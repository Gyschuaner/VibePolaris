<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibePolaris · 手机与平板对照稿</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e5dd;color:#252822;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1350px;margin:auto;padding:36px 32px}header{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:26px}small{font-size:11px;letter-spacing:.17em;color:#8c5942}h1{font-size:28px;font-weight:550;margin:7px 0 0;letter-spacing:-.03em}.tabs{display:flex;gap:6px;padding:4px;background:#dcd8ce;border-radius:10px}button{border:0;cursor:pointer;color:#686e64;background:none;border-radius:7px;padding:11px 20px;font:inherit;font-size:14px}button[aria-pressed=true]{background:#fcfaf3;color:#8c5942}.pair{display:flex;gap:28px;align-items:flex-start;justify-content:center}.device{min-width:0}label{display:flex;justify-content:space-between;color:#686e64;font-size:12px;margin-bottom:10px}.frame{border:1px solid #c7c3b8;border-radius:20px;overflow:hidden;box-shadow:0 14px 36px #171a1510;background:#f7f3e8}iframe{border:0;display:block;transform-origin:top left}.phone .frame{width:312px;height:675px}.phone iframe{width:390px;height:844px;transform:scale(.8)}.tablet .frame{width:820px;height:675px}.tablet iframe{width:1024px;height:844px;transform:scale(.8)}.note{display:grid;grid-template-columns:312px 820px;gap:28px;justify-content:center;margin-top:20px;color:#686e64;font-size:13px}.note p{margin:0}.note b{color:#8c5942;font-weight:500}@media(max-width:1220px){.pair{flex-wrap:wrap}.note{display:block}.note p{margin:12px 0}.tablet .frame{width:615px;height:506px}.tablet iframe{transform:scale(.6)}}@media(max-width:680px){header{display:block}.tabs{margin-top:20px}.wrap{padding:24px 16px}.tablet .frame{width:328px;height:270px}.tablet iframe{transform:scale(.32)}.tabs button{padding:10px 12px}}</style><div class="wrap"><header><div><small>VIBEPOLARIS · RESPONSIVE STUDY / 2026.10</small><h1>相同的功能，合适的空间。</h1></div><nav class="tabs"><button data-view="nav" aria-pressed="true">01 导航</button><button data-view="reader" aria-pressed="false">02 阅读</button><button data-view="editor" aria-pressed="false">03 编辑</button></nav></header><div class="pair"><section class="device phone"><label><span>手机</span><span>390 × 844</span></label><div class="frame"><iframe title="手机对照稿" src="screen.html?view=nav"></iframe></div></section><section class="device tablet"><label><span>平板 · 横屏</span><span>1024 × 844</span></label><div class="frame"><iframe title="平板对照稿" src="screen.html?view=nav"></iframe></div></section></div><div class="note"><p id="phoneNote"></p><p id="tabletNote"></p></div></div><script>const notes={nav:['<b>手机 ·</b> 星图、画布、新闻、笔记固定在底部。更多菜单补齐设置与关于。','<b>平板 ·</b> 带文字的导航回到顶部，为主要内容留出完整高度。主题、账号和更多入口保持可见。'],reader:['<b>手机 ·</b> 首屏先读正文。点击底部“目录与笔记”打开面板，关闭后继续阅读。','<b>平板 ·</b> 这张展示 1024px 的专注阅读。大于 1100px 时沿用可收起的目录／批注侧栏。'],editor:['<b>手机 ·</b> 默认全高编辑，点击“预览”查看结果。格式工具与小北补全保持可点。','<b>平板 ·</b> 768px 起显示编辑／预览双栏，保留比例调整。窄分屏自动回到单栏切换。']};function show(view){document.querySelectorAll('iframe').forEach(f=>f.src='screen.html?view='+view);document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelector('#phoneNote').innerHTML=notes[view][0];document.querySelector('#tabletNote').innerHTML=notes[view][1]}document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));show('nav')</script></html>
