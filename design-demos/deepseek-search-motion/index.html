<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页如何进入编程助手 · 三个动画方向</title>
<style>
:root{color-scheme:light;--bg:#F7F3E8;--paper:#FCFAF3;--ink:#171A15;--muted:#686E64;--green:#52683F;--line:#DAD8CD}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:32px 30px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);margin:0 0 14px}h1{font-family:"Songti SC","Noto Serif CJK SC",serif;font-size:clamp(28px,4vw,42px);font-weight:600;letter-spacing:-1px;margin:0 0 12px}header>p:last-child{font-size:15px;color:var(--muted);line-height:1.7;margin:0}.directions{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}.direction{position:relative;display:block;padding:14px 0 17px;text-align:left;border:0;border-top:2px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:inherit}.direction[aria-selected=true]{border-color:var(--green)}.direction .letter{font-family:Georgia,serif;font-style:italic;font-size:25px;color:var(--green);margin-right:12px}.direction strong{font-size:17px;font-weight:600}.direction small{display:block;margin-top:10px;font-size:13px;line-height:1.5;color:var(--muted)}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:4px}section{border:1px solid var(--line);background:var(--paper)}iframe{display:block;width:100%;height:790px;border:0;background:var(--bg)}[hidden]{display:none!important}.links{display:flex;gap:18px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);font-size:13px}.links a{color:var(--green);text-underline-offset:4px}.links span{margin-left:auto;color:var(--muted);font-size:12px}footer{margin:20px 0 0;font-size:13px;color:var(--muted);line-height:1.8}.comparison{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.comparison figure{margin:0}.comparison img{display:block;width:100%;border:1px solid var(--line)}figcaption{font-size:13px;margin-top:8px;color:var(--muted)}@media(max-width:680px){main{padding:25px 15px}.directions{gap:12px}.direction strong{font-size:15px}.direction .letter{display:block;margin-bottom:5px}.direction small{font-size:12px}iframe{height:650px}.links span{display:none}.comparison{grid-template-columns:1fr}}
</style></head><body><main>
<header><p class="eyebrow">VIBEPOLARIS · 动画方向初稿</p><h1>网页，怎样走进编程助手？</h1><p>选择一个方向，直接玩。每版都把“线索 → 正文 → 模型工作区”变成对象的运动。</p></header>
<nav class="directions" role="tablist" aria-label="动画设计方向">
<button class="direction" id="tab-paper" role="tab" aria-selected="true" aria-controls="panel-paper" data-target="paper"><span class="letter">A</span><strong>活字取文机</strong><small>网页留下外壳，正文抽出来，压入工作区。</small></button>
<button class="direction" id="tab-lens" role="tab" aria-selected="false" aria-controls="panel-lens" data-target="lens" tabindex="-1"><span class="letter">B</span><strong>正文透镜</strong><small>亲手推动读头，正文逐行穿过边界。</small></button>
<button class="direction" id="tab-ribbon" role="tab" aria-selected="false" aria-controls="panel-ribbon" data-target="ribbon" tabindex="-1"><span class="letter">C</span><strong>文字入稿</strong><small>正文揭成一条文字带，拉直排进回答。</small></button>
</nav>
<section id="panel-paper" role="tabpanel" aria-labelledby="tab-paper"><iframe title="A 活字取文机互动样片" src="paper-press.html"></iframe><div class="links"><a href="paper-press.html" target="_blank" rel="noopener">单独打开 A</a><span>可运行方向样片 · 尚未替换文章</span></div></section>
<section id="panel-lens" role="tabpanel" aria-labelledby="tab-lens" hidden><iframe title="B 正文透镜互动样片" loading="lazy" src="lens-reveal.html"></iframe><div class="links"><a href="lens-reveal.html" target="_blank" rel="noopener">单独打开 B</a><span>可运行方向样片 · 尚未替换文章</span></div></section>
<section id="panel-ribbon" role="tabpanel" aria-labelledby="tab-ribbon" hidden><iframe title="C 文字入稿互动样片" loading="lazy" src="ribbon-compose.html"></iframe><div class="links"><a href="ribbon-compose.html" target="_blank" rel="noopener">单独打开 C</a><span>可运行方向样片 · 尚未替换文章</span></div></section>
<div class="comparison" aria-label="三个方向关键画面对比">
<figure><a href="paper-press.html"><img style="height:auto" src="paper-press.png" alt="A 活字取文机：纸张与正文抽取的关键画面" width="1280" height="840"></a><figcaption>A · 活字取文机</figcaption></figure>
<figure><a href="lens-reveal.html"><img style="height:auto" src="lens-reveal.png" alt="B 正文透镜：读头提取正文的关键画面" width="1280" height="840"></a><figcaption>B · 正文透镜</figcaption></figure>
<figure><a href="ribbon-compose.html"><img style="height:auto" src="ribbon-compose.png" alt="C 文字入稿：文字带进入工作区的关键画面" width="1280" height="840"></a><figcaption>C · 文字入稿</figcaption></figure>
</div>
<footer>选定后会按该方向接入本篇新闻，保留站点主题、键盘操作与减少动态支持。</footer>
</main><script>
(() => {
 const tabs=[...document.querySelectorAll('[role=tab]')];
 function choose(tab){for(const item of tabs){const on=item===tab;item.setAttribute('aria-selected',String(on));item.tabIndex=on?0:-1;document.getElementById(item.getAttribute('aria-controls')).hidden=!on}}
 for(const tab of tabs){tab.addEventListener('click',()=>choose(tab));tab.addEventListener('keydown',event=>{const i=tabs.indexOf(tab);let target;if(event.key==='ArrowRight')target=tabs[(i+1)%tabs.length];if(event.key==='ArrowLeft')target=tabs[(i+tabs.length-1)%tabs.length];if(event.key==='Home')target=tabs[0];if(event.key==='End')target=tabs[tabs.length-1];if(target){event.preventDefault();choose(target);target.focus()}})}
})();
</script></body></html>
