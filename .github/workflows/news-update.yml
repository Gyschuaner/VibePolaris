name: News update

on:
  # Beijing 00:00/06:00/12:00/18:00 = UTC 16:00/22:00/04:00/10:00.
  schedule:
    - cron: "0 16,22,4,10 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [dots-news]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  collect-validate-publish:
    runs-on: ubuntu-latest
    env:
      NEWS_DOTS_ENDPOINT: ${{ secrets.NEWS_DOTS_ENDPOINT }}
      NEWS_DOTS_TOKEN: ${{ secrets.NEWS_DOTS_TOKEN }}
      NEWS_BRANCH: news-auto/${{ github.run_id }}
    steps:
      - name: Checkout dev baseline
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Prepare isolated automation branch
        run: |
          git switch -c "$NEWS_BRANCH"
          git config user.name "vibepolaris-news-bot"
          git config user.email "news-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Receive external handoff
        if: github.event_name == 'repository_dispatch'
        env:
          DOTS_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node -e 'require("node:fs").writeFileSync("/tmp/dots-news.json", process.env.DOTS_PAYLOAD)' 

      - name: Fetch Dots handoff when configured
        if: github.event_name != 'repository_dispatch' && env.NEWS_DOTS_ENDPOINT != ''
        run: node scripts/news-fetch-dots.mjs > /tmp/dots-news.json

      - name: Continue with checked-in official sources
        if: github.event_name != 'repository_dispatch' && env.NEWS_DOTS_ENDPOINT == ''
        run: echo "NEWS_DOTS_ENDPOINT is not configured; validating checked-in official-source content."

      - name: Ingest drafts with idempotent dedupe
        if: github.event_name == 'repository_dispatch' || env.NEWS_DOTS_ENDPOINT != ''
        run: npm run news:ingest -- /tmp/dots-news.json

      - name: Validate drafts and relations
        run: npm run news:validate

      - name: Auto-publish only routine, verified candidates
        run: npm run news:auto-publish -- --approve

      - name: Build candidate site
        run: npm run build

      - name: Build Docker candidate
        run: docker build --tag "vibepolaris-news-ci:${{ github.run_id }}" .

      - name: Run Docker candidate
        run: docker run --detach --rm --name "vibepolaris-news-ci-${{ github.run_id }}" --publish 38080:3000 "vibepolaris-news-ci:${{ github.run_id }}"

      - name: Smoke-test published routes and Xiaobei visibility
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:38080/news >/dev/null; then break; fi
            sleep 2
          done
          NEWS_EXPECTED_SLUGS="$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("content/zh/news.json", "utf8")).map(article=>article.slug).join(","))')" \
            node scripts/news-smoke.mjs http://127.0.0.1:38080

      - name: Stop Docker candidate
        if: always()
        run: docker stop "vibepolaris-news-ci-${{ github.run_id }}" || true

      - name: Create protected dev PR
        id: publish
        run: |
          if test -z "$(git status --porcelain)"; then
            echo "No new drafts or publishable changes."
            exit 0
          fi
          git diff --check
          git add content/zh/news.json content/zh/news-drafts
          git commit -m "chore(news): ingest Dots update ${{ github.run_id }}"
          git push --set-upstream origin "$NEWS_BRANCH"
          gh pr create --base dev --head "$NEWS_BRANCH" --title "News update ${{ github.run_id }}" --body-file <(cat <<'EOF'
          Automated News update from Dots.

          The repository gate only publishes candidates with verified evidence, at least one evidence URL, routine risk, and confirmed concept relationships. Major or uncertain candidates remain needs-review.
          EOF
          )
          gh pr merge "$NEWS_BRANCH" --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
