name: vibepolaris

services:
  web:
    image: vibepolaris:${VIBEPOLARIS_IMAGE_TAG:?set VIBEPOLARIS_IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      edge:
        aliases:
          - vibepolaris_web

networks:
  edge:
    external: true
    name: chuansgu_edge
