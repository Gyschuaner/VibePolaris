name: vibepolaris

services:
  web:
    image: vibepolaris:${VIBEPOLARIS_IMAGE_TAG:?set VIBEPOLARIS_IMAGE_TAG}
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      XIAOBEI_MODEL: ${XIAOBEI_MODEL:-deepseek-v4.1-flash}
      XIAOBEI_DB_PATH: /app/.xiaobei/xiaobei.sqlite
      XIAOBEI_SITE_ORIGIN: ${XIAOBEI_SITE_ORIGIN:-https://vibe.chuansgu.top}
    volumes:
      - xiaobei_data:/app/.xiaobei
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      edge:
        aliases:
          - vibepolaris_web

volumes:
  xiaobei_data:

networks:
  edge:
    external: true
    name: chuansgu_edge
