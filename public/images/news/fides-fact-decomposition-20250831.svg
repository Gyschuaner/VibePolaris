<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">FIDES 的事实分解与证据聚合</title><desc id="desc">长答案被拆成子事实，分别检索证据，冲突时修订后再聚合。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">FIDES：长答案先拆成事实，再找证据</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">原句 · 子事实 · 证据 · 冲突修订</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="284" width="200" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="212" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#21456f">长答案</text><text x="212" y="363" text-anchor="middle" font-size="18" fill="#365b83">复杂句子</text>
<rect x="392" y="214" width="190" height="82" rx="16" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="487" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#275d39">子事实 A</text><text x="487" y="276" text-anchor="middle" font-size="17" fill="#3e7650">时间 / 对象</text>
<rect x="392" y="386" width="190" height="82" rx="16" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="487" y="420" text-anchor="middle" font-size="23" font-weight="700" fill="#805513">子事实 B</text><text x="487" y="448" text-anchor="middle" font-size="17" fill="#966b24">因果 / 数量</text>
<rect x="672" y="284" width="200" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="772" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#783553">证据对齐</text><text x="772" y="363" text-anchor="middle" font-size="18" fill="#94516f">支持 / 冲突</text>
<rect x="952" y="284" width="168" height="112" rx="18" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/><text x="1036" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#234b78">聚合</text><text x="1036" y="363" text-anchor="middle" font-size="17" fill="#385f8d">回到原句</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M312 340 H382"/><path d="M582 255 C630 255 642 310 662 320"/><path d="M582 427 C630 427 642 370 662 360"/><path d="M872 340 H942"/></g><g fill="#607080"><path d="M382 340 l-14 -9 v18z"/><path d="M662 320 l-14 -9 v18z"/><path d="M662 360 l-14 -9 v18z"/><path d="M942 340 l-14 -9 v18z"/></g>
<text x="600" y="530" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">引用要对齐事实，而不是只贴在句子旁边</text>
</svg>