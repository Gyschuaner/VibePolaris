<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">健康 RAG：检索证据组成与回答对齐</title>
<desc id="desc">受控改变检索池和提问方式，检查模型回答是否与健康事实答案一致。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#effbf8"/><stop offset="1" stop-color="#fff4f0"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#378379"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#183b3a" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#173e3c" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">健康 RAG：有来源，先问来源可靠吗</text>
<text x="72" y="118" fill="#66817e" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">受控改变文档组成与提问 framing · 对齐 ground-truth · 高风险时人工复核</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="250" height="292" rx="22" fill="#fff" stroke="#b9ddd6" stroke-width="2"/>
 <text x="106" y="238" fill="#378379" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">检索池</text>
 <rect x="106" y="270" width="174" height="50" rx="12" fill="#d8f1eb"/><text x="193" y="302" text-anchor="middle" fill="#24645d" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">helpful</text>
 <rect x="106" y="334" width="174" height="50" rx="12" fill="#fff0c9"/><text x="193" y="366" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">harmful</text>
 <rect x="106" y="398" width="174" height="50" rx="12" fill="#fde0dd"/><text x="193" y="430" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">adversarial</text>
</g>
<path d="M338 334 H400" stroke="#378379" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="420" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#c9c2eb" stroke-width="2"/>
 <text x="458" y="220" fill="#5d4b9b" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">模型上下文</text>
 <rect x="458" y="254" width="270" height="55" rx="12" fill="#eee9ff"/><text x="593" y="289" text-anchor="middle" fill="#4c3e88" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">健康问题 + 用户 framing</text>
 <text x="458" y="358" fill="#6d6b8e" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">一致 / 中性 / 不一致</text>
 <text x="458" y="399" fill="#6d6b8e" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">记录来源、排序和冲突</text>
 <text x="458" y="449" fill="#6d6b8e" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不是检索到就可信</text>
</g>
<path d="M788 334 H850" stroke="#378379" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#e4b0a6" stroke-width="2"/>
 <text x="906" y="220" fill="#a64d40" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">对齐与复核</text>
 <rect x="906" y="255" width="188" height="56" rx="12" fill="#fde2de"/><text x="1000" y="290" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">ground-truth</text>
 <rect x="906" y="333" width="188" height="56" rx="12" fill="#d8f1eb"/><text x="1000" y="368" text-anchor="middle" fill="#24645d" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">权威来源</text>
 <text x="1000" y="438" text-anchor="middle" fill="#a64d40" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高风险问题交给专业人员</text>
 <text x="1000" y="468" text-anchor="middle" fill="#66817e" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">冲突证据要显式呈现</text>
</g>
<text x="70" y="578" fill="#378379" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">对抗性证据会拉低对齐 · 有益证据可保留鲁棒性</text>
<text x="70" y="615" fill="#66817e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">把“什么时候不该相信”固定成检索与回答的回归问题。</text>
</svg>