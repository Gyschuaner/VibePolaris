<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mobile-Agent-v3 GUI automation</title>
  <desc id="desc">A GUI agent learns across virtual Android, Ubuntu, macOS and Windows environments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171c39"/><stop offset="1" stop-color="#21454d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ff4e8"/><stop offset="1" stop-color="#80b5ff"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd083"/><stop offset="1" stop-color="#ff9fc1"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070a16" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1045" cy="88" r="212" fill="#9ff4e8" opacity=".11"/>
  <circle cx="1028" cy="570" r="255" fill="#ff9fc1" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="720" height="140" rx="24" fill="#242a4b" stroke="#9ff4e8" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c9fff3">MOBILE-AGENT-V3 · GUI-OWL</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#fafbff">SEE → PLAN → CLICK</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7e8ff">先造一座虚拟桌面，再教 Agent 操作</text>
  <g transform="translate(816 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="408" rx="30" fill="#111a33" stroke="#c0ccff" stroke-width="3"/>
    <rect x="28" y="32" width="196" height="112" rx="16" fill="#2e446b"/>
    <rect x="48" y="55" width="62" height="45" rx="7" fill="url(#cyan)"/><rect x="122" y="55" width="78" height="17" rx="7" fill="#8497c6"/><rect x="122" y="84" width="58" height="17" rx="7" fill="#8497c6"/>
    <path d="M126 173v39M126 212l-55 42M126 212l55 42" stroke="#8295ca" stroke-width="7" stroke-linecap="round"/>
    <circle cx="71" cy="272" r="24" fill="url(#cyan)"/><circle cx="181" cy="272" r="24" fill="url(#orange)"/>
    <text x="71" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2c50">UI</text>
    <text x="181" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#402743">RL</text>
    <text x="126" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#eaf0ff">ANDROID · DESKTOP</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="710" height="140" rx="20" fill="#242a4b" stroke="#536e9b" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c9fff3">ANDROIDWORLD 73.3 · OSWORLD 37.7</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">云端虚拟环境 · 自演化轨迹 · 异步 RL</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c4cbe6">论文基准成绩，不等于真实设备稳定性</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c6cbe7">ARXIV · FIRST SUBMITTED 21 AUG 2025</text>
