<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="斯坦福 AI 经济转型公开声明：从事件到可检验议程">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19324d"/><stop offset="1" stop-color="#527c9c"/></linearGradient><style>
  .node{fill:#fff;fill-opacity:.92;stroke:#f3c969;stroke-width:3} .label{font:700 24px system-ui,sans-serif;fill:#10212b} .sub{font:500 16px system-ui,sans-serif;fill:#31505f} .pulse{animation:pulse 2.8s ease-in-out infinite} .line{stroke:#f3c969;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 12;animation:flow 3s linear infinite} @keyframes pulse{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}} @keyframes flow{to{stroke-dashoffset:-48}}
  </style></defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="54" y="70" class="label" fill="#fff">VibePolaris · 2026-07-13</text>
  <path d="M220 270H330M430 270H540M640 270H750" class="line" fill="none"/>
  <g class="pulse"><rect x="58" y="210" width="165" height="120" rx="22" class="node"/><text x="140" y="258" text-anchor="middle" class="label">事件</text><text x="140" y="288" text-anchor="middle" class="sub">当天公告</text></g>
  <g class="pulse" style="animation-delay:.35s"><rect x="330" y="210" width="165" height="120" rx="22" class="node"/><text x="412" y="258" text-anchor="middle" class="label">上下文</text><text x="412" y="288" text-anchor="middle" class="sub">事实与边界</text></g>
  <g class="pulse" style="animation-delay:.7s"><rect x="540" y="210" width="165" height="120" rx="22" class="node"/><text x="622" y="258" text-anchor="middle" class="label">行动</text><text x="622" y="288" text-anchor="middle" class="sub">谁可以改变什么</text></g>
  <g class="pulse" style="animation-delay:1.05s"><rect x="750" y="210" width="155" height="120" rx="22" class="node"/><text x="827" y="258" text-anchor="middle" class="label">复核</text><text x="827" y="288" text-anchor="middle" class="sub">来源可追溯</text></g>
  <circle cx="480" cy="430" r="12" fill="#fff" opacity=".8"><animate attributeName="r" values="8;22;8" dur="2.2s" repeatCount="indefinite"/></circle>
  <text x="480" y="478" text-anchor="middle" class="sub" fill="#fff">官方事实 → 读者能理解的机制 → 保留未知</text>
</svg>
