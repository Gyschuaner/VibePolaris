  <path d="M718 230h60M718 257h39" stroke="#b7d7ea" stroke-width="10" stroke-linecap="round"/>
  <text x="82" y="92" fill="#f2f5f7" font-family="Arial, sans-serif" font-size="30" font-weight="700">WHO SETS THE GUARDRAILS?</text>
  <text x="82" y="474" fill="#c5deea" font-family="Arial, sans-serif" font-size="21">公司自律、国会立法与安全责任的公开争论</text>
