    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6bd60"/><stop offset="1" stop-color="#e76f51"/></linearGradient>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <path d="M95 387h770" stroke="#b7d7ea" stroke-width="6" opacity=".35"/>
