<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Anthropic 定制芯片路线图</title><desc id="desc">Claude 工作负载从模型和服务需求出发，经过芯片设计、软件栈和供应链，最终进入云端推理。</desc><rect width="960" height="540" rx="28" fill="#111827"/><path d="M140 270H820" stroke="#475569" stroke-width="5"/><circle cx="140" cy="270" r="54" fill="#312e81" stroke="#a5b4fc" stroke-width="4"/><circle cx="360" cy="270" r="54" fill="#134e4a" stroke="#5eead4" stroke-width="4"/><circle cx="580" cy="270" r="54" fill="#451a03" stroke="#fbbf24" stroke-width="4"/><circle cx="800" cy="270" r="54" fill="#3f1d5a" stroke="#d8b4fe" stroke-width="4"/><text x="140" y="265" text-anchor="middle" fill="#e0e7ff" font-size="18" font-family="sans-serif">Claude</text><text x="140" y="289" text-anchor="middle" fill="#c7d2fe" font-size="15" font-family="sans-serif">工作负载</text><text x="360" y="265" text-anchor="middle" fill="#ccfbf1" font-size="18" font-family="sans-serif">芯片</text><text x="360" y="289" text-anchor="middle" fill="#99f6e4" font-size="15" font-family="sans-serif">设计团队</text><text x="580" y="265" text-anchor="middle" fill="#fef3c7" font-size="18" font-family="sans-serif">软件栈</text><text x="580" y="289" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">编译 / 调度</text><text x="800" y="265" text-anchor="middle" fill="#f3e8ff" font-size="18" font-family="sans-serif">云集群</text><text x="800" y="289" text-anchor="middle" fill="#e9d5ff" font-size="15" font-family="sans-serif">服务落地</text><text x="360" y="140" text-anchor="middle" fill="#5eead4" font-size="19" font-family="sans-serif">8 月 5 日：确认组队</text><text x="480" y="430" text-anchor="middle" fill="#94a3b8" font-size="19" font-family="sans-serif">架构、制造、样片和性能仍未公布</text></svg>
