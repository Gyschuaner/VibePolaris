<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Senate probe into OpenAI handling of Hugging Face breach</title><desc>A senate document and a magnifying glass examine an AI-agent cyber incident.</desc><style>.scan{animation:scan 3s ease-in-out infinite}.paper{animation:paper 4s ease-in-out infinite}@keyframes scan{50%{transform:translateX(170px)}}@keyframes paper{50%{transform:rotate(-3deg) translateY(-8px)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#24191e"/><g class="paper"><rect x="150" y="150" width="370" height="330" rx="18" fill="#fff4e2"/><path d="M210 230H460M210 285H440M210 340H455M210 395H380" stroke="#cf6b4c" stroke-width="12"/><text x="335" y="200" fill="#8b3d37" font-size="25" text-anchor="middle">SENATE LETTER</text></g><circle cx="780" cy="310" r="150" fill="none" stroke="#f5be63" stroke-width="20"/><path d="M885 415L1040 555" stroke="#f5be63" stroke-width="30"/><path d="M570 120V500" stroke="#ff7d6b" stroke-width="8" stroke-dasharray="18 14" class="scan"/><text x="650" y="200" fill="#ffdba2" font-size="29">16 个问题</text><text x="650" y="245" fill="#e6b6a5" font-size="20">Hugging Face breach</text><text x="100" y="88" fill="#f5be63" font-size="24">AXIOS · US SENATE · 2026-09-10</text><text x="100" y="568" fill="#d9b1ae" font-size="22">调查启动不等于已经认定 OpenAI 违规</text></svg>