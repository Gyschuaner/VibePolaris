<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">WorMI：测试时组合领域世界模型</title>
<desc id="desc">具身 Agent 根据轨迹检索领域世界模型，在测试时对齐表示，异常时可以移除并回到基线。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef8ff"/><stop offset="1" stop-color="#f7f1ff"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3977b7"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#26344d" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#203c5d" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">WorMI：需要时取用世界模型，离开时可以移除</text>
<text x="72" y="118" fill="#687c96" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">轨迹检索 · 测试时组合 · 表示对齐 · 冲突时回到基线</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="240" height="292" rx="22" fill="#fff" stroke="#c5ddef" stroke-width="2"/>
 <text x="106" y="238" fill="#3977b7" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">当前轨迹</text>
 <rect x="106" y="272" width="168" height="56" rx="12" fill="#dceeff"/><text x="190" y="308" text-anchor="middle" fill="#2c5f8f" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">状态 → 动作</text>
 <text x="106" y="378" fill="#687c96" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">抽象表示</text>
 <text x="106" y="411" fill="#687c96" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不只看任务名字</text>
 </g>
 <path d="M328 334 H390" stroke="#3977b7" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="410" y="170" width="360" height="326" rx="22" fill="#fff" stroke="#bdb1e9" stroke-width="2"/>
 <text x="448" y="220" fill="#5d4b9b" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">世界模型库</text>
 <circle cx="495" cy="294" r="30" fill="#e9e1fb"/><text x="495" y="301" text-anchor="middle" fill="#5a438e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">A</text>
 <circle cx="594" cy="294" r="30" fill="#ded4f8"/><text x="594" y="301" text-anchor="middle" fill="#5a438e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">B</text>
 <circle cx="693" cy="294" r="30" fill="#d3c7f4"/><text x="693" y="301" text-anchor="middle" fill="#5a438e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">C</text>
 <text x="448" y="368" fill="#706c92" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">原型匹配 → 检索相关领域</text>
 <text x="448" y="407" fill="#706c92" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">world-wise compound attention</text>
 <text x="448" y="447" fill="#706c92" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">临时植入，可移除</text>
</g>
<path d="M790 334 H850" stroke="#3977b7" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#a8d8cf" stroke-width="2"/>
 <text x="907" y="220" fill="#28776d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">适配与回滚</text>
 <rect x="907" y="255" width="186" height="56" rx="12" fill="#d8f1ec"/><text x="1000" y="290" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">未见领域</text>
 <rect x="907" y="333" width="186" height="56" rx="12" fill="#fde2de"/><text x="1000" y="368" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">冲突 / 移除</text>
 <text x="1000" y="438" text-anchor="middle" fill="#537d77" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">VirtualHome · ALFWorld</text>
 <text x="1000" y="468" text-anchor="middle" fill="#687c96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">异常时回到基线策略</text>
</g>
<text x="70" y="578" fill="#3977b7" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">测试时组合 ≠ 自动理解真实环境</text>
<text x="70" y="615" fill="#687c96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">检索、接口、延迟和安全停止都要在现场重新验证。</text>
</svg>