<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Google Web Guide 搜索实验</title><desc id="desc">Web Guide 通过多组相关搜索，把网页链接按主题排列，并保留原始搜索回退。</desc><rect width="1200" height="680" rx="36" fill="#101827"/><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#4285f4"/><stop offset="1" stop-color="#34a853"/></linearGradient></defs><text x="72" y="84" fill="#fff" font-size="32" font-family="sans-serif" font-weight="700">Google Web Guide · 给搜索结果一张地图</text><text x="72" y="122" fill="#b8c4d8" font-size="20" font-family="sans-serif">2025-07-24 · Search Labs experiment</text><g font-family="sans-serif"><rect x="78" y="222" width="240" height="170" rx="24" fill="#27487c"/><text x="120" y="274" fill="#fff" font-size="24" font-weight="700">一个问题</text><text x="120" y="320" fill="#d5e5ff" font-size="18">带背景的查询</text><text x="120" y="354" fill="#d5e5ff" font-size="18">开放式主题</text><path d="M338 306h78" stroke="#9dc4ff" stroke-width="6" stroke-linecap="round"/><path d="m400 294 18 12-18 12" fill="none" stroke="#9dc4ff" stroke-width="6"/><rect x="444" y="190" width="282" height="232" rx="24" fill="#3b3f77"/><text x="488" y="246" fill="#fff" font-size="24" font-weight="700">query fan-out</text><text x="488" y="294" fill="#e2e3ff" font-size="18">多组相关搜索</text><text x="488" y="328" fill="#e2e3ff" font-size="18">定制版 Gemini</text><text x="488" y="362" fill="#e2e3ff" font-size="18">理解网页内容</text><path d="M752 306h78" stroke="#9dc4ff" stroke-width="6" stroke-linecap="round"/><path d="m814 294 18 12-18 12" fill="none" stroke="#9dc4ff" stroke-width="6"/><rect x="858" y="166" width="264" height="270" rx="24" fill="url(#b)"/><text x="898" y="224" fill="#07131f" font-size="24" font-weight="700">主题链接</text><text x="898" y="272" fill="#07131f" font-size="18">按角度分组</text><text x="898" y="306" fill="#07131f" font-size="18">回到原文</text><text x="898" y="340" fill="#07131f" font-size="18">可切回标准结果</text><rect x="180" y="510" width="85