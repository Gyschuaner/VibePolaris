<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">多 Agent 网页链接防守链</title><desc id="desc">链接经过规范化、来源核验和内容隔离后，才进入分别授权的外部动作。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5f3"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdfa" stroke="#d9d4cf" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#2b3035">网页链接：先验证，再让 Agent 动作</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#70777d">不可信输入 · 来源检查 · 内容隔离 · 分层授权</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="96" y="254" width="198" height="144" rx="22" fill="#f7e8e7" stroke="#c88d89" stroke-width="3"/><text x="195" y="306" text-anchor="middle" font-size="23" font-weight="700" fill="#7d3f3c">原始链接</text><text x="195" y="344" text-anchor="middle" font-size="18" fill="#985a56">不可信输入</text><text x="195" y="372" text-anchor="middle" font-size="16" fill="#a46e6a">URL / 跳转</text>
<rect x="348" y="254" width="198" height="144" rx="22" fill="#fff0d6" stroke="#d3a05b" stroke-width="3"/><text x="447" y="306" text-anchor="middle" font-size="23" font-weight="700" fill="#7c5419">规范化</text><text x="447" y="344" text-anchor="middle" font-size="18" fill="#97702f">主机 / 来源</text><text x="447" y="372" text-anchor="middle" font-size="16" fill="#a37c3b">重定向检查</text>
<rect x="600" y="254" width="198" height="144" rx="22" fill="#e8eef8" stroke="#7c98bd" stroke-width="3"/><text x="699" y="306" text-anchor="middle" font-size="23" font-weight="700" fill="#2e4e72">沙盒内容</text><text x="699" y="344" text-anchor="middle" font-size="18" fill="#4d6d8b">只读分析</text><text x="699" y="372" text-anchor="middle" font-size="16" fill="#66829c">不自动执行</text>
<rect x="852" y="254" width="198" height="144" rx="22" fill="#e8f2e9" stroke="#76a27d" stroke-width="3"/><text x="951" y="306" text-anchor="middle" font-size="23" font-weight="700" fill="#2e6438">外部动作</text><text x="951" y="344" text-anchor="middle" font-size="18" fill="#4d7b56">分别授权</text><text x="951" y="372" text-anchor="middle" font-size="16" fill="#67866d">日志 / 停止</text>
</g>
<g fill="none" stroke="#69736f" stroke-width="4" stroke-linecap="round"><path d="M294 326 H334"/><path d="M546 326 H586"/><path d="M798 326 H838"/></g><g fill="#69736f"><path d="M334 326 l-13 -9 v18z"/><path d="M586 326 l-13 -9 v18z"/><path d="M838 326 l-13 -9 v18z"/></g>
<text x="600" y="486" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4c565b">链接解析、网页理解、外部执行是三条边界</text>
<text x="600" y="526" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#7a8388">发现来源冲突时：暂停、只读降级，或请求人工确认</text>
</svg>
