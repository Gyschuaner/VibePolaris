<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Gemini Deep Think 在 IMO 2025 达到金牌线</title><desc id="desc">模型在六道题中解出五题得到 35 分，由 IMO 协调员认证；评测成绩、实验版本和公开上线被分开表示。</desc><defs><linearGradient id="mbg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171329"/><stop offset="1" stop-color="#3f2b16"/></linearGradient><linearGradient id="mline" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#mbg)"/><text x="68" y="78" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">Gemini Deep Think · IMO 2025</text><text x="68" y="118" fill="#fde68a" font-size="21" font-family="sans-serif">2025-07-21 · 5 / 6 problems · 35 / 42 points</text><g font-family="sans-serif"><rect x="72" y="218" width="236" height="186" rx="26" fill="#92400e"/><text x="118" y="278" fill="#fff" font-size="25" font-weight="700">题目</text><text x="118" y="322" fill="#fef3c7" font-size="18">6 道证明题</text><text x="118" y="356" fill="#fef3c7" font-size="18">4.5 小时</text><path d="M328 312h74" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/><path d="m384 300 18 12-18 12" fill="none" stroke="#fbbf24" stroke-width="6"/><rect x="424" y="198" width="236" height="226" rx="26" fill="#a16207"/><text x="470" y="260" fill="#fff" font-size="25" font-weight="700">评分</text><text x="470" y="306" fill="#fef9c3" font-size="20">35 / 42</text><text x="470" y="344" fill="#fef9c3" font-size="18">金牌分数线</text><text x="470" y="380" fill="#fef9c3" font-size="18">IMO 协调员认证</text><path d="M680 312h74" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/><path d="m736 300 18 12-18 12" fill="none" stroke="#fcd34d" stroke-width="6"/><rect x="776" y="218" width="236" height="186" rx="26" fill="#9f1239"/><text x="822" y="278" fill="#fff" font-size="25" font-weight="700">系统</text><text x="822" y="322" fill="#ffe4e6" font-size="18">Deep Think</text><text x="822" y="356" fill="#ffe4e6" font-size="18">并行思路</text><text x="822" y="390" fill="#ffe4e6" font-size="18">自然语言证明</text><rect x="190" y="500" width="840" height="88" rx="26" fill="#0b0a12" stroke="url(#mline)" stroke-width="3"/><text x="324" y="548" fill="#fff" font-size="24" font-weight="700">金牌线 ≠ 人类奖牌 ≠ 通用智能</text><text x="370" y="578" fill="#fcd34d" font-size="16">评测条件、认证方式和上线范围都要一起读</text></g></svg>
