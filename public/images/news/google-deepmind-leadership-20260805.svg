<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Google DeepMind 管理层职责图</title><desc id="desc">Hassabis 转向 AGI 与科学战略，Koray 负责 Google DeepMind 日常业务，Jeff Dean 与 Sanjay Ghemawat 创办独立公益公司。</desc><rect width="960" height="540" rx="28" fill="#0b1220"/><path d="M120 270H840" stroke="#334155" stroke-width="4" stroke-dasharray="12 14"/><rect x="80" y="105" width="240" height="140" rx="20" fill="#233b67" stroke="#7dd3fc" stroke-width="3"/><text x="200" y="160" text-anchor="middle" fill="#e0f2fe" font-size="27" font-family="sans-serif">Hassabis</text><text x="200" y="197" text-anchor="middle" fill="#bae6fd" font-size="19" font-family="sans-serif">主席 · 首席科学家</text><rect x="360" y="105" width="240" height="140" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="480" y="160" text-anchor="middle" fill="#cffafe" font-size="27" font-family="sans-serif">Koray</text><text x="480" y="197" text-anchor="middle" fill="#a5f3fc" font-size="19" font-family="sans-serif">SVP · 日常领导</text><rect x="640" y="105" width="240" height="140" rx="20" fill="#334155" stroke="#cbd5e1" stroke-width="3"/><text x="760" y="160" text-anchor="middle" fill="#f8fafc" font-size="25" font-family="sans-serif">Dean + Ghemawat</text><text x="760" y="197" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="sans-serif">独立公益公司</text><text x="200" y="325" text-anchor="middle" fill="#7dd3fc" font-size="20" font-family="sans-serif">AGI · 科学 · Isomorphic</text><text x="480" y="325" text-anchor="middle" fill="#67e8f9" font-size="20" font-family="sans-serif">Gemini · 研究 · 开发者</text><text x="760" y="325" text-anchor="middle" fill="#cbd5e1" font-size="20" font-family="sans-serif">Google 投资 + 云合作</text><text x="480" y="440" text-anchor="middle" fill="#94a3b8" font-size="19" font-family="sans-serif">2026-08-05 · 职责重排，不是组织拆分</text></svg>
