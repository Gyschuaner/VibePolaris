<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="OpenAI 家庭产品招聘新闻：招聘信号、家庭成员与权限边界">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16263d"/><stop offset="1" stop-color="#4d7190"/></linearGradient>
    <style>
      .node{fill:#fff;fill-opacity:.94;stroke:#f2c66d;stroke-width:3}
      .label{font:700 23px system-ui,sans-serif;fill:#10212b}
      .sub{font:500 15px system-ui,sans-serif;fill:#31505f}
      .title{font:700 25px system-ui,sans-serif;fill:#fff}
      .line{stroke:#f2c66d;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 12;animation:flow 3.2s linear infinite}
      .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .dash{stroke:#fff;stroke-opacity:.45;stroke-width:3;stroke-dasharray:7 9;fill:none}
      @keyframes flow{to{stroke-dashoffset:-42}}
      @keyframes pulse{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
    </style>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" class="title">VibePolaris · 2026-07-11</text>
  <text x="52" y="98" class="sub" fill="#fff">招聘信号 → 家庭场景 → 成员权限 → 等待产品证据</text>
  <path d="M218 270H318M438 270H538M658 270H758" class="line" fill="none"/>
  <g class="pulse">
    <rect x="48" y="200" width="170" height="140" rx="22" class="node"/>
    <text x="133" y="248" text-anchor="middle" class="label">招聘岗位</text>
    <text x="133" y="278" text-anchor="middle" class="sub">7 月 11 日报道</text>
    <text x="133" y="303" text-anchor="middle" class="sub">Families PM</text>
  </g>
  <g class="pulse" style="animation-delay:.35s">
    <rect x="318" y="200" width="170" height="140" rx="22" class="node"/>
    <text x="403" y="248" text-anchor="middle" class="label">家庭场景</text>
    <text x="403" y="278" text-anchor="middle" class="sub">孩子 · 照护者</text>
    <text x="403" y="303" text-anchor="middle" class="sub">年长者</text>
  </g>
  <g class="pulse" style="animation-delay:.7s">
    <rect x="538" y="200" width="170" height="140" rx="22" class="node"/>
    <text x="623" y="248" text-anchor="middle" class="label">授权边界</text>
    <text x="623" y="278" text-anchor="middle" class="sub">谁能读</text>
    <text x="623" y="303" text-anchor="middle" class="sub">谁能撤回</text>
  </g>
  <g class="pulse" style="animation-delay:1.05s">
    <rect x="758" y="200" width="154" height="140" rx="22" class="node"/>
    <text x="835" y="248" text-anchor="middle" class="label">待确认</text>
    <text x="835" y="278" text-anchor="middle" class="sub">套餐 · 时间</text>
    <text x="835" y="303" text-anchor="middle" class="sub">真实效果</text>
  </g>
  <path d="M133 365V424H835V365" class="dash"/>
  <circle cx="480" cy="424" r="9" fill="#fff" opacity=".85"><animate attributeName="r" values="7;20;7" dur="2.3s" repeatCount="indefinite"/></circle>
  <text x="480" y="474" text-anchor="middle" class="sub" fill="#fff">招聘说明是事实，家庭产品仍需正式公告与实际验证</text>
</svg>
