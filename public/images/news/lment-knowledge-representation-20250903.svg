<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">LMEnt：从语料到知识表示的可追踪时间轴</title>
<desc id="desc">实体标注语料经过检索，在多个训练 checkpoint 上观察知识获取，再检查编辑与幻觉。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6f2ff"/><stop offset="1" stop-color="#eefaf8"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5a4b9b"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#211e43" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#28214f" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">LMEnt：知识形成要沿着时间轴回查</text>
<text x="72" y="118" fill="#6c6b8e" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">实体标注语料 → 检索 → checkpoint → 编辑与幻觉回归</text>
<g filter="url(#shadow)">
 <rect x="70" y="190" width="250" height="286" rx="22" fill="#fff" stroke="#d8cdf7" stroke-width="2"/>
 <text x="108" y="240" fill="#5a4b9b" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">可回查语料</text>
 <rect x="108" y="273" width="174" height="62" rx="12" fill="#ece5ff"/><text x="195" y="311" text-anchor="middle" fill="#4c3f88" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">实体 + 上下文</text>
 <text x="108" y="381" fill="#6c6b8e" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Wikipedia 标注</text>
 <text x="108" y="413" fill="#6c6b8e" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">检索版本可追踪</text>
 </g>
 <path d="M338 331 H400" stroke="#5a4b9b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="420" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#a9d9d0" stroke-width="2"/>
 <text x="458" y="220" fill="#27786d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">训练中的表示变化</text>
 <circle cx="493" cy="293" r="29" fill="#d9f2ed"/><text x="493" y="300" text-anchor="middle" fill="#27786d" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">t1</text>
 <circle cx="595" cy="293" r="29" fill="#c5e9e2"/><text x="595" y="300" text-anchor="middle" fill="#27786d" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">t2</text>
 <circle cx="697" cy="293" r="29" fill="#a9d9d0"/><text x="697" y="300" text-anchor="middle" fill="#1f5e57" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">tN</text>
 <path d="M527 293 H558 M629 293 H660" stroke="#27786d" stroke-width="4" marker-end="url(#arrow)"/>
 <text x="458" y="370" fill="#537f79" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">12 个模型 · 约 4K checkpoint</text>
 <text x="458" y="405" fill="#537f79" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">共现与提及形式</text>
 <text x="458" y="440" fill="#537f79" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">知识获取趋势</text>
</g>
<path d="M788 331 H850" stroke="#5a4b9b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#f0c67d" stroke-width="2"/>
 <text x="907" y="220" fill="#a36e14" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">回归检查</text>
 <rect x="907" y="255" width="186" height="58" rx="12" fill="#fff0c9"/><text x="1000" y="291" text-anchor="middle" fill="#80580a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">编辑前后</text>
 <rect x="907" y="335" width="186" height="58" rx="12" fill="#fff0c9"/><text x="1000" y="371" text-anchor="middle" fill="#80580a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">幻觉 / 归因</text>
 <text x="1000" y="437" text-anchor="middle" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">保留版本与副作用</text>
 <text x="1000" y="467" text-anchor="middle" fill="#806a3a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不是一张万能知识地图</text>
</g>
<text x="70" y="578" fill="#5a4b9b" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">实体检索最高提升 80.4% · 模型规模最高 1B 参数</text>
<text x="70" y="615" fill="#6c6b8e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">把“模型答对了”拆成数据、表示、编辑和生成阶段的证据。</text>
</svg>