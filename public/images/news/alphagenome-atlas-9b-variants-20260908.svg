<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>AlphaGenome Atlas</title><desc>A DNA strand expands into a genome-wide atlas of variants, an impact score and a validated research target.</desc><style>.dna{animation:dna 5s ease-in-out infinite}.score{animation:score 3s ease-in-out infinite}@keyframes dna{50%{transform:translateX(24px)}}@keyframes score{50%{transform:scale(1.12);opacity:.75}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#101f36"/><g class="dna" fill="none" stroke="#84d8ff" stroke-width="8"><path d="M120 165C280 260 280 370 120 465"/><path d="M260 165C100 260 100 370 260 465"/><path d="M140 205H240M115 270H265M115 345H265M140 410H240" stroke="#f2cb69" stroke-width="6"/></g><path d="M315 315H480" stroke="#84d8ff" stroke-width="7" stroke-dasharray="16 14"/><rect x="480" y="180" width="280" height="270" rx="28" fill="#225a70" stroke="#8fe6c2" stroke-width="5"/><text x="620" y="260" fill="#ecfff7" font-size="30" text-anchor="middle">9 billion</text><text x="620" y="300" fill="#b8f0db" font-size="20" text-anchor="middle">single-letter variants</text><circle cx="620" cy="370" r="38" fill="#f2cb69" class="score"/><text x="620" y="379" fill="#493611" font-size="20" text-anchor="middle">AVI</text><path d="M760 315H915" stroke="#84d8ff" stroke-width="7" stroke-dasharray="16 14"/><rect x="915" y="220" width="190" height="190" rx="24" fill="#f2cb69"/><text x="1010" y="295" fill="#4b3914" font-size="25" text-anchor="middle">验证</text><text x="1010" y="332" fill="#6c531e" font-size="18" text-anchor="middle">实验目标</text><text x="100" y="88" fill="#84d8ff" font-size="24">GOOGLE DEEPMIND · ALPHAGENOME ATLAS · 2026-09-08</text><text x="100" y="565" fill="#b9c9da" font-size="20">全基因组预测是研究入口，不是对个体疾病的诊断</text></svg>