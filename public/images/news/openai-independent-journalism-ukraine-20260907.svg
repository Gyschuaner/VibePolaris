<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>OpenAI, WAN-IFRA and AIRPPU newsroom AI programme</title><desc>A newsroom support path moves from 45 editorial teams through ten catalyst pilots to human-reviewed local journalism.</desc><style>.flow{animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-72}}@keyframes pulse{50%{opacity:.72;transform:scale(1.05)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#101c32"/><text x="80" y="78" fill="#8fe7ff" font-size="24">OPENAI × WAN-IFRA × AIRPPU · 2026-09-07</text><rect x="70" y="170" width="300" height="220" rx="24" fill="#203b65" stroke="#8fe7ff" stroke-width="4"/><text x="220" y="235" fill="#eefbff" font-size="30" text-anchor="middle">45 teams</text><text x="220" y="282" fill="#b9d8ee" font-size="21" text-anchor="middle">Masterclass</text><text x="220" y="326" fill="#b9d8ee" font-size="18" text-anchor="middle">editorial · audience · product</text><circle cx="220" cy="365" r="18" fill="#f2cb72" class="pulse"/><path d="M370 280H500" stroke="#8fe7ff" stroke-width="8" stroke-dasharray="18 16" class="flow"/><rect x="500" y="145" width="300" height="270" rx="24" fill="#264e4b" stroke="#9cf0c7" stroke-width="4"/><text x="650" y="222" fill="#f1fff8" font-size="30" text-anchor="middle">10 media</text><text x="650" y="270" fill="#c7f5df" font-size="21" text-anchor="middle">Catalyst pilots</text><text x="650" y="315" fill="#c7f5df" font-size="18" text-anchor="middle">roadmap + API credits</text><path d="M800 280H930" stroke="#9cf0c7" stroke-width="8" stroke-dasharray="18 16" class="flow"/><rect x="930" y="170" width="200" height="220" rx="24" fill="#5b3b54" stroke="#ffb7a8" stroke-width="4"/><text x="1030" y="245" fill="#fff4f1" font-size="25" text-anchor="middle">Editor</text><text x="1030" y="286" fill="#ffd8cf" font-size="19" text-anchor="middle">source check</text><text x="1030" y="322" fill="#ffd8cf" font-size="19" text-anchor="middle">final say</text><text x="80" y="525" fill="#b6cae5" font-size="22">项目支持的是新闻机构的能力建设，尚未证明报道质量或收入已经改善</text><text x="80" y="565" fill="#f2cb72" font-size="18">Masterclass → Catalyst → human review</text></svg>
