<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Perch 生物声学开放模型</title>
  <desc id="desc">Perch 从森林、海岸和水下声音中寻找生态线索，研究者再用本地标签核对和进入保护行动。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173d3d"/>
      <stop offset="1" stop-color="#7c9b68"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4efdc"/>
      <stop offset="1" stop-color="#d9e3c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#102c2c" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1048" cy="96" r="190" fill="#efd37c" opacity=".18"/>
  <circle cx="110" cy="540" r="230" fill="#a6c39b" opacity=".18"/>
  <path d="M20 458 C120 370 238 508 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#efd37c" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f4efdc"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#dfc77c"/>
  </g>
  <g fill="#173d3d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">自然声音</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#b7d0b1"/>
    <text x="218" y="261" font-size="25" text-anchor="middle" font-weight="800">鸟 · 哺乳 · 两栖</text>
    <path d="M108 329 h214" stroke="#7c9b68" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">森林 · 海岸 · 水下</text>
    <text x="108" y="405" font-size="16">噪声也在录音里</text>

    <text x="489" y="178" font-size="25" font-weight="800">Perch</text>
    <circle cx="600" cy="260" r="62" fill="#7c9b68"/>
    <path d="M555 275 C574 242 586 271 600 235 C614 201 627 273 648 242" fill="none" stroke="#f4efdc" stroke-width="9" stroke-linecap="round"/>
    <path d="M510 355 C551 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#7c9b68" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">开放模型 · Kaggle</text>

    <text x="860" y="178" font-size="25" font-weight="800">保护行动</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#7c9b68"/>
    <text x="970" y="261" font-size="23" fill="#f4efdc" text-anchor="middle" font-weight="800">筛选 → 核对</text>
    <path d="M860 330 h215" stroke="#173d3d" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">标签 · 现场 · 决策</text>
    <text x="860" y="405" font-size="16">模型不是终点</text>
  </g>
  <g fill="#f4efdc" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">PERCH · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">听见线索，再交给现场</text>
  </g>
</svg>
