<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 产品从联邦采购货架走向机构评估</title>
  <desc id="desc">Claude、Gemini 和 ChatGPT 进入采购入口，机构仍需完成审查、试点和治理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#20354c"/>
      <stop offset="1" stop-color="#527766"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5edd8"/>
      <stop offset="1" stop-color="#d6e4d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#0d1d2c" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1045" cy="100" r="185" fill="#edc878" opacity=".15"/>
  <circle cx="125" cy="530" r="235" fill="#91c2a2" opacity=".16"/>
  <path d="M30 445 C170 340 285 500 430 370 S680 275 830 400 S1030 475 1190 305" fill="none" stroke="#edc878" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="90" y="118" width="300" height="320" rx="30" fill="url(#card)"/>
    <rect x="450" y="118" width="300" height="320" rx="30" fill="#f5edd8"/>
    <rect x="810" y="118" width="300" height="320" rx="30" fill="#e3c474"/>
  </g>
  <g fill="#20354c" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="135" y="178" font-size="25" font-weight="800">采购货架</text>
    <rect x="135" y="230" width="205" height="48" rx="16" fill="#d6e4d0"/>
    <text x="160" y="261" font-size="17">Claude</text>
    <rect x="135" y="292" width="170" height="48" rx="16" fill="#91c2a2"/>
    <text x="160" y="323" font-size="17">Gemini</text>
    <rect x="135" y="354" width="145" height="48" rx="16" fill="#b4cfae"/>
    <text x="160" y="385" font-size="17">ChatGPT</text>

    <text x="495" y="178" font-size="25" font-weight="800">机构审查</text>
    <path d="M500 250 h200" stroke="#527766" stroke-width="9" stroke-linecap="round"/>
    <circle cx="520" cy="250" r="16" fill="#20354c"/>
    <circle cx="600" cy="250" r="16" fill="#20354c"/>
    <circle cx="680" cy="250" r="16" fill="#20354c"/>
    <path d="M520 320 h150" stroke="#527766" stroke-width="12" stroke-linecap="round"/>
    <path d="M520 370 h110" stroke="#527766" stroke-width="12" stroke-linecap="round" opacity=".6"/>
    <text x="495" y="408" font-size="17">数据 · 权限 · 合规</text>

    <text x="855" y="178" font-size="25" font-weight="800">上线治理</text>
    <circle cx="900" cy="265" r="25" fill="#527766"/>
    <path d="M887 265 l9 9 l18 -22" fill="none" stroke="#f5edd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M960 245 h110 M960 295 h80 M960 345 h130" stroke="#20354c" stroke-width="11" stroke-linecap="round"/>
    <text x="855" y="408" font-size="17">试点 · 监控 · 退出</text>
  </g>
  <g fill="#f5edd8" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="90" y="565" font-size="22" letter-spacing="1">GSA MAS · 2025.08.05</text>
    <text x="1110" y="565" font-size="16" text-anchor="end" opacity=".84">能采购，不等于已部署</text>
  </g>
</svg>
