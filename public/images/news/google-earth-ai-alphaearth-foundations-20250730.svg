<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Google Earth AI 与 AlphaEarth Foundations</title><desc id="desc">多源地球观测经过嵌入进入地图任务和人工核验，模型、数据集与决策分层。</desc><rect width="1200" height="680" rx="36" fill="#0f172a"/><g font-family="Arial, sans-serif"><text x="90" y="92" fill="#f8fafc" font-size="34" font-weight="700">Observe → Embed → Verify</text><text x="90" y="128" fill="#93c5fd" font-size="20">Google Earth AI · AlphaEarth Foundations · 2025-07-30</text><g transform="translate(90 220)"><rect width="255" height="145" rx="22" fill="#dbeafe"/><text x="28" y="54" fill="#1e3a8a" font-size="24" font-weight="700">多源观测</text><text x="28" y="96" fill="#334155" font-size="18">光学 · 雷达 · LiDAR</text></g><g transform="translate(472 220)"><rect width="255" height="145" rx="22" fill="#dcfce7"/><text x="28" y="54" fill="#166534" font-size="24" font-weight="700">64 维嵌入</text><text x="28" y="96" fill="#334155" font-size="18">10×10 m 地理网格</text></g><g transform="translate(855 220)"><rect width="255" height="145" rx="22" fill="#fef3c7"/><text x="28" y="54" fill="#92400e" font-size="24" font-weight="700">地图任务</text><text x="28" y="96" fill="#57534e" font-size="18">原始资料再核验</text></g><path d="M345 292H472M727 292H855" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrow)"/><path d="M983 378V468" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/><g transform="translate(90 468)"><rect width="1020" height="100" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="30" y="44" fill="#fde68a" font-size="23" font-weight="700">嵌入 ≠ 自动决策</text><text x="30" y="77" fill="#cbd5e1" font-size="18">数据血缘、时间线和地面证据决定地图结果能否解释。</text></g></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#60a5fa"/></marker></defs></svg>