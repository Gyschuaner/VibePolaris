<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Arrakis AI 代理行为治理</title><desc id="desc">Arrakis 从发现企业代理到建立行为画像、实时监控和异常响应，并宣布 800 万美元种子轮。</desc><rect width="960" height="540" rx="28" fill="#111827"/><circle cx="480" cy="250" r="92" fill="#312e81" stroke="#a5b4fc" stroke-width="4"/><text x="480" y="244" text-anchor="middle" fill="#e0e7ff" font-size="25" font-family="sans-serif">行为治理</text><text x="480" y="278" text-anchor="middle" fill="#c7d2fe" font-size="16" font-family="sans-serif">Arrakis</text><rect x="65" y="90" width="200" height="100" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="165" y="133" text-anchor="middle" fill="#cffafe" font-size="20" font-family="sans-serif">发现</text><text x="165" y="165" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">盘点代理与权限</text><rect x="695" y="90" width="200" height="100" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="795" y="133" text-anchor="middle" fill="#dbeafe" font-size="20" font-family="sans-serif">画像</text><text x="795" y="165" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">建立行为基线</text><rect x="65" y="350" width="200" height="100" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="165" y="393" text-anchor="middle" fill="#fef3c7" font-size="20" font-family="sans-serif">监控</text><text x="165" y="425" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">实时对照政策</text><rect x="695" y="350" width="200" height="100" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="795" y="393" text-anchor="middle" fill="#ffe4e6" font-size="20" font-family="sans-serif">响应</text><text x="795" y="425" text-anchor="middle" fill="#fecdd3" font-size="15" font-family="sans-serif">拦截 · 升级 · 复查</text><path d="M265 140L405 215M695 140L555 215M265 400L405 285M695 400L555 285" stroke="#94a3b8" stroke-width="3"/><text x="480" y="500