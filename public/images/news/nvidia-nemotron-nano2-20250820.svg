<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nemotron Nano 2 hybrid Mamba Transformer</title>
  <desc id="desc">A hybrid Mamba Transformer model routes long reasoning traces through a compact inference path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111b35"/><stop offset="1" stop-color="#243e45"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9df29c"/><stop offset="1" stop-color="#5ce1d4"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8db7ff"/><stop offset="1" stop-color="#bca4ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#050b18" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1038" cy="98" r="208" fill="#9df29c" opacity=".12"/>
  <circle cx="1030" cy="575" r="250" fill="#8db7ff" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="70" width="710" height="140" rx="24" fill="#172a43" stroke="#9df29c" stroke-width="2"/>
    <text x="108" y="125" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#bafbb3">NVIDIA · NEMOTRON</text>
    <text x="108" y="181" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#f5f8ff">NANO 2 · 9B</text>
  </g>
  <text x="80" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e6ecff">把长思考的成本，改写成吞吐问题</text>
  <g transform="translate(814 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="244" height="390" rx="28" fill="#111c31" stroke="#b9c8ff" stroke-width="3"/>
    <rect x="28" y="35" width="188" height="64" rx="16" fill="#294c52"/>
    <text x="122" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#bafbb3">MAMBA-2</text>
    <path d="M46 130h152M46 185h152M46 240h152" stroke="#6179a9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="76" cy="130" r="18" fill="url(#green)"/><circle cx="164" cy="185" r="18" fill="url(#blue)"/><circle cx="104" cy="240" r="18" fill="url(#green)"/>
    <text x="122" y="321" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e5ebff">128K · A10G</text>
  </g>
  <g transform="translate(80 360)">
    <rect width="668" height="140" rx="20" fill="#192d46" stroke="#4f7691" stroke-width="2"/>
    <text x="30" y="49" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#bafbb3">12B BASE → MINITRON → 9B V2</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#ebefff">20T tokens · FP8 · reasoning throughput</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c0cbea">最高 6×：论文特定输入输出设置</text>
  </g>
  <text x="82" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c2cbe7">ARXIV · FIRST SUBMITTED 20 AUG 2025</text>
</svg>
