<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">ProST 的渐进子任务训练</title><desc id="desc">小模型多 Agent 从少量子任务开始，逐轮加入组合，再用效果与效率画 Pareto 前沿。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d8d4ca" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#293231">ProST：小模型也要逐步学会分工</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#6f7975">子任务课程 · 多 Agent · 错误率 · Pareto</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="258" width="214" height="136" rx="22" fill="#e8eef8" stroke="#7c98bc" stroke-width="3"/><text x="211" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">少量任务</text><text x="211" y="348" text-anchor="middle" font-size="18" fill="#4d6e8d">基础交接</text>
<rect x="368" y="258" width="214" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7e551a">逐轮增加</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#98702e">新子任务</text>
<rect x="636" y="258" width="214" height="136" rx="22" fill="#f2e7f0" stroke="#b785a4" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#713d5b">多 Agent</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#95647c">长链协作</text>
<rect x="904" y="258" width="196" height="136" rx="22" fill="#e8f2e9" stroke="#76a37d" stroke-width="3"/><text x="1002" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">Pareto</text><text x="1002" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">效果 / 成本</text>
</g>
<g fill="none" stroke="#66736e" stroke-width="4" stroke-linecap="round"><path d="M318 326 H350"/><path d="M582 326 H618"/><path d="M850 326 H886"/></g><g fill="#66736e"><path d="M350 326 l-13 -9 v18z"/><path d="M618 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5956">分工只有在子任务错误和系统开销可测时才成立</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#77817d">消息、重试、等待和接管都要算进效率</text>
</svg>
