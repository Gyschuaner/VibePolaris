<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Scam2Prompt 的 LLM 安全审计</title><desc id="desc">受控样本经过模型、来源和工具边界检查，恶意端点被隔离并记录。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5f3"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdfa" stroke="#d9d3ce" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#2f3034">Scam2Prompt：把风险关进审计环境</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#74777d">受控样本 · 模型输出 · 工具隔离 · 授权记录</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="98" y="258" width="218" height="136" rx="22" fill="#f8e8e7" stroke="#c88d88" stroke-width="3"/><text x="207" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7e403c">受控样本</text><text x="207" y="348" text-anchor="middle" font-size="18" fill="#995a56">停用 / 仿真端点</text>
<rect x="366" y="258" width="218" height="136" rx="22" fill="#e9eef8" stroke="#7c98bb" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2d4f73">LLM 审计</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#4c6e8e">输出检查</text>
<rect x="634" y="258" width="218" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7d551a">沙盒工具</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#98702f">出站白名单</text>
<rect x="902" y="258" width="198" height="136" rx="22" fill="#e8f2e9" stroke="#76a27d" stroke-width="3"/><text x="1001" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2d6338">复核</text><text x="1001" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">授权 / 接管</text>
</g>
<g fill="none" stroke="#68736f" stroke-width="4" stroke-linecap="round"><path d="M316 326 H350"/><path d="M584 326 H618"/><path d="M852 326 H886"/></g><g fill="#68736f"><path d="M350 326 l-13 -9 v18z"/><path d="M618 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d585d">模型会写代码，工具必须决定代码能不能运行</text>
<text x="600" y="531" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#7b8388">最小权限 · 出站隔离 · 来源记录 · 持续复测</text>
</svg>
