<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">MoLoRAG：页面图帮助多页文档问答</title>
<desc id="desc">页面保留视觉信息，页面图连接逻辑关联，轻量 VLM 选择 top-K 页面交给 LVLM 回答。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#fff3e7"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#59768e"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2a4a61" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#2f5973" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">文档里的答案，可能藏在下一页的关系里</text>
<text x="70" y="114" fill="#6f8998" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">page graph · logical relevance · top-K context · LVLM</text>
<g filter="url(#shadow)">
 <rect x="66" y="173" width="254" height="322" rx="22" fill="#fff" stroke="#b9d7e6" stroke-width="2"/>
 <text x="103" y="221" fill="#3b7897" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">多页图文文档</text>
 <rect x="104" y="255" width="92" height="110" rx="8" fill="#e2f1fa" stroke="#9ec4d5"/><path d="M119 285 H181 M119 305 H170 M119 325 H181" stroke="#6d9db2" stroke-width="6" stroke-linecap="round"/>
 <rect x="211" y="255" width="71" height="110" rx="8" fill="#fff0d9" stroke="#e0bc82"/><circle cx="246" cy="294" r="18" fill="#f0ca7e"/><path d="M222 344 L242 320 L258 335 L271 313" fill="none" stroke="#b7823e" stroke-width="4"/>
 <text x="174" y="417" text-anchor="middle" fill="#6f8998" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">文字 + 图表 + 页序</text>
 <text x="174" y="453" text-anchor="middle" fill="#b16f4a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不能只看关键词</text>
</g>
<path d="M336 335 H375" stroke="#59768e" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="395" y="145" width="404" height="380" rx="22" fill="#fff" stroke="#b9cce5" stroke-width="2"/>
 <text x="435" y="201" fill="#4d6f99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">页面图检索</text>
 <circle cx="496" cy="282" r="28" fill="#e2f1fa" stroke="#79a9c1" stroke-width="3"/><circle cx="615" cy="240" r="28" fill="#fff0d9" stroke="#d0a15e" stroke-width="3"/><circle cx="698" cy="321" r="28" fill="#e5f2eb" stroke="#7bb096" stroke-width="3"/><circle cx="578" cy="386" r="28" fill="#eee7ff" stroke="#a18acb" stroke-width="3"/>
 <path d="M520 269 L587 248 M636 261 L678 300 M678 341 L599 371 M555 369 L510 305" fill="none" stroke="#6f8998" stroke-width="4" marker-end="url(#arrow)"/>
 <text x="496" y="289" text-anchor="middle" fill="#3b7897" font-size="14" font-family="Arial, 'Noto Sans CJK SC', sans-serif">P1</text><text x="615" y="247" text-anchor="middle" fill="#a06f33" font-size="14" font-family="Arial, 'Noto Sans CJK SC', sans-serif">P2</text><text x="698" y="328" text-anchor="middle" fill="#4e8662" font-size="14" font-family="Arial, 'Noto Sans CJK SC', sans-serif">P3</text><text x="578" y="393" text-anchor="middle" fill="#765da3" font-size="14" font-family="Arial, 'Noto Sans CJK SC', sans-serif">P4</text>
 <rect x="450" y="438" width="296" height="54" rx="11" fill="#e8f0ff"/><text x="598" y="472" text-anchor="middle" fill="#456b9a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">轻量 VLM 遍历逻辑连接</text>
</g>
<path d="M820 335 H859" stroke="#59768e" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="880" y="173" width="254" height="322" rx="22" fill="#fff" stroke="#b8d5c3" stroke-width="2"/>
 <text x="920" y="221" fill="#4c8666" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">回答上下文</text>
 <rect x="916" y="255" width="184" height="48" rx="10" fill="#e5f2eb"/><text x="1008" y="285" text-anchor="middle" fill="#4e8662" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">top-K 页面</text>
 <rect x="916" y="321" width="184" height="48" rx="10" fill="#e2f1fa"/><text x="1008" y="351" text-anchor="middle" fill="#3b7897" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">任意 LVLM</text>
 <rect x="916" y="387" width="184" height="48" rx="10" fill="#fff0d9"/><text x="1008" y="417" text-anchor="middle" fill="#a06f33" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">准确率 +9.68%</text>
 <text x="1008" y="461" text-anchor="middle" fill="#6f8998" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">四个 DocQA 数据集</text>
</g>
<text x="68" y="575" fill="#a06f33" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">检索精度 +7.44%，仍需看清实验边界</text>
<text x="68" y="613" fill="#6f8998" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">页面解析、图更新和 top-K 截断都会影响最终答案。</text>
</svg>
