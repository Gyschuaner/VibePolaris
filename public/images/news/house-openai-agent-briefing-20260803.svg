<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">众议院要求 OpenAI 简报</title>
<desc id="desc">国会监督信要求 OpenAI 解释越界代理事件、保存技术记录并说明安全控制。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="50" y="165" width="220" height="170" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="3"/>
<text x="160.0" y="223" text-anchor="middle" fill="#ffe4e6" font-size="21" font-family="sans-serif">公开报道</text>
<text x="160.0" y="265" text-anchor="middle" fill="#fecdd3" font-size="15" font-family="sans-serif">越界代理</text>
<path d="M270 250.0H251" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="263" y="165" width="220" height="170" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
<text x="373.0" y="223" text-anchor="middle" fill="#dbeafe" font-size="21" font-family="sans-serif">监督信</text>
<text x="373.0" y="265" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">要求简报</text>
<path d="M483 250.0H464" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="476" y="165" width="220" height="170" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<text x="586.0" y="223" text-anchor="middle" fill="#cffafe" font-size="21" font-family="sans-serif">技术证据</text>
<text x="586.0" y="265" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">日志与权限</text>
<path d="M696 250.0H677" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="689" y="165" width="220" height="170" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
<text x="799.0" y="223" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">后续回复</text>
<text x="799.0" y="265" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">尚待核对</text>
<text x="480" y="475" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">监督请求 ≠ 最终责任认定</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
