<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Thinking Machines Lab 融资与未知产品</title><desc id="desc">资金和团队节点汇聚到一个仍被问号遮住的模型盒子，表示估值先于公开技术证据。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171d34"/><stop offset="1" stop-color="#3a2951"/></linearGradient><radialGradient id="star"><stop stop-color="#f4c777"/><stop offset="1" stop-color="#e77668"/></radialGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><g opacity=".35" fill="#f4c777"><circle cx="115" cy="160" r="2"/><circle cx="260" cy="115" r="3"/><circle cx="410" cy="165" r="2"/><circle cx="730" cy="120" r="3"/><circle cx="1060" cy="180" r="2"/><circle cx="1030" cy="500" r="3"/></g><text x="76" y="84" fill="#fff8f1" font-family="Arial" font-size="28" font-weight="700">Thinking Machines Lab · 20 亿美元先到，产品仍在幕后</text><text x="76" y="118" fill="#c5b8d3" font-family="Arial" font-size="16">融资事实、团队信号和技术证据要分开读取</text><g stroke="#f4c777" stroke-width="5" stroke-dasharray="9 12" opacity=".9"><path d="M190 295L520 330M340 510L520 390M900 275L660 330M850 520L660 410"/></g><g transform="translate(90 230)"><circle cx="100" cy="90" r="64" fill="url(#star)"/><text x="54" y="98" fill="#231a31" font-family="Arial" font-size="22" font-weight="700">$2B</text><text x="45" y="190" fill="#c5b8d3" font-family="Arial" font-size="15">seed round</text></g><g transform="translate(270 440)"><circle cx="75" cy="60" r="54" fill="#f0a567"/><text x="32" y="67" fill="#2a1c36" font-family="Arial" font-size="16">团队</text><text x="12" y="150" fill="#c5b8d3" font-family="Arial" font-size="15">founder signal</text></g><g transform="translate(865 215)"><circle cx="90" cy="90" r="66" fill="#7ad4c0"/><text x="52" y="99" fill="#1c2735" font-family="Arial" font-size="21">$10B</text><text x="22" y="190" fill="#c5b8d3" font-family="Arial" font-size="15">pre-money</text></g><g transform="translate(820 460)"><circle cx="75" cy="65" r="58" fill="#5d648f" stroke="#9fa7d2" stroke-width="5"/><text x="58" y="84" fill="#fff8f1" font-family="Arial" font-size="42">?</text><text x="2" y="155" fill="#c5b8d3" font-family="Arial" font-size="15">public model / benchmark</text></g><text x="500" y="590" fill="#c5b8d3" font-family="Arial" font-size="16">capital + people → future product → evidence still pending</text></svg>
