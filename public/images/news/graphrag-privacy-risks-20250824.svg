<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Graph RAG privacy</title>
  <desc id="desc">A graph protects one text path while its entity and relationship edges remain visible as a different privacy surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18273a"/><stop offset="1" stop-color="#4d3148"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#81d9cc"/><stop offset="1" stop-color="#f4b779"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070d" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#111a2a" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a7bccf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">GRAPH RAG PRIVACY · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">The graph is data too</text>
  <text x="124" y="255" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">Less text leakage can still mean more edges exposed.</text>
  <g stroke="url(#edge)" stroke-width="5" fill="none" stroke-linecap="round"><path d="M330 390l155-74"/><path d="M330 390l155 74"/><path d="M540 316l155 74"/><path d="M540 464l155-74"/><path d="M750 390l145-74"/><path d="M750 390l145 74"/></g>
  <g fill="#243f49" stroke="#81d9cc" stroke-width="3"><circle cx="300" cy="390" r="42"/><circle cx="515" cy="316" r="42"/><circle cx="515" cy="464" r="42"/></g>
  <g fill="#4a3042" stroke="#f4b779" stroke-width="3"><circle cx="730" cy="390" r="42"/><circle cx="930" cy="316" r="42"/><circle cx="930" cy="464" r="42"/></g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><text x="300" y="397">doc</text><text x="515" y="323">node</text><text x="515" y="471">node</text><text x="730" y="397">edge</text><text x="930" y="323">edge</text><text x="930" y="471">edge</text></g>
  <text x="124" y="535" fill="#a7bccf" font-family="Arial, sans-serif" font-size="18">Protect nodes, edges, attributes and cross-request links.</text>
</svg>
