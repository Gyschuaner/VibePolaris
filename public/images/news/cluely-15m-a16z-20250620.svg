<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Cluely 实时 AI 助手与信任边界</title><desc id="desc">一台实时助手读取屏幕和通话后给出提示，绿色融资路径与红色场景风险分开。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172134"/><stop offset="1" stop-color="#3d2537"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="76" y="84" fill="#f7f7f2" font-family="Arial" font-size="28" font-weight="700">Cluely · 实时 AI 辅助的两条线</text><text x="76" y="118" fill="#b5c0ca" font-family="Arial" font-size="16">融资讲增长，使用场景讲信任与许可</text><g transform="translate(110 205)"><rect width="340" height="230" rx="20" fill="#202e42" stroke="#5e7485"/><rect x="32" y="34" width="276" height="150" rx="12" fill="#111a29" stroke="#3d5869"/><path d="M60 90H270M60 125H230M60 160H250" stroke="#7ddbb8" stroke-width="7" stroke-linecap="round"/><circle cx="270" cy="90" r="14" fill="#ff916c"/><text x="35" y="210" fill="#b5c0ca" font-family="Arial" font-size="15">screen / call context</text></g><path d="M470 320H600" stroke="#7ddbb8" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(620 206)"><rect width="300" height="228" rx="20" fill="#202e42" stroke="#5e7485"/><circle cx="150" cy="86" r="43" fill="#7ddbb8"/><path d="M128 86L145 103L178 66" fill="none" stroke="#17303a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="71" y="170" fill="#f7f7f2" font-family="Arial" font-size="19">实时建议</text><text x="42" y="199" fill="#b5c0ca" font-family="Arial" font-size="14">融资未证明安全或合规</text></g><path d="M770 450V535M770 535H535M770 535H1005" stroke="#ff916c" stroke-width="7" stroke-dasharray="10 13"/><rect x="435" y="565" width="200" height="72" rx="16" fill="#4a2a3d" stroke="#ff916c"/><text x="475" y="609" fill="#fff5ee" font-family="Arial" font-size="17">考试 / 面试</text><rect x="905" y="565" width="200" height="72" rx="16" fill="#233d41" stroke="#7ddbb8"/><text x="945" y="609" fill="#f7f7f2" font-family="Arial" font-size="17">许可 / 声明</text><text x="110" y="535" fill="#b5c0ca" font-family="Arial" font-size="16">看见屏幕 → 生成提示 → 决定是否允许</text></svg>
