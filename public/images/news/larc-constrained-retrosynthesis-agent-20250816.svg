<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LARC constrained retrosynthesis agent</title>
  <desc id="desc">A target molecule is split backward into candidate routes, checked by a tool-based constraint gate, and fed back to an agent for replanning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142238"/><stop offset="1" stop-color="#3f3152"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0f1e4"/><stop offset="1" stop-color="#67addc"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffda8f"/><stop offset="1" stop-color="#efa16c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="78" r="215" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="570" r="250" fill="#83e2d7" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="670" height="136" rx="24" fill="#223550" stroke="#8bcfe0" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a1eee4">ARXIV · 16 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f4fbff">LARC · CONSTRAINED ROUTES</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">Agent 生成路线，工具把约束送回下一轮</text>
  <g transform="translate(776 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="344" height="404" rx="28" fill="#17243b" stroke="#6cbfd1" stroke-width="3"/>
    <text x="172" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeaf4">AGENTIC RETROSYNTHESIS</text>
    <g transform="translate(35 64)">
      <circle cx="46" cy="52" r="31" fill="url(#teal)"/>
      <circle cx="103" cy="52" r="31" fill="url(#teal)"/>
      <circle cx="160" cy="52" r="31" fill="url(#teal)"/>
      <path d="M24 52 H182" stroke="#21405a" stroke-width="6" stroke-linecap="round"/>
      <text x="103" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dff9f4">目标分子 → 候选拆解</text>
    </g>
    <path d="M172 190 V226" stroke="#ffd38b" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 214 L172 233 L191 214" fill="none" stroke="#ffd38b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="35" y="246" width="274" height="66" rx="16" fill="url(#gold)"/>
    <text x="172" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3b2b32">AGENT-AS-A-JUDGE</text>
    <text x="172" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b3d36">工具检查约束 · 给出反馈</text>
    <path d="M172 319 V352" stroke="#9deee4" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 340 L172 359 L191 340" fill="none" stroke="#9deee4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e2f1ff">重规划 · 人工复核</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="650" height="140" rx="20" fill="#202f49" stroke="#536f8c" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">48 个任务 · 3 类约束</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e4eff9">作者实验报告：72.9% 成功率</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">工具反馈是路线检查的一部分，不是化学验证的终点</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">LARC · TOWARDS CONSTRAINED RETROSYNTHESIS PLANNING</text>
</svg>
