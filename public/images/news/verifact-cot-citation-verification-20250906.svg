<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">VeriFact-CoT：从事实核验到引用整合</title>
<desc id="desc">LLM 将事实主张拆开，依次进行验证、反思和引用绑定，再输出可追溯的回答。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eff8f7"/><stop offset="1" stop-color="#fff2e7"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5b7b80"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#254c51" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#2f6467" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">引用不是句末装饰，要能支撑每个主张</text>
<text x="70" y="114" fill="#738d91" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">verify · reflect · integrate citation · audit</text>
<g filter="url(#shadow)">
 <rect x="66" y="173" width="240" height="322" rx="22" fill="#fff" stroke="#b8d8d1" stroke-width="2"/>
 <text x="103" y="221" fill="#3d7d76" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">回答主张</text>
 <rect x="104" y="257" width="164" height="46" rx="10" fill="#e4f2ee"/><text x="186" y="286" text-anchor="middle" fill="#3d7d76" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">事实判断 A</text>
 <rect x="104" y="323" width="164" height="46" rx="10" fill="#fff0dc"/><text x="186" y="352" text-anchor="middle" fill="#a16d37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">事实判断 B</text>
 <text x="186" y="423" text-anchor="middle" fill="#738d91" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">逐条核对</text>
 <text x="186" y="462" text-anchor="middle" fill="#b16f4d" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不是一次生成</text>
</g>
<path d="M318 335 H354" stroke="#5b7b80" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="374" y="145" width="452" height="380" rx="22" fill="#fff" stroke="#c4d6cf" stroke-width="2"/>
 <text x="414" y="201" fill="#4a7876" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">多阶段自检</text>
 <rect x="414" y="247" width="116" height="58" rx="11" fill="#e4f2ee"/><text x="472" y="282" text-anchor="middle" fill="#3d7d76" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">事实验证</text>
 <rect x="548" y="247" width="116" height="58" rx="11" fill="#eee8ff"/><text x="606" y="282" text-anchor="middle" fill="#745ba1" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">反思修正</text>
 <rect x="682" y="247" width="104" height="58" rx="11" fill="#fff0dc"/><text x="734" y="282" text-anchor="middle" fill="#a16d37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">引用绑定</text>
 <path d="M532 276 H544 M666 276 H678" stroke="#5b7b80" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M734 328 C734 393 472 393 472 328" fill="none" stroke="#8a73b5" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="456" y="431" width="286" height="53" rx="11" fill="#e6f1fb"/><text x="599" y="464" text-anchor="middle" fill="#477290" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">保留证据与版本</text>
</g>
<path d="M848 335 H877" stroke="#5b7b80" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="897" y="173" width="237" height="322" rx="22" fill="#fff" stroke="#e2c5a1" stroke-width="2"/>
 <text x="933" y="221" fill="#a06d37" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">可追溯回答</text>
 <rect x="932" y="257" width="166" height="46" rx="10" fill="#e6f1fb"/><text x="1015" y="286" text-anchor="middle" fill="#477290" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">主张 + 来源</text>
 <rect x="932" y="323" width="166" height="46" rx="10" fill="#e4f2ee"/><text x="1015" y="352" text-anchor="middle" fill="#3d7d76" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">正确率 / 支持率</text>
 <rect x="932" y="389" width="166" height="46" rx="10" fill="#fff0dc"/><text x="1015" y="418" text-anchor="middle" fill="#a16d37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">人工复核</text>
 <text x="1015" y="462" text-anchor="middle" fill="#738d91" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高风险场景</text>
</g>
<text x="68" y="575" fill="#a06d37" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">论文摘要没有给出可复核的提升数值</text>
<text x="68" y="613" fill="#738d91" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">方法主张仍要经过独立数据集和来源质量评估。</text>
</svg>
