<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Harvey raises 550 million dollars</title><desc>A legal AI workflow links legal documents, a model and a funding milestone while keeping customer validation separate from valuation.</desc><style>.bar{animation:bar 3s ease-in-out infinite;transform-origin:bottom}.doc{animation:doc 3.4s ease-in-out infinite}@keyframes bar{50%{transform:scaleY(1.3)}}@keyframes doc{50%{transform:translateY(-10px)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#211b36"/><g class="doc"><rect x="110" y="170" width="250" height="300" rx="18" fill="#f6efdf"/><path d="M160 250H310M160 300H300M160 350H320M160 400H275" stroke="#b36a4b" stroke-width="12"/><text x="235" y="220" fill="#714538" font-size="24" text-anchor="middle">LEGAL</text></g><path d="M360 320H520" stroke="#eac56b" stroke-width="7" stroke-dasharray="18 16"/><rect x="520" y="190" width="300" height="250" rx="28" fill="#4f3e7e" stroke="#bca4ff" stroke-width="5"/><text x="670" y="285" fill="#f5efff" font-size="33" text-anchor="middle">Harvey</text><text x="670" y="327" fill="#d6c6ff" font-size="20" text-anchor="middle">legal models</text><path d="M820 320H980" stroke="#eac56b" stroke-width="7" stroke-dasharray="18 16"/><g fill="#f1c767" class="bar"><rect x="980" y="350" width="42" height="80"/><rect x="1035" y="290" width="42" height="140"/><rect x="1090" y="220" width="42" height="210"/></g><text x="100" y="88" fill="#bca4ff" font-size="24">HARVEY · SERIES C · 2026-09-09</text><text x="600" y="540" fill="#f1c767" font-size="38" text-anchor="middle">$550M · $15.5B valuation</text><text x="100" y="580" fill="#c2b5d0" font-size="18">融资支持产品路线；估值不等于客户效果或已实现收入</text></svg>