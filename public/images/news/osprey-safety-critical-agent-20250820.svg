<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Osprey safety critical agent</title>
  <desc id="desc">Osprey turns an agent plan into a reviewed and guarded control-room action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171d36"/><stop offset="1" stop-color="#3e2636"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd36f"/><stop offset="1" stop-color="#ff9f6e"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7af0db"/><stop offset="1" stop-color="#6ea6ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#080912" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="210" fill="#7af0db" opacity=".11"/>
  <circle cx="1030" cy="570" r="255" fill="#ff9f6e" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="700" height="140" rx="24" fill="#29243f" stroke="#ffd36f" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#ffe5a2">OSPREY · CONTROL ROOM</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fbf8ff">PLAN → REVIEW → ACT</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#eee6ff">让 Agent 先把依赖关系说清楚</text>
  <g transform="translate(818 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="248" height="418" rx="30" fill="#111b31" stroke="#b9caff" stroke-width="3"/>
    <rect x="30" y="35" width="188" height="72" rx="18" fill="#3a354b"/>
    <text x="124" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffe5a2">AGENT PLAN</text>
    <path d="M124 121v42M124 163l-50 42M124 163l50 42" stroke="#8298ce" stroke-width="7" stroke-linecap="round"/>
    <circle cx="74" cy="225" r="24" fill="url(#teal)"/><circle cx="174" cy="225" r="24" fill="url(#amber)"/>
    <path d="M124 256v49" stroke="#8298ce" stroke-width="7" stroke-linecap="round"/>
    <rect x="51" y="320" width="146" height="45" rx="18" fill="#2e674f" stroke="#7af0db" stroke-width="2"/>
    <text x="124" y="349" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e9fff9">HUMAN GATE</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="690" height="140" rx="20" fill="#29243f" stroke="#775d58" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#ffe5a2">ALS · HUNDREDS OF THOUSANDS OF CHANNELS</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#eeeaff">类型一致 · 工具筛选 · 数据下采样</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7cae2">论文案例中的部署主张，仍需现场验收</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c8c9e2">ARXIV · FIRST SUBMITTED 20 AUG 2025</text>
