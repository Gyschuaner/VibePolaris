<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SafetyFlow automated LLM safety benchmark</title>
  <desc id="desc">Seven specialized agents build a safety benchmark through a controlled evaluation flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171c38"/><stop offset="1" stop-color="#3f2d4b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a2f2c7"/><stop offset="1" stop-color="#7db8ff"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdb83"/><stop offset="1" stop-color="#ff99b8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070a15" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1044" cy="88" r="210" fill="#a2f2c7" opacity=".11"/>
  <circle cx="1030" cy="570" r="255" fill="#ff99b8" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="710" height="140" rx="24" fill="#272548" stroke="#a2f2c7" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#caffdf">SAFETYFLOW · EVALUATION</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#faf9ff">7 AGENTS → 23,446 QUERIES</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ebe7ff">把安全基准也变成一条 Agent 流</text>
  <g transform="translate(816 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="405" rx="30" fill="#111a32" stroke="#c3ccff" stroke-width="3"/>
    <circle cx="76" cy="80" r="24" fill="url(#green)"/><circle cx="176" cy="80" r="24" fill="url(#green)"/>
    <circle cx="76" cy="151" r="24" fill="url(#orange)"/><circle cx="176" cy="151" r="24" fill="url(#orange)"/>
    <path d="M76 104v23M176 104v23M76 175v38M176 175v38" stroke="#7c91c9" stroke-width="7" stroke-linecap="round"/>
    <rect x="46" y="230" width="160" height="72" rx="18" fill="#2f4c60" stroke="#a2f2c7" stroke-width="2"/>
    <text x="126" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eafff2">BENCHMARK</text>
    <text x="126" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c7d6e8">CHECK · DEDUPE</text>
    <text x="126" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e8edff">49 MODELS</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="706" height="140" rx="20" fill="#272548" stroke="#6b5d87" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#caffdf">4 DAYS · LOW REDUNDANCY</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">自动生成 · 专业工具 · 人类标准嵌入</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c8cbe3">自动化加速评测，不自动生成责任</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7cbe6">ARXIV · FIRST SUBMITTED 21 AUG 2025</text>
</svg>
