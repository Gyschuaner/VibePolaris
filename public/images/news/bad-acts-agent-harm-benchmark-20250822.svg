<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BAD-ACTS benchmark</title>
  <desc id="desc">Agent safety is evaluated by whether an action crosses a boundary in a real application environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20172f"/><stop offset="1" stop-color="#4a2f3d"/></linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffcf7a"/><stop offset="1" stop-color="#ff8b88"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#08040b" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="76" y="68" width="1048" height="494" rx="38" fill="#161322" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#c7a9bd" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">BAD-ACTS · AGENT SAFETY</text>
  <text x="124" y="212" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Test the action</text>
  <text x="124" y="258" fill="#ead9e7" font-family="Arial, sans-serif" font-size="25">Not only the refusal.</text>
  <rect x="124" y="337" width="230" height="112" rx="20" fill="#2f2c49" stroke="#8fb5ff" stroke-width="2"/>
  <text x="158" y="382" fill="#8fb5ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">DATASET</text>
  <text x="158" y="423" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">238 + 699</text>
  <rect x="390" y="337" width="230" height="112" rx="20" fill="#3d2c46" stroke="#ffcf7a" stroke-width="2"/>
  <text x="424" y="382" fill="#ffcf7a" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">ENVIRONMENTS</text>
  <text x="424" y="423" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">5 systems</text>
  <rect x="656" y="337" width="390" height="112" rx="20" fill="#472d3a" stroke="#ff8b88" stroke-width="2"/>
  <text x="690" y="382" fill="#ff8b88" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">OBSERVED RANGE</text>
  <text x="690" y="423" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">40–90% by model</text>
  <path d="M104 508h950" stroke="url(#warn)" stroke-width="4" stroke-linecap="round"/>
  <text x="124" y="535" fill="#c7a9bd" font-family="Arial, sans-serif" font-size="18">A benchmark makes harm replayable; it does not become a universal probability.</text>
</svg>
