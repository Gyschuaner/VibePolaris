<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">WebProber：Agent 化网站可用性测试</title>
<desc id="desc">在授权和只读边界内，Agent 从 URL 出发探索页面、记录状态并生成可复现报告。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#fff6ed"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3d75ae"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#20354c" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#1f3b5b" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">WebProber：像用户一样走一遍，才知道哪里会迷路</text>
<text x="72" y="118" fill="#668099" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">URL → 页面状态 → 只读探索 → 可复现报告</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="240" height="292" rx="22" fill="#fff" stroke="#c4dcef" stroke-width="2"/>
 <text x="106" y="238" fill="#3d75ae" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">授权入口</text>
 <rect x="106" y="272" width="168" height="56" rx="12" fill="#dceeff"/><text x="190" y="308" text-anchor="middle" fill="#2d5e8d" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">URL</text>
 <text x="106" y="378" fill="#668099" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">限域名 · 限频率</text>
 <text x="106" y="411" fill="#668099" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">默认只读</text>
 </g>
 <path d="M328 334 H390" stroke="#3d75ae" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="410" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#a7d7d0" stroke-width="2"/>
 <text x="448" y="220" fill="#28786d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Agent 探索</text>
 <rect x="448" y="254" width="120" height="52" rx="12" fill="#d9f1ec"/><text x="508" y="287" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">点击</text>
 <rect x="588" y="254" width="120" height="52" rx="12" fill="#d9f1ec"/><text x="648" y="287" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">输入</text>
 <rect x="448" y="326" width="120" height="52" rx="12" fill="#d9f1ec"/><text x="508" y="359" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">导航</text>
 <text x="588" y="359" fill="#537d76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">观察状态反馈</text>
 <text x="448" y="431" fill="#537d76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不只查单页规则</text>
 <text x="448" y="462" fill="#537d76" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">遇到登录就暂停</text>
</g>
<path d="M778 334 H850" stroke="#3d75ae" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#efc47e" stroke-width="2"/>
 <text x="906" y="220" fill="#a16e15" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">报告与复核</text>
 <rect x="906" y="255" width="188" height="56" rx="12" fill="#fff0c8"/><text x="1000" y="290" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">路径 + 截图</text>
 <rect x="906" y="333" width="188" height="56" rx="12" fill="#fff0c8"/><text x="1000" y="368" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">问题 + 影响</text>
 <text x="1000" y="438" text-anchor="middle" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">人工确认误报/漏报</text>
 <text x="1000" y="468" text-anchor="middle" fill="#668099" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">120 网站 · 29 问题</text>
</g>
<text x="70" y="578" fill="#3d75ae" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Agent 是额外的一双体验测试眼睛</text>
<text x="70" y="615" fill="#668099" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">授权、只读和人工接管先于“像用户一样”这句话。</text>
</svg>