<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 模型文件进入扫描与访问策略</title>
  <desc id="desc">模型文件经过 ClamAV 扫描后，威胁信号进入隔离或允许访问的策略。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#112d47"/>
      <stop offset="1" stop-color="#2c776e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecf5e8"/>
      <stop offset="1" stop-color="#c8e4d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#081d2e" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#f2ca70" opacity=".16"/>
  <circle cx="100" cy="540" r="230" fill="#75b3a6" opacity=".18"/>
  <path d="M25 445 C130 360 235 500 350 392 S565 335 675 430 S875 515 1000 378 S1095 345 1190 420" fill="none" stroke="#f2ca70" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#ecf5e8"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e9c878"/>
  </g>
  <g fill="#112d47" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">模型上传</text>
    <rect x="115" y="226" width="210" height="56" rx="17" fill="#b8d8cb"/>
    <path d="M145 260 h27 l13 -18 l17 29 l16 -17 h48" fill="none" stroke="#2c776e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="115" y="332" font-size="18">.pt · .pkl · other files</text>
    <path d="M115 371 h205" stroke="#2c776e" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <text x="115" y="404" font-size="16">公开仓库入口</text>

    <text x="487" y="178" font-size="25" font-weight="800">ClamAV 扫描</text>
    <circle cx="600" cy="280" r="62" fill="#2c776e"/>
    <path d="M600 225 v110 M545 280 h110" stroke="#ecf5e8" stroke-width="10" stroke-linecap="round"/>
    <path d="M505 377 h190" stroke="#2c776e" stroke-width="10" stroke-linecap="round" opacity=".45"/>
    <text x="487" y="408" font-size="17">恶意代码 · 反序列化</text>

    <text x="859" y="178" font-size="25" font-weight="800">访问策略</text>
    <rect x="865" y="224" width="82" height="78" rx="19" fill="#2c776e"/>
    <path d="M891 266 l11 11 l20 -24" fill="none" stroke="#ecf5e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="982" y="224" width="82" height="78" rx="19" fill="#c36c61"/>
    <path d="M1008 250 l30 30 M1038 250 l-30 30" stroke="#ecf5e8" stroke-width="8" stroke-linecap="round"/>
    <path d="M862 351 h207" stroke="#112d47" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="404" font-size="17">允许 · 隔离 · 复核</text>
  </g>
  <g fill="#ecf5e8" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">CISCO × HUGGING FACE · 2025.08.05</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">扫描是第一道门</text>
  </g>
</svg>
