<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Positron AI $875 million Series C</title><desc>Memory-first inference hardware connects a large funding figure to a future silicon and system roadmap.</desc><style>.chip{animation:chip 3.2s ease-in-out infinite}.spark{animation:spark 2s ease-in-out infinite}@keyframes chip{50%{transform:translateY(-10px)}}@keyframes spark{50%{opacity:.25}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#091d2f"/><g class="chip"><rect x="430" y="170" width="330" height="260" rx="28" fill="#173e5e" stroke="#77dcff" stroke-width="5"/><rect x="500" y="235" width="190" height="130" rx="14" fill="#08253a" stroke="#f4c86d" stroke-width="4"/><text x="595" y="290" fill="#f4c86d" font-size="28" text-anchor="middle">INFERENCE</text><text x="595" y="330" fill="#b9e9ff" font-size="20" text-anchor="middle">memory-first</text></g><path d="M210 300H430M760 300H990" stroke="#77dcff" stroke-width="8" stroke-dasharray="18 16"/><g class="spark" fill="#f4c86d"><circle cx="150" cy="300" r="24"/><circle cx="1050" cy="240" r="18"/><circle cx="1050" cy="360" r="18"/></g><text x="100" y="88" fill="#77dcff" font-size="24">POSITRON AI · SERIES C · 2026-09-10</text><text x="600" y="520" fill="#f4c86d" font-size="40" text-anchor="middle">$875M · $5B post-money</text><text x="100" y="580" fill="#9bbdce" font-size="20">融资支持 Asimov tapeout 与 Titan 产能爬坡；路线图仍待兑现</text></svg>