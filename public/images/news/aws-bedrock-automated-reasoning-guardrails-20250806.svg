<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Bedrock Guardrails Automated Reasoning checks</title>
  <desc id="desc">模型输出经过业务规则和形式化验证后放行或进入人工复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#263b57"/>
      <stop offset="1" stop-color="#6b7c8e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f0df"/>
      <stop offset="1" stop-color="#d9e4e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#14243a" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#ebc876" opacity=".16"/>
  <circle cx="100" cy="540" r="230" fill="#83b2ae" opacity=".17"/>
  <path d="M24 458 C125 367 238 515 350 400 S560 322 675 430 S870 512 1006 382 S1100 347 1190 420" fill="none" stroke="#ebc876" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f4f0df"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c775"/>
  </g>
  <g fill="#263b57" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">模型输出</text>
    <rect x="115" y="226" width="220" height="54" rx="16" fill="#bdd7d6"/>
    <text x="141" y="260" font-size="17">answer / action</text>
    <path d="M115 335 h205" stroke="#6b7c8e" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="115" y="372" font-size="17">事实 · 政策 · 规则</text>
    <text x="115" y="407" font-size="16">先定义什么才算正确</text>

    <text x="487" y="178" font-size="25" font-weight="800">形式化验证</text>
    <circle cx="600" cy="274" r="62" fill="#6b7c8e"/>
    <path d="M600 228 v92 M554 274 h92" stroke="#f4f0df" stroke-width="10" stroke-linecap="round"/>
    <path d="M500 378 h200" stroke="#6b7c8e" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <text x="487" y="407" font-size="17">通过 · 歧义 · 待审</text>

    <text x="859" y="178" font-size="25" font-weight="800">交付决策</text>
    <circle cx="900" cy="266" r="26" fill="#6b7c8e"/>
    <path d="M887 266 l9 9 l18 -22" fill="none" stroke="#f4f0df" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1005" cy="266" r="26" fill="#ba6c60"/>
    <path d="M993 254 l24 24 M1017 254 l-24 24" stroke="#f4f0df" stroke-width="7" stroke-linecap="round"/>
    <path d="M865 370 h205" stroke="#263b57" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">放行 · 拒绝 · 人工</text>
  </g>
  <g fill="#f4f0df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">BEDROCK GUARDRAILS · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">规则能保证的才可验证</text>
  </g>
</svg>
