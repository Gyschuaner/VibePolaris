<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">MMSearch-Plus 的来源感知多模态搜索</title><desc id="desc">Agent 标记图片局部，发起图文检索，交叉验证并回链来源。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">MMSearch-Plus：把“看见”接到证据链</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">定位区域 · 图文检索 · 交叉验证 · 来源回链</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="282" width="214" height="116" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="211" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#21456f">图像区域</text><text x="211" y="365" text-anchor="middle" font-size="18" fill="#365b83">标记 / 裁剪</text>
<rect x="394" y="282" width="214" height="116" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="501" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#275d39">图文检索</text><text x="501" y="365" text-anchor="middle" font-size="18" fill="#3e7650">带噪声搜索</text>
<rect x="684" y="282" width="214" height="116" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="791" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#805513">交叉验证</text><text x="791" y="365" text-anchor="middle" font-size="18" fill="#966b24">排除相似事件</text>
<rect x="974" y="282" width="142" height="116" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1045" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#783553">回链</text><text x="1045" y="365" text-anchor="middle" font-size="17" fill="#94516f">网页证据</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M318 340 H384"/><path d="M608 340 H674"/><path d="M898 340 H964"/></g><g fill="#607080"><path d="M384 340 l-14 -9 v18z"/><path d="M674 340 l-14 -9 v18z"/><path d="M964 340 l-14 -9 v18z"/></g>
<text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">真正的视觉使用，会留下位置和来源</text>
</svg>