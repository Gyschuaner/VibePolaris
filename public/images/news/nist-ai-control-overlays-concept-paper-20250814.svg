<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NIST AI security control overlays</title>
  <desc id="desc">Layered security controls connect an AI assistant, predictive model, single agent, multi-agent system and AI developer workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#173c55"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#3874e8"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop offset="0" stop-color="#f8d477"/><stop offset="1" stop-color="#f08f5d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#040b14" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="205" fill="#5cc8ff" opacity=".12"/>
  <circle cx="1030" cy="520" r="245" fill="#f8d477" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="72" y="74" width="600" height="132" rx="24" fill="#172b3d" stroke="#5cc8ff" stroke-width="2"/>
    <text x="106" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="4" fill="#9bdcff">NIST SP 800-53</text>
    <text x="106" y="176" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f0f6fc">AI CONTROL OVERLAYS</text>
  </g>
  <text x="78" y="265" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d8efff">按用例叠加安全控制</text>
  <g transform="translate(720 88)" filter="url(#shadow)">
    <rect x="38" y="48" width="290" height="230" rx="22" fill="#173756" stroke="#5cc8ff" stroke-width="3" transform="rotate(-8 183 163)"/>
    <rect x="54" y="32" width="290" height="230" rx="22" fill="#1e5272" stroke="#75d7ff" stroke-width="3" transform="rotate(4 199 147)"/>
    <rect x="74" y="22" width="290" height="230" rx="22" fill="url(#blue)" stroke="#d8f4ff" stroke-width="3"/>
    <path d="M219 66 L297 94 V150 C297 204 264 242 219 266 C174 242 141 204 141 150 V94 Z" fill="#112b43" opacity=".92"/>
    <path d="M180 158 L207 184 L260 124" fill="none" stroke="#f8d477" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="219" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#e5f7ff">USE-CASE LAYER</text>
  </g>
  <g transform="translate(82 354)">
    <rect width="566" height="136" rx="20" fill="#142d41" stroke="#315a75" stroke-width="2"/>
    <text x="30" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f8d477">5 PROPOSED USE CASES</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f3ff">GenAI · Predictive AI · Single Agent</text>
    <text x="30" y="115" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4f3ff">Multi-Agent · AI Developers</text>
  </g>
  <text x="82" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a5c7d7">CONCEPT PAPER · FEEDBACK · 14 AUG 2025</text>
