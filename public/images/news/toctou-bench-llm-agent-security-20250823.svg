<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TOCTOU-Bench</title>
  <desc id="desc">An agent checks external state, a clock moves, and the state must be verified again before use.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18283b"/><stop offset="1" stop-color="#4b3041"/></linearGradient>
    <linearGradient id="time" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cded0"/><stop offset="1" stop-color="#ffba7d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070d" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="68" width="1056" height="496" rx="38" fill="#101a2a" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a5bbcf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">TOCTOU-BENCH · 2025.08.23</text>
  <text x="124" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Check ≠ use</text>
  <text x="124" y="255" fill="#d1dce8" font-family="Arial, sans-serif" font-size="25">The state can change in between.</text>
  <rect x="126" y="352" width="250" height="100" rx="19" fill="#213d48" stroke="#7cded0" stroke-width="2"/><text x="160" y="393" fill="#7cded0" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">T0</text><text x="160" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">CHECK</text>
  <path d="M398 402h390" stroke="url(#time)" stroke-width="7" stroke-linecap="round"/><circle cx="594" cy="402" r="13" fill="#ffba7d"/><text x="546" y="356" fill="#ffba7d" font-family="Arial, sans-serif" font-size="18">TIME WINDOW</text>
  <rect x="812" y="352" width="254" height="100" rx="19" fill="#412c3d" stroke="#ffba7d" stroke-width="2"/><text x="846" y="393" fill="#ffba7d" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">T1</text><text x="846" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">USE</text>
  <text x="124" y="520" fill="#a5bbcf" font-family="Arial, sans-serif" font-size="18">Bind the check to a version, or stop when the state changes.</text>
</svg>
