<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">青少年 AI 陪伴调查</title><desc id="desc">Common Sense Media 对 1060 名美国青少年的调查显示 72% 用过 AI 陪伴、52% 定期使用；多数人仍更多和现实朋友相处，但有严肃对话和隐私分享信号。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171832"/><stop offset="1" stop-color="#4a1d3e"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#a5b4fc"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="68" y="76" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">Teen AI companions · NPR / Common Sense</text><text x="68" y="116" fill="#ddd6fe" font-size="21" font-family="sans-serif">2025-07-20 news · U.S. teens 13–17 · n=1,060</text><g font-family="sans-serif"><rect x="72" y="204" width="240" height="224" rx="26" fill="#5b21b6"/><text x="116" y="264" fill="#fff" font-size="25" font-weight="700">使用</text><text x="116" y="316" fill="#ede9fe" font-size="25">72% 用过</text><text x="116" y="356" fill="#ede9fe" font-size="20">52% 定期使用</text><text x="116" y="394" fill="#ddd6fe" font-size="17">娱乐 / 好奇</text><path d="M330 316h70" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/><path d="m387 304 18 12-18 12" fill="none" stroke="#a5b4fc" stroke-width="6"/><rect x="418" y="184" width="270" height="264" rx="26" fill="#7e22ce"/><text x="462" y="246" fill="#fff" font-size="25" font-weight="700">关系</text><text x="462" y="294" fill="#f5d0fe" font-size="20">80% 更多和真人相处</text><text x="462" y="334" fill="#f5d0fe" font-size="20">67% 觉得 AI 较不满足</text><text x="462" y="382" fill="#e9d5ff" font-size="17">普及 ≠ 替代</text><path d="M706 316h70" stroke="#f9a8d4" stroke-width="6" stroke-linecap="round"/><path d="m763 304 18 12-18 12" fill="none" stroke="#f9a8d4" stroke-width="6"/><rect x="794" y="204" width="334" height="224" rx="26" fill="#9d174d"><text x="838" y="264" fill="#fff" font-size="25" font-weight="700">信号</text><text x="838" y="310" fill="#fce7f3" font-size="19">33% 严肃问题先找 AI</text><text x="838" y="348" fill="#fce7f3" font-size="19">24% 分享个人信息</text><text x="838" y="386" fill="#fce7f3" font-size="19">34% 遇到不适回答</text><rect x="178" y="500" width="850" height="88" rx="26" fill="#0f1024" stroke="url(#line)" stroke-width="3"/><text x="357" y="548" fill="#fff" font-size="24" font-weight="700">调查是信号，不是因果判决</text><text x="355" y="578" fill="#ddd6fe" font-size="16">样本、定义、隐私和人工转介路径要一起看</text></g></svg>
