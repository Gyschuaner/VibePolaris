<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">数据在流动中处理的通用示意</title>
  <desc id="desc">左侧是数据库、文件和传感器等数据源，中间是把数据拆解并连接成网的处理层，右侧是决策动作；这是 Torch.AI 2021 年融资新闻的通用技术解释，不是公司已公开的具体架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171b3a"/><stop offset="1" stop-color="#164b55"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">数据在流动中被拆解、连接，再进入决策</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-17 · Torch.AI 融资新闻的通用技术解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#fda4af" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">数据源</text>
    <text x="237" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">数据库 / 文件 / 传感器</text>
    <text x="237" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">不同格式正在进入</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">实时拆解与连接</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">文字 / 形状 / 特征</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">Synaptic Mesh（公司命名）</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">决策动作</text>
    <text x="963" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">风险 / 运营 / 任务</text>
    <text x="963" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">权限与审计仍要核对</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">更早处理数据，不等于性能与合规已被独立证明</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">公司新闻回答了定位，没回答全部验证问题</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">PR Newswire / VentureBeat：融资与产品主张可追溯；延迟、错误、存储和验收仍需核验。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">来源：PR Newswire / VentureBeat</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2021-03-17</text><text x="944" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">边界：仍需核验</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释 data in-flight 新闻中的数据路径与证据边界。</text>
</svg>
