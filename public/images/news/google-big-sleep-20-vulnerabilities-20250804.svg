<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Big Sleep 漏洞发现闭环</title>
  <desc id="desc">AI 在代码中找到并复现漏洞，人类安全专家复核后交给维护者修复。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d2343"/>
      <stop offset="1" stop-color="#3d6b63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#10162f" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="180" fill="#f1c46e" opacity=".14"/>
  <circle cx="105" cy="545" r="230" fill="#81b9a3" opacity=".15"/>
  <g filter="url(#shadow)">
    <rect x="90" y="150" width="235" height="300" rx="24" fill="#e9e5d3"/>
    <rect x="380" y="150" width="235" height="300" rx="24" fill="#e9e5d3"/>
    <rect x="670" y="150" width="235" height="300" rx="24" fill="#e9e5d3"/>
    <rect x="960" y="150" width="150" height="300" rx="24" fill="#f1c46e"/>
  </g>
  <g fill="#1d2343" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="130" y="210" font-size="24" font-weight="800">发现</text>
    <path d="M130 275 h145 M130 315 h120 M130 355 h155" stroke="#3d6b63" stroke-width="10" stroke-linecap="round"/>
    <circle cx="265" cy="275" r="17" fill="#c75d5d"/>
    <text x="130" y="410" font-size="17">开源代码</text>

    <text x="420" y="210" font-size="24" font-weight="800">复现</text>
    <path d="M430 330 C455 250 500 250 530 330 S585 410 575 270" fill="none" stroke="#3d6b63" stroke-width="7"/>
    <circle cx="500" cy="330" r="18" fill="#f1c46e"/>
    <text x="420" y="410" font-size="17">AI Agent</text>

    <text x="710" y="210" font-size="24" font-weight="800">复核</text>
    <circle cx="790" cy="315" r="58" fill="#81b9a3"/>
    <path d="M760 315 l20 20 l42-50" fill="none" stroke="#1d2343" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="710" y="410" font-size="17">安全专家</text>

    <text x="982" y="210" font-size="22" font-weight="800">修复</text>
    <path d="M990 300 h90 M990 340 h65 M990 380 h75" stroke="#1d2343" stroke-width="10" stroke-linecap="round" opacity=".75"/>
    <text x="982" y="410" font-size="15">维护者</text>
  </g>
  <g fill="#e9e5d3" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="90" y="560" font-size="22" letter-spacing="1">Google Big Sleep · 2025.08.04</text>
    <text x="1110" y="560" font-size="16" text-anchor="end" opacity=".82">报告 ≠ 已修复</text>
  </g>
</svg>
