<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">主动学习减少高保真训练样本</title>
  <desc id="desc">主动学习从十万条样本中挑出更有信息量的例子，再经过人工标签和独立验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1d3b59"/>
      <stop offset="1" stop-color="#7b8eae"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f1e4"/>
      <stop offset="1" stop-color="#dce5ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#12273e" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1045" cy="96" r="190" fill="#f0c878" opacity=".17"/>
  <circle cx="112" cy="540" r="228" fill="#99c0c3" opacity=".17"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#f0c878" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f4f1e4"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#e6c37b"/>
  </g>
  <g fill="#1d3b59" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">大样本池</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#bfd7df"/>
    <text x="218" y="261" font-size="25" text-anchor="middle" font-weight="800">100,000</text>
    <path d="M108 329 h214" stroke="#7b8eae" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">先定义错误边界</text>
    <text x="108" y="405" font-size="16">不是随机删数据</text>

    <text x="489" y="178" font-size="25" font-weight="800">主动挑选</text>
    <circle cx="600" cy="260" r="62" fill="#7b8eae"/>
    <path d="M566 260 h68 M600 226 v68" stroke="#f4f1e4" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#7b8eae" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">信息量 · 标签质量</text>

    <text x="860" y="178" font-size="25" font-weight="800">独立验证</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#7b8eae"/>
    <text x="970" y="261" font-size="23" fill="#f4f1e4" text-anchor="middle" font-weight="800">&lt;500 samples</text>
    <path d="M860 330 h215" stroke="#1d3b59" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">边界 · 漏报 · 复核</text>
    <text x="860" y="405" font-size="16">实验不等于普适</text>
  </g>
  <g fill="#f4f1e4" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">ACTIVE LEARNING · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">先问哪些样本最有用</text>
  </g>
</svg>
