<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Abridge 从临床对话走向可审计编码</title><desc id="d">一段问诊逐层转为文档、编码和人工确认。</desc><rect width="1200" height="630" fill="#ecfdf5"/><text x="70" y="86" font-family="Arial" font-size="38" font-weight="700" fill="#064e3b">临床对话，怎样变成证据</text><text x="70" y="126" font-family="Arial" font-size="20" fill="#047857">Abridge Series E · $300M · 2025-06-23</text><path d="M160 360 C300 170 460 170 600 360 S900 550 1040 360" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/><g fill="#fff" stroke="#0f766e" stroke-width="4"><circle cx="160" cy="360" r="58"/><circle cx="380" cy="210" r="58"/><circle cx="600" cy="360" r="58"/><circle cx="820" cy="510" r="58"/><circle cx="1040" cy="360" r="58"/></g><g font-family="Arial" text-anchor="middle" fill="#064e3b"><text x="160" y="352" font-size="22" font-weight="700">问诊</text><text x="160" y="380" font-size="16">原始对话</text><text x="380" y="202" font-size="22" font-weight="700">文档</text><text x="380" y="230" font-size="16">医生确认</text><text x="600" y="352" font-size="22" font-weight="700">编码</text><text x="600" y="380" font-size="16">ICD-10 / HCC</text><text x="820" y="502" font-size="22" font-weight="700">证据</text><text x="820" y="530" font-size="16">可回看</text><text x="1040" y="352" font-size="22" font-weight="700">提交</text><text x="1040" y="380" font-size="16">留审计</text></g><text x="70" y="574" font-family="Arial" font-size="18" fill="#047857">融资与合作规模是公司公告口径；医疗效果仍需逐项验证。</text></svg>