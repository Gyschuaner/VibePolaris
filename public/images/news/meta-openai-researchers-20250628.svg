<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Meta 招募 OpenAI 研究员的 AI 人才流动事实链</title>
  <desc id="desc">四个研究员节点从 OpenAI 流向 Meta 超级智能团队，旁边标出报道、履历与待验证结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" rx="38" fill="url(#bg)"/>
  <circle cx="952" cy="100" r="180" fill="#7c3aed" opacity=".13"/>
  <circle cx="220" cy="560" r="240" fill="#2563eb" opacity=".10"/>
  <text x="70" y="92" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" letter-spacing="4">AI TALENT NEWS · 2025.06.28</text>
  <text x="70" y="160" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="48" font-weight="700">四名研究员，跨过一条组织边界</text>
  <text x="72" y="205" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">新闻确认的是人员流动；模型能力还要等待后续证据。</text>
  <rect x="70" y="292" width="270" height="176" rx="22" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <text x="102" y="335" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">OPENAI</text>
  <text x="102" y="375" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">后训练 · 多模态</text>
  <text x="102" y="410" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">语音 · 评测经验</text>
  <text x="102" y="450" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">来源：TechCrunch / WIRED</text>
  <path d="M370 380 C465 290 515 290 610 380" fill="none" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M585 351 l42 29 -42 29" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#dbeafe" stroke="#60a5fa" stroke-width="2">
    <circle cx="425" cy="335" r="10"/><circle cx="470" cy="313" r="10"/><circle cx="515" cy="313" r="10"/><circle cx="560" cy="335" r="10"/>
  </g>
  <rect x="680" y="292" width="450" height="176" rx="22" fill="#1e1b4b" stroke="#c084fc" stroke-width="2"/>
  <text x="714" y="335" fill="#e9d5ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">META SUPERINTELLIGENCE TEAM</text>
  <text x="714" y="378" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">组织目标 ≠ 已发布模型</text>
  <text x="714" y="414" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">offer 口径 ≠ 统一薪酬</text>
  <text x="714" y="450" fill="#c4b5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">下一步：正式任命、模型、评测与交付</text>
  <text x="70" y="558" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">VibePolaris · 事实链可追溯视觉</text>
  <text x="1130" y="558" text-anchor="end" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">自制 SVG · CC BY 4.0</text>
</svg>
