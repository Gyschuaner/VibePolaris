<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">ResearchQA 的科研回答 rubric</title><desc id="desc">一个科研问题被拆成引用、解释、限制和比较等逐项标准。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">ResearchQA：把“答全”拆成四格检查</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">引用 · 解释 · 限制 · 比较</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="116" y="286" width="220" height="116" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="226" y="332" text-anchor="middle" font-size="27" font-weight="700" fill="#21456f">科研问题</text><text x="226" y="368" text-anchor="middle" font-size="18" fill="#365b83">一个目标</text>
<rect x="426" y="206" width="190" height="88" rx="16" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="521" y="242" text-anchor="middle" font-size="23" font-weight="700" fill="#275d39">引用</text><text x="521" y="272" text-anchor="middle" font-size="17" fill="#3e7650">来源支持</text>
<rect x="426" y="318" width="190" height="88" rx="16" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="521" y="354" text-anchor="middle" font-size="23" font-weight="700" fill="#805513">解释</text><text x="521" y="384" text-anchor="middle" font-size="17" fill="#966b24">机制说明</text>
<rect x="426" y="430" width="190" height="88" rx="16" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="521" y="466" text-anchor="middle" font-size="23" font-weight="700" fill="#783553">限制</text><text x="521" y="496" text-anchor="middle" font-size="17" fill="#94516f">适用边界</text>
<rect x="814" y="286" width="224" height="116" rx="18" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/><text x="926" y="332" text-anchor="middle" font-size="27" font-weight="700" fill="#234b78">比较</text><text x="926" y="368" text-anchor="middle" font-size="18" fill="#385f8d">对象与维度</text>
</g>
