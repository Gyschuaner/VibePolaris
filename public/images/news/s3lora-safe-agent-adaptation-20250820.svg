    <path d="M49 80h154M49 143h154M49 206h154M49 269h154" stroke="#536eaa" stroke-width="10" stroke-linecap="round"/>
    <circle cx="85" cy="80" r="18" fill="url(#green)"/><circle cx="174" cy="143" r="18" fill="url(#orange)"/><circle cx="111" cy="206" r="18" fill="url(#orange)"/><circle cx="171" cy="269" r="18" fill="url(#green)"/>
    <path d="M48 327h156" stroke="#7185c0" stroke-width="6" stroke-linecap="round"/>
    <text x="126" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e8ecff">SPECTRAL SHARPNESS</text>
