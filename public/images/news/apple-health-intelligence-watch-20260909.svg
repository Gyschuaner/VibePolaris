<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Apple Watch health sensing and Apple Intelligence</title><desc>A watch sensor feeds heart rate and readiness signals into an on-device health intelligence layer with a clear medical boundary.</desc><style>.pulse{animation:pulse 1.4s ease-in-out infinite}.ring{animation:ring 8s linear infinite;transform-origin:600px 315px}@keyframes pulse{50%{transform:scale(1.22);opacity:.35}}@keyframes ring{to{transform:rotate(360deg)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#f4fbff"/><circle cx="600" cy="315" r="190" fill="none" stroke="#b6e2f5" stroke-width="5" stroke-dasharray="16 14" class="ring"/><rect x="470" y="155" width="260" height="320" rx="70" fill="#173e5a" stroke="#7dd4f2" stroke-width="7"/><rect x="510" y="220" width="180" height="145" rx="24" fill="#eafaff"/><path d="M530 292H555L570 265L592 330L612 245L632 292H670" fill="none" stroke="#ee6c7c" stroke-width="7" class="pulse"/><text x="600" y="415" fill="#aeeeff" font-size="20" text-anchor="middle">readiness 0–10</text><text x="100" y="88" fill="#1f6e9d" font-size="24">APPLE HEALTH · APPLE INTELLIGENCE · 2026-09-09</text><text x="100" y="560" fill="#47718a" font-size="21">传感器和模型给出线索；健康判断仍需要上下文和专业解释</text></svg>