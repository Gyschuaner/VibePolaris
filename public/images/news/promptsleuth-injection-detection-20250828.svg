<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PromptSleuth 的语义意图不变性</title>
  <desc id="desc">不同表面写法汇聚到同一个任务意图，再与授权边界比较。</desc>
  <rect width="1200" height="630" rx="32" fill="#f7f5ef"/>
  <rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
  <text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">PromptSleuth：不追字符串，追任务意图</text>
  <text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">改写 · 混淆 · 多任务 · 授权判断</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="116" y="214" width="198" height="76" rx="16" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/>
    <text x="215" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#21456f">写法 A</text>
    <rect x="116" y="320" width="198" height="76" rx="16" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/>
    <text x="215" y="366" text-anchor="middle" font-size="24" font-weight="700" fill="#275d39">写法 B</text>
    <rect x="116" y="426" width="198" height="76" rx="16" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/>
    <text x="215" y="472" text-anchor="middle" font-size="24" font-weight="700" fill="#805513">写法 C</text>
    <rect x="478" y="294" width="236" height="126" rx="20" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/>
    <text x="596" y="342" text-anchor="middle" font-size="28" font-weight="700" fill="#783553">任务意图</text>
    <text x="596" y="379" text-anchor="middle" font-size="19" fill="#94516f">是否要求未授权动作</text>
    <rect x="884" y="294" width="190" height="126" rx="20" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/>
    <text x="979" y="342" text-anchor="middle" font-size="27" font-weight="700" fill="#234b78">授权层</text>
    <text x="979" y="379" text-anchor="middle" font-size="19" fill="#385f8d">允许 / 暂停</text>
  </g>
  <g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M314 252 C380 252 404 310 468 330"/><path d="M314 358 H468"/><path d="M314 464 C380 464 404 406 468 384"/><path d="M714 357 H874"/>
  </g>
  <g fill="#607080">
    <path d="M468 330 l-14 -9 v18z"/><path d="M468 358 l-14 -9 v18z"/><path d="M468 384 l-14 -9 v18z"/><path d="M874 357 l-14 -9 v18z"/>
  </g>
  <text x="600" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">换了表达，不应悄悄换掉安全判断</text>
</svg>
