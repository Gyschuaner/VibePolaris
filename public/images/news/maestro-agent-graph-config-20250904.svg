<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Maestro：Agent 图与节点配置联合优化</title>
<desc id="desc">同时观察工作流图和节点配置，用轨迹反馈定位结构性失败，并在 rollout 与 token 预算内回归。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f5ff"/><stop offset="1" stop-color="#fff8ec"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4054b2"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#20264e" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#202951" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Maestro：优化 Agent，要同时看图和配置</text>
<text x="72" y="118" fill="#6a7091" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">模块与信息流 · 节点模型与工具 · 轨迹反馈与预算</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="260" height="292" rx="22" fill="#fff" stroke="#c8d1f2" stroke-width="2"/>
 <text x="108" y="238" fill="#4054b2" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">工作流图</text>
 <circle cx="130" cy="300" r="22" fill="#dfe5ff"/><text x="130" y="307" text-anchor="middle" fill="#334491" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">检</text>
 <circle cx="218" cy="300" r="22" fill="#dfe5ff"/><text x="218" y="307" text-anchor="middle" fill="#334491" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">规</text>
 <circle cx="174" cy="385" r="22" fill="#dfe5ff"/><text x="174" y="392" text-anchor="middle" fill="#334491" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">答</text>
 <path d="M149 312 L165 368 M199 312 L183 368" stroke="#4054b2" stroke-width="3"/>
 <text x="108" y="434" fill="#6a7091" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">模块 · 信息流 · 接管路径</text>
 </g>
 <path d="M348 334 H398" stroke="#4054b2" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="418" y="168" width="360" height="328" rx="22" fill="#fff" stroke="#a8d5cf" stroke-width="2"/>
 <text x="456" y="218" fill="#28786d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">节点配置</text>
 <rect x="456" y="252" width="122" height="54" rx="12" fill="#d9f1ec"/><text x="517" y="286" text-anchor="middle" fill="#24625b" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">模型</text>
 <rect x="594" y="252" width="122" height="54" rx="12" fill="#d9f1ec"/><text x="655" y="286" text-anchor="middle" fill="#24625b" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">prompt</text>
 <rect x="456" y="326" width="122" height="54" rx="12" fill="#d9f1ec"/><text x="517" y="360" text-anchor="middle" fill="#24625b" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">工具</text>
 <text x="594" y="360" fill="#537d77" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">控制参数</text>
 <text x="456" y="433" fill="#537d77" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">轨迹反馈 → 下一轮候选</text>
 <text x="456" y="464" fill="#537d77" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">rollout / token 预算</text>
</g>
<path d="M796 334 H846" stroke="#4054b2" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="866" y="168" width="264" height="328" rx="22" fill="#fff" stroke="#e4b5a6" stroke-width="2"/>
 <text x="904" y="218" fill="#a64d40" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">回归与审计</text>
 <rect x="904" y="252" width="188" height="56" rx="12" fill="#fde2de"/><text x="998" y="287" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">失败节点</text>
 <rect x="904" y="329" width="188" height="56" rx="12" fill="#fff0c9"/><text x="998" y="364" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">工具白名单</text>
 <text x="998" y="436" text-anchor="middle" fill="#a64d40" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">权限 · 循环 · 数据流</text>
 <text x="998" y="467" text-anchor="middle" fill="#6a7091" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">分数高也要看得懂</text>
</g>
<text x="70" y="578" fill="#4054b2" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">IFBench / HotpotQA · 图与配置一起搜索</text>
<text x="70" y="615" fill="#6a7091" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Agent 结构变了，权限、成本和失败边界也要重新验证。</text>
</svg>