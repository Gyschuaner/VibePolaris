<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Character.AI CEO 更替与产品治理</title><desc id="desc">一张角色聊天卡片交给新的产品治理路径，分支指向社区、过滤和记忆。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a31"/><stop offset="1" stop-color="#312c59"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="78" y="84" fill="#f7f4ff" font-family="Arial" font-size="28" font-weight="700">Character.AI · 组织变化落到哪里</text><text x="78" y="118" fill="#bbb8d6" font-family="Arial" font-size="16">CEO 任命确认责任变化，产品效果要等后续证据</text><g transform="translate(90 190)"><rect width="290" height="250" rx="28" fill="#27254a" stroke="#665f9a"/><circle cx="76" cy="80" r="38" fill="#ffb76b"/><path d="M54 136Q76 112 98 136" fill="none" stroke="#ffb76b" stroke-width="9" stroke-linecap="round"/><text x="137" y="83" fill="#f7f4ff" font-family="Arial" font-size="19">Karandeep Anand</text><text x="137" y="114" fill="#bbb8d6" font-family="Arial" font-size="14">new CEO · Jun 20</text><text x="32" y="202" fill="#ffb76b" font-family="Arial" font-size="16">经营责任</text><text x="32" y="228" fill="#bbb8d6" font-family="Arial" font-size="14">不是新模型发布</text></g><path d="M380 315H520" stroke="#ffb76b" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(540 180)"><rect width="500" height="300" rx="28" fill="#242448" stroke="#665f9a"/><text x="38" y="54" fill="#f7f4ff" font-family="Arial" font-size="20">下一阶段要交付的产品问题</text><path d="M80 108H420M80 174H420M80 240H420" stroke="#574f82" stroke-width="2"/><circle cx="82" cy="108" r="14" fill="#8be1c1"/><circle cx="82" cy="174" r="14" fill="#ffb76b"/><circle cx="82" cy="240" r="14" fill="#ffb76b"/><text x="120" y="114" fill="#d9d5ed" font-family="Arial" font-size="17">角色发现与创作者反馈</text><text x="120" y="180" fill="#d9d5ed" font-family="Arial" font-size="17">年龄分级与过滤</text><text x="120" y="246" fill="#d9d5ed" font-family="Arial" font-size="17">记忆、权限与可追踪性</text></g><text x="90" y="570" fill="#bbb8d6" font-family="Arial" font-size="16">任命 → 责任 → 产品指标 → 后续验证</text></svg>
