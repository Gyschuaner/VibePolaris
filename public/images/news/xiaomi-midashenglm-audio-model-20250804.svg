<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MiDashengLM 音频语言模型</title>
  <desc id="desc">语音、环境声和音乐经过音频编码器与语言模型，生成字幕或回答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#162d36"/>
      <stop offset="1" stop-color="#4a6d59"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0e6c9"/>
      <stop offset="1" stop-color="#d4e2c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#0c2026" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="90" r="170" fill="#f4c66c" opacity=".16"/>
  <circle cx="150" cy="530" r="230" fill="#8bb9a1" opacity=".18"/>
  <g filter="url(#shadow)">
    <rect x="92" y="135" width="300" height="340" rx="26" fill="url(#panel)"/>
    <rect x="450" y="135" width="300" height="340" rx="26" fill="#f0e6c9"/>
    <rect x="808" y="135" width="300" height="340" rx="26" fill="#f4c66c"/>
  </g>
  <g fill="#162d36" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="132" y="190" font-size="24" font-weight="800">声音</text>
    <path d="M130 290 C155 220 180 360 205 285 S255 220 280 300 S330 360 355 260" fill="none" stroke="#4a6d59" stroke-width="9" stroke-linecap="round"/>
    <text x="132" y="390" font-size="18">说话 · 风声 · 音乐</text>
    <text x="132" y="426" font-size="16" fill="#4f6656">不只是一段 ASR 文本</text>

    <text x="490" y="190" font-size="24" font-weight="800">MiDashengLM</text>
    <circle cx="600" cy="292" r="72" fill="#d4e2c5" stroke="#4a6d59" stroke-width="7"/>
    <path d="M560 292 h80 M600 252 v80" stroke="#4a6d59" stroke-width="9" stroke-linecap="round"/>
    <text x="503" y="407" font-size="18">通用音频描述对齐</text>
    <text x="503" y="439" font-size="16" fill="#4f6656">声音 → 语言表示</text>

    <text x="848" y="190" font-size="24" font-weight="800">输出</text>
    <rect x="850" y="245" width="218" height="52" rx="16" fill="#162d36" opacity=".88"/>
    <text x="875" y="278" font-size="18" fill="#f0e6c9">“发动机正在怠速”</text>
    <rect x="850" y="325" width="180" height="14" rx="7" fill="#162d36" opacity=".65"/>
    <rect x="850" y="357" width="145" height="14" rx="7" fill="#162d36" opacity=".45"/>
    <text x="848" y="424" font-size="16">字幕 · 问答 · 分类</text>
  </g>
  <g fill="#f0e6c9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="92" y="570" font-size="22" letter-spacing="1">Xiaomi Research · 2025.08.04</text>
    <text x="1108" y="570" font-size="16" text-anchor="end" opacity=".82">公开权重 · 先复现</text>
  </g>
</svg>
