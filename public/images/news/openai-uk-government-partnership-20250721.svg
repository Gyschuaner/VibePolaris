<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">英国政府与 OpenAI 的战略合作边界</title><desc id="desc">一份不具法律约束力的谅解备忘录把安全研究、基础设施探索和公共服务试点连到后续采购与评估。</desc><defs><linearGradient id="ubg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0f3b56"/></linearGradient><linearGradient id="uline" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#ubg)"/><text x="68" y="78" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">UK × OpenAI · MoU</text><text x="68" y="118" fill="#cbd5e1" font-size="21" font-family="sans-serif">2025-07-21 · strategic partnership · non-binding</text><g font-family="sans-serif"><rect x="70" y="222" width="214" height="174" rx="26" fill="#1e3a8a"/><text x="108" y="280" fill="#fff" font-size="25" font-weight="700">安全</text><text x="108" y="324" fill="#dbeafe" font-size="18">AISI 协作</text><text x="108" y="358" fill="#dbeafe" font-size="18">技术信息</text><path d="M300 310h74" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/><path d="m356 298 18 12-18 12" fill="none" stroke="#60a5fa" stroke-width="6"/><rect x="396" y="202" width="240" height="214" rx="26" fill="#0f766e"/><text x="442" y="264" fill="#fff" font-size="25" font-weight="700">基础设施</text><text x="442" y="308" fill="#ccfbf1" font-size="18">数据中心</text><text x="442" y="342" fill="#ccfbf1" font-size="18">AI Growth Zones</text><text x="442" y="376" fill="#ccfbf1" font-size="18">仍需许可并网</text><path d="M652 310h74" stroke="#5eead4" stroke-width="6" stroke-linecap="round"/><path d="m708 298 18 12-18 12" fill="none" stroke="#5eead4" stroke-width="6"/><rect x="748" y="222" width="214" height="174" rx="26" fill="#166534"/><text x="786" y="280" fill="#fff" font-size="25" font-weight="700">公共服务</text><text x="786" y="324" fill="#dcfce7" font-size="18">Humphrey</text><text x="786" y="358" fill="#dcfce7" font-size="18">Consult</text><path d="M978 310h74" stroke="#86efac" stroke-width="6" stroke-linecap="round"/><path d="m1034 298 18 12-18 12" fill="none" stroke="#86efac" stroke-width="6"/><rect x="1068" y="222" width="74" height="174" rx="22" fill="#334155"/><text x="1080" y="284" fill="#fff" font-size="20" font-weight="700">核验</text><text x="1080" y="324" fill="#cbd5e1" font-size="16">合同</text><text x="1080" y="354" fill="#cbd5e1" font-size="16">审计</text><rect x="182" y="500" width="838" height="88" rx="26" fill="#0b1120" stroke="url(#uline)" stroke-width="3"/><text x="306" y="548" fill="#fff" font-size="24" font-weight="700">合作意向 ≠ 采购合同 ≠ 已验证效果</text><text x="368" y="578" fill="#94a3b8" font-size="16">后续要追踪安全、许可、招标和服务数据</text></g></svg>
