<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">美国众议员要求为 AI 护栏取消休会</title><desc id="desc">Axios 报道一封流通信件要求众议院复会并推进 AI 护栏；这不是已通过的法律。</desc><style>.paper{animation:paper 3s ease-in-out infinite}@keyframes paper{50%{transform:translateY(-8px) rotate(-1deg)}}.check{stroke-dasharray:36;animation:check 2.4s ease-in-out infinite}@keyframes check{50%{stroke-dashoffset:36}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182b48"/><stop offset="1" stop-color="#774a54"/></linearGradient></defs><rect width="960" height="540" rx="34" fill="url(#bg)"/><text x="72" y="88" fill="#fff7f0" font-family="Arial,sans-serif" font-size="31" font-weight="700">HOUSE LETTER / AI SAFEGUARDS</text><text x="72" y="124" fill="#f0d6d8" font-family="Arial,sans-serif" font-size="20">2026-09-11 · 倡议 → 议程 → 法案（仍未落地）</text><g class="paper"><rect x="128" y="178" width="302" height="226" rx="18" fill="#fff7f0"/><path d="M180 236h200M180 274h160M180 312h184" stroke="#a36a72" stroke-width="13" stroke-linecap="round"/><path d="M180 350h106" stroke="#a36a72" stroke-width="13" stroke-linecap="round"/><path d="M356 332l20 20 42-54" fill="none" stroke="#2e8a87" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" class="check"/></g><path d="M496 290h126" stroke="#f6bd60" stroke-width="12" stroke-linecap="round" stroke-dasharray="12 16"/><circle cx="559" cy="290" r="15" fill="#f6bd60"/><path d="M690 176h118v78H690z" fill="#cfe4ee"/><path d="M676 254h146v18H676z" fill="#cfe4ee"/><path d="M708 272v98M790 272v98" stroke="#cfe4ee" stroke-width="14"/><path d="M680 370h140" stroke="#cfe4ee" stroke-width="14" stroke-linecap="round"/><text x="72" y="468" fill="#f0d6d8" font-family="Arial,sans-serif" font-size="21">联署信要求复会；是否排期、表决和签署仍需后续确认</text></svg>
