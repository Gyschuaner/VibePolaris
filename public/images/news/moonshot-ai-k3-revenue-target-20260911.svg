<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Moonshot AI Kimi K3 商业化目标</title><desc id="desc">TechCrunch 报道 Moonshot AI 为开放权重 Kimi K3 设定 20 亿美元年化收入目标；目标不是已审计收入。</desc><style>.bar{animation:bar 2.8s ease-in-out infinite;transform-origin:bottom}@keyframes bar{50%{transform:scaleY(.68)}}.coin{animation:coin 2s ease-in-out infinite}@keyframes coin{50%{transform:translateY(-10px)}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152c48"/><stop offset="1" stop-color="#644574"/></linearGradient></defs><rect width="960" height="540" rx="34" fill="url(#bg)"/><text x="72" y="88" fill="#fbf7ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">MOONSHOT AI / KIMI K3</text><text x="72" y="124" fill="#ded8f0" font-family="Arial,sans-serif" font-size="20">$2B annualized target · open-weight economics · reported</text><g><rect x="154" y="336" width="82" height="46" rx="8" fill="#a8dadc" class="bar"/><rect x="274" y="286" width="82" height="96" rx="8" fill="#a8dadc" class="bar"/><rect x="394" y="226" width="82" height="156" rx="8" fill="#f6bd60" class="bar"/><path d="M124 398h394" stroke="#d9f1f2" stroke-width="7" stroke-linecap="round"/><text x="150" y="426" fill="#d9f1f2" font-family="Arial,sans-serif" font-size="17">使用</text><text x="272" y="426" fill="#d9f1f2" font-family="Arial,sans-serif" font-size="17">托管</text><text x="386" y="426" fill="#d9f1f2" font-family="Arial,sans-serif" font-size="17">收入目标</text></g><g class="coin"><circle cx="712" cy="260" r="84" fill="#f6bd60"/><text x="669" y="274" fill="#35254f" font-family="Arial,sans-serif" font-size="34" font-weight="700">K3</text><path d="M650 364h124" stroke="#a8dadc" stroke-width="12" stroke-linecap="round"/><text x="632" y="406" fill="#d9f1f2" font-family="Arial,sans-serif" font-size="18">open weights</text></g><text x="72" y="490" fill="#ded8f0" font-family="Arial,sans-serif" font-size="20">token 使用量 ≠ 审计收入；蒸馏指控另需核验</text></svg>
