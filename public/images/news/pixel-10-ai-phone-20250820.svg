<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pixel 10 and on-device Gemini Nano</title>
  <desc id="desc">Pixel 10 phones connect Tensor G5 and Gemini Nano to proactive phone assistance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17243a"/><stop offset="1" stop-color="#3a2d5f"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9df2d0"/><stop offset="1" stop-color="#7bb8ff"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb7cf"/><stop offset="1" stop-color="#b29bff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070b18" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="88" r="210" fill="#9df2d0" opacity=".12"/>
  <circle cx="1050" cy="570" r="260" fill="#ffb7cf" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="650" height="138" rx="24" fill="#222f4d" stroke="#9df2d0" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c6ffe6">GOOGLE · PIXEL 10</text>
    <text x="108" y="181" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#f8f9ff">TENSOR G5 × GEMINI NANO</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ebe7ff">让手机先理解上下文，再把建议送到手边</text>
  <g transform="translate(805 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="246" height="426" rx="36" fill="#101a30" stroke="#c6d1ff" stroke-width="3"/>
    <rect x="22" y="30" width="202" height="250" rx="20" fill="#283a65"/>
    <circle cx="123" cy="100" r="48" fill="url(#mint)"/>
    <path d="M93 100c18-20 42-20 60 0-18 20-42 20-60 0Z" fill="#1d2a49"/>
    <circle cx="110" cy="100" r="7" fill="#9df2d0"/><circle cx="136" cy="100" r="7" fill="#9df2d0"/>
    <text x="123" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f3f4ff">ON-DEVICE AI</text>
    <rect x="49" y="205" width="146" height="12" rx="6" fill="#7889c1"/>
    <rect x="49" y="231" width="108" height="12" rx="6" fill="#7889c1"/>
    <circle cx="123" cy="360" r="31" fill="url(#pink)"/>
    <path d="M108 361h30M123 346v30" stroke="#2b2448" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(78 360)">
    <rect width="640" height="138" rx="20" fill="#20304f" stroke="#516391" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c6ffe6">MAGIC CUE · CAMERA COACH</text>
    <text x="30" y="86" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e9ecff">本地建议 · 需要用户许可 · 仍需核验</text>
    <text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bbc5e9">官方功能描述，不等于独立效果评测</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c1c7e8">GOOGLE BLOG · 20 AUG 2025</text>
</svg>
