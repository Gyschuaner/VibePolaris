<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">GPT-Live · 音频来源 · 验证 API</title>
<desc id="desc">OpenAI 在 GPT-Live 音频中加入 SynthID 水印，并开放音频验证工具和 API；来源信号有助追踪生成链路，却不等于内容事实成立。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="45" y="175" width="190" height="150" rx="18" fill="#123b5d" stroke="#93c5fd" stroke-width="3"/>
<text x="140" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">音频生成</text>
<text x="140" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">ChatGPT / API</text>
<path d="M235 250H265" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="270" y="175" width="190" height="150" rx="18" fill="#6b3c12" stroke="#93c5fd" stroke-width="3"/>
<text x="365" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">SynthID</text>
<text x="365" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">嵌入来源信号</text>
<path d="M460 250H490" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="495" y="175" width="190" height="150" rx="18" fill="#3b2b70" stroke="#93c5fd" stroke-width="3"/>
<text x="590" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">验证工具</text>
<text x="590" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">查水印 / 凭证</text>
<path d="M685 250H715" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="720" y="175" width="190" height="150" rx="18" fill="#174d4d" stroke="#93c5fd" stroke-width="3"/>
<text x="815" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">人工核验</text>
<text x="815" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">判断事实</text>
<text x="480" y="445" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">2026-07-31 · GPT-Live · 音频来源 · 验证 API</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
