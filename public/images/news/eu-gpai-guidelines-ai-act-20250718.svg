<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">欧盟 GPAI 指南合规地图</title><desc id="desc">模型身份、提供者角色、风险与时间线的关系。</desc><rect width="1200" height="680" rx="36" fill="#102233"/><text x="72" y="88" fill="#f8fafc" font-size="40" font-family="sans-serif" font-weight="700">GPAI 指南：先找角色，再看时间线</text><text x="72" y="130" fill="#b7cadb" font-size="22" font-family="sans-serif">7 月 18 日发布的是解释和准备节点</text><g font-family="sans-serif"><rect x="76" y="210" width="250" height="170" rx="24" fill="#204a62"/><text x="110" y="260" fill="#a5e8ff" font-size="22">① 模型</text><text x="110" y="310" fill="white" font-size="28" font-weight="700">GPAI 范围</text><text x="110" y="348" fill="#d5eef7" font-size="17">训练规模 + 生成能力</text><path d="M350 295h112" stroke="#6dd5ed" stroke-width="8" stroke-linecap="round"/><path d="m445 271 28 24-28 24" fill="none" stroke="#6dd5ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="210" width="250" height="170" rx="24" fill="#3b4b6a"/><text x="526" y="260" fill="#c8d7ff" font-size="22">② 角色</text><text x="526" y="310" fill="white" font-size="28" font-weight="700">提供者</text><text x="526" y="348" fill="#e0e7ff" font-size="17">训练 / 重大修改 / 投放</text><path d="M766 295h112" stroke="#f4c46e" stroke-width="8" stroke-linecap="round"/><path d="m861 271 28 24-28 24" fill="none" stroke="#f4c46e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="908" y="210" width="216" height="170" rx="24" fill="#5b3b50"/><text x="940" y="260" fill="#ffd1df" font-size="22">③ 风险</text><text x="940" y="310" fill="white" font-size="28" font-weight="700">系统性？</text><text x="940" y="348" fill="#ffe5ec" font-size="17">评估、缓解、报告</text><line x1="116" y1="486" x2="1084" y2="486" stroke="#71869b" stroke-width="3"/><text x="80" y="548" fill="#fbd38d" font-size="24" font-family="sans-serif" font-weight="700">8/2/2025 适用</text><text x="80" y="590" fill="#d9e6f2" font-size="20" font-family="sans-serif">8/2/2026 执法权限</text><text x="470" y="548" fill="#fbd38d" font-size="24" font-family="sans-serif" font-weight="700">8/2/2027 既有模型</text><text x="470" y="590" fill="#d9e6f2" font-size="20" font-family="sans-serif">今天发布 ≠ 今天处罚</text></g></svg>