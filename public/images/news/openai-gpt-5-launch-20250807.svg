<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GPT-5 统一快答、深度推理与路由</title>
  <desc id="desc">GPT-5 将快速回答模型、深度推理模型和实时路由器放进一个系统，ChatGPT 默认使用 GPT-5 系列。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2338"/>
      <stop offset="1" stop-color="#7d4b54"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f1e7"/>
      <stop offset="1" stop-color="#d8e2e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#111827" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1045" cy="92" r="192" fill="#f0b66f" opacity=".17"/>
  <circle cx="106" cy="545" r="220" fill="#8fb9be" opacity=".16"/>
  <path d="M22 455 C130 360 234 508 348 398 S560 316 680 422 S872 512 1002 378 S1100 350 1195 420" fill="none" stroke="#f0b66f" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="120" width="320" height="300" rx="30" fill="url(#panel)"/>
    <rect x="440" y="120" width="320" height="300" rx="30" fill="#f7f1e7"/>
    <rect x="816" y="120" width="320" height="300" rx="30" fill="#e8bd78"/>
  </g>
  <g fill="#1b2338" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="180" font-size="25" font-weight="800">ChatGPT</text>
    <rect x="108" y="224" width="220" height="56" rx="17" fill="#c1d7dc"/>
    <text x="136" y="260" font-size="24" font-weight="800">GPT-5 默认</text>
    <path d="M108 329 h214" stroke="#7d4b54" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="370" font-size="17">少一步手动选模型</text>
    <text x="108" y="404" font-size="16">快答 · 深思 · 工具</text>

    <text x="488" y="180" font-size="25" font-weight="800">实时路由</text>
    <circle cx="600" cy="260" r="61" fill="#7d4b54"/>
    <path d="M567 260 h66 M600 227 v66" stroke="#f7f1e7" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 C550 320 572 320 600 355 S650 390 692 350" fill="none" stroke="#7d4b54" stroke-width="9" stroke-linecap="round"/>
    <text x="488" y="404" font-size="17">按任务选择处理路径</text>

    <text x="862" y="180" font-size="25" font-weight="800">API</text>
    <rect x="862" y="226" width="220" height="54" rx="17" fill="#7d4b54"/>
    <text x="972" y="261" font-size="23" fill="#f7f1e7" text-anchor="middle" font-weight="800">5 · mini · nano</text>
    <path d="M862 331 h216" stroke="#1b2338" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="862" y="370" font-size="17">400K context</text>
    <text x="862" y="404" font-size="16">控制项 · 工具 · 评测</text>
  </g>
  <g fill="#f7f1e7" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">GPT-5 · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">统一入口，仍需回归测试</text>
  </g>
</svg>
