<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AI 版权诉讼中的内容链路</title><desc id="desc">报纸诉状把新闻从抓取、训练、检索到生成输出的每一段都带进法院，最终请求仍待审理。</desc><rect width="1200" height="700" rx="38" fill="#19202b"/><g font-family="Arial,sans-serif"><text x="64" y="92" fill="#f5f7fb" font-size="40" font-weight="700">A complaint maps the content chain</text><text x="64" y="132" fill="#aab9ca" font-size="23">Seattle Times + Newsday v. OpenAI + Microsoft</text><g fill="#364f78" stroke="#9dbcf1" stroke-width="3"><rect x="70" y="252" width="205" height="126" rx="18"/><rect x="335" y="252" width="205" height="126" rx="18"/><rect x="600" y="252" width="205" height="126" rx="18"/><rect x="865" y="252" width="265" height="126" rx="18"/></g><g fill="#f2f6ff" font-size="24" font-weight="700"><text x="128" y="300">新闻网站</text><text x="129" y="334">抓取 / 付费墙</text><text x="368" y="300">训练数据 / 检索</text><text x="377" y="334">WebText · RAG</text><text x="667" y="300">模型</text><text x="640" y="334">复制 / 改写</text><text x="916" y="300">ChatGPT / Copilot</text><text x="920" y="334">输出与署名</text></g><g stroke="#f1c55c" stroke-width="8" fill="none"><path d="M275 315h60"/><path d="M540 315h60"/><path d="M805 315h60"/></g><rect x="260" y="488" width="680" height="88" rx="20" fill="#a65461"/><text x="320" y="543" fill="#fff1ed" font-size="25" font-weight="700">诉状请求：赔偿 · 禁令 · 扣押/销毁（尚未裁定）</text><text x="294" y="635" fill="#b8c7dc" font-size="23">每一格都是原告主张，法院结论还在后面</text></g></svg>
