<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 芯片出口许可与 15% 收入安排</title>
  <desc id="desc">英伟达 H20 和 AMD MI308 经过出口许可闸门，报道中的 15% 销售收入条件仍待正式文件说明</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <rect x="54" y="54" width="1092" height="612" rx="28" fill="#182338" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">AI 芯片出口许可</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">H20 · MI308 · 15% 销售收入安排（据报道）</text>
  <rect x="98" y="280" width="236" height="160" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="216" y="344" fill="#f8fafc" font-size="26" text-anchor="middle" font-family="sans-serif" font-weight="700">H20</text>
  <text x="216" y="384" fill="#bfdbfe" font-size="17" text-anchor="middle" font-family="sans-serif">NVIDIA · AI 芯片</text>
  <rect x="98" y="466" width="236" height="76" rx="16" fill="#25324a"/>
  <text x="216" y="513" fill="#dbeafe" font-size="17" text-anchor="middle" font-family="sans-serif">对华销售请求</text>
  <path d="M 364 360 H 494" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 474 344 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="520" y="248" width="190" height="258" rx="20" fill="#202b3c" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 574 304 V 448 M 656 304 V 448" stroke="#fbbf24" stroke-width="8"/>
  <path d="M 548 344 H 682 M 548 408 H 682" stroke="#fbbf24" stroke-width="8"/>
  <text x="615" y="548" fill="#fde68a" font-size="18" text-anchor="middle" font-family="sans-serif">出口许可闸门</text>
  <circle cx="615" cy="182" r="58" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/>
  <text x="615" y="192" fill="#fff7ed" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">15%</text>
  <text x="615" y="634" fill="#d5def0" font-size="18" text-anchor="middle" font-family="sans-serif">收入条件的报道 ≠ 已生效税法</text>
  <rect x="788" y="280" width="236" height="160" rx="20" fill="#202b3c" stroke="#a7f3d0" stroke-width="2"/>
  <text x="906" y="344" fill="#f8fafc" font-size="26" text-anchor="middle" font-family="sans-serif" font-weight="700">MI308</text>
  <text x="906" y="384" fill="#bbf7d0" font-size="17" text-anchor="middle" font-family="sans-serif">AMD · AI 芯片</text>
  <rect x="788" y="466" width="236" height="76" rx="16" fill="#253a37"/>
  <text x="906" y="513" fill="#d1fae5" font-size="17" text-anchor="middle" font-family="sans-serif">许可与出货待核验</text>
</svg>
