<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Confluent Streaming Agents</title>
  <desc id="desc">Streaming Agents connects real-time events to agent reasoning and guarded tool actions inside a Flink data stream.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14263b"/><stop offset="1" stop-color="#472c48"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3f4e9"/><stop offset="1" stop-color="#69b8e6"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdb91"/><stop offset="1" stop-color="#efa16c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="706" height="136" rx="24" fill="#21374f" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">CONFLUENT · 19 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f4fbff">STREAMING AGENTS</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">让事件流成为 Agent 的新鲜上下文</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">FLINK DATA STREAM</text>
    <g transform="translate(28 70)">
      <circle cx="28" cy="42" r="18" fill="url(#cyan)"/><circle cx="78" cy="42" r="18" fill="url(#cyan)"/><circle cx="128" cy="42" r="18" fill="url(#cyan)"/>
      <path d="M48 42 H58 M98 42 H108" stroke="#a7eee5" stroke-width="5" stroke-linecap="round"/>
      <text x="78" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e1faf5">实时事件</text>
      <path d="M168 42 H228" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M212 23 L231 42 L212 61" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="234" y="10" width="56" height="64" rx="14" fill="url(#amber)"/>
      <text x="262" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#47313b">Agent</text>
      <text x="262" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#654338">推理</text>
      <path d="M262 96 V128" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M243 116 L262 135 L281 116" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="20" y="154" width="270" height="60" rx="14" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
      <text x="155" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#effcff">工具 / 业务动作</text>
      <path d="M155 228 C155 270 88 270 88 232" fill="none" stroke="#91dfe1" stroke-width="4" stroke-linecap="round"/>
      <path d="M88 232 L78 249 M88 232 L105 235" fill="none" stroke="#91dfe1" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">Open Preview · 可审计</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">数据处理 + AI 工作流</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">实时上下文减少等待，但不会替模型负责</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">幂等、权限、限流与回滚仍要自己验收</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">CONFLUENT · EVENT-DRIVEN AGENTS</text>
</svg>
