<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Open Agent Safety Platform 机制示意</title>
  <desc id="desc">AI 代理在 OpenShell 的受限运行时中执行，Sentry 在独立硬件层持续监控，越界时可以隔离；这是 NVIDIA 新闻中平台设计的通用解释，不代表每个部署都已验证安全。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151f3c"/><stop offset="1" stop-color="#124c4c"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061521" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">在代理之外设置运行时与硬件边界</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2026-09-28 · NVIDIA Open Agent Safety Platform 新闻的机制解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="210" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="475" y="178" width="330" height="178" rx="20" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="855" y="210" width="235" height="114" rx="18" fill="#31584f" stroke="#a7f3d0" stroke-width="2"/>
    <text x="237" y="244" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">任务与权限</text>
    <text x="237" y="272" fill="#ede2ff" font-size="15" text-anchor="middle">先写出能碰什么、不能碰什么</text>
    <text x="237" y="297" fill="#ede2ff" font-size="15" text-anchor="middle">代理不自己扩大权限</text>
    <text x="640" y="218" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">OpenShell 受限运行时</text>
    <rect x="535" y="244" width="210" height="78" rx="14" fill="#213e50" stroke="#b6f3ff" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="585" cy="283" r="21" fill="#67e8f9" fill-opacity=".25" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="585" cy="283" r="7" fill="#67e8f9"/>
    <text x="640" y="274" fill="#d6fff7" font-size="15" text-anchor="middle">代理在沙箱内执行</text>
    <text x="640" y="299" fill="#d6fff7" font-size="15" text-anchor="middle">文件、网络、工具按策略放行</text>
    <text x="972" y="244" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Sentry 外部监控</text>
    <text x="972" y="272" fill="#dfffea" font-size="15" text-anchor="middle">数据处理器（DPU）层</text>
    <text x="972" y="297" fill="#dfffea" font-size="15" text-anchor="middle">越界时可隔离或停止</text>
    <path d="M362 267H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M805 267H842" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="7 7" fill="none"/>
    <text x="824" y="247" fill="#a7f3d0" font-size="13" text-anchor="middle">持续观察</text>
    <path d="M972 332V374" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">OpenShell 负责执行边界，Sentry 在外部监控并止损</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">平台公告讲的是控制架构，实际效果仍要看部署和策略</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">NVIDIA：OpenShell 是开源运行时；Sentry 是 BlueField-4 上的参考系统设计。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#31584f"/>
    <text x="256" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">来源：NVIDIA / AP</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2026-09-28</text><text x="944" y="538" fill="#dfffea" font-size="14" text-anchor="middle">边界：仍需实测</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释 OpenShell 与 Sentry 的分层边界，不是 NVIDIA 的性能或安全保证。</text>
</svg>
