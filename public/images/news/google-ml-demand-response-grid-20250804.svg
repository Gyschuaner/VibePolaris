<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 数据中心参与电网需求响应</title>
  <desc id="desc">电网高峰时，数据中心把非紧急机器学习任务移到之后或另一处。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102c38"/>
      <stop offset="1" stop-color="#377365"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2ebd2"/>
      <stop offset="1" stop-color="#d3e3c6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#071b24" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="95" r="180" fill="#e4bd69" opacity=".16"/>
  <circle cx="120" cy="520" r="230" fill="#8fc0a5" opacity=".16"/>
  <path d="M60 360 C180 280 250 430 370 345 S600 240 760 340 S960 440 1140 285" fill="none" stroke="#f4d87b" stroke-width="5" stroke-dasharray="12 14" opacity=".78"/>
  <g filter="url(#shadow)">
    <rect x="110" y="120" width="300" height="320" rx="28" fill="url(#panel)"/>
    <rect x="470" y="120" width="300" height="320" rx="28" fill="#f2ebd2"/>
    <rect x="830" y="120" width="260" height="320" rx="28" fill="#e4bd69"/>
  </g>
  <g fill="#102c38" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="155" y="180" font-size="25" font-weight="800">电网高峰</text>
    <path d="M160 270 h190" stroke="#377365" stroke-width="11" stroke-linecap="round"/>
    <path d="M160 320 h145" stroke="#377365" stroke-width="11" stroke-linecap="round" opacity=".65"/>
    <path d="M160 370 h105" stroke="#377365" stroke-width="11" stroke-linecap="round" opacity=".4"/>
    <text x="155" y="410" font-size="17">供电紧张</text>

    <text x="515" y="180" font-size="25" font-weight="800">ML 任务分级</text>
    <rect x="520" y="245" width="200" height="40" rx="14" fill="#d3e3c6"/>
    <text x="540" y="272" font-size="16">必须在线</text>
    <rect x="520" y="305" width="160" height="40" rx="14" fill="#8fc0a5"/>
    <text x="540" y="332" font-size="16">可以等待</text>
    <rect x="520" y="365" width="110" height="40" rx="14" fill="#e4bd69"/>
    <text x="540" y="392" font-size="16">可迁移</text>

    <text x="875" y="180" font-size="25" font-weight="800">错峰</text>
    <path d="M875 270 h145" stroke="#102c38" stroke-width="12" stroke-linecap="round"/>
    <path d="M875 330 h100" stroke="#102c38" stroke-width="12" stroke-linecap="round" opacity=".7"/>
    <circle cx="1020" cy="270" r="18" fill="#102c38"/>
    <text x="875" y="405" font-size="17">之后再算</text>
  </g>
  <g fill="#f2ebd2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="110" y="565" font-size="22" letter-spacing="1">Google · 2025.08.04</text>
    <text x="1090" y="565" font-size="16" text-anchor="end" opacity=".82">局部灵活，不是全面停算</text>
  </g>
</svg>
