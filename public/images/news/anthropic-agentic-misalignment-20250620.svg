<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Agentic misalignment 控制模拟</title><desc id="desc">十六个模型节点进入虚构公司环境，经过目标、工具和障碍后被人工控制边界拦住。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141a2b"/><stop offset="1" stop-color="#39263c"/></linearGradient><radialGradient id="node"><stop stop-color="#ffc27a"/><stop offset="1" stop-color="#e96a63"/></radialGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="76" y="82" fill="#fff8f0" font-family="Arial" font-size="28" font-weight="700">Agentic misalignment · 受控压力测试</text><text x="76" y="116" fill="#c5b5c5" font-family="Arial" font-size="16">模拟结果提示风险，不能直接当作真实部署事故</text><g transform="translate(120 190)"><rect width="280" height="330" rx="28" fill="#25243b" stroke="#72526a"/><text x="38" y="52" fill="#ffc27a" font-family="Arial" font-size="20">16 个模型</text><g fill="url(#node)"><circle cx="65" cy="105" r="13"/><circle cx="125" cy="105" r="13"/><circle cx="185" cy="105" r="13"/><circle cx="245" cy="105" r="13"/><circle cx="65" cy="165" r="13"/><circle cx="125" cy="165" r="13"/><circle cx="185" cy="165" r="13"/><circle cx="245" cy="165" r="13"/><circle cx="65" cy="225" r="13"/><circle cx="125" cy="225" r="13"/><circle cx="185" cy="225" r="13"/><circle cx="245" cy="225" r="13"/><circle cx="65" cy="285" r="13"/><circle cx="125" cy="285" r="13"/><circle cx="185" cy="285" r="13"/><circle cx="245" cy="285" r="13"/></g><text x="38" y="315" fill="#c5b5c5" font-family="Arial" font-size="14">不同提供商 · 同一类虚构环境</text></g><path d="M420 355H560" stroke="#ffc27a" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(570 205)"><rect width="280" height="300" rx="28" fill="#25243b" stroke="#72526a"/><text x="36" y="50" fill="#fff8f0" font-family="Arial" font-size="20">虚构公司</text><rect x="35" y="84" width="210" height="48" rx="12" fill="#3b2b45"/><text x="54" y="115" fill="#c5b5c5" font-family="Arial" font-size="15">读取邮件 / 发送邮件</text><rect x="35" y="154" width="210" height="48" rx="12" fill="#3b2b45"/><text x="54" y="185" fill="#c5b5c5" font-family="Arial" font-size="15">目标冲突 / 即将替换</text><rect x="35" y="224" width="210" height="48" rx="12" fill="#592e3d" stroke="#e96a63"/><text x="56" y="255" fill="#ffc27a" font-family="Arial" font-size="15">模拟里的危险行动</text></g><path d="M875 355H1005" stroke="#74e0c1" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(980 268)"><rect width="140" height="174" rx="22" fill="#203a3f" stroke="#74e0c1"/><path d="M48 78L68 98L101 58" fill="none" stroke="#74e0c1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="23" y="132" fill="#fff8f0" font-family="Arial" font-size="15">人工审批</text><text x="23" y="155" fill="#a8c7c7" font-family="Arial" font-size="12">真实部署护栏</text></g><text x="120" y="590" fill="#c5b5c5" font-family="Arial" font-size="16">目标 → 工具 → 障碍 → 行动选择 → 权限边界</text></svg>
