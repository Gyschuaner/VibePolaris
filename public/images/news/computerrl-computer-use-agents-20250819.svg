<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ComputerRL desktop agents</title>
  <desc id="desc">ComputerRL trains desktop agents with API and GUI actions across parallel virtual desktops, then validates them on benchmarks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13253a"/><stop offset="1" stop-color="#452d4a"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2f4e9"/><stop offset="1" stop-color="#69b8e6"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdb91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="706" height="136" rx="24" fill="#20354d" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 19 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f4fbff">COMPUTERRL · DESKTOP AGENTS</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">API 和 GUI，一起学会操作电脑</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">API · GUI · ONLINE RL</text>
    <g transform="translate(26 68)">
      <rect x="0" y="0" width="126" height="66" rx="14" fill="url(#cyan)"/>
      <text x="63" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">API</text>
      <text x="63" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#24485b">结构化动作</text>
      <rect x="156" y="0" width="126" height="66" rx="14" fill="url(#amber)"/>
      <text x="219" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">GUI</text>
      <text x="219" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#654338">视觉反馈</text>
      <path d="M63 88 V119 M219 88 V119" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 107 L63 126 L82 107 M200 107 L219 126 L238 107" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="146" width="282" height="66" rx="14" fill="#6e9bd3"/>
      <text x="141" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f4fbff">数千个虚拟桌面</text>
      <text x="141" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e0eefb">并行探索与重置</text>
      <path d="M141 230 V261" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M122 249 L141 268 L160 249" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="282" width="282" height="60" rx="14" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
      <text x="141" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#effcff">OSWorld · 48.9%</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">Entropulse · 交替训练</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">把失败轨迹也变成训练数据</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">API 精确，GUI 灵活，虚拟环境负责规模</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">真实桌面仍需权限隔离、遮蔽和人工接管</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">COMPUTERRL · COMPUTER USE AGENTS</text>
</svg>
