<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Anthropic Usage Policy agentic use update</title>
  <desc id="desc">An agent tool path is split by policy gates for cyber abuse, consented security research, and high risk consumer use.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2031"/><stop offset="1" stop-color="#502d3b"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffbf84"/><stop offset="1" stop-color="#ff7d8d"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8df0cc"/><stop offset="1" stop-color="#4db5a0"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#120b13" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1060" cy="86" r="210" fill="#ffbf84" opacity=".12"/>
  <circle cx="1020" cy="560" r="240" fill="#8df0cc" opacity=".11"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="665" height="136" rx="24" fill="#3b2b3b" stroke="#ffbf84" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#ffd9ae">ANTHROPIC · POLICY</text>
    <text x="108" y="180" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fff5f1">AGENTIC USE · 15 AUG</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffe9dc">从能力增长到使用边界</text>
  <g transform="translate(772 86)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="366" rx="28" fill="#271d2e" stroke="#d7a7b1" stroke-width="3"/>
    <circle cx="165" cy="72" r="34" fill="url(#coral)"/>
    <path d="M165 52 V94 M145 73 H185" stroke="#3a2632" stroke-width="8" stroke-linecap="round"/>
    <path d="M165 106 V151 M165 151 H80 M165 151 H250 M80 151 V186 M250 151 V186" fill="none" stroke="#f7d282" stroke-width="4" stroke-linecap="round"/>
    <rect x="25" y="188" width="110" height="92" rx="16" fill="#573044" stroke="#ff8e97" stroke-width="2"/>
    <rect x="195" y="188" width="110" height="92" rx="16" fill="#28544f" stroke="#8df0cc" stroke-width="2"/>
    <text x="80" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffd9dd">禁止滥用</text>
    <text x="80" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffe9ed">入侵 / 恶意</text>
    <text x="250" y="224" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d9fff2">可支持</text>
    <text x="250" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#dbfff4">经同意安全研究</text>
    <path d="M80 312 H250" stroke="#f7d282" stroke-width="4" stroke-linecap="round"/>
    <text x="165" y="343" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f5d9cb">9 月 15 日生效</text>
  </g>
  <g transform="translate(80 356)">
    <rect width="624" height="136" rx="20" fill="#3a2938" stroke="#714953" stroke-width="2"/>
    <text x="30" y="47" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffd9ae">高风险消费者场景：人工在环 + AI 披露</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f5e6df">法律 · 金融 · 就业 · agent 工具权限</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d4bfc3">政策文字是边界，应用仍需自己执行控制</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d8c2c4">ANTHROPIC · USAGE POLICY UPDATE · 15 AUG 2025</text>
</svg>
