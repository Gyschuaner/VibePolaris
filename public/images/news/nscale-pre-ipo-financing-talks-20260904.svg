<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Nscale AI 算力融资链</title><desc id="desc">可转债、NVIDIA 资金、GPU 数据中心和客户租约共同组成 Nscale 报道中的上市前融资链。</desc><rect width="1200" height="700" rx="38" fill="#1b1c2b"/><g font-family="Arial,sans-serif"><text x="64" y="92" fill="#f7f3ff" font-size="40" font-weight="700">AI finance follows the physical stack</text><text x="64" y="132" fill="#b8b0d4" font-size="23">Nscale’s reported pre-IPO financing plan</text><g fill="#4b4d87" stroke="#a9a8ef" stroke-width="3"><rect x="82" y="255" width="230" height="125" rx="20"/><rect x="354" y="255" width="230" height="125" rx="20"/><rect x="626" y="255" width="230" height="125" rx="20"/><rect x="898" y="255" width="230" height="125" rx="20"/></g><g fill="#f8f6ff" font-size="24" font-weight="700"><text x="132" y="305">可转债</text><text x="127" y="339">15 亿美元</text><text x="403" y="305">NVIDIA</text><text x="405" y="339">20 亿美元谈判</text><text x="685" y="305">GPU 数据中心</text><text x="696" y="339">电力 · 折旧</text><text x="947" y="305">客户租约</text><text x="948" y="339">收入预测</text></g><g stroke="#f2c85b" stroke-width="8"><path d="M312 318h42"/><path d="M584 318h42"/><path d="M856 318h42"/></g><rect x="266" y="492" width="670" height="85" rx="20" fill="#a65568"/><text x="333" y="545" fill="#fff1ed" font-size="25" font-weight="700">35 亿美元仍是报道中的计划</text><text x="267" y="635" fill="#bbb3d5" font-size="23">融资工具、IPO 文件和现金流必须等正式文件验证</text></g></svg>
