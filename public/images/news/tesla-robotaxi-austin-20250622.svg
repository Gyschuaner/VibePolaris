<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tesla Robotaxi 奥斯汀试运行</title>
  <desc id="desc">一条从受限区域地图通向 Model Y 的路线，旁边标出邀请制、地理围栏和车内安全员三个运行边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#151d33"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f2"/>
      <stop offset="1" stop-color="#f7c66b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <g opacity=".15" stroke="#b7c3e5" stroke-width="2">
    <path d="M70 130H1120M70 230H1120M70 330H1120M70 430H1120M70 530H1120M170 70V600M310 70V600M450 70V600M590 70V600M730 70V600M870 70V600M1010 70V600"/>
  </g>
  <text x="82" y="92" fill="#f9fafb" font-family="Arial, sans-serif" font-size="34" font-weight="700">ROBOTAXI / AUSTIN</text>
  <text x="84" y="130" fill="#9eabc8" font-family="Arial, sans-serif" font-size="20">2025.06.22 · first invited rides</text>
  <g transform="translate(90 180)">
    <rect width="390" height="330" rx="28" fill="#101a2d" stroke="#4a6389" stroke-width="2"/>
    <text x="28" y="48" fill="#aab8d6" font-family="Arial, sans-serif" font-size="18">SOUTH AUSTIN</text>
    <path d="M50 255C100 235 120 150 188 175S260 280 338 103" fill="none" stroke="#314563" stroke-width="16" stroke-linecap="round"/>
    <path d="M50 255C100 235 120 150 188 175S260 280 338 103" fill="none" stroke="url(#route)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="50" cy="255" r="10" fill="#6ee7f2"/>
    <circle cx="338" cy="103" r="10" fill="#f7c66b"/>
    <text x="30" y="292" fill="#d6e2ff" font-family="Arial, sans-serif" font-size="18">pickup</text>
    <text x="298" y="78" fill="#d6e2ff" font-family="Arial, sans-serif" font-size="18">drop-off</text>
    <rect x="24" y="22" width="342" height="282" rx="22" fill="none" stroke="#6ee7f2" stroke-width="2" stroke-dasharray="9 9" opacity=".7"/>
    <text x="80" y="333" fill="#6ee7f2" font-family="Arial, sans-serif" font-size="16">geofence / limited hours</text>
  </g>
  <path d="M510 345H650" stroke="url(#route)" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(650 205)">
    <rect width="430" height="260" rx="36" fill="#17263a" stroke="#f7c66b" stroke-width="2"/>
    <path d="M75 150h280l-38-75H112z" fill="#d9e7f2" opacity=".95"/>
    <path d="M122 92h84v45h-84zM218 92h92v45h-92z" fill="#263a56"/>
    <circle cx="120" cy="165" r="23" fill="#0c1220"/><circle cx="310" cy="165" r="23" fill="#0c1220"/>
    <circle cx="260" cy="78" r="9" fill="#f7c66b"/>
    <text x="36" y="215" fill="#f9fafb" font-family="Arial, sans-serif" font-size="22" font-weight="700">MODEL Y</text>
    <text x="36" y="244" fill="#9eabc8" font-family="Arial, sans-serif" font-size="17">camera + end-to-end AI</text>
  </g>
  <g transform="translate(685 515)">
    <rect width="365" height="85" rx="18" fill="#0e1728" stroke="#415a80"/>
    <circle cx="35" cy="42" r="10" fill="#f7c66b"/>
    <text x="60" y="38" fill="#f9fafb" font-family="Arial, sans-serif" font-size="18" font-weight="700">safety monitor</text>
    <text x="60" y="62" fill="#9eabc8" font-family="Arial, sans-serif" font-size="16">right-front passenger seat</text>
  </g>
  <g transform="translate(90 575)">
    <rect width="520" height="58" rx="16" fill="#0e1728"/>
    <text x="24" y="37" fill="#f7c66b" font-family="Arial, sans-serif" font-size="19">INVITE ONLY</text>
    <text x="186" y="37" fill="#aab8d6" font-family="Arial, sans-serif" font-size="18">· $4.20 · 06:00–00:00</text>
  </g>
</svg>
