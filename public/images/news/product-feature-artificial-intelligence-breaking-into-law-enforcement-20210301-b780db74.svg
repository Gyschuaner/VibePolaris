<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">警务 AI 证据工作流</title><desc id="desc">录音、车牌图像经过 AI 处理后交给人复核并留下审计记录。</desc><rect width="1200" height="620" rx="28" fill="#f4f0e6"/><text x="64" y="78" fill="#171a15" font-family="Arial,sans-serif" font-size="34" font-weight="700">VibePolaris · NEWS</text><text x="64" y="124" fill="#6d7fa9" font-family="Arial,sans-serif" font-size="24">2021-03-01 · 警务 AI 的证据链</text><g stroke="#6d7fa9" stroke-width="12" fill="none" stroke-linecap="round"><path d="M250 294 H430"/><path d="M610 294 H790"/><path d="M970 294 H1080"/></g><g fill="#171a15"><rect x="90" y="220" width="160" height="150" rx="18"/><rect x="430" y="220" width="180" height="150" rx="18"/><rect x="790" y="220" width="180" height="150" rx="18"/><rect x="1080" y="220" width="70" height="150" rx="18"/></g><g fill="#f4f0e6" font-family="Arial,sans-serif" text-anchor="middle"><text x="170" y="278" font-size="26">录音 / 车牌</text><text x="170" y="318" font-size="20">原始证据</text><text x="520" y="278" font-size="26">AI 处理</text><text x="520" y="318" font-size="20">转写 · 识别</text><text x="880" y="278" font-size="26">人工复核</text><text x="880" y="318" font-size="20">上下文与权限</text><text x="1115" y="278" font-size="25" transform="rotate(90 1115 278)">审计</text></g><text x="64" y="500" fill="#171a15" font-family="Arial,sans-serif" font-size="24">工具能加快检索，不能替人决定证据意义。</text><text x="64" y="548" fill="#6d7fa9" font-family="Arial,sans-serif" font-size="20">来源：Police Chief Magazine · VIQ · Veritone · Jenoptik · California DOJ</text></svg>