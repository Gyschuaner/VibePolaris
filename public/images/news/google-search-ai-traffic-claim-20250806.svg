<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Search 点击与证据边界</title>
  <desc id="desc">查询经过 AI 摘要到达网站，质量点击指标旁边标注 Google 自报和站点自测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#333553"/>
      <stop offset="1" stop-color="#7a6d82"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f0e1"/>
      <stop offset="1" stop-color="#e1ded9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#22233b" flood-opacity=".43"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#edc978" opacity=".17"/>
  <circle cx="100" cy="540" r="230" fill="#aa9ab1" opacity=".16"/>
  <path d="M24 458 C125 367 238 515 350 400 S560 322 675 430 S870 512 1006 382 S1100 347 1190 420" fill="none" stroke="#edc978" stroke-width="5" stroke-dasharray="12 15" opacity=".83"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f3f0e1"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c777"/>
  </g>
  <g fill="#333553" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">查询</text>
    <rect x="115" y="226" width="220" height="52" rx="16" fill="#c9bed7"/>
    <text x="140" y="259" font-size="17">longer question</text>
    <path d="M115 335 h205" stroke="#7a6d82" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="115" y="374" font-size="17">AI Overviews · AI Mode</text>
    <text x="115" y="407" font-size="16">更多问题，不同意图</text>

    <text x="487" y="178" font-size="25" font-weight="800">摘要与链接</text>
    <rect x="500" y="227" width="200" height="48" rx="15" fill="#c9bed7"/>
    <path d="M524 251 h144" stroke="#7a6d82" stroke-width="8" stroke-linecap="round"/>
    <path d="M500 310 h200" stroke="#7a6d82" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <path d="M500 358 h150" stroke="#7a6d82" stroke-width="10" stroke-linecap="round"/>
    <text x="487" y="407" font-size="17">Google 自报 · 需复核</text>

    <text x="859" y="178" font-size="25" font-weight="800">网站点击</text>
    <circle cx="900" cy="272" r="28" fill="#7a6d82"/>
    <path d="M900 245 v54 M873 272 h54" stroke="#f3f0e1" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1025" cy="272" r="42" fill="#333553"/>
    <path d="M1004 273 l13 13 l28 -34" fill="none" stroke="#f3f0e1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M865 379 h205" stroke="#333553" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">停留 · 转化 · 直接访问</text>
  </g>
  <g fill="#f3f0e1" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">AI IN SEARCH · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">总量稳定不代表人人稳定</text>
  </g>
</svg>
