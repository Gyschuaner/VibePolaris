<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">LatticeWorld：从文字和草图到可交互三维世界</title>
<desc id="desc">文字与地形草图先进入语言模型生成符号布局，再由 Unreal Engine 渲染成包含动态 Agent 的虚拟世界并进行验证。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#fff5e9"/></linearGradient>
 <linearGradient id="panel" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4877a4"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#243a54" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="66" y="76" fill="#203c5d" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">LatticeWorld：描述先变成结构，再变成世界</text>
<text x="68" y="114" fill="#6b7f96" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">文字 + 地形指令 · 符号布局 · Unreal Engine 5 · 动态 Agent</text>
<g filter="url(#shadow)">
 <rect x="66" y="180" width="230" height="300" rx="22" fill="url(#panel)" stroke="#b9d5ed" stroke-width="2"/>
 <text x="100" y="228" fill="#356b9a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">输入</text>
 <rect x="100" y="255" width="162" height="58" rx="12" fill="#e0f0ff"/><text x="181" y="291" text-anchor="middle" fill="#356b9a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">场景文字</text>
 <rect x="100" y="336" width="162" height="58" rx="12" fill="#fff0d9"/><path d="M116 380 L142 348 L164 369 L191 342 L246 394 H116 Z" fill="#e4b46a" opacity=".8"/><text x="181" y="423" text-anchor="middle" fill="#8b6a36" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高度图 / 草图</text>
 </g>
 <path d="M315 330 H370" stroke="#4877a4" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="390" y="164" width="320" height="332" rx="22" fill="url(#panel)" stroke="#c7b7ec" stroke-width="2"/>
 <text x="428" y="214" fill="#604a9d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">LLaMA-2-7B</text>
 <text x="428" y="248" fill="#776b9c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">空间理解 + 结构化生成</text>
 <rect x="428" y="281" width="244" height="116" rx="12" fill="#f0eaff"/>
 <g font-family="monospace" font-size="21" fill="#7155ad">
  <text x="449" y="312">R R B B W W</text><text x="449" y="342">R F F B W W</text><text x="449" y="372">G G F A A R</text>
 </g>
 <text x="428" y="433" fill="#776b9c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">32×32 符号布局矩阵</text>
 <text x="428" y="463" fill="#776b9c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">先检查，再渲染</text>
 </g>
 <path d="M730 330 H785" stroke="#4877a4" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="805" y="164" width="330" height="332" rx="22" fill="url(#panel)" stroke="#9ed6ca" stroke-width="2"/>
 <text x="843" y="214" fill="#2c766b" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Unreal Engine 5</text>
 <text x="843" y="248" fill="#5d877f" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">翻译 · 物理 · 实时渲染</text>
 <path d="M848 383 L882 329 L934 346 L974 304 L1058 376 L1030 416 L884 416 Z" fill="#b9e2d7" stroke="#5f9e91" stroke-width="2"/>
 <circle cx="925" cy="337" r="14" fill="#e89e61"/><circle cx="1005" cy="357" r="14" fill="#658fd1"/><circle cx="976" cy="406" r="14" fill="#df7183"/>
 <text x="843" y="455" fill="#5d877f" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">动态 Agent · 多 Agent 互动</text>
 </g>
<text x="66" y="572" fill="#356b9a" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">论文报告：工业生产效率提高 90 倍以上</text>
<text x="66" y="610" fill="#6b7f96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">仍需验证碰撞、可达性、行为覆盖，以及模拟器里的策略能否迁移到现实。</text>
</svg>
