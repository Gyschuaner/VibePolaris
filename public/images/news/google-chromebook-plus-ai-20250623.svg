<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Chromebook Plus 的本地与云端 AI</title><desc id="d">屏幕中的文字先被选择，再在本地 NPU 和云端能力之间处理，最后由用户确认动作。</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="70" y="82" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">一块屏幕，两条处理路径</text><text x="70" y="122" font-family="Arial" font-size="20" fill="#475569">Chromebook Plus AI · 2025-06-23</text><rect x="110" y="190" width="430" height="260" rx="26" fill="#1e293b"/><rect x="145" y="225" width="360" height="180" rx="10" fill="#e0f2fe"/><rect x="182" y="260" width="200" height="18" rx="9" fill="#38bdf8"/><rect x="182" y="300" width="270" height="14" rx="7" fill="#94a3b8"/><rect x="182" y="334" width="220" height="14" rx="7" fill="#94a3b8"/><text x="325" y="430" text-anchor="middle" font-family="Arial" font-size="20" fill="#e2e8f0">选择屏幕内容</text><path d="M540 320 H650" stroke="#f97316" stroke-width="7" marker-end="url(#a)"/><rect x="670" y="190" width="190" height="110" rx="20" fill="#ffedd5" stroke="#f97316" stroke-width="4"/><text x="765" y="238" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#9a3412">NPU</text><text x="765" y="270" text-anchor="middle" font-family="Arial" font-size="16" fill="#9a3412">离线 / 本地</text><rect x="670" y="350" width="190" height="110" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="765" y="398" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#1e3a8a">云端</text><text x="765" y="430" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">复杂理解</text><path d="M860 245 H1015 M860 405 H1015" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="1020" y="272" width="120" height="105" rx="18" fill="#0f172a"/><text x="1080" y="320" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">确认</text><text x="1080" y="350" text-anchor="middle" font-family="Arial" font-size="15" fill="#cbd5e1">动作 / 权限</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#64748b"/></marker></defs><text x="70" y="570" font-family="Arial" font-size="18" fill="#475569">本地与云端的边界取决于设备、账号和管理员策略；50 TOPS 是厂商规格。</text></svg>