<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AntiDote：开放权重模型的抗篡改训练</title>
<desc id="desc">训练时用自适应对手模拟权重变化，防御模型学习保持安全，再分别检查鲁棒性和通用能力。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eff8f6"/><stop offset="1" stop-color="#fff2ed"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#557b83"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263e45" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#214b55" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">开放权重可以继续改，安全也要学会抵抗篡改</text>
<text x="70" y="114" fill="#68828a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">自适应对手 · 防御模型 · 安全鲁棒性 · 能力保持</text>
<g filter="url(#shadow)">
 <rect x="66" y="177" width="238" height="320" rx="22" fill="#fff" stroke="#b9d7d1" stroke-width="2"/>
 <text x="104" y="227" fill="#367b78" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">开放权重</text>
 <rect x="104" y="263" width="162" height="48" rx="10" fill="#e1f1ed"/><text x="185" y="293" text-anchor="middle" fill="#367b78" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">权重 / 架构</text>
 <rect x="104" y="331" width="162" height="48" rx="10" fill="#fde6e1"/><text x="185" y="361" text-anchor="middle" fill="#a3534b" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">继续微调</text>
 <text x="185" y="433" text-anchor="middle" fill="#68828a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">安全护栏会变化</text>
 </g>
 <path d="M320 336 H370" stroke="#557b83" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="390" y="148" width="400" height="374" rx="22" fill="#fff" stroke="#c6b7e4" stroke-width="2"/>
 <text x="430" y="204" fill="#604d99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">双层优化训练</text>
 <rect x="430" y="250" width="148" height="58" rx="11" fill="#fde4df"/><text x="504" y="285" text-anchor="middle" fill="#a3534b" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">自适应对手</text>
 <rect x="602" y="250" width="148" height="58" rx="11" fill="#e2f1ed"/><text x="676" y="285" text-anchor="middle" fill="#367b78" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">防御模型</text>
 <path d="M580 279 H600" stroke="#557b83" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M676 320 C676 382 505 382 505 320" fill="none" stroke="#8a72b6" stroke-width="4" marker-end="url(#arrow)"/>
 <text x="430" y="430" fill="#716b91" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">对手变化 → 防守更新</text>
 <text x="430" y="469" fill="#716b91" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不公开攻击配方</text>
 </g>
 <path d="M811 336 H860" stroke="#557b83" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="880" y="177" width="254" height="320" rx="22" fill="#fff" stroke="#a9d6c9" stroke-width="2"/>
 <text x="915" y="227" fill="#2e7567" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">双轨评估</text>
 <rect x="915" y="263" width="184" height="48" rx="10" fill="#e2f1ed"/><text x="1007" y="293" text-anchor="middle" fill="#2e7567" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">52 组红队</text>
 <rect x="915" y="329" width="184" height="48" rx="10" fill="#e5f0ff"/><text x="1007" y="359" text-anchor="middle" fill="#356b9a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">鲁棒性 +27.4%</text>
 <rect x="915" y="395" width="184" height="48" rx="10" fill="#fff0da"/><text x="1007" y="425" text-anchor="middle" fill="#8a6b36" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">能力损失 &lt;0.5%</text>
 </g>
<text x="68" y="575" fill="#a3534b" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">实验结果属于特定模型、数据和红队集合</text>
<text x="68" y="613" fill="#68828a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">权重签名、写入权限和上线后评测仍然需要保留。</text>
</svg>
