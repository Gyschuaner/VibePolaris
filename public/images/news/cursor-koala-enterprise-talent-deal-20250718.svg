<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Cursor 与 Koala 人才交易</title><desc id="desc">Koala 产品关停、部分工程师加入 Cursor、企业团队建设的关系。</desc><rect width="1200" height="680" rx="36" fill="#111d2b"/><text x="72" y="88" fill="#f8fafc" font-size="40" font-family="sans-serif" font-weight="700">Cursor × Koala：买的是哪一层能力？</text><text x="72" y="130" fill="#b5c9df" font-size="22" font-family="sans-serif">部分工程师加入，不等于 CRM 产品整体迁移</text><g font-family="sans-serif"><rect x="90" y="226" width="270" height="180" rx="24" fill="#5b3c4d"/><text x="126" y="275" fill="#ffd5e0" font-size="22">Koala 原产品</text><text x="126" y="329" fill="white" font-size="30" font-weight="700">9/30 关停</text><text x="126" y="370" fill="#ffe7ec" font-size="17">客户迁移 / 数据处理</text><path d="M390 316h148" stroke="#e4ad6a" stroke-width="8" stroke-linecap="round"/><path d="m512 292 28 24-28 24" fill="none" stroke="#e4ad6a" stroke-width="8"/><rect x="566" y="226" width="270" height="180" rx="24" fill="#2d4e73"/><text x="602" y="275" fill="#c9e3ff" font-size="22">人员</text><text x="602" y="329" fill="white" font-size="30" font-weight="700">部分工程师</text><text x="602" y="370" fill="#dceeff" font-size="17">加入企业化团队</text><path d="M866 316h148" stroke="#86d6a0" stroke-width="8" stroke-linecap="round"/><path d="m988 292 28 24-28 24" fill="none" stroke="#86d6a0" stroke-width="8"/><rect x="1042" y="226" width="100" height="180" rx="24" fill="#395a4e"/><text x="1064" y="275" fill="#d5f5df" font-size="22">目标</text><text x="1058" y="329" fill="white" font-size="25" font-weight="700">企业</text><text x="1058" y="370" fill="#e0f8e7" font-size="17">待验证</text><rect x="90" y="505" width="1052" height="70" rx="18" fill="#293548"/><text x="126" y="550" fill="#e6edf5" font-size="22">公开证据：人才交易 + 产品关停；价格、合同和数据迁移未知</text></g></svg>