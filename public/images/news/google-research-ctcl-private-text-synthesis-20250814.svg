<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Research CTCL private text synthesis</title>
  <desc id="desc">Public topic components and private differentially private signals feed a lightweight generator to create synthetic text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#12253b"/><stop offset="1" stop-color="#264b59"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#67c9ff"/><stop offset="1" stop-color="#7a85ef"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop offset="0" stop-color="#75dfbd"/><stop offset="1" stop-color="#48a56c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050b15" flood-opacity=".44"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="98" r="190" fill="#67c9ff" opacity=".12"/>
  <circle cx="1030" cy="528" r="240" fill="#75dfbd" opacity=".11"/>
  <g filter="url(#shadow)">
    <rect x="72" y="74" width="620" height="132" rx="24" fill="#162f46" stroke="#67c9ff" stroke-width="2"/>
    <text x="106" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="4" fill="#a8e3ff">GOOGLE RESEARCH</text>
    <text x="106" y="177" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#f2fbff">CTCL · 140M</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#d8f3ee">用主题和差分隐私生成合成文本</text>
  <g transform="translate(702 82)" filter="url(#shadow)">
    <rect x="0" y="40" width="156" height="120" rx="18" fill="#275b7e" stroke="#9be1ff" stroke-width="3"/>
    <rect x="188" y="40" width="156" height="120" rx="18" fill="#604f78" stroke="#d1b8ff" stroke-width="3"/>
    <rect x="92" y="214" width="156" height="120" rx="18" fill="url(#mint)" stroke="#d0ffe8" stroke-width="3"/>
    <text x="78" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ecfbff">PUBLIC TOPICS</text>
    <text x="266" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f5efff">PRIVATE DP</text>
    <text x="170" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f2a37">GENERATOR</text>
    <path d="M156 100 H188 M120 160 L150 214 M224 160 L194 214" stroke="#f7d478" stroke-width="4" stroke-linecap="round"/>
    <circle cx="170" cy="386" r="40" fill="#f7d478" stroke="#fff0bf" stroke-width="3"/>
    <path d="M151 386 L164 399 L190 370" fill="none" stroke="#1a3542" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#d8f3ee">SYNTHETIC DATA</text>
  </g>
  <g transform="translate(80 360)">
    <rect width="574" height="132" rx="20" fill="#162f46" stroke="#32637a" stroke-width="2"/>
    <text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f7d478">TOPIC HISTOGRAM → DP FINE-TUNING</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e6f8f3">PubMed · Chatbot Arena · Multi-Session Chat</text>
    <text x="30" y="115" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b6d6dd">OpenReview · strong privacy regime</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a8cbd2">GOOGLE RESEARCH · 14 AUG 2025</text>
</svg>