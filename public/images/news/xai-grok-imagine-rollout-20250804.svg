<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Grok Imagine 从提示生成带声音的视频</title>
  <desc id="desc">文字或图片经过图像生成、动画和音频步骤变成短视频，并经过内容限制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2d1e48"/>
      <stop offset="1" stop-color="#79506b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8e9d6"/>
      <stop offset="1" stop-color="#e0d5ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#180f2d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="105" r="180" fill="#f2bf76" opacity=".14"/>
  <circle cx="130" cy="535" r="240" fill="#d69cc5" opacity=".15"/>
  <path d="M50 440 C190 330 300 485 435 365 S700 260 840 390 S1040 480 1190 330" fill="none" stroke="#f2bf76" stroke-width="5" stroke-dasharray="12 16" opacity=".8"/>
  <g filter="url(#shadow)">
    <rect x="90" y="115" width="300" height="325" rx="30" fill="url(#card)"/>
    <rect x="450" y="115" width="300" height="325" rx="30" fill="#f8e9d6"/>
    <rect x="810" y="115" width="300" height="325" rx="30" fill="#e6bfd0"/>
  </g>
  <g fill="#2d1e48" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="135" y="175" font-size="25" font-weight="800">提示</text>
    <rect x="135" y="230" width="205" height="52" rx="18" fill="#e0d5ef"/>
    <text x="158" y="263" font-size="17">一只猫在月球散步</text>
    <rect x="135" y="305" width="160" height="45" rx="16" fill="#c69cc5"/>
    <text x="158" y="334" font-size="16">文字或图片</text>
    <text x="135" y="405" font-size="17">先生成画面</text>

    <text x="495" y="175" font-size="25" font-weight="800">Imagine</text>
    <rect x="505" y="225" width="188" height="118" rx="18" fill="#d3a8c3"/>
    <circle cx="555" cy="282" r="27" fill="#f2bf76"/>
    <path d="M576 300 l34 -34 l41 51" fill="none" stroke="#2d1e48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M520 375 h165" stroke="#79506b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="585" cy="375" r="12" fill="#2d1e48"/>
    <text x="495" y="405" font-size="17">动画 · 原生音频</text>

    <text x="855" y="175" font-size="25" font-weight="800">审核边界</text>
    <path d="M870 250 h155" stroke="#2d1e48" stroke-width="12" stroke-linecap="round" opacity=".35"/>
    <path d="M870 250 h78" stroke="#2d1e48" stroke-width="12" stroke-linecap="round"/>
    <circle cx="948" cy="250" r="19" fill="#2d1e48"/>
    <rect x="870" y="303" width="180" height="46" rx="16" fill="#c99bb7"/>
    <text x="895" y="333" font-size="16">允许 · 拦截</text>
    <text x="855" y="405" font-size="17">早期 rollout</text>
  </g>
  <g fill="#f8e9d6" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="90" y="565" font-size="22" letter-spacing="1">Grok Imagine · 2025.08.04</text>
    <text x="1110" y="565" font-size="16" text-anchor="end" opacity=".84">能生成，也要能解释限制</text>
  </g>
</svg>
