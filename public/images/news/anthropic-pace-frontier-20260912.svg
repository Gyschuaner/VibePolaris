  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a7f3d0"/><stop offset="1" stop-color="#fef08a"/></linearGradient>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <path d="M112 386h188l118-80h188l118-80h118" fill="none" stroke="url(#step)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="386" r="28" fill="#fef08a"/><circle cx="418" cy="306" r="28" fill="#a7f3d0"/><circle cx="724" cy="226" r="28" fill="#fef08a"/>
