<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AHaBench affective hallucination</title>
  <desc id="desc">A conversation stays warm while three boundary checks watch for enmeshment, false presence and overdependence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211d36"/><stop offset="1" stop-color="#4a3044"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8bdad1"/><stop offset="1" stop-color="#f6b37b"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#06050b" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#161426" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#c6b5c7" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">AHABENCH · 2025.08.23</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Warmth needs a boundary</text>
  <text x="124" y="255" fill="#e2d8e3" font-family="Arial, sans-serif" font-size="25">Measure the relationship illusion, not just the tone.</text>
  <rect x="124" y="344" width="274" height="112" rx="20" fill="#2d3d4b" stroke="#8bdad1" stroke-width="2"/><text x="158" y="386" fill="#8bdad1" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">CHECK 01</text><text x="158" y="428" fill="#ffffff" font-family="Arial, sans-serif" font-size="25">Enmeshment</text>
  <rect x="454" y="344" width="274" height="112" rx="20" fill="#3a3046" stroke="#f6b37b" stroke-width="2"/><text x="488" y="386" fill="#f6b37b" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">CHECK 02</text><text x="488" y="428" fill="#ffffff" font-family="Arial, sans-serif" font-size="25">False presence</text>
  <rect x="784" y="344" width="282" height="112" rx="20" fill="#34304c" stroke="#9facff" stroke-width="2"/><text x="818" y="386" fill="#9facff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">CHECK 03</text><text x="818" y="428" fill="#ffffff" font-family="Arial, sans-serif" font-size="25">Overdependence</text>
  <path d="M124 505h942" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>
  <text x="124" y="535" fill="#c6b5c7" font-family="Arial, sans-serif" font-size="18">A caring response can still point back to human support.</text>
</svg>
