  <rect x="306" y="500" width="588" height="74" rx="18" fill="#243043"/>
  <text x="600" y="546" fill="#d5def0" font-size="18" text-anchor="middle" font-family="sans-serif">监管沟通 · UKRI 资金 · 重组方案 · 后续成果</text>
