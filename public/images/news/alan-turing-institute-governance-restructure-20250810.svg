  <path d="M 330 362 H 404" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 384 346 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="434" y="276" width="210" height="172" rx="20" fill="#253b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="539" y="337" fill="#f8fafc" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">政府方向</text>
  <text x="539" y="377" fill="#bfdbfe" font-size="17" text-anchor="middle" font-family="sans-serif">国防 · 主权能力</text>
  <text x="539" y="414" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="sans-serif">资金条件与领导层</text>
  <path d="M 672 362 H 746" stroke="#94a3b8" stroke-width="4"/>
