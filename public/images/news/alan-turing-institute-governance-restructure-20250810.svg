<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Alan Turing Institute 治理与研究方向重组</title>
  <desc id="desc">员工投诉、政府资金与方向压力、研究项目取舍和监管记录组成机构重组链</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="124" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">Alan Turing Institute</text>
  <text x="92" y="164" fill="#a8b3c7" font-size="18" font-family="sans-serif">治理投诉 · 资金压力 · 研究方向重组</text>
