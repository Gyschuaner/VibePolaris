<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Qwen-Image-Edit open source</title>
  <desc id="desc">An image enters semantic and appearance control paths, then a boxed local edit corrects a Chinese poster character step by step.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233a"/><stop offset="1" stop-color="#4d304d"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0f2e4"/><stop offset="1" stop-color="#65b3df"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffda91"/><stop offset="1" stop-color="#ef9b69"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="86" r="215" fill="#ffce7b" opacity=".1"/>
  <circle cx="1070" cy="560" r="250" fill="#80e7da" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="700" height="136" rx="24" fill="#223550" stroke="#8bd2e1" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a2eee4">QWENLM · 18 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4fbff">QWEN-IMAGE-EDIT · OPEN</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">语义、外观和海报文字，都能分步修改</text>
  <g transform="translate(776 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="344" height="406" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="172" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeaf4">ONE IMAGE INPUT</text>
    <rect x="34" y="60" width="276" height="74" rx="14" fill="#e8eff1"/>
    <rect x="54" y="80" width="160" height="12" rx="6" fill="#71869a"/>
    <text x="54" y="119" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#263c52">海报 · 文字 · 人物</text>
    <path d="M172 144 V176" stroke="#ffd28c" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 165 L172 184 L191 165" fill="none" stroke="#ffd28c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="198" width="128" height="64" rx="15" fill="#31534f"/>
    <rect x="186" y="198" width="128" height="64" rx="15" fill="#3a4b68"/>
    <text x="94" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e1fff8">语义控制</text>
    <text x="94" y="249" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c9eee8">Qwen2.5-VL</text>
    <text x="250" y="227" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e9f1ff">外观控制</text>
    <text x="250" y="249" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#cddbed">VAE Encoder</text>
    <path d="M172 272 V306" stroke="#9deee4" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 294 L172 313 L191 294" fill="none" stroke="#9deee4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="326" width="276" height="48" rx="13" fill="url(#gold)"/>
    <text x="172" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3d2e34">框选局部 · 链式纠错</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="670" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">中文 / English 文字编辑</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">开源降低试用门槛，质量仍要自己的回归</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">官方 benchmark 与示例属于发布方口径</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">QWEN-IMAGE-EDIT · IMAGE AND TEXT EDITING</text>
</svg>
