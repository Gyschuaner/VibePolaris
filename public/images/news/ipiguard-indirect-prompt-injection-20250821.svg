<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">IPIGuard indirect prompt injection defense</title>
  <desc id="desc">A planned tool dependency graph separates an agent's action plan from untrusted external data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191a39"/><stop offset="1" stop-color="#43304e"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9df0cb"/><stop offset="1" stop-color="#75c6ff"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffcc83"/><stop offset="1" stop-color="#ff8ea2"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070912" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1045" cy="90" r="210" fill="#9df0cb" opacity=".11"/>
  <circle cx="1030" cy="570" r="255" fill="#ff8ea2" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="700" height="140" rx="24" fill="#292548" stroke="#9df0cb" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c6ffe6">IPIGUARD · AGENT DEFENSE</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#faf9ff">PLAN ≠ DATA ≠ ACTION</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ebe6ff">先固定要做什么，再读外部世界</text>
  <g transform="translate(816 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="410" rx="30" fill="#111a32" stroke="#c3ccff" stroke-width="3"/>
    <circle cx="126" cy="82" r="31" fill="url(#green)"/>
    <text x="126" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e2d50">PLAN</text>
    <path d="M126 119v47M126 166l-55 46M126 166l55 46" stroke="#7891c7" stroke-width="7" stroke-linecap="round"/>
    <circle cx="71" cy="232" r="25" fill="url(#green)"/><circle cx="181" cy="232" r="25" fill="url(#green)"/>
    <path d="M47 293h158" stroke="#697fb6" stroke-width="7" stroke-linecap="round"/>
    <path d="M76 333h100" stroke="#697fb6" stroke-width="7" stroke-linecap="round"/>
    <path d="M50 380h152" stroke="#ff8ea2" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 13"/>
  </g>
  <g transform="translate(78 360)">
    <rect width="700" height="140" rx="20" fill="#292548" stroke="#6c5d87" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c6ffe6">TOOL DEPENDENCY GRAPH</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">动作计划先行 · 外部数据隔离 · AgentDojo</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9cbe4">防御范式，不能替代权限和人工审批</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9cbe5">ARXIV · FIRST SUBMITTED 21 AUG 2025</text>
</svg>
