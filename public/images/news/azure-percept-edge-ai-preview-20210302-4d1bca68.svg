<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Azure Percept 的边缘 AI 工作流</title>
  <desc id="desc">摄像头和麦克风在现场产生输入，设备在边缘运行推理，再连接云端管理、模型和人工复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10233f"/><stop offset="1" stop-color="#173d55"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#37c7b6"/><stop offset="1" stop-color="#6ee7b7"/></linearGradient>
    <linearGradient id="cloud" x1="0" x2="1"><stop stop-color="#6ea8fe"/><stop offset="1" stop-color="#b4d7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071525" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="78" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700">Azure Percept：把推理放到现场</text>
  <text x="74" y="116" fill="#b8c9dc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">2021-03-02 · 公开预览中的硬件、模型与管理路径</text>
  <g filter="url(#shadow)">
    <rect x="70" y="185" width="225" height="300" rx="22" fill="#203b58" stroke="#4b6e91" stroke-width="2"/>
    <rect x="337" y="155" width="260" height="360" rx="22" fill="#123f4d" stroke="#46c7b0" stroke-width="3"/>
    <rect x="640" y="185" width="230" height="300" rx="22" fill="#1e3559" stroke="#6ea8fe" stroke-width="3"/>
    <rect x="913" y="205" width="215" height="260" rx="22" fill="#25384a" stroke="#d8b4ff" stroke-width="2"/>
  </g>
  <g fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="182" y="226" font-size="23" font-weight="700">现场输入</text>
    <text x="182" y="260" font-size="16" fill="#b8c9dc">Vision · Audio</text>
    <circle cx="150" cy="340" r="42" fill="#293f5e" stroke="#8bb4d9" stroke-width="3"/>
    <path d="M127 340h46M150 317v46" stroke="#b6e2ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="112" y="405" width="140" height="32" rx="16" fill="#2d5576"/>
    <text x="182" y="427" font-size="15">图像 / 声音</text>
    <text x="467" y="198" font-size="23" font-weight="700">边缘设备</text>
    <text x="467" y="232" font-size="16" fill="#a7f3d0">本地推理</text>
    <rect x="389" y="273" width="156" height="80" rx="14" fill="url(#edge)" opacity=".9"/>
    <text x="467" y="307" font-size="19" fill="#092f35" font-weight="700">硬件加速</text>
    <text x="467" y="333" font-size="16" fill="#092f35">低延迟判断</text>
    <path d="M392 402h150" stroke="#4bd2bc" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="467" y="442" font-size="15" fill="#ccefe8">可断网先响应</text>
    <text x="755" y="226" font-size="23" font-weight="700">云端管理</text>
    <text x="755" y="260" font-size="16" fill="#c7dcff">Studio · AI · IoT</text>
    <path d="M704 365c0-28 22-50 50-50 17 0 32 8 41 21 6-5 15-8 24-8 21 0 38 17 38 38 0 3 0 6-1 9 12 4 21 15 21 28 0 17-14 31-31 31H704c-20 0-36-16-36-36 0-17 11-30 26-35z" fill="url(#cloud)" opacity=".9"/>
    <text x="755" y="385" font-size="18" fill="#12335a" font-weight="700">配置 · 训练 · 部署</text>
    <text x="1020" y="246" font-size="23" font-weight="700">人工复核</text>
    <text x="1020" y="281" font-size="16" fill="#d9c4f2">原型能不能上线？</text>
    <circle cx="1020" cy="363" r="48" fill="#3d5263" stroke="#d8b4ff" stroke-width="3"/>
    <path d="M994 365l18 18 36-42" fill="none" stroke="#e8d7ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1020" y="438" font-size="15" fill="#d8c6eb">检查误报、权限、维护</text>
  </g>
  <g fill="none" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)">
    <path d="M298 335h33"/>
    <path d="M600 335h34"/>
    <path d="M873 335h34"/>
  </g>
  <text x="74" y="570" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">示意图为 VibePolaris 自制，按官方发布中的组件与边界重画；不代表客户已完成生产部署。</text>
</svg>
