<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ReFactX constrained generation</title>
  <desc id="desc">Knowledge graph facts form a prefix tree that constrains each generated token.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17263a"/><stop offset="1" stop-color="#275052"/></linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#78e0cf"/><stop offset="1" stop-color="#8ba9ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070e" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="68" width="1056" height="496" rx="38" fill="#101a2b" fill-opacity=".81" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a2bbcf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">REFACTX · 2025.08.23</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Facts have a path</text>
  <text x="124" y="254" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">Constrain generation to the knowledge graph.</text>
  <g stroke="url(#tree)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M520 400h110"/><path d="M630 400l90-60"/><path d="M630 400l90 60"/><path d="M720 340l96-44"/><path d="M720 340l96 44"/><path d="M720 460l96-44"/><path d="M720 460l96 44"/></g>
  <circle cx="490" cy="400" r="28" fill="#213d48" stroke="#78e0cf" stroke-width="3"/><circle cx="630" cy="400" r="23" fill="#2c3e58" stroke="#8ba9ff" stroke-width="3"/><circle cx="720" cy="340" r="20" fill="#3b3450" stroke="#ffbf7d" stroke-width="3"/><circle cx="720" cy="460" r="20" fill="#3b3450" stroke="#ffbf7d" stroke-width="3"/>
  <circle cx="846" cy="296" r="17" fill="#244744" stroke="#78e0cf" stroke-width="3"/><circle cx="846" cy="384" r="17" fill="#244744" stroke="#78e0cf" stroke-width="3"/><circle cx="846" cy="416" r="17" fill="#4a3547" stroke="#ffbf7d" stroke-width="3"/><circle cx="846" cy="504" r="17" fill="#4a3547" stroke="#ffbf7d" stroke-width="3"/>
  <text x="154" y="385" fill="#78e0cf" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">KNOWLEDGE GRAPH</text><text x="154" y="425" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">prefix tree</text>
  <text x="926" y="350" fill="#ffbf7d" font-family="Arial, sans-serif" font-size="19" letter-spacing="2">TOKEN</text><text x="926" y="386" fill="#ffffff" font-family="Arial, sans-serif" font-size="25">only valid facts</text>
  <text x="124" y="520" fill="#a2bbcf" font-family="Arial, sans-serif" font-size="18">A hard boundary still needs a fresh, complete knowledge base.</text>
</svg>
