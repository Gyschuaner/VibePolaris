<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">MedFactEval：从临床关键事实到摘要评估</title>
<desc id="desc">医生定义关键事实，多模型 Jury 与医生参考对照，结果回到临床摘要生成和人工复核。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef8f6"/><stop offset="1" stop-color="#fff1e7"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5c7c80"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#294e51" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#2f6465" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">先定义关键事实，再判断摘要有没有漏</text>
<text x="70" y="114" fill="#738d91" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">clinical key facts · LLM Jury · physician reference · human review</text>
<g filter="url(#shadow)">
 <rect x="66" y="173" width="246" height="322" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="2"/>
 <text x="103" y="221" fill="#3e7d76" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">临床事实清单</text>
 <rect x="104" y="257" width="170" height="45" rx="10" fill="#e3f2ee"/><text x="189" y="285" text-anchor="middle" fill="#3e7d76" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">诊断 / 治疗</text>
 <rect x="104" y="323" width="170" height="45" rx="10" fill="#fff0dc"/><text x="189" y="351" text-anchor="middle" fill="#a16d37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">出院安排</text>
 <text x="189" y="422" text-anchor="middle" fill="#738d91" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">医生定义高显著性</text>
 <text x="189" y="461" text-anchor="middle" fill="#b16f4d" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">保留时间与否定关系</text>
</g>
<path d="M328 335 H365" stroke="#5c7c80" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="385" y="145" width="426" height="380" rx="22" fill="#fff" stroke="#c8b9e3" stroke-width="2"/>
 <text x="425" y="201" fill="#624f99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">双重评测回路</text>
 <rect x="425" y="247" width="154" height="56" rx="11" fill="#e4f1fb"/><text x="502" y="282" text-anchor="middle" fill="#47718f" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">LLM Jury</text>
 <rect x="616" y="247" width="154" height="56" rx="11" fill="#e5f2eb"/><text x="693" y="282" text-anchor="middle" fill="#4b8464" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">7 位医生参考</text>
 <path d="M579 275 H608" stroke="#5c7c80" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M693 323 C693 391 502 391 502 323" fill="none" stroke="#8d75b5" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="460" y="424" width="284" height="54" rx="11" fill="#fff0dc"/><text x="602" y="458" text-anchor="middle" fill="#a16d37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Cohen κ=0.81 / 0.67</text>
 <text x="425" y="501" fill="#738d91" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">一致性指标，不是临床批准</text>
</g>
<path d="M831 335 H867" stroke="#5c7c80" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="887" y="173" width="247" height="322" rx="22" fill="#fff" stroke="#e1c39f" stroke-width="2"/>
 <text x="925" y="221" fill="#a06d37" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">摘要回路</text>
 <rect x="922" y="257" width="178" height="45" rx="10" fill="#e5f2eb"/><text x="1011" y="285" text-anchor="middle" fill="#4b8464" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">MedAgentBrief</text>
 <rect x="922" y="323" width="178" height="45" rx="10" fill="#e4f1fb"/><text x="1011" y="351" text-anchor="middle" fill="#47718f" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">缺失事实回修</text>
 <rect x="922" y="389" width="178" height="45" rx="10" fill="#fff0dc"/><text x="1011" y="417" text-anchor="middle" fill="#a06d37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">医生签字</text>
 <text x="1011" y="461" text-anchor="middle" fill="#738d91" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高风险仍需人工</text>
</g>
<text x="68" y="575" fill="#a06d37" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">事实覆盖率不等于临床安全</text>
<text x="68" y="613" fill="#738d91" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">原始病历、数据漂移和医生责任链都要保留。</text>
</svg>
