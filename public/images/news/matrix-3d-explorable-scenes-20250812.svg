<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Matrix-3D 全景到可探索场景</title>
  <desc id="desc">文字或图片经过全景图和全景视频生成，再重建成可以沿相机轨迹探索的三维场景</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#1b2638" stroke="#3b4a62" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Matrix-3D</text>
  <text x="92" y="160" fill="#a5b4fc" font-size="18" font-family="sans-serif">文字 / 图片 → 全景视频 → 可探索 3D</text>
  <rect x="92" y="272" width="210" height="174" rx="20" fill="#263b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="197" y="328" fill="#dbeafe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">输入</text>
  <text x="197" y="370" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">文字 · 图片</text>
  <path d="M 326 358 H 384" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 364 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="408" y="272" width="210" height="174" rx="20" fill="#3a2e4e" stroke="#c4b5fd" stroke-width="2"/>
  <text x="513" y="328" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">全景视频</text>
  <text x="513" y="370" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">360° · 轨迹</text>
  <path d="M 642 358 H 700" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 680 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="724" y="272" width="210" height="174" rx="20" fill="#203d3e" stroke="#5eead4" stroke-width="2"/>
  <text x="829" y="328" fill="#ccfbf1" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">3D 场景</text>
  <text x="829" y="370" fill="#99f6e4" font-size="16" text-anchor="middle" font-family="sans-serif">重建 · 探索</text>
  <path d="M 829 468 C 829 548, 280 548, 197 468" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M 210 480 l -14 -14 -13 14" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="600" y="586" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">沿相机轨迹回放，检查深度、接缝和长路径漂移</text>
</svg>
