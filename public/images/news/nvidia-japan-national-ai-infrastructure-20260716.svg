<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">日本国家级物理 AI 基础设施</title><desc id="d">Noetra AI factory 连接算力、工业数据、多模态模型、数字孪生与机器人。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f3f8ff}.muted{fill:#a5b8cd;font-size:22px}.node{fill:#122d3d;stroke:#77e1a7;stroke-width:3}.pulse{stroke:#77e1a7;stroke-width:8;stroke-dasharray:14 15;fill:none;animation:p 2.8s linear infinite}@keyframes p{to{stroke-dashoffset:-58}}</style><rect width="1200" height="680" rx="34" fill="#071b21"/><text x="72" y="90" font-size="42" font-weight="700">日本 / Physical AI 基础设施</text><text x="72" y="130" class="muted">140 MW 规划，把数据、模型和机器人放进同一条链</text><g transform="translate(68 236)"><rect class="node" width="218" height="170" rx="24"/><text x="26" y="64" font-size="29">工业数据</text><text x="26" y="110" class="muted">制造 · 物流 · 医疗</text></g><path class="pulse" d="M286 322H410"/><g transform="translate(410 218)"><rect class="node" width="270" height="206" rx="24"/><text x="26" y="62" font-size="29">Noetra AI factory</text><text x="26" y="108" class="muted">13,750 CPU</text><text x="26" y="146" class="muted">27,500 GPU / 140 MW</text></g><path class="pulse" d="M680 322H804"/><g transform="translate(804 190)"><rect class="node" width="326" height="264" rx="24"/><text x="26" y="60" font-size="29">多模态模型</text><text x="26" y="104" class="muted">数字孪生 · 机器人</text><text x="26" y="148" class="muted">Cosmos · Isaac</text><text x="26" y="192" class="muted">先模拟，再落地</text></g><text x="78" y="568" class="muted">公告里的容量与模型目标仍待项目建设和独立实测确认。</text></svg>
