<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">RW-Steering 的混合上下文防护</title><desc id="desc">模型在相关与不当信息的竞争中识别异常信号，再由外部证据与权限边界共同控制。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d8d5ca" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#29332f">RW-Steering：混合上下文先辨信号</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#6d7870">相关信息 · 不当信息 · 行为曲线 · 外部防线</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="258" width="216" height="134" rx="22" fill="#e8eef8" stroke="#7b98bc" stroke-width="3"/><text x="212" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">混合上下文</text><text x="212" y="347" text-anchor="middle" font-size="18" fill="#4d6d8d">相关 / 不当</text>
<rect x="422" y="258" width="216" height="134" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="530" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7d5519">行为曲线</text><text x="530" y="347" text-anchor="middle" font-size="18" fill="#97702e">信号竞争</text>
<rect x="740" y="258" width="216" height="134" rx="22" fill="#e8f2e9" stroke="#76a37d" stroke-width="3"/><text x="848" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">RW-Steering</text><text x="848" y="347" text-anchor="middle" font-size="18" fill="#4e7a57">识别 / 忽略</text>
<rect x="990" y="258" width="100" height="134" rx="22" fill="#f3e7f0" stroke="#b885a5" stroke-width="3"/><text x="1040" y="309" text-anchor="middle" font-size="22" font-weight="700" fill="#713e5b">复核</text><text x="1040" y="347" text-anchor="middle" font-size="16" fill="#94637c">权限</text>
</g>
<g fill="none" stroke="#66736b" stroke-width="4" stroke-linecap="round"><path d="M320 325 H406"/><path d="M638 325 H724"/><path d="M956 325 H974"/></g><g fill="#66736b"><path d="M406 325 l-14 -9 v18z"/><path d="M724 325 l-14 -9 v18z"/><path d="M974 325 l-12 -9 v18z"/></g>
<text x="600" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5a52">少量信息可能影响很大，但少量也可能是关键反例</text>
<text x="600" y="531" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#78837b">微调之外仍要保留来源、隔离和授权</text>
</svg>
