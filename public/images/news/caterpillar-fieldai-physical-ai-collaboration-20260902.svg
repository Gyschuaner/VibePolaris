<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">卡特彼勒与 FieldAI 的工业 Physical AI 合作</title><desc id="d">设备数据进入数字孪生和机器人基础模型，再回到巡检与安全决策。</desc><rect width="1200" height="680" rx="36" fill="#12202b"/><g font-family="Arial, sans-serif" fill="#f4f7f8"><text x="72" y="82" font-size="34" font-weight="700">Physical AI · industrial loop</text><text x="72" y="122" font-size="20" fill="#b9c8ce">合作公告列出的早期落点：观察、推演、受控动作</text><g transform="translate(72 215)"><rect width="230" height="150" rx="20" fill="#d9822b"/><text x="28" y="62" font-size="27" font-weight="700">Caterpillar</text><text x="28" y="98" font-size="18">设备 · 工程 · 运营数据</text></g><g transform="translate(485 205)"><rect width="230" height="170" rx="20" fill="#2b7a78"/><text x="26" y="62" font-size="27" font-weight="700">FieldAI</text><text x="26" y="98" font-size="18">机器人基础模型</text><text x="26" y="126" font-size="18">物理推理与不确定性</text></g><g transform="translate(896 215)"><rect width="230" height="150" rx="20" fill="#5065a8"/><text x="30" y="62" font-size="27" font-weight="700">现场</text><text x="30" y="98" font-size="18">巡检 · 感知 · 优化</text></g><path d="M302 290h175M715 290h175" stroke="#f7c873" stroke-width="8" marker-end="url(#a)"/><path d="M1015 385v92H185v-92" fill="none" stroke="#80b7c3" stroke-width="6"/><text x="350" y="523" font-size="22" fill="#d9e8ec">NVIDIA 加速计算 + Omniverse 数字孪生：先推演，再验证</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f7c873"/></marker></defs></svg>