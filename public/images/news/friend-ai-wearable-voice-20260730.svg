<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Friend 2.0 · AI 项链 · 语音陪伴</title>
<desc id="desc">Friend 2.0 让 AI 项链通过扬声器直接回应，固定声音和人格带来更强陪伴感，也放大持续聆听、记忆和情感依赖问题。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="45" y="175" width="190" height="150" rx="18" fill="#123b5d" stroke="#93c5fd" stroke-width="3"/>
<text x="140" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">持续聆听</text>
<text x="140" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">项链输入</text>
<path d="M235 250H265" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
