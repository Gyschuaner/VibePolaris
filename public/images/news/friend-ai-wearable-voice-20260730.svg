<text x="365" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">声音人格</text>
<text x="365" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">直接回应</text>
<path d="M460 250H490" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="495" y="175" width="190" height="150" rx="18" fill="#3b2b70" stroke="#93c5fd" stroke-width="3"/>
<text x="590" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">记忆</text>
<text x="590" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">长期关系</text>
<path d="M685 250H715" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="720" y="175" width="190" height="150" rx="18" fill="#174d4d" stroke="#93c5fd" stroke-width="3"/>
<text x="815" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">责任</text>
<text x="815" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">隐私边界</text>
<text x="480" y="445" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">2026-07-30 · Friend 2.0 · AI 项链 · 语音陪伴</text>
