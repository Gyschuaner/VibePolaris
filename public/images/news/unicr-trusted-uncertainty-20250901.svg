<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">UniCR 的风险控制拒答</title><desc id="desc">多种不确定性证据融合为校准概率，再按错误预算决定回答或拒答。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf9" stroke="#dad4ce" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#2d3035">UniCR：把不确定性变成拒答预算</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#70747b">证据融合 · 概率校准 · 风险控制 · 原子事实</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="244" width="220" height="154" rx="22" fill="#e9eef7" stroke="#7d99bd" stroke-width="3"/><text x="214" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#2d4e73">多种证据</text><text x="214" y="328" text-anchor="middle" font-size="17" fill="#4e6d8d">似然 / 检索</text><text x="214" y="355" text-anchor="middle" font-size="17" fill="#4e6d8d">工具 / 自一致性</text>
<rect x="490" y="244" width="220" height="154" rx="22" fill="#fff0d7" stroke="#d3a25f" stroke-width="3"/><text x="600" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#7e551b">校准概率</text><text x="600" y="328" text-anchor="middle" font-size="17" fill="#97702f">正确率估计</text><text x="600" y="355" text-anchor="middle" font-size="17" fill="#97702f">原子事实</text>
<rect x="876" y="244" width="220" height="154" rx="22" fill="#e8f2e9" stroke="#76a27c" stroke-width="3"/><text x="986" y="292" text-anchor="middle" font-size="23" font-weight="700" fill="#2d6338">错误预算</text><text x="986" y="328" text-anchor="middle" font-size="17" fill="#4e7a58">回答 / 追问</text><text x="986" y="355" text-anchor="middle" font-size="17" fill="#4e7a58">拒答 / 转人工</text>
</g>
<g fill="none" stroke="#68716e" stroke-width="5" stroke-linecap="round"><path d="M324 321 H472"/><path d="M710 321 H858"/></g><g fill="#68716e"><path d="M472 321 l-15 -10 v20z"/><path d="M858 321 l-15 -10 v20z"/></g>
<text x="600" y="487" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4c5557">拒答不是一句口头禅，而是可审计的风险决策</text>
<text x="600" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#7b8185">论文当前状态需同时核对：提交方法与后续撤回标注</text>
</svg>
