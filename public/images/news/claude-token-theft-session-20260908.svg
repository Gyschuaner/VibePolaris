<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Claude subscriber usage anomaly</title><desc>A reported stolen session key can mint unauthorized tokens and drain usage while the account holder watches a meter rise.</desc><style>.drain{animation:drain 2.6s ease-in-out infinite}.blink{animation:blink 1.8s ease-in-out infinite}@keyframes drain{50%{transform:translateX(42px)}}@keyframes blink{50%{opacity:.25}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#241d2c"/><rect x="110" y="185" width="270" height="250" rx="24" fill="#3b5579"/><text x="245" y="255" fill="#eef5ff" font-size="28" text-anchor="middle">订阅账号</text><rect x="170" y="305" width="150" height="32" rx="16" fill="#81d6bd"/><rect x="170" y="305" width="88" height="32" rx="16" fill="#f1c56b" class="drain"/><text x="245" y="388" fill="#c7dafa" font-size="20" text-anchor="middle">usage meter</text><path d="M380 310H520" stroke="#ff967f" stroke-width="8" stroke-dasharray="16 14" class="drain"/><circle cx="600" cy="310" r="82" fill="#5d344e" stroke="#ff967f" stroke-width="6" class="blink"/><path d="M570 300l30-28 30 28v42h-60z" fill="#ffcf76"/><path d="M600 300v42" stroke="#5d344e" stroke-width="6"/><path d="M680 310H820" stroke="#ff967f" stroke-width="8" stroke-dasharray="16 14" class="drain"/><rect x="820" y="185" width="280" height="250" rx="24" fill="#2f705e"/><text x="960" y="255" fill="#ecfff7" font-size="28" text-anchor="middle">OAuth tokens</text><text x="960" y="300" fill="#c8f1df" font-size="19" text-anchor="middle">撤销 · 退款 · 取证</text><text x="100" y="88" fill="#ff967f" font-size="24">TECHCRUNCH · ANTHROPIC · 2026-09-08</text><text x="100" y="565" fill="#c9bacd" font-size="20">会话被盗时，订阅额度也会变成可消耗的资源</text></svg>