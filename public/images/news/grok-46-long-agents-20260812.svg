<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Grok 4.6：长流程代理</title><desc id="desc">Agent（代理）从目标出发，经过工具调用和自测，再由人工验收；回环表示任务可能需要修正。</desc><rect width="1000" height="560" fill="#f8fafc"/><rect x="30" y="30" width="940" height="500" rx="28" fill="#ede9fe"/><text x="60" y="92" fill="#1e1b4b" font-size="32" font-weight="700" font-family="Arial, sans-serif">Grok 4.6：长流程代理</text><text x="60" y="132" fill="#4c1d95" font-size="18" font-family="Arial, sans-serif">Agent（代理）在多步任务中持续调用工具并回看结果。</text><rect x="70" y="230" width="180" height="88" rx="18" fill="#0f172a"/><text x="160" y="283" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial, sans-serif">目标</text><rect x="300" y="230" width="180" height="88" rx="18" fill="#7c3aed"/><text x="390" y="283" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial, sans-serif">工具调用</text><rect x="530" y="230" width="180" height="88" rx="18" fill="#334155"/><text x="620" y="283" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial, sans-serif">自测</text><rect x="760" y="230" width="170" height="88" rx="18" fill="#0f172a"/><text x="845" y="283" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial, sans-serif">人工验收</text><path d="M250 274 H282 M480 274 H512 M710 274 H742" stroke="#7c3aed" stroke-width="5"/><path d="M272 263 L282 274 L272 285 M502 263 L512 274 L502 285 M732 263 L742 274 L732 285" fill="none" stroke="#7c3aed" stroke-width="5"/><path d="M620 335 C620 420 390 420 390 335" fill="none" stroke="#7c3aed" stroke-width="4" stroke-dasharray="10 8"/><path d="M390 335 L379 352 L402 349" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="60" y="430" fill="#4c1d95" font-size="17" font-family="Arial, sans-serif">回环是解释示意，不代表厂商公开的系统架构。</text><text x="60" y="466" fill="#6d28d9" font-size="16" font-family="Arial, sans-serif">VibePolaris 自制 SVG · CC BY 4.0</text></svg>