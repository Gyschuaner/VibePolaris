<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">医疗 AI 分诊的证据与监管边界</title>
  <desc id="desc">症状进入分诊聊天机器人后，输出需要经过预期用途、临床证据、运行反馈和监管检查，新闻事件指出这些环节之间存在空档。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#102e46"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6de1ff"/>
      <stop offset="1" stop-color="#2aa6d6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc96b"/>
      <stop offset="1" stop-color="#e9824b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020914" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1400" height="820" rx="38" fill="url(#bg)"/>
  <circle cx="1240" cy="92" r="180" fill="#1d5c78" opacity=".16"/>
  <circle cx="160" cy="730" r="240" fill="#d77a4b" opacity=".08"/>
  <text x="86" y="86" fill="#dff7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">医疗 AI：一条回答怎样变成可承担责任的服务</text>
  <text x="88" y="128" fill="#9bbccc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-05 · MHRA / Babylon Health 新闻事件</text>

  <g filter="url(#shadow)">
    <rect x="78" y="218" width="216" height="170" rx="22" fill="#143b56" stroke="#4b9ec2" stroke-width="2"/>
    <circle cx="126" cy="267" r="26" fill="#2a779b"/>
    <path d="M115 265h22M126 254v22" stroke="#e7fbff" stroke-width="5" stroke-linecap="round"/>
    <text x="110" y="326" fill="#e9fbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700">症状输入</text>
    <text x="110" y="357" fill="#a8cedd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">胸痛 · 发热 · 咳嗽</text>
  </g>

  <path d="M300 304H374" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
  <path d="m360 288 24 16-24 16" fill="none" stroke="#6de1ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="388" y="184" width="260" height="238" rx="25" fill="#1c526c" stroke="#70d7ed" stroke-width="2"/>
    <rect x="430" y="222" width="176" height="106" rx="18" fill="#0b263c" stroke="#55bfd9" stroke-width="2"/>
    <path d="M455 259h128M455 286h94" stroke="#8fe9f7" stroke-width="9" stroke-linecap="round"/>
    <circle cx="546" cy="351" r="16" fill="#ffc96b"/>
    <text x="438" y="379" fill="#f4fdff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="25" font-weight="700">AI 分诊</text>
    <text x="438" y="405" fill="#b7dbe7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">判断紧急程度，不等于诊断</text>
  </g>

  <path d="M656 304H732" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
  <path d="m718 288 24 16-24 16" fill="none" stroke="#6de1ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="746" y="170" width="286" height="266" rx="25" fill="#173b50" stroke="#71bdd3" stroke-width="2"/>
    <text x="782" y="216" fill="#e7fbff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700">证据链</text>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">
      <rect x="782" y="242" width="218" height="37" rx="12" fill="#245b70"/>
      <text x="801" y="267" fill="#e4faff">预期用途</text>
      <rect x="782" y="290" width="218" height="37" rx="12" fill="#245b70"/>
      <text x="801" y="315" fill="#e4faff">临床验证</text>
      <rect x="782" y="338" width="218" height="37" rx="12" fill="#245b70"/>
      <text x="801" y="363" fill="#e4faff">真实世界结果</text>
      <rect x="782" y="386" width="218" height="37" rx="12" fill="#245b70"/>
      <text x="801" y="411" fill="#e4faff">不良事件反馈</text>
    </g>
  </g>

  <path d="M1040 304H1114" stroke="url(#amber)" stroke-width="7" stroke-linecap="round"/>
  <path d="m1100 288 24 16-24 16" fill="none" stroke="#ffc96b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1128" y="186" width="194" height="234" rx="25" fill="#553e36" stroke="#f0aa65" stroke-width="2"/>
    <path d="M1198 230h54v44h-54z" fill="none" stroke="#ffdb9b" stroke-width="5"/>
    <path d="M1210 230v-12c0-18 30-18 30 0v12" fill="none" stroke="#ffdb9b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1225" cy="253" r="5" fill="#ffdb9b"/>
    <path d="M1225 258v10" stroke="#ffdb9b" stroke-width="4" stroke-linecap="round"/>
    <text x="1160" y="318" fill="#fff3dc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700">监管检查</text>
    <text x="1150" y="350" fill="#f7ca8e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">登记 · 调查 · 通知</text>
    <text x="1158" y="380" fill="#f7ca8e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">权限可能有空档</text>
  </g>

  <rect x="372" y="530" width="656" height="154" rx="24" fill="#0c2539" stroke="#315b72" stroke-width="2"/>
  <text x="414" y="573" fill="#ffc96b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700">新闻留下的边界</text>
  <text x="414" y="612" fill="#d6edf4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">“监管方表示担忧” ≠ “已经认定违法”</text>
  <text x="414" y="645" fill="#a8cbd8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">把临床医生的指控、公司回应和正式执法决定分开记录。</text>

  <text x="88" y="765" fill="#7fa7b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">VibePolaris 自制 SVG · CC BY 4.0</text>
  <text x="1092" y="765" fill="#7fa7b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">VBP-049 · 2021-03-05</text>
</svg>
