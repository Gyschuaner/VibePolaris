<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT 第三方连接器与权限</title>
  <desc id="desc">外部应用资料经过账户权限和管理员策略后进入聊天搜索</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">ChatGPT Connectors</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">外部搜索 · 账户权限 · 管理员控制</text>
  <rect x="92" y="278" width="220" height="170" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="334" fill="#f8fafc" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">连接应用</text>
  <text x="202" y="374" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">Box · Notion · Teams</text>
  <path d="M 336 364 H 412" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 392 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="436" y="278" width="220" height="170" rx="20" fill="#253b55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="546" y="334" fill="#d1fae5" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">聊天搜索</text>
  <text x="546" y="374" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">范围 · 版本 · 引用</text>
  <path d="M 680 364 H 756" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 736 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="780" y="278" width="220" height="170" rx="20" fill="#3a2c4d" stroke="#c4b5fd" stroke-width="2"/>
  <text x="890" y="334" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">治理与撤销</text>
  <text x="890" y="374" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">管理员 · 地区 · 审计</text>
  <rect x="280" y="500" width="640" height="74" rx="18" fill="#2d2534" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="546" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">能搜索到，不等于可以修改或分享</text>
</svg>
