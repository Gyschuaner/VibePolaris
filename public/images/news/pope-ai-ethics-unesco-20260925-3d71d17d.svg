<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">教宗在 UNESCO 讨论人工智能与人的尊严</title>
  <desc id="desc">人的尊严、AI 系统和伦理判断在 UNESCO 的公共对话中连接起来。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172238"/><stop offset="1" stop-color="#293023"/></linearGradient><linearGradient id="route" x1="0" x2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient></defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="205" cy="280" r="102" fill="#35253e" stroke="#fda4af" stroke-width="4"/><circle cx="205" cy="245" r="28" fill="#fda4af"/><path d="M150 350c9-57 101-57 110 0" fill="none" stroke="#fda4af" stroke-width="12" stroke-linecap="round"/>
  <text x="205" y="455" text-anchor="middle" fill="#fecdd3" font-size="25" font-family="sans-serif">人的尊严</text>
  <path d="M320 280H450" stroke="url(#route)" stroke-width="9" stroke-linecap="round"/><path d="m435 266 22 14-22 14" fill="none" stroke="#fda4af" stroke-width="5"/>
  <rect x="455" y="155" width="285" height="255" rx="26" fill="#17334a" stroke="#67e8f9" stroke-width="4"/>
  <text x="598" y="220" text-anchor="middle" fill="#ecfeff" font-size="30" font-family="sans-serif" font-weight="700">AI 系统</text>
  <circle cx="535" cy="300" r="16" fill="#67e8f9"/><circle cx="598" cy="270" r="16" fill="#67e8f9"/><circle cx="660" cy="315" r="16" fill="#67e8f9"/><path d="M550 295l32-18M613 275l32 34M645 315l-90-15" stroke="#67e8f9" stroke-width="4" opacity=".8"/>
  <path d="M745 280H875" stroke="url(#route)" stroke-width="9" stroke-linecap="round"/><path d="m860 266 22 14-22 14" fill="none" stroke="#a7f3d0" stroke-width="5"/>
  <circle cx="980" cy="280" r="102" fill="#19392f" stroke="#a7f3d0" stroke-width="4"/><path d="M930 315c34-42 67-42 100 0" fill="none" stroke="#a7f3d0" stroke-width="9" stroke-linecap="round"/><path d="M948 260h64M980 235v70" stroke="#a7f3d0" stroke-width="7" stroke-linecap="round"/>
  <text x="980" y="455" text-anchor="middle" fill="#a7f3d0" font-size="25" font-family="sans-serif">伦理判断</text>
  <text x="600" y="565" text-anchor="middle" fill="#e2e8f0" font-size="25" font-family="sans-serif">技术应服务于人，而不是把人压成效率指标</text>
  <text x="600" y="608" text-anchor="middle" fill="#b8bfd8" font-size="18" font-family="sans-serif">UNESCO 演讲把教育、真相与公共对话放在一起</text>
</svg>
