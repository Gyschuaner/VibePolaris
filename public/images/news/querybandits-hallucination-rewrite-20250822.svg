<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">QueryBandits</title>
  <desc id="desc">A contextual bandit chooses whether to rewrite a query before generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#152033"/><stop offset="1" stop-color="#443052"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fd8ff"/><stop offset="1" stop-color="#ffbf7c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070e" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#10182a" fill-opacity=".81" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#9eb5d1" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">QUERYBANDITS · 2025.08.22</text>
  <text x="124" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Rewrite before you answer</text>
  <text x="124" y="255" fill="#cedbea" font-family="Arial, sans-serif" font-size="25">Choose the strategy for this question.</text>
  <rect x="124" y="346" width="254" height="104" rx="19" fill="#24354b" stroke="#7fd8ff" stroke-width="2"/>
  <text x="158" y="386" fill="#7fd8ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">INPUT</text>
  <text x="158" y="425" fill="#ffffff" font-family="Arial, sans-serif" font-size="26">17 features</text>
  <path d="M398 398h96" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/><path d="M474 376l28 22-28 22" fill="none" stroke="#d5e4f3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="320" width="240" height="156" rx="19" fill="#3a2f4d" stroke="#ffbf7c" stroke-width="2"/>
  <text x="554" y="360" fill="#ffbf7c" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">BANDIT</text>
  <text x="554" y="402" fill="#ffffff" font-family="Arial, sans-serif" font-size="25">choose a rewrite</text>
  <text x="554" y="438" fill="#c6bfd4" font-family="Arial, sans-serif" font-size="18">or keep original</text>
  <path d="M780 398h88" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/><path d="M846 376l28 22-28 22" fill="none" stroke="#d5e4f3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="898" y="346" width="168" height="104" rx="19" fill="#25364b" stroke="#8dd4ba" stroke-width="2"/>
  <text x="930" y="386" fill="#8dd4ba" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">OUTPUT</text>
  <text x="930" y="425" fill="#ffffff" font-family="Arial, sans-serif" font-size="25">verify</text>
  <text x="124" y="520" fill="#9eb5d1" font-family="Arial, sans-serif" font-size="18">No single rewrite wins every question.</text>
</svg>
