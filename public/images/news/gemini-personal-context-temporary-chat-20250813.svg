<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Gemini 个人上下文与 Temporary Chat</title>
  <desc id="desc">Gemini 的个人上下文参考过去对话，Temporary Chat 走不进入历史的短期路径，用户分别控制两条数据流</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#1b2638" stroke="#3b4a62" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Gemini</text>
  <text x="92" y="160" fill="#93c5fd" font-size="18" font-family="sans-serif">Personal context ↔ Temporary Chat</text>
  <rect x="92" y="256" width="430" height="220" rx="22" fill="#263b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="307" y="322" fill="#dbeafe" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">个人上下文</text>
  <text x="307" y="364" fill="#bfdbfe" font-size="17" text-anchor="middle" font-family="sans-serif">过去对话 · 偏好 · 连续回答</text>
  <text x="307" y="410" fill="#93c5fd" font-size="16" text-anchor="middle" font-family="sans-serif">可开启 / 关闭 / 管理</text>
  <rect x="678" y="256" width="430" height="220" rx="22" fill="#3b2f4f" stroke="#c4b5fd" stroke-width="2"/>
  <text x="893" y="322" fill="#ede9fe" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">Temporary Chat</text>
  <text x="893" y="364" fill="#ddd6fe" font-size="17" text-anchor="middle" font-family="sans-serif">不进历史 · 不个性化</text>
  <text x="893" y="410" fill="#c4b5fd" font-size="16" text-anchor="middle" font-family="sans-serif">最多保留 72 小时</text>
  <path d="M 522 366 H 678" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="600" y="340" fill="#fef3c7" font-size="16" text-anchor="middle" font-family="sans-serif">用户选择</text>
  <rect x="252" y="536" width="696" height="62" rx="18" fill="#252d3b" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="575" fill="#e2e8f0" font-size="18" text-anchor="middle" font-family="sans-serif">不进历史 ≠ 零留存；跨对话 ≠ 永久记忆</text>
</svg>
