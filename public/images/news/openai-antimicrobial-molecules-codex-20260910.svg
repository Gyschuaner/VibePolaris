<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>AI-assisted antimicrobial molecule search</title><desc>DNA-like strands feed a model that prioritizes molecular candidates before laboratory validation.</desc><style>.dna{animation:dna 5s ease-in-out infinite}.spark{animation:spark 2s ease-in-out infinite}@keyframes dna{50%{transform:translateX(25px)}}@keyframes spark{50%{opacity:.25;transform:scale(1.4)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#092d32"/><g class="dna" fill="none" stroke="#6de5c1" stroke-width="8"><path d="M150 160 C320 260 320 370 150 470"/><path d="M290 160 C120 260 120 370 290 470"/><path d="M170 200H270M145 260H295M145 330H295M170 400H270" stroke="#f3d16a" stroke-width="6"/></g><path d="M360 315H550" stroke="#f3d16a" stroke-width="7" stroke-dasharray="18 16"/><rect x="550" y="190" width="250" height="250" rx="125" fill="#16625e" stroke="#6de5c1" stroke-width="4"/><text x="675" y="285" fill="#effff9" font-size="32" text-anchor="middle">AI 初筛</text><text x="675" y="325" fill="#b7f6df" font-size="20" text-anchor="middle">patterns → candidates</text><path d="M800 315H930" stroke="#f3d16a" stroke-width="7" stroke-dasharray="18 16"/><g class="spark" fill="#ff9f6e"><circle cx="970" cy="245" r="22"/><circle cx="1030" cy="315" r="16"/><circle cx="970" cy="385" r="22"/></g><text x="100" y="88" fill="#6de5c1" font-size="24">OPENAI · APPLIED AI · 2026-09-10</text><text x="100" y="565" fill="#b3dad6" font-size="22">模型缩小搜索空间，实验仍决定候选物能否成为药物</text></svg>