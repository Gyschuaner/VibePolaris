<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AraHalluEval：阿拉伯语 LLM 幻觉细粒度评测</title>
<desc id="desc">在生成式问答和摘要上，按模型组与 12 个指标区分事实性幻觉和忠实性错误。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#f5f1ff"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#9b634a"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#47312a" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#4e3028" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">AraHalluEval：别把不同幻觉压成一个总分</text>
<text x="72" y="118" fill="#88736c" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">阿拉伯语问答 + 摘要 · 12 个模型 · 12 个细粒度指标</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="250" height="292" rx="22" fill="#fff" stroke="#ecd0b2" stroke-width="2"/>
 <text x="108" y="238" fill="#9b634a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">任务</text>
 <rect x="108" y="272" width="174" height="54" rx="12" fill="#fff0d9"/><text x="195" y="307" text-anchor="middle" fill="#805238" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">生成式问答</text>
 <rect x="108" y="342" width="174" height="54" rx="12" fill="#fff0d9"/><text x="195" y="377" text-anchor="middle" fill="#805238" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">摘要</text>
 <text x="108" y="443" fill="#88736c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">本地语言与领域样例</text>
</g>
<path d="M338 334 H400" stroke="#9b634a" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="420" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#c8b9eb" stroke-width="2"/>
 <text x="458" y="220" fill="#6a519f" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">模型组 × 细指标</text>
 <rect x="458" y="254" width="120" height="52" rx="12" fill="#eee7ff"/><text x="518" y="287" text-anchor="middle" fill="#55418a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">阿拉伯语 ×4</text>
 <rect x="594" y="254" width="120" height="52" rx="12" fill="#eee7ff"/><text x="654" y="287" text-anchor="middle" fill="#55418a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">多语 ×4</text>
 <rect x="458" y="326" width="120" height="52" rx="12" fill="#eee7ff"/><text x="518" y="359" text-anchor="middle" fill="#55418a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">推理 ×4</text>
 <text x="594" y="359" fill="#766b91" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">12 个指标</text>
 <text x="458" y="431" fill="#766b91" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">事实性 ≠ 忠实性</text>
 <text x="458" y="462" fill="#766b91" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">错误类型单独回归</text>
</g>
<path d="M788 334 H850" stroke="#9b634a" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#b7d9d0" stroke-width="2"/>
 <text x="906" y="220" fill="#30776d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">可复核结果</text>
 <rect x="906" y="255" width="188" height="56" rx="12" fill="#d9f1ec"/><text x="1000" y="290" text-anchor="middle" fill="#246259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">事实幻觉</text>
 <rect x="906" y="333" width="188" height="56" rx="12" fill="#fff0d9"/><text x="1000" y="368" text-anchor="middle" fill="#805238" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">忠实性错误</text>
 <text x="1000" y="438" text-anchor="middle" fill="#30776d" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">回归集 · 母语者复核</text>
 <text x="1000" y="468" text-anchor="middle" fill="#88736c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Allam 结果需限定范围</text>
</g>
<text x="70" y="578" fill="#9b634a" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">事实性幻觉在论文任务中更常见</text>
<text x="70" y="615" fill="#88736c" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">评测越细，越能知道该补数据、改提示还是交给人工。</text>
</svg>