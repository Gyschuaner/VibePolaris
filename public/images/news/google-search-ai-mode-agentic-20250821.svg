<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google Search AI Mode agentic reservations</title>
  <desc id="desc">AI Mode searches live reservation sources and leaves the final booking confirmation to the user.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17213b"/><stop offset="1" stop-color="#3d2e54"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#93c6ff"/><stop offset="1" stop-color="#84f0db"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdc87"/><stop offset="1" stop-color="#ff9fc5"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070a15" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="86" r="210" fill="#93c6ff" opacity=".12"/>
  <circle cx="1030" cy="574" r="255" fill="#ff9fc5" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="720" height="140" rx="24" fill="#252d4c" stroke="#93c6ff" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c8e4ff">GOOGLE SEARCH · AI MODE</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fafaff">SEARCH → RESERVE → CONFIRM</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#eae7ff">Agent 找到时段，把最后一步留给你</text>
  <g transform="translate(816 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="402" rx="30" fill="#111a33" stroke="#c1ccff" stroke-width="3"/>
    <rect x="30" y="35" width="192" height="54" rx="17" fill="#2c3e62"/>
    <circle cx="59" cy="62" r="13" fill="url(#blue)"/><rect x="84" y="54" width="105" height="15" rx="7" fill="#8b9bc8"/>
    <path d="M126 108v40M126 148l-50 40M126 148l50 40" stroke="#7e93cb" stroke-width="7" stroke-linecap="round"/>
    <rect x="32" y="201" width="82" height="65" rx="16" fill="url(#blue)"/><rect x="140" y="201" width="82" height="65" rx="16" fill="url(#yellow)"/>
    <text x="73" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1e2c53">LIVE</text>
    <text x="181" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#42263f">OPTIONS</text>
    <rect x="52" y="315" width="148" height="45" rx="17" fill="#315b66" stroke="#84f0db" stroke-width="2"/>
    <text x="126" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eafffb">USER CONFIRMS</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="710" height="140" rx="20" fill="#252d4c" stroke="#546b9d" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c8e4ff">PROJECT MARINER · MAPS · PARTNERS</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">美国 AI Ultra / Labs 灰度 · 英语扩展 180+ 地区</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c5cae7">官方产品范围，不是全面自动下单</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c5cbe7">GOOGLE SEARCH BLOG · 21 AUG 2025</text>
</svg>
