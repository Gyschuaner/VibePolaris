<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenCUA 电脑操作智能体链</title>
  <desc id="desc">屏幕示范经过状态动作对齐和模型推理，生成可执行动作后在沙盒中继续读取屏幕</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">OpenCUA</text>
  <text x="92" y="160" fill="#86efac" font-size="18" font-family="sans-serif">截图 · 状态动作 · 推理 · 执行 · 接管</text>
  <rect x="88" y="270" width="200" height="174" rx="20" fill="#263b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="188" y="326" fill="#dbeafe" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">示范</text>
  <text x="188" y="368" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">屏幕 · 键鼠 · 树</text>
  <path d="M 312 358 H 370" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 350 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="394" y="270" width="200" height="174" rx="20" fill="#3a2e4e" stroke="#c4b5fd" stroke-width="2"/>
  <text x="494" y="326" fill="#ede9fe" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">对齐</text>
  <text x="494" y="368" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">状态 · 动作 · 反思</text>
  <path d="M 618 358 H 676" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 656 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="700" y="270" width="200" height="174" rx="20" fill="#203d3e" stroke="#5eead4" stroke-width="2"/>
  <text x="800" y="326" fill="#ccfbf1" font-size="23" text-anchor="middle" font-family="sans-serif" font-weight="700">模型动作</text>
  <text x="800" y="368" fill="#99f6e4" font-size="16" text-anchor="middle" font-family="sans-serif">点击 · 输入 · 滚动</text>
  <path d="M 924 358 H 982" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 962 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="1006" y="270" width="104" height="174" rx="20" fill="#3b2d25" stroke="#fbbf24" stroke-width="2"/>
  <text x="1058" y="326" fill="#fef3c7" font-size="20" text-anchor="middle" font-family="sans-serif" font-weight="700">沙盒</text>
  <text x="1058" y="366" fill="#fde68a" font-size="15" text-anchor="middle" font-family="sans-serif">确认</text>
  <text x="1058" y="392" fill="#fde68a" font-size="15" text-anchor="middle" font-family="sans-serif">接管</text>
  <path d="M 1058 466 C 1058 542, 188 542, 188 466" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M 200 478 l -14 -14 -13 14" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="600" y="586" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">可执行动作必须受权限、日志和人工确认约束</text>
</svg>
