<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT 健康使用方向</title>
  <desc id="desc">任务完成后出现休息提示，个人难题进入权衡而不是代做决定的路径示意。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10273f"/>
      <stop offset="1" stop-color="#244b5b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f1df"/>
      <stop offset="1" stop-color="#d9e8db"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#071522" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="150" fill="#d7b56d" opacity=".16"/>
  <circle cx="1120" cy="510" r="210" fill="#83b8a3" opacity=".14"/>
  <path d="M70 520 C220 450 270 300 420 270 C560 242 610 330 760 300 C890 272 930 180 1110 170" fill="none" stroke="#d7b56d" stroke-width="4" stroke-dasharray="10 16" opacity=".75"/>
  <g filter="url(#shadow)">
    <rect x="120" y="120" width="330" height="350" rx="28" fill="url(#card)"/>
    <rect x="495" y="120" width="330" height="350" rx="28" fill="#f5f1df"/>
    <rect x="870" y="120" width="210" height="350" rx="28" fill="#d7b56d"/>
  </g>
  <g fill="#10273f" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="158" y="175" font-size="26" font-weight="700">完成目标</text>
    <text x="158" y="220" font-size="18">回答、学习、解决问题</text>
    <path d="M165 290 h190" stroke="#4b7770" stroke-width="12" stroke-linecap="round"/>
    <circle cx="355" cy="290" r="19" fill="#4b7770"/>
    <text x="158" y="370" font-size="18">产品成功不只看停留时间</text>
    <text x="158" y="407" font-size="16" fill="#4e625e">OpenAI：帮助用户回到生活</text>

    <text x="533" y="175" font-size="26" font-weight="700">长会话</text>
    <text x="533" y="220" font-size="18">温和提醒休息</text>
    <rect x="548" y="270" width="222" height="116" rx="18" fill="#d9e8db"/>
    <circle cx="585" cy="326" r="24" fill="#4b7770"/>
    <path d="M585 311 v18 l12 8" fill="none" stroke="#f5f1df" stroke-width="5" stroke-linecap="round"/>
    <text x="625" y="320" font-size="17">要不要</text>
    <text x="625" y="349" font-size="17">先休息一下？</text>
    <text x="533" y="426" font-size="16" fill="#4e625e">当天开始出现，阈值仍会调整</text>

    <text x="910" y="180" font-size="24" font-weight="700">个人难题</text>
    <path d="M930 245 h105" stroke="#10273f" stroke-width="8" stroke-linecap="round"/>
    <path d="M930 278 h80" stroke="#10273f" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    <path d="M930 311 h120" stroke="#10273f" stroke-width="8" stroke-linecap="round" opacity=".45"/>
    <text x="910" y="382" font-size="17">问问题、列利弊</text>
    <text x="910" y="416" font-size="17">不直接替你决定</text>
  </g>
  <g fill="#f5f1df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="120" y="565" font-size="22" letter-spacing="1">OpenAI · 2025.08.04</text>
    <text x="1080" y="565" font-size="16" text-anchor="end" opacity=".78">原则 → 行为 → 评估</text>
  </g>
</svg>
