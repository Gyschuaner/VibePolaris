<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI Dots 工作流示意</title>
  <desc id="desc">VibePolaris 自制机制示意：用户给出目标，Dots 在云端计算机中处理工作，连接已授权应用，并按规则决定独立执行、请求审批或阻止。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151b31"/><stop offset="1" stop-color="#194d4d"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#dcf35d"/><stop offset="1" stop-color="#72e4ca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061521" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#baf6cb"/></marker>
  </defs>
  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">Dots：目标进入一条可检查的工作流</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2026-09-29 · OpenAI DevDay 产品新闻的机制解释</text>
  <g filter="url(#shadow)"><rect x="70" y="144" width="1060" height="280" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/><rect x="70" y="448" width="1060" height="100" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="104" y="214" width="210" height="116" rx="18" fill="#3d4d6a" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="372" y="214" width="250" height="116" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="680" y="214" width="210" height="116" rx="18" fill="#4b3b63" stroke="#fda4af" stroke-width="2"/>
    <rect x="948" y="214" width="170" height="116" rx="18" fill="#3f4a38" stroke="#dcf35d" stroke-width="2"/>
    <text x="209" y="248" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">目标</text>
    <text x="209" y="276" fill="#ede2ff" font-size="15" text-anchor="middle">用户给出边界</text><text x="209" y="301" fill="#ede2ff" font-size="15" text-anchor="middle">拆成多步任务</text>
    <text x="497" y="248" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">云端工作区</text>
    <text x="497" y="276" fill="#d6fff7" font-size="15" text-anchor="middle">自己的电脑与浏览器</text><text x="497" y="301" fill="#d6fff7" font-size="15" text-anchor="middle">保存中间结果</text>
    <text x="785" y="248" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">已授权应用</text>
    <text x="785" y="276" fill="#ffe1e5" font-size="15" text-anchor="middle">插件读取或准备动作</text><text x="785" y="301" fill="#ffe1e5" font-size="15" text-anchor="middle">范围由权限决定</text>
    <text x="1033" y="248" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">规则处理</text>
    <text x="1033" y="276" fill="#efffc7" font-size="14" text-anchor="middle">执行 / 审批</text><text x="1033" y="301" fill="#efffc7" font-size="14" text-anchor="middle">/ 阻止</text>
    <path d="M314 272H360" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M622 272H668" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M890 272H936" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M1033 338 C1033 390 209 390 209 338" stroke="#baf6cb" stroke-width="3" stroke-dasharray="9 10" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="410" fill="#baf6cb" font-size="16" text-anchor="middle">持续工作不等于无条件自动执行：人可以查看进展并改规则</text>
    <text x="106" y="486" fill="#f8fafc" font-size="23" font-weight="700">Dots 的能力来自环境、工具和规则的组合</text>
    <text x="106" y="518" fill="#a7f3d0" font-size="16">OpenAI：只读研究、应用权限和有后果的动作分开；敏感任务仍由用户完成。</text>
  </g>
  <rect x="70" y="576" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="597" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释 Dots 的目标、云端、应用与规则边界。</text>
</svg>
