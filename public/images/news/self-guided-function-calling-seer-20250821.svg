<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SEER self-guided function calling</title>
  <desc id="desc">An agent recalls successful tool trajectories step by step from a growing experience pool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17203a"/><stop offset="1" stop-color="#3b2f54"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9df3d5"/><stop offset="1" stop-color="#7eb7ff"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd181"/><stop offset="1" stop-color="#ff9fc6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070a15" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1045" cy="88" r="212" fill="#9df3d5" opacity=".11"/>
  <circle cx="1030" cy="570" r="258" fill="#ff9fc6" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="700" height="140" rx="24" fill="#252b4b" stroke="#9df3d5" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c5ffe7">SEER · FUNCTION CALLING</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fafaff">RECALL STEP BY STEP</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e9e7ff">让一次成功调用，成为下一次的参考</text>
  <g transform="translate(816 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="404" rx="30" fill="#111a33" stroke="#c2ccff" stroke-width="3"/>
    <rect x="31" y="35" width="190" height="54" rx="17" fill="#2c3e62"/>
    <text x="126" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c5ffe7">NEW TASK</text>
    <path d="M126 109v39M126 148l-53 42M126 148l53 42" stroke="#7c94cb" stroke-width="7" stroke-linecap="round"/>
    <rect x="31" y="212" width="86" height="64" rx="16" fill="url(#mint)"/><rect x="135" y="212" width="86" height="64" rx="16" fill="url(#peach)"/>
    <text x="74" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2b50">STEP 1</text>
    <text x="178" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#402744">STEP 2</text>
    <path d="M74 292v39M178 292v39" stroke="#7c94cb" stroke-width="7" stroke-linecap="round"/>
    <text x="126" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e9efff">EXPERIENCE POOL</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="700" height="140" rx="20" fill="#252b4b" stroke="#536b9b" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c5ffe7">TOOLQA · τ-BENCH</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">持续更新 · 成功轨迹 · 逐步检索</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c6cbe8">基准提升仍需清理经验和权限</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c6cbe7">ARXIV · FIRST SUBMITTED 21 AUG 2025</text>
</svg>
