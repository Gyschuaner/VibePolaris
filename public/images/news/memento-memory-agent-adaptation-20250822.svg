<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Memento memory-based adaptation</title>
  <desc id="desc">An agent records an experience, rewrites a case, selects it and acts again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14253a"/><stop offset="1" stop-color="#3c3157"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7be4d1"/><stop offset="1" stop-color="#f0b978"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#050812" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101a2b" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#9fb9d1" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">MEMENTO · 2025.08.22</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Learn in memory</text>
  <text x="124" y="255" fill="#cddbea" font-family="Arial, sans-serif" font-size="25">Keep the model steady. Update the cases.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="212" cy="390" r="65" fill="#233b4d" stroke="#7be4d1" stroke-width="3"/><text x="212" y="382" fill="#7be4d1" font-size="18">RECORD</text><text x="212" y="415" fill="#ffffff" font-size="22">experience</text>
    <circle cx="450" cy="390" r="65" fill="#2e3454" stroke="#9fb1ff" stroke-width="3"/><text x="450" y="382" fill="#9fb1ff" font-size="18">REWRITE</text><text x="450" y="415" fill="#ffffff" font-size="22">case</text>
    <circle cx="688" cy="390" r="65" fill="#45354e" stroke="#f0b978" stroke-width="3"/><text x="688" y="382" fill="#f0b978" font-size="18">SELECT</text><text x="688" y="415" fill="#ffffff" font-size="22">memory</text>
    <circle cx="926" cy="390" r="65" fill="#2e3454" stroke="#9fb1ff" stroke-width="3"/><text x="926" y="382" fill="#9fb1ff" font-size="18">ACT</text><text x="926" y="415" fill="#ffffff" font-size="22">again</text>
  </g>
  <g stroke="url(#path)" stroke-width="5" stroke-linecap="round" fill="none"><path d="M283 390h92"/><path d="M521 390h92"/><path d="M759 390h92"/></g>
  <text x="124" y="516" fill="#9fb9d1" font-family="Arial, sans-serif" font-size="18">No gradient update does not mean no memory governance.</text>
</svg>
