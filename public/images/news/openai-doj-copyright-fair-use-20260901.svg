<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">美国司法部在 AI 训练版权案中的立场</title><desc id="desc">从政府提交意见到法院裁决之间的状态链，强调意见不是判决</desc>
<rect width="1200" height="720" fill="#111827"/><rect x="48" y="48" width="1104" height="624" rx="30" fill="#1f2937" stroke="#475569" stroke-width="2"/>
<text x="92" y="116" fill="#f8fafc" font-size="30" font-family="sans-serif" font-weight="700">AI 训练与版权：意见不是判决</text>
<text x="92" y="154" fill="#cbd5e1" font-size="17" font-family="sans-serif">2026-09-01 · DOJ 在 OpenAI/纽约时报诉讼中提交 Statement of Interest</text>
<g transform="translate(92 250)"><rect width="230" height="174" rx="22" fill="#312e81" stroke="#818cf8" stroke-width="3"/><text x="115" y="70" fill="#e0e7ff" text-anchor="middle" font-size="23" font-family="sans-serif" font-weight="700">政府意见</text><text x="115" y="108" fill="#f8fafc" text-anchor="middle" font-size="16" font-family="sans-serif">主张训练可属合理使用</text><text x="115" y="140" fill="#c7d2fe" text-anchor="middle" font-size="14" font-family="sans-serif">已提交 · 非裁决</text></g>
<path d="M342 337 H407" stroke="#94a3b8" stroke-width="4"/><path d="M391 319 l20 18 -20 18" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(438 250)"><rect width="230" height="174" rx="22" fill="#3f2d1f" stroke="#f59e0b" stroke-width="3"/><text x="115" y="70" fill="#fef3c7" text-anchor="middle" font-size="23" font-family="sans-serif" font-weight="700">双方举证</text><text x="115" y="108" fill="#f8fafc" text-anchor="middle" font-size="16" font-family="sans-serif">出版社与公司继续辩论</text><text x="115" y="140" fill="#fde68a" text-anchor="middle" font-size="14" font-family="sans-serif">案件仍在审理</text></g>
<path d="M688 337 H753" stroke="#94a3b8" stroke-width="4"/><path d="M737 319 l20 18 -20 18" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(784 250)"><rect width="230" height="174" rx="22" fill="#172f2c" stroke="#2dd4bf" stroke-width="3"/><text x="115" y="70" fill="#ccfbf1" text-anchor="middle" font-size="23" font-family="sans-serif" font-weight="700">法院裁决</text><text x="115" y="108" fill="#f8fafc" text-anchor="middle" font-size="16" font-family="sans-serif">决定具体案件的法律结论</text><text x="115" y="140" fill="#99f6e4" text-anchor="middle" font-size="14" font-family="sans-serif">截至当日未发生</text></g>
<text x="600" y="526" fill="#f8fafc" text-anchor="middle" font-size="23" font-family="sans-serif">政府支持会改变诉讼背景，但不会自动改变版权法</text><text x="600" y="580" fill="#94a3b8" text-anchor="middle" font-size="15" font-family="sans-serif">VibePolaris 自制机制图 · CC BY 4.0 · 依据 CourtListener 文件与 AP/TechCrunch 报道</text></svg>
