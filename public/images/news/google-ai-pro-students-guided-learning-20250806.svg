<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Google AI Pro 学生学习流程</title>
  <desc id="desc">学生从学习目标出发，在 Guided Learning 中经过提问、分步练习和来源复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3a315f"/>
      <stop offset="1" stop-color="#6e8798"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f1e3"/>
      <stop offset="1" stop-color="#d8e7e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#211c3f" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="92" r="190" fill="#f0ca75" opacity=".17"/>
  <circle cx="108" cy="535" r="230" fill="#9ac0bb" opacity=".17"/>
  <path d="M24 458 C135 365 245 515 355 401 S565 323 680 430 S870 510 1007 380 S1100 347 1190 420" fill="none" stroke="#f0ca75" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f5f1e3"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c877"/>
  </g>
  <g fill="#3a315f" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">学习目标</text>
    <rect x="115" y="225" width="220" height="48" rx="16" fill="#b9d7d6"/>
    <text x="140" y="256" font-size="17">想弄懂一个概念</text>
    <rect x="115" y="289" width="185" height="48" rx="16" fill="#cfc8e5"/>
    <text x="140" y="320" font-size="17">准备一次练习</text>
    <path d="M115 377 h205" stroke="#6e8798" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="115" y="407" font-size="16">Gemini 2.5 Pro · 12 个月</text>

    <text x="487" y="178" font-size="25" font-weight="800">Guided Learning</text>
    <circle cx="515" cy="248" r="14" fill="#3a315f"/>
    <path d="M545 248 h160" stroke="#6e8798" stroke-width="11" stroke-linecap="round"/>
    <circle cx="515" cy="302" r="14" fill="#3a315f"/>
    <path d="M545 302 h125" stroke="#6e8798" stroke-width="11" stroke-linecap="round"/>
    <circle cx="515" cy="356" r="14" fill="#3a315f"/>
    <path d="M545 356 h178" stroke="#6e8798" stroke-width="11" stroke-linecap="round"/>
    <text x="487" y="407" font-size="17">提问 · 分步 · 练习</text>

    <text x="859" y="178" font-size="25" font-weight="800">来源复核</text>
    <rect x="865" y="225" width="90" height="110" rx="16" fill="#6e8798"/>
    <path d="M884 258 h52 M884 282 h40 M884 306 h50" stroke="#f5f1e3" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1025" cy="280" r="42" fill="#3a315f"/>
    <path d="M1003 281 l13 13 l29 -35" fill="none" stroke="#f5f1e3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M865 379 h205" stroke="#3a315f" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">原文 · 课程规则 · 教师</text>
  </g>
  <g fill="#f5f1e3" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">GOOGLE AI PRO · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">陪着学，也要自己核对</text>
  </g>
</svg>
