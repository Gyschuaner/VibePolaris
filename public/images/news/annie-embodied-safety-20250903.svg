<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">ANNIE：具身 Agent 的安全边界</title>
<desc id="desc">从视觉输入到机器人动作，经过安全分类、约束和独立控制器，异常时触发停机。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f3fbf8"/><stop offset="1" stop-color="#fff5ed"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2d7c71"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173d3c" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#153e3d" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">ANNIE：从看见到动作，安全边界要独立存在</text>
<text x="72" y="118" fill="#587a76" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">9 个场景 · 2,400 段视频—动作序列 · 高风险时由安全控制器接管</text>
<g filter="url(#shadow)">
 <rect x="70" y="190" width="230" height="276" rx="22" fill="#fff" stroke="#bfe1d9" stroke-width="2"/>
 <text x="106" y="240" fill="#2d7c71" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">感知输入</text>
 <rect x="105" y="275" width="160" height="56" rx="12" fill="#dcf4ed"/><text x="185" y="311" text-anchor="middle" fill="#1f5e57" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">视频 / 传感器</text>
 <text x="105" y="377" fill="#587a76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">完整性检查</text>
 <text x="105" y="409" fill="#587a76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">时间戳与一致性</text>
 </g>
 <path d="M318 328 H388" stroke="#2d7c71" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="410" y="170" width="330" height="316" rx="22" fill="#fff" stroke="#efc778" stroke-width="2"/>
 <text x="447" y="220" fill="#a16d14" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">安全分类与约束</text>
 <rect x="447" y="252" width="116" height="52" rx="12" fill="#fff0c7"/><text x="505" y="285" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">critical</text>
 <rect x="575" y="252" width="116" height="52" rx="12" fill="#ffe1c6"/><text x="633" y="285" text-anchor="middle" fill="#8c4b12" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">dangerous</text>
 <rect x="447" y="325" width="116" height="52" rx="12" fill="#e9e1fa"/><text x="505" y="358" text-anchor="middle" fill="#5a438e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">risky</text>
 <text x="575" y="358" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">距离 / 速度 / 碰撞边界</text>
 <text x="447" y="427" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">模型输出只是候选动作</text>
 <text x="447" y="457" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不是最终安全裁决</text>
</g>
<path d="M758 328 H828" stroke="#2d7c71" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="850" y="170" width="280" height="316" rx="22" fill="#fff" stroke="#e6b2a7" stroke-width="2"/>
 <text x="887" y="220" fill="#a64c3f" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">执行与停机</text>
 <rect x="887" y="255" width="206" height="60" rx="12" fill="#fde3de"/><text x="990" y="293" text-anchor="middle" fill="#8b4037" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">授权 / 人工确认</text>
 <rect x="887" y="337" width="206" height="60" rx="12" fill="#fde3de"/><text x="990" y="375" text-anchor="middle" fill="#8b4037" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">限速 / 急停 / 断电</text>
 <text x="990" y="437" text-anchor="middle" fill="#a64c3f" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">异常时覆盖模型动作</text>
</g>
<text x="70" y="578" fill="#2d7c71" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">ANNIEBench：评测安全，不提供攻击复现路径</text>
<text x="70" y="615" fill="#587a76" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">物理系统遇到不确定性时，能够安全停下比完成长时任务更重要。</text>
</svg>