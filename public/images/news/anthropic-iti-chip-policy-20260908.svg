<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Anthropic leaves ITI over chip legislation</title><desc>Three proposed chip bills pull a policy coalition in different directions while Congress waits to act.</desc><style>.chip{animation:chip 3s ease-in-out infinite}.line{animation:line 2.8s linear infinite}@keyframes chip{50%{transform:translateY(-8px)}}@keyframes line{to{stroke-dashoffset:-80}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#241d36"/><rect x="100" y="190" width="260" height="220" rx="24" fill="#4a3b78" stroke="#c6adff" stroke-width="5"/><text x="230" y="255" fill="#f5efff" font-size="28" text-anchor="middle">Anthropic</text><text x="230" y="300" fill="#ddd0ff" font-size="20" text-anchor="middle">支持三项法案</text><path d="M360 300H510" stroke="#f1cb70" stroke-width="7" stroke-dasharray="16 14" class="line"/><g class="chip"><rect x="510" y="215" width="190" height="170" rx="18" fill="#6c9ac2"/><rect x="555" y="260" width="100" height="80" rx="12" fill="#1e3c59"/><text x="605" y="305" fill="#f2cb70" font-size="22" text-anchor="middle">CHIP</text></g><path d="M700 300H820" stroke="#f1cb70" stroke-width="7" stroke-dasharray="16 14" class="line"/><rect x="820" y="170" width="280" height="260" rx="24" fill="#46324f" stroke="#ffad9b" stroke-width="5"/><text x="960" y="245" fill="#fff0ec" font-size="28" text-anchor="middle">ITI</text><text x="960" y="292" fill="#ffd0c8" font-size="19" text-anchor="middle">反对推进</text><text x="960" y="338" fill="#ffd0c8" font-size="18" text-anchor="middle">NDAA 待处理</text><text x="100" y="88" fill="#c6adff" font-size="24">AXIOS · CHIP POLICY · 2026-09-08</text><text x="100" y="565" fill="#cabfd7" font-size="20">行业协会立场冲突是政治新闻，不是已经生效的出口管制</text></svg>