<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Apple Reference Image provenance feature</title><desc>A camera capture flows through a signed sensor record and private cloud computation into an image with a provenance seal.</desc><style>.flow{animation:flow 3s linear infinite}.seal{animation:seal 3.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes seal{50%{transform:scale(1.12);opacity:.7}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#171d2a"/><rect x="100" y="210" width="220" height="160" rx="25" fill="#294b71" stroke="#a7d7ff" stroke-width="5"/><circle cx="210" cy="290" r="48" fill="#16283f" stroke="#d1efff" stroke-width="7"/><circle cx="210" cy="290" r="18" fill="#d1efff"/><text x="210" y="420" fill="#c6e7ff" font-size="20" text-anchor="middle">sensor capture</text><path d="M320 290H480" stroke="#8dd2ff" stroke-width="8" stroke-dasharray="18 16" class="flow"/><rect x="480" y="195" width="250" height="190" rx="25" fill="#2e604f" stroke="#9ee2bc" stroke-width="5"/><text x="605" y="270" fill="#ecfff4" font-size="26" text-anchor="middle">Private Cloud</text><text x="605" y="310" fill="#c1f2d5" font-size="20" text-anchor="middle">signed record</text><path d="M730 290H875" stroke="#8dd2ff" stroke-width="8" stroke-dasharray="18 16" class="flow"/><rect x="875" y="210" width="220" height="160" rx="22" fill="#f1ca70"/><text x="985" y="274" fill="#493714" font-size="26" text-anchor="middle">Photo</text><text x="985" y="312" fill="#6d531d" font-size="19" text-anchor="middle">provenance seal</text><circle cx="985" cy="420" r="26" fill="#8ee6b1" class="seal"/><path d="M973 420l9 9 18-22" fill="none" stroke="#143b2c" stroke-width="6"/><text x="100" y="88" fill="#a7d7ff" font-size="24">APPLE REFERENCE IMAGE · 2026-09-09</text><text x="100" y="565" fill="#b9c8db" font-size="21">来源证明是数据链路设计，不是对每张图真实性的自动裁定</text></svg>