<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Google Earth · Nano Banana · 回滚</title>
<desc id="desc">Google Earth 在真实地理背景上提供生成式图像功能后，因疑似违反政策的截图于次日回滚；水印和更强护栏共同决定来源可信度。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="45" y="175" width="190" height="150" rx="18" fill="#123b5d" stroke="#93c5fd" stroke-width="3"/>
<text x="140" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">真实地点</text>
<text x="140" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">卫星 / 航拍 / 3D</text>
<path d="M235 250H265" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="270" y="175" width="190" height="150" rx="18" fill="#5b2d8b" stroke="#93c5fd" stroke-width="3"/>
<text x="365" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">Nano Banana</text>
<text x="365" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">按提示生成</text>
<path d="M460 250H490" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="495" y="175" width="190" height="150" rx="18" fill="#8f3d32" stroke="#93c5fd" stroke-width="3"/>
<text x="590" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">截图传播</text>
<text x="590" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">看起来像事实</text>
<path d="M685 250H715" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="720" y="175" width="190" height="150" rx="18" fill="#174d4d" stroke="#93c5fd" stroke-width="3"/>
<text x="815" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">回滚</text>
<text x="815" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">加强护栏</text>
<text x="480" y="445" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">2026-07-31 · Google Earth · Nano Banana · 回滚</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
