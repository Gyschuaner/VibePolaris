<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NSF AI 科研基础设施</title>
  <desc id="desc">可编程云实验室和真实环境测试床连接设备、数据、AI 和研究人员。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f3a54"/>
      <stop offset="1" stop-color="#66816f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f0df"/>
      <stop offset="1" stop-color="#d8e5d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#12283b" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#e9c678" opacity=".16"/>
  <circle cx="100" cy="540" r="230" fill="#90b7a2" opacity=".16"/>
  <path d="M24 458 C125 367 238 515 350 400 S560 322 675 430 S870 512 1006 382 S1100 347 1190 420" fill="none" stroke="#e9c678" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f4f0df"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c676"/>
  </g>
  <g fill="#1f3a54" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">云实验室</text>
    <rect x="115" y="228" width="220" height="60" rx="17" fill="#bdd7d0"/>
    <path d="M145 263 q22 -28 44 0 q22 -34 45 0 q22 -27 45 0" fill="none" stroke="#66816f" stroke-width="7" stroke-linecap="round"/>
    <path d="M115 338 h205" stroke="#66816f" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="115" y="376" font-size="17">远程 · 可编程 · 可复现</text>
    <text x="115" y="407" font-size="16">生物 · 材料</text>

    <text x="487" y="178" font-size="25" font-weight="800">AI 实验循环</text>
    <circle cx="600" cy="280" r="66" fill="#66816f"/>
    <path d="M600 229 v102 M549 280 h102" stroke="#f4f0df" stroke-width="9" stroke-linecap="round"/>
    <path d="M500 384 h195" stroke="#66816f" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <text x="487" y="407" font-size="17">设计 · 控制 · 分析</text>

    <text x="859" y="178" font-size="25" font-weight="800">现场测试床</text>
    <rect x="865" y="235" width="190" height="74" rx="18" fill="#66816f"/>
    <circle cx="893" cy="271" r="14" fill="#f4f0df"/>
    <circle cx="950" cy="271" r="14" fill="#f4f0df"/>
    <circle cx="1007" cy="271" r="14" fill="#f4f0df"/>
    <path d="M893 271 l57 -35 l57 35 l-57 35 z" fill="none" stroke="#f4f0df" stroke-width="5"/>
    <path d="M865 375 h205" stroke="#1f3a54" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">无线 · 农业 · 灾害 · 交通</text>
  </g>
  <g fill="#f4f0df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">NSF AI INFRASTRUCTURE · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">先建设试验场，再谈规模化</text>
  </g>
</svg>
