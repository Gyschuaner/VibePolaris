<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Windsurf 交易时间线</title><desc id="desc">OpenAI 谈判、Google 人员与技术流动、Cognition 收购的连续时间线。</desc><rect width="1200" height="680" rx="36" fill="#111827"/><text x="72" y="92" fill="#f8fafc" font-size="42" font-family="sans-serif" font-weight="700">Windsurf：人员先流动，资产再换轨</text><text x="72" y="136" fill="#a7b7cf" font-size="22" font-family="sans-serif">7 月 19 日后续报道补上 7 月 14 日公告没有展开的时间线</text><line x1="138" y1="335" x2="1060" y2="335" stroke="#64748b" stroke-width="8" stroke-linecap="round"/><g font-family="sans-serif"><circle cx="190" cy="335" r="28" fill="#f97316"/><text x="148" y="260" fill="#fdba74" font-size="22">前序</text><text x="100" y="405" fill="white" font-size="28" font-weight="700">OpenAI 谈判</text><text x="100" y="445" fill="#cbd5e1" font-size="18">未完成</text><circle cx="520" cy="335" r="28" fill="#60a5fa"/><text x="480" y="260" fill="#bfdbfe" font-size="22">人员 / 技术</text><text x="430" y="405" fill="white" font-size="28" font-weight="700">Google DeepMind</text><text x="430" y="445" fill="#cbd5e1" font-size="18">聘用核心成员并据报道许可技术</text><circle cx="910" cy="335" r="28" fill="#a78bfa"/><text x="880" y="260" fill="#ddd6fe" font-size="22">7 月 14 日</text><text x="820" y="405" fill="white" font-size="28" font-weight="700">Cognition 收购</text><text x="820" y="445" fill="#cbd5e1" font-size="18">IP、产品、商标和业务</text><path d="M218 335h270M548 335h334" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10"/><rect x="72" y="530" width="1056" height="70" rx="18" fill="#263244"/><text x="104" y="575" fill="#e0e7ff" font-size="22">已宣布的交易 ≠ 已交付整合：后续产品和团队状态才是验证证据</text></g></svg>