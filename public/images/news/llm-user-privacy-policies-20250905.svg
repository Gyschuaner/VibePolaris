<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">聊天数据隐私政策分析</title>
<desc id="desc">六家前沿 AI 公司政策被按默认训练、敏感数据、保存期限和退出控制进行比较。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f3f7ff"/><stop offset="1" stop-color="#fff2ee"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#57799c"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#26364c" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#203c5d" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">聊天数据会走到哪里？先看默认值，再看控制</text>
<text x="70" y="114" fill="#6b7f96" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">六家政策分析 · 训练/改进 · 敏感数据 · 保存期限 · 退出与删除</text>
<g filter="url(#shadow)">
 <rect x="66" y="174" width="250" height="326" rx="22" fill="#fff" stroke="#b8d2eb" stroke-width="2"/>
 <text x="105" y="224" fill="#356b9a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">用户聊天</text>
 <rect x="105" y="258" width="170" height="52" rx="12" fill="#e4f0ff"/><text x="190" y="291" text-anchor="middle" fill="#356b9a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">提示词 / 文件</text>
 <rect x="105" y="329" width="170" height="52" rx="12" fill="#fde8e5"/><text x="190" y="362" text-anchor="middle" fill="#a3524c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">健康 / 身份</text>
 <text x="190" y="430" text-anchor="middle" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">对话不等于只读一次</text>
 </g>
 <path d="M337 337 H388" stroke="#57799c" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="408" y="152" width="370" height="370" rx="22" fill="#fff" stroke="#c8b6e6" stroke-width="2"/>
 <text x="447" y="204" fill="#604c99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">政策文本比较</text>
 <text x="447" y="242" fill="#766c96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Amazon · Anthropic · Google</text>
 <text x="447" y="270" fill="#766c96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Meta · Microsoft · OpenAI</text>
 <rect x="447" y="300" width="290" height="44" rx="10" fill="#eee8fb"/><text x="592" y="328" text-anchor="middle" fill="#604c99" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">默认：训练 / 改进？</text>
 <rect x="447" y="358" width="290" height="44" rx="10" fill="#e8f5f2"/><text x="592" y="386" text-anchor="middle" fill="#2d746c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">敏感与儿童数据？</text>
 <rect x="447" y="416" width="290" height="44" rx="10" fill="#fff1db"/><text x="592" y="444" text-anchor="middle" fill="#8a6b36" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">保存、退出、删除？</text>
 </g>
 <path d="M799 337 H850" stroke="#57799c" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="174" width="264" height="326" rx="22" fill="#fff" stroke="#e4b1aa" stroke-width="2"/>
 <text x="906" y="224" fill="#a6534a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">可执行判断</text>
 <circle cx="918" cy="281" r="12" fill="#e89b74"/><text x="945" y="288" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">默认训练</text>
 <circle cx="918" cy="335" r="12" fill="#83b9aa"/><text x="945" y="342" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">敏感数据</text>
 <circle cx="918" cy="389" r="12" fill="#d5af63"/><text x="945" y="396" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">保存期限</text>
 <rect x="906" y="430" width="174" height="40" rx="10" fill="#e4f0ff"/><text x="993" y="456" text-anchor="middle" fill="#356b9a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">退出 / 删除入口</text>
 </g>
<text x="68" y="577" fill="#a6534a" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">研究结论：六家看起来都默认使用聊天改进模型</text>
<text x="68" y="615" fill="#6b7f96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">政策会变化；论文的分析时间点不是当前法律结论。</text>
</svg>
