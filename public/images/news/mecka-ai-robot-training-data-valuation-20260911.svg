<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Mecka AI 机器人训练数据融资报道</title><desc id="desc">TechCrunch 报道 Mecka AI 接近 5 亿美元估值，交易尚未敲定；人类动作数据流向机器人训练。</desc><style>.scan{animation:scan 2.8s ease-in-out infinite}@keyframes scan{50%{opacity:.35;transform:translateX(34px)}}.dot{animation:dot 1.9s ease-in-out infinite}@keyframes dot{50%{r:12}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d2b36"/><stop offset="1" stop-color="#7a4b32"/></linearGradient></defs><rect width="960" height="540" rx="34" fill="url(#bg)"/><text x="72" y="88" fill="#fff8ef" font-family="Arial,sans-serif" font-size="31" font-weight="700">MECKA AI / ROBOT DATA</text><text x="72" y="124" fill="#f3d7b7" font-family="Arial,sans-serif" font-size="20">报道中的约 $500M 估值 · 条款未敲定</text><g><circle cx="176" cy="280" r="70" fill="#f3d7b7" opacity=".94"/><circle cx="150" cy="266" r="11" fill="#1d2b36"/><circle cx="202" cy="266" r="11" fill="#1d2b36"/><path d="M143 306q33 26 66 0" fill="none" stroke="#1d2b36" stroke-width="9" stroke-linecap="round"/><path d="M228 250l68 -30M228 300l74 30" stroke="#f3d7b7" stroke-width="14" stroke-linecap="round"/></g><path d="M334 280h196" stroke="#f6bd60" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 18" class="scan"/><circle cx="430" cy="280" r="9" fill="#f6bd60" class="dot"/><rect x="570" y="178" width="250" height="210" rx="30" fill="#182f3d" stroke="#f3d7b7" stroke-width="4"/><circle cx="695" cy="236" r="34" fill="#f6bd60"/><circle cx="683" cy="231" r="7" fill="#182f3d"/><circle cx="707" cy="231" r="7" fill="#182f3d"/><path d="M681 252q14 12 28 0" fill="none" stroke="#182f3d" stroke-width="6" stroke-linecap="round"/><path d="M635 308h120M655 340h80" stroke="#a8dadc" stroke-width="10" stroke-linecap="round"/><text x="72" y="468" fill="#f3d7b7" font-family="Arial,sans-serif" font-size="21">手机与身体传感器 → 动作数据 → 机器人训练；估值不是性能证明</text></svg>
