<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Baichuan-M2 医疗推理与验证链</title>
  <desc id="desc">病例输入经过患者模拟器和多维验证，再交给医生复核</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Baichuan-M2-32B</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">医疗增强推理 · Large Verifier System · 医生复核</text>
  <rect x="92" y="278" width="208" height="170" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="196" y="334" fill="#f8fafc" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">病例输入</text>
  <text x="196" y="374" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">症状 · 既往史 · 问题</text>
  <path d="M 324 364 H 386" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 366 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="410" y="278" width="208" height="170" rx="20" fill="#253b55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="514" y="334" fill="#d1fae5" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">患者模拟</text>
  <text x="514" y="374" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">追问 · 不完整信息</text>
  <path d="M 642 364 H 704" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 684 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="728" y="278" width="208" height="170" rx="20" fill="#3a2c4d" stroke="#c4b5fd" stroke-width="2"/>
  <text x="832" y="334" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">多维验证</text>
  <text x="832" y="374" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">准确 · 完整 · 后续</text>
  <rect x="274" y="500" width="650" height="74" rx="18" fill="#2d2534" stroke="#fbbf24" stroke-width="2"/>
  <text x="599" y="546" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">模型建议交给医生复核，不直接替代诊疗</text>
</svg>
