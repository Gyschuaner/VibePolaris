<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Coding Agent 工具调用的分层防护</title>
<desc id="desc">工具描述、参数和返回值进入 Agent 后，执行层用 schema、最小权限、沙箱和人工审批阻断越界动作。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#fff0ed"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#54789d"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263c55" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#203c5d" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Coding Agent 的边界在工具调用之后</text>
<text x="70" y="114" fill="#6b7f96" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">工具描述 · 参数 / 返回值 · 执行层 · 最小权限</text>
<g filter="url(#shadow)">
 <rect x="66" y="177" width="240" height="318" rx="22" fill="#fff" stroke="#b8d1e9" stroke-width="2"/>
 <text x="105" y="227" fill="#356b9a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">工具协议</text>
 <rect x="105" y="262" width="162" height="46" rx="10" fill="#e4f0ff"/><text x="186" y="291" text-anchor="middle" fill="#356b9a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">描述 / Schema</text>
 <rect x="105" y="327" width="162" height="46" rx="10" fill="#fce7e2"/><text x="186" y="356" text-anchor="middle" fill="#a3524a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">参数 / 返回值</text>
 <text x="186" y="430" text-anchor="middle" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">都要标来源</text>
 </g>
 <path d="M322 336 H370" stroke="#54789d" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="390" y="150" width="390" height="372" rx="22" fill="#fff" stroke="#e3b0a9" stroke-width="2"/>
 <text x="430" y="205" fill="#a6534a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Agent 决策层</text>
 <rect x="430" y="252" width="310" height="52" rx="11" fill="#fde9e5"/><text x="585" y="285" text-anchor="middle" fill="#a6534a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">上下文 → 调用意图</text>
 <path d="M454 350 H716" stroke="#d58b7e" stroke-width="4" stroke-dasharray="10 8"/>
 <circle cx="505" cy="350" r="13" fill="#e2a06d"/><circle cx="602" cy="350" r="13" fill="#da747a"/><circle cx="688" cy="350" r="13" fill="#e2a06d"/>
 <text x="430" y="408" fill="#7c6b86" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">模型判断 ≠ 执行授权</text>
 <text x="430" y="452" fill="#7c6b86" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">参数和副作用需再次检查</text>
 </g>
 <path d="M801 336 H850" stroke="#54789d" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="177" width="264" height="318" rx="22" fill="#fff" stroke="#a7d7cc" stroke-width="2"/>
 <text x="908" y="227" fill="#2e7567" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">执行防护</text>
 <rect x="908" y="262" width="188" height="42" rx="10" fill="#e4f2ee"/><text x="1002" y="289" text-anchor="middle" fill="#2e7567" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">schema 校验</text>
 <rect x="908" y="322" width="188" height="42" rx="10" fill="#e5f0ff"/><text x="1002" y="349" text-anchor="middle" fill="#356b9a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">最小权限 / 沙箱</text>
 <rect x="908" y="382" width="188" height="42" rx="10" fill="#fff0da"/><text x="1002" y="409" text-anchor="middle" fill="#8a6b36" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">人工审批 / 回滚</text>
 <text x="1002" y="462" text-anchor="middle" fill="#6b7f96" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">记录每一次决定</text>
 </g>
<text x="68" y="575" fill="#a6534a" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">红队结果只能说明风险存在，不代表生产可以直接复现</text>
<text x="68" y="613" fill="#6b7f96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">让执行层拒绝越界参数，别把“模型说了”当作授权。</text>
</svg>
