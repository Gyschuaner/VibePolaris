<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>OpenAI Agents API public beta</title><desc>Layered diagram of a cloud agent harness coordinating context, tools and parallel subagents.</desc><style>.flow{animation:flow 3s linear infinite}.node{animation:float 3.5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes float{50%{transform:translateY(-9px)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#f4f1ff"/><rect x="90" y="126" width="1020" height="384" rx="28" fill="#fff" stroke="#5e43d9" stroke-width="5"/><rect x="130" y="174" width="310" height="270" rx="20" fill="#e8e2ff"/><text x="285" y="230" fill="#35257e" font-size="30" text-anchor="middle">开发者</text><text x="285" y="276" fill="#5e43d9" font-size="21" text-anchor="middle">环境 · 工具 · 上下文</text><path d="M440 310H570" stroke="#5e43d9" stroke-width="7" stroke-dasharray="18 16" class="flow"/><g class="node"><rect x="570" y="195" width="300" height="230" rx="24" fill="#35257e"/><text x="720" y="260" fill="#fff" font-size="33" text-anchor="middle">Codex harness</text><text x="720" y="305" fill="#dcd6ff" font-size="21" text-anchor="middle">压缩 · 工具搜索 · 编排</text><text x="720" y="343" fill="#dcd6ff" font-size="21" text-anchor="middle">长会话 · 子智能体</text></g><g fill="#ffd36e"><circle cx="960" cy="220" r="28"/><circle cx="1000" cy="315" r="28"/><circle cx="960" cy="410" r="28"/></g><path d="M870 270L940 225M870 310H972M870 350L940 405" stroke="#f0a93b" stroke-width="5"/><text x="100" y="82" fill="#35257e" font-size="24">OPENAI · AGENTS API · PUBLIC BETA</text><text x="100" y="568" fill="#5e43d9" font-size="22">把长运行智能体的基础设施作为 API 暴露给开发者</text></svg>