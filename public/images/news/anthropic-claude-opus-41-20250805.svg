<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 4.1 追踪代码细节并调用工具</title>
  <desc id="desc">模型在代码库中追踪多文件改动，运行工具并经过安全复测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2b2546"/>
      <stop offset="1" stop-color="#6c567f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4ead6"/>
      <stop offset="1" stop-color="#ded6ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#17122d" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="180" fill="#edbd79" opacity=".15"/>
  <circle cx="120" cy="520" r="230" fill="#c39cc7" opacity=".16"/>
  <path d="M30 440 C180 335 285 485 430 370 S680 275 830 400 S1030 470 1195 315" fill="none" stroke="#edbd79" stroke-width="5" stroke-dasharray="12 15" opacity=".82"/>
  <g filter="url(#shadow)">
    <rect x="95" y="118" width="300" height="320" rx="30" fill="url(#card)"/>
    <rect x="450" y="118" width="300" height="320" rx="30" fill="#f4ead6"/>
    <rect x="805" y="118" width="300" height="320" rx="30" fill="#e6c17e"/>
  </g>
  <g fill="#2b2546" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="140" y="178" font-size="25" font-weight="800">Opus 4.1</text>
    <rect x="140" y="235" width="195" height="52" rx="18" fill="#ded6ec"/>
    <text x="164" y="268" font-size="17">增量升级</text>
    <path d="M140 330 h170" stroke="#755b84" stroke-width="12" stroke-linecap="round"/>
    <path d="M140 375 h125" stroke="#755b84" stroke-width="12" stroke-linecap="round" opacity=".6"/>
    <text x="140" y="408" font-size="17">代码 · 推理</text>

    <text x="495" y="178" font-size="25" font-weight="800">代码库</text>
    <rect x="500" y="225" width="200" height="125" rx="18" fill="#ded6ec" stroke="#755b84" stroke-width="5"/>
    <path d="M525 260 h145 M525 295 h105 M525 330 h135" stroke="#755b84" stroke-width="11" stroke-linecap="round"/>
    <circle cx="650" cy="295" r="17" fill="#2b2546"/>
    <path d="M641 295 l7 7 l13 -16" fill="none" stroke="#f4ead6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="495" y="408" font-size="17">多文件 · 细节</text>

    <text x="850" y="178" font-size="25" font-weight="800">复核</text>
    <path d="M875 252 h150" stroke="#2b2546" stroke-width="12" stroke-linecap="round" opacity=".35"/>
    <path d="M875 252 h95" stroke="#2b2546" stroke-width="12" stroke-linecap="round"/>
    <circle cx="971" cy="252" r="19" fill="#2b2546"/>
    <path d="M875 330 h150" stroke="#2b2546" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>
    <text x="850" y="408" font-size="17">Agent · 安全</text>
  </g>
  <g fill="#f4ead6" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="95" y="565" font-size="22" letter-spacing="1">Claude Opus 4.1 · 2025.08.05</text>
    <text x="1105" y="565" font-size="16" text-anchor="end" opacity=".84">增量能力也要放回工作流</text>
