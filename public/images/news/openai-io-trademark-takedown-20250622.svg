<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI io 宣传材料因 iyO 商标临时命令撤下</title>
  <desc id="desc">画面把 io 与 iyO 两个相近标志放在法庭文件两侧，中间是一张带暂时下线提示的宣传页，表示品牌使用被暂时限制而合作关系仍在。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101426"/><stop offset="1" stop-color="#241832"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#79e1ef"/><stop offset="1" stop-color="#ff8c83"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" rx="38" fill="url(#bg)"/>
  <g opacity=".13" stroke="#c8c9e6" stroke-width="2"><path d="M70 140H1130M70 250H1130M70 360H1130M70 470H1130M70 580H1130M170 70V630M320 70V630M470 70V630M620 70V630M770 70V630M920 70V630M1070 70V630"/></g>
  <text x="84" y="92" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">BRAND / COURT ORDER</text>
  <text x="86" y="130" fill="#aeb5d2" font-family="Arial, sans-serif" font-size="20">2025.06.22 · io materials removed</text>
  <g transform="translate(90 202)">
    <rect width="230" height="220" rx="24" fill="#15243a" stroke="#79e1ef" stroke-width="2"/>
    <text x="44" y="102" fill="#79e1ef" font-family="Arial, sans-serif" font-size="64" font-weight="700">io</text>
    <text x="38" y="155" fill="#e3ecff" font-family="Arial, sans-serif" font-size="19">OpenAI / Ive</text>
    <text x="38" y="184" fill="#9da9c9" font-family="Arial, sans-serif" font-size="16">marketing mark</text>
  </g>
  <g transform="translate(880 202)">
    <rect width="230" height="220" rx="24" fill="#291d32" stroke="#ff8c83" stroke-width="2"/>
    <text x="32" y="102" fill="#ff8c83" font-family="Arial, sans-serif" font-size="56" font-weight="700">iyO</text>
    <text x="38" y="155" fill="#fff0ef" font-family="Arial, sans-serif" font-size="19">IYO Inc.</text>
    <text x="38" y="184" fill="#c7a9b4" font-family="Arial, sans-serif" font-size="16">trademark claim</text>
  </g>
  <path d="M330 312H470" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
  <path d="M730 312H870" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(470 168)">
    <rect width="260" height="300" rx="18" fill="#f7f9fc"/>
    <rect x="0" y="0" width="260" height="50" rx="18" fill="#e3e8f3"/>
    <circle cx="24" cy="25" r="6" fill="#ff8c83"/><circle cx="45" cy="25" r="6" fill="#f1c76d"/><circle cx="66" cy="25" r="6" fill="#79e1ef"/>
    <rect x="28" y="87" width="204" height="76" rx="12" fill="#252a47"/>
    <text x="50" y="132" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">io × Ive</text>
    <rect x="28" y="191" width="204" height="50" rx="12" fill="#ff8c83"/>
    <text x="60" y="223" fill="#291d32" font-family="Arial, sans-serif" font-size="18" font-weight="700">temporarily down</text>
    <text x="35" y="272" fill="#66718c" font-family="Arial, sans-serif" font-size="14">court order / trademark</text>
  </g>
  <g transform="translate(90 515)">
    <rect width="1020" height="92" rx="20" fill="#0c1122" stroke="#4a5171"/>
    <circle cx="40" cy="45" r="13" fill="#f1c76d"/>
    <text x="70" y="40" fill="#f1c76d" font-family="Arial, sans-serif" font-size="21" font-weight="700">TEMPORARY</text>
    <text x="70" y="67" fill="#d7dcf1" font-family="Arial, sans-serif" font-size="17">限制的是相关产品营销中的标志使用 · 交易与研发并未因此自动终止</text>
  </g>
</svg>
