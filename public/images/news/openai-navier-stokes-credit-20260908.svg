<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>OpenAI-reported Navier-Stokes proof and credit dispute</title><desc>Two mathematical workstreams meet at a proof review gate while a credit and data boundary remains unresolved.</desc><style>.flow{animation:flow 3s linear infinite}.gate{animation:gate 2.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes gate{50%{transform:scale(1.08);opacity:.7}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#131b2c"/><rect x="100" y="175" width="300" height="260" rx="24" fill="#244266" stroke="#86d6ff" stroke-width="5"/><text x="250" y="250" fill="#edf9ff" font-size="28" text-anchor="middle">OpenAI model</text><text x="250" y="300" fill="#b9e6ff" font-size="20" text-anchor="middle">Navier–Stokes proof</text><path d="M400 305H510" stroke="#86d6ff" stroke-width="7" stroke-dasharray="16 14" class="flow"/><circle cx="600" cy="305" r="88" fill="#5a425a" stroke="#f1cb6d" stroke-width="6" class="gate"/><text x="600" y="295" fill="#fff0d4" font-size="27" text-anchor="middle">独立</text><text x="600" y="332" fill="#f2d990" font-size="20" text-anchor="middle">核验</text><path d="M690 305H800" stroke="#86d6ff" stroke-width="7" stroke-dasharray="16 14" class="flow"/><rect x="800" y="175" width="300" height="260" rx="24" fill="#2c664f" stroke="#9ee7c4" stroke-width="5"/><text x="950" y="245" fill="#edfff5" font-size="27" text-anchor="middle">Euler 工作</text><text x="950" y="292" fill="#c9f4dc" font-size="20" text-anchor="middle">Buckmaster · Alpöge</text><path d="M830 350H1070" stroke="#ff9b84" stroke-width="5" stroke-dasharray="12 12"/><text x="950" y="390" fill="#ffd0c3" font-size="18" text-anchor="middle">优先权 / 数据边界</text><text x="100" y="88" fill="#86d6ff" font-size="24">OPENAI · MATH NEWS · 2026-09-08</text><text x="100" y="565" fill="#b7c7dc" font-size="20">宣布证明不等于数学界已接受，也不自动解决贡献归属</text></svg>