<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">MPDF：多 Agent 的元认知协作动作</title>
<desc id="desc">Agent 根据证据和不确定性在 Persist、Refine、Concede 之间选择，再由预算和停止条件约束。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f1ff"/><stop offset="1" stop-color="#effbf7"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5d4b9d"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#242044" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#2a2354" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">MPDF：协作不只问“谁来答”，还问“要不要继续”</text>
<text x="72" y="118" fill="#6b6a8c" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">读取信心与不确定性 → 选择元认知动作 → 在预算内收敛</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="250" height="292" rx="22" fill="#fff" stroke="#d7cdf4" stroke-width="2"/>
 <text x="108" y="238" fill="#5d4b9d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">当前状态</text>
 <rect x="108" y="272" width="174" height="56" rx="12" fill="#ece5ff"/><text x="195" y="308" text-anchor="middle" fill="#4c3e88" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">证据与信心</text>
 <text x="108" y="376" fill="#6b6a8c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不确定性 · 轨迹</text>
 <text x="108" y="409" fill="#6b6a8c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">通信 / token 预算</text>
 </g>
 <path d="M338 334 H398" stroke="#5d4b9d" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="418" y="166" width="360" height="330" rx="22" fill="#fff" stroke="#a8d8cf" stroke-width="2"/>
 <text x="456" y="216" fill="#27786d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">元认知动作</text>
 <rect x="456" y="252" width="124" height="58" rx="12" fill="#d9f2ed"/><text x="518" y="289" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Persist</text>
 <rect x="600" y="252" width="124" height="58" rx="12" fill="#fff0c9"/><text x="662" y="289" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Refine</text>
 <rect x="456" y="332" width="124" height="58" rx="12" fill="#fde1de"/><text x="518" y="369" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Concede</text>
 <text x="600" y="369" fill="#6b6a8c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">继续 / 修正 / 让步</text>
 <text x="456" y="442" fill="#6b6a8c" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">SoftRankPO 平滑训练信号</text>
 <text x="456" y="470" fill="#6b6a8c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不把偶然高回报当成真理</text>
</g>
<path d="M796 334 H856" stroke="#5d4b9d" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="876" y="166" width="254" height="330" rx="22" fill="#fff" stroke="#e4b5a6" stroke-width="2"/>
 <text x="912" y="216" fill="#a64d40" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">受控收敛</text>
 <rect x="912" y="252" width="182" height="58" rx="12" fill="#fde2de"/><text x="1003" y="289" text-anchor="middle" fill="#8b4037" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">预算</text>
 <rect x="912" y="332" width="182" height="58" rx="12" fill="#fde2de"/><text x="1003" y="369" text-anchor="middle" fill="#8b4037" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">停止 / 接管</text>
 <text x="1003" y="438" text-anchor="middle" fill="#a64d40" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">准确率 + 成本一起看</text>
 <text x="1003" y="468" text-anchor="middle" fill="#6b6a8c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高风险时交给人</text>
</g>
<text x="70" y="578" fill="#5d4b9d" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">五个推理基准 · 相对六种方法平均 +4–5 个百分点</text>
<text x="70" y="615" fill="#6b6a8c" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">学习协作节奏，不等于取消预算、停止条件和人工接管。</text>
</svg>