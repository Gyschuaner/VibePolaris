ily="sans-serif">账户与 API</text><text x="824" y="414" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">尚未确认</text><rect x="970" y="272" width="150" height="188" rx="18" fill="#202b3c" stroke="#f87171" stroke-width="2"/><text x="1045" y="337" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">评测</text><text x="1045" y="377" fill="#fecaca" font-size="15" text-anchor="middle" font-family="sans-serif">能力与限制</text><text x="1045" y="414" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">不能从截图得出</text><text x="600" y="565" fill="#d5def0" font-size="19" text-anchor="middle" font-family="sans-serif">VibePolaris 自制机制图 · 预告与发布边界</text><text x="600" y="603" fill="#7f8ba0" font-size="14" text-anchor="middle" font-family="sans-serif">CC BY 4.0 · 不把界面截图当成模型规格</text></svg>
