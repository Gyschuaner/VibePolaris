<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">开放权重模型从下载进入本地 Agent</title>
  <desc id="desc">两款模型从权重下载进入本地 GPU，再连接工具和安全控制。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#142d3d"/>
      <stop offset="1" stop-color="#27685f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7efd8"/>
      <stop offset="1" stop-color="#d7e7d1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#071b26" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="95" r="185" fill="#f4cf7a" opacity=".15"/>
  <circle cx="120" cy="520" r="230" fill="#8fc5aa" opacity=".16"/>
  <path d="M35 430 C170 325 290 510 420 370 S680 270 810 405 S1020 480 1190 305" fill="none" stroke="#f4cf7a" stroke-width="5" stroke-dasharray="12 15" opacity=".85"/>
  <g filter="url(#shadow)">
    <rect x="90" y="120" width="285" height="315" rx="30" fill="url(#card)"/>
    <rect x="425" y="120" width="350" height="315" rx="30" fill="#f7efd8"/>
    <rect x="825" y="120" width="285" height="315" rx="30" fill="#e4c473"/>
  </g>
  <g fill="#142d3d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="135" y="178" font-size="25" font-weight="800">开放权重</text>
    <rect x="135" y="235" width="195" height="55" rx="18" fill="#d7e7d1"/>
    <text x="160" y="270" font-size="18">120b · 20b</text>
    <path d="M160 330 h145" stroke="#377563" stroke-width="12" stroke-linecap="round"/>
    <path d="M160 375 h105" stroke="#377563" stroke-width="12" stroke-linecap="round" opacity=".6"/>
    <text x="135" y="408" font-size="17">下载 · 微调</text>

    <text x="470" y="178" font-size="25" font-weight="800">本地 GPU</text>
    <rect x="480" y="230" width="235" height="115" rx="20" fill="#d7e7d1" stroke="#377563" stroke-width="5"/>
    <rect x="510" y="260" width="175" height="35" rx="12" fill="#377563"/>
    <circle cx="535" cy="278" r="7" fill="#f7efd8"/>
    <circle cx="560" cy="278" r="7" fill="#f7efd8"/>
    <circle cx="585" cy="278" r="7" fill="#f7efd8"/>
    <path d="M520 380 h155" stroke="#377563" stroke-width="12" stroke-linecap="round"/>
    <text x="470" y="408" font-size="17">80GB · 16GB 目标配置</text>

    <text x="870" y="178" font-size="25" font-weight="800">Agent</text>
    <path d="M885 260 h155" stroke="#142d3d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="900" cy="260" r="17" fill="#142d3d"/>
    <circle cx="1025" cy="260" r="17" fill="#142d3d"/>
    <path d="M900 325 h125" stroke="#142d3d" stroke-width="12" stroke-linecap="round" opacity=".7"/>
    <text x="870" y="408" font-size="17">工具 · 权限 · 监控</text>
  </g>
  <g fill="#f7efd8" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="90" y="565" font-size="22" letter-spacing="1">OpenAI gpt-oss · 2025.08.05</text>
    <text x="1110" y="565" font-size="16" text-anchor="end" opacity=".84">拿到权重，也接住责任</text>
  </g>
</svg>
