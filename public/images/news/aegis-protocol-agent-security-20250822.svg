<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Aegis Protocol</title>
  <desc id="desc">Three layers secure a multi-agent action: identity, communication integrity and policy proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1830"/><stop offset="1" stop-color="#203f52"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ce8d1"/><stop offset="1" stop-color="#84a6ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#040610" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="76" y="66" width="1048" height="498" rx="38" fill="#0e1728" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="138" fill="#9bb7d0" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">AEGIS PROTOCOL · 2025.08.22</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">Trust has three layers</text>
  <text x="124" y="253" fill="#cad9e8" font-family="Arial, sans-serif" font-size="25">Identity · integrity · policy proof</text>
  <path d="M928 176l116 46v94c0 99-66 154-116 177-50-23-116-78-116-177v-94z" fill="url(#shield)" fill-opacity=".16" stroke="url(#shield)" stroke-width="5"/>
  <path d="M928 220v206" stroke="#b6e9ff" stroke-opacity=".7" stroke-width="3"/>
  <path d="M878 319h100" stroke="#b6e9ff" stroke-opacity=".7" stroke-width="3"/>
  <g font-family="Arial, sans-serif">
    <rect x="124" y="337" width="210" height="106" rx="20" fill="#223448" stroke="#8ce8d1" stroke-width="2"/><text x="158" y="380" fill="#8ce8d1" font-size="18" letter-spacing="2">WHO</text><text x="158" y="418" fill="#ffffff" font-size="27">DID identity</text>
    <rect x="366" y="337" width="210" height="106" rx="20" fill="#29314c" stroke="#84a6ff" stroke-width="2"/><text x="400" y="380" fill="#84a6ff" font-size="18" letter-spacing="2">HOW</text><text x="400" y="418" fill="#ffffff" font-size="27">PQC integrity</text>
    <rect x="608" y="337" width="210" height="106" rx="20" fill="#3b2c43" stroke="#ffcb82" stroke-width="2"/><text x="642" y="380" fill="#ffcb82" font-size="18" letter-spacing="2">WHY</text><text x="642" y="418" fill="#ffffff" font-size="27">Policy proof</text>
  </g>
  <text x="124" y="508" fill="#9bb7d0" font-family="Arial, sans-serif" font-size="18">0% in simulation is a baseline, not a production guarantee.</text>
</svg>
