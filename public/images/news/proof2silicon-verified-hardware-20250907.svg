<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Proof2Silicon：先验证，再综合硬件</title>
<desc id="desc">自然语言规格经过提示修复生成 Dafny，验证通过后转换成高层 C 和 RTL。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0f7ff"/><stop offset="1" stop-color="#fff1e7"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5c778c"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#29475d" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#315b73" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">让“能生成”先过一道能拒绝的证明闸门</text>
<text x="70" y="114" fill="#718997" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">specification · Dafny proof · high-level C · RTL synthesis</text>
<g filter="url(#shadow)">
 <rect x="66" y="173" width="230" height="322" rx="22" fill="#fff" stroke="#bad4e4" stroke-width="2"/>
 <text x="102" y="221" fill="#3f7896" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">自然语言规格</text>
 <rect x="103" y="257" width="156" height="47" rx="10" fill="#e4f1fb"/><text x="181" y="286" text-anchor="middle" fill="#47718e" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">输入 / 输出</text>
 <rect x="103" y="323" width="156" height="47" rx="10" fill="#eee7ff"/><text x="181" y="352" text-anchor="middle" fill="#765da1" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">前置 / 后置条件</text>
 <text x="181" y="423" text-anchor="middle" fill="#718997" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">验证对象先写清</text>
 <text x="181" y="462" text-anchor="middle" fill="#b16d4a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">未通过就回修</text>
</g>
<path d="M312 335 H350" stroke="#5c778c" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="370" y="145" width="444" height="380" rx="22" fill="#fff" stroke="#c7b9e5" stroke-width="2"/>
 <text x="410" y="201" fill="#624f99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">PREFACE + Proof2Silicon</text>
 <rect x="410" y="247" width="126" height="57" rx="11" fill="#e4f1fb"/><text x="473" y="282" text-anchor="middle" fill="#47718e" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">提示修复</text>
 <rect x="552" y="247" width="108" height="57" rx="11" fill="#e5f2eb"/><text x="606" y="282" text-anchor="middle" fill="#4b8464" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Dafny</text>
 <rect x="676" y="247" width="98" height="57" rx="11" fill="#fff0d9"/><text x="725" y="282" text-anchor="middle" fill="#a06d34" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">验证</text>
 <path d="M536 275 H544 M660 275 H668" stroke="#5c778c" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M725 326 C725 393 473 393 473 326" fill="none" stroke="#8d75b5" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="446" y="425" width="294" height="54" rx="11" fill="#eee7ff"/><text x="593" y="459" text-anchor="middle" fill="#765da1" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">通过才进入综合</text>
 <text x="410" y="501" fill="#718997" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">失败原因与版本都要留档</text>
</g>
<path d="M834 335 H870" stroke="#5c778c" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="890" y="173" width="244" height="322" rx="22" fill="#fff" stroke="#b8d5c3" stroke-width="2"/>
 <text x="928" y="221" fill="#4b8564" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">硬件产物</text>
 <rect x="925" y="257" width="174" height="45" rx="10" fill="#e4f1fb"/><text x="1012" y="285" text-anchor="middle" fill="#47718e" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高层 C</text>
 <rect x="925" y="323" width="174" height="45" rx="10" fill="#e5f2eb"/><text x="1012" y="351" text-anchor="middle" fill="#4b8564" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Vivado HLS → RTL</text>
 <rect x="925" y="389" width="174" height="45" rx="10" fill="#fff0d9"/><text x="1012" y="417" text-anchor="middle" fill="#a06d34" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">综合成功率 72%</text>
 <text x="1012" y="461" text-anchor="middle" fill="#718997" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">研究基准结果</text>
</g>
<text x="68" y="575" fill="#a06d34" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">证明通过不等于芯片已经验证</text>
<text x="68" y="613" fill="#718997" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">转换一致性、时序、资源和上板测试仍需硬件工程师负责。</text>
</svg>
