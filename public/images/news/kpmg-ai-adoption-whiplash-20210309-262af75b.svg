<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">KPMG 调查中的 AI 采用速度与治理担忧</title>
  <desc id="desc">左侧显示调查样本，中间显示企业自报 AI 运作程度，右侧显示采用速度与治理需求同时上升。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#20203e"/><stop offset="1" stop-color="#123e4a"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <linearGradient id="coral" x1="0" x2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".48"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700">AI 采用加速，治理也得跟上</text>
  <text x="74" y="114" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">2021-03-09 · KPMG《Thriving in an AI World》调查</text>
  <g filter="url(#shadow)">
    <rect x="74" y="170" width="285" height="350" rx="24" fill="#1b3451" stroke="#4f6f91" stroke-width="2"/>
    <rect x="426" y="170" width="342" height="350" rx="24" fill="#16414a" stroke="#67e8f9" stroke-width="3"/>
    <rect x="834" y="170" width="292" height="350" rx="24" fill="#3e3042" stroke="#fda4af" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="216" y="210" fill="#f8fafc" font-size="22" font-weight="700">调查样本</text>
    <text x="216" y="241" fill="#b8ccdf" font-size="15">企业决策者的自报</text>
    <circle cx="216" cy="336" r="92" fill="#2d5273" stroke="#75b7df" stroke-width="3"/>
    <text x="216" y="329" fill="#effaff" font-size="46" font-weight="700">950</text>
    <text x="216" y="360" fill="#d9f4ff" font-size="16">业务 / IT 决策者</text>
    <text x="216" y="465" fill="#c4d8e8" font-size="15">7 个行业 · 2021 年 1 月调查</text>
    <text x="597" y="210" fill="#f8fafc" font-size="22" font-weight="700">自报“中等运作”</text>
    <text x="597" y="241" fill="#a7f3d0" font-size="15">不是独立性能认证</text>
    <path d="M505 420A96 96 0 0 1 689 420" fill="none" stroke="#2d7375" stroke-width="24" stroke-linecap="round"/>
    <path d="M505 420A96 96 0 0 1 625 330" fill="none" stroke="url(#cyan)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="625" cy="330" r="13" fill="#effffb"/>
    <text x="597" y="390" fill="#e7fff7" font-size="28" font-weight="700">93% / 84% / 83%</text>
    <text x="597" y="451" fill="#ccefe8" font-size="15">工业制造 · 金融 · 科技</text>
    <text x="597" y="480" fill="#ccefe8" font-size="15">受访者认为各自组织内至少达到中等运作程度</text>
    <text x="980" y="210" fill="#fff" font-size="22" font-weight="700">同一调查的张力</text>
    <path d="M885 356h190" stroke="#fda4af" stroke-width="7" stroke-linecap="round"/>
    <path d="M900 356l-18-14M900 356l-18 14M1060 356l18-14M1060 356l18 14" stroke="#fda4af" stroke-width="5" stroke-linecap="round"/>
    <text x="980" y="308" fill="#ffdce0" font-size="18" font-weight="700">采用更快</text>
    <text x="980" y="414" fill="#ffdce0" font-size="18" font-weight="700">规则更清楚</text>
    <rect x="886" y="455" width="188" height="38" rx="19" fill="#744653"/>
    <text x="980" y="480" fill="#ffe9ed" font-size="14">担忧与信心可以并存</text>
  </g>
  <g fill="none" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)"><path d="M365 345h52"/><path d="M771 345h52"/></g>
  <text x="74" y="570" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">示意图为 VibePolaris 自制，重画调查样本、企业自报指标与治理张力。</text>
</svg>
