<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AMDM 的多维自适应监控</title>
  <desc id="desc">多个运行指标进入自适应基线，再通过组合异常判断输出分级响应。</desc>
  <rect width="1200" height="630" rx="32" fill="#f7f5ef"/>
  <rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
  <text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">AMDM：从一条阈值到一组运行状态</text>
  <text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">多维信号 · 自适应基线 · 组合异常</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="116" y="222" width="188" height="78" rx="16" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/>
    <text x="210" y="270" text-anchor="middle" font-size="23" font-weight="700" fill="#21456f">延迟</text>
    <rect x="116" y="324" width="188" height="78" rx="16" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/>
    <text x="210" y="372" text-anchor="middle" font-size="23" font-weight="700" fill="#275d39">错误率</text>
    <rect x="116" y="426" width="188" height="78" rx="16" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/>
    <text x="210" y="474" text-anchor="middle" font-size="23" font-weight="700" fill="#805513">成本 / 资源</text>
    <rect x="442" y="278" width="258" height="150" rx="20" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/>
    <text x="571" y="330" text-anchor="middle" font-size="27" font-weight="700" fill="#783553">自适应基线</text>
    <text x="571" y="368" text-anchor="middle" font-size="19" fill="#94516f">EWMA 更新近期状态</text>
    <text x="571" y="399" text-anchor="middle" font-size="19" fill="#94516f">Mahalanobis 看组合偏离</text>
    <rect x="846" y="278" width="232" height="150" rx="20" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/>
    <text x="962" y="330" text-anchor="middle" font-size="27" font-weight="700" fill="#234b78">分级响应</text>
    <text x="962" y="368" text-anchor="middle" font-size="19" fill="#385f8d">告警 / 降级 / 复核</text>
    <text x="962" y="399" text-anchor="middle" font-size="19" fill="#385f8d">授权仍独立</text>
  </g>
  <g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M304 261 C360 261 382 307 432 326"/><path d="M304 363 H432"/><path d="M304 465 C360 465 382 419 432 400"/><path d="M700 353 H836"/>
  </g>
  <g fill="#607080">
    <path d="M432 326 l-14 -9 v18z"/><path d="M432 363 l-14 -9 v18z"/><path d="M432 400 l-14 -9 v18z"/><path d="M836 353 l-14 -9 v18z"/>
  </g>
  <text x="600" y="528" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">监控回答“状态变了吗”，授权决定“能不能动”</text>
</svg>
