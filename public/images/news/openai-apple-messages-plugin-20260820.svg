<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Apple Messages：从对话到发送确认</title><desc id="desc">从消息检索、草稿生成、收件人确认到实际发送的权限链路。</desc><metadata><source>https://help.openai.com/en/articles/6825453-chatgpt-release-notes</source><source>https://learn.chatgpt.com/docs/plugins?surface=app</source><source>https://www.macrumors.com/2026/08/20/chatgpt-imessages-mac/</source></metadata><rect width="1200" height="620" rx="36" fill="#101827"/><text x="70" y="72" fill="#f8fafc" font-size="31" font-family="Arial,sans-serif" font-weight="700">Apple Messages：自动化不能跳过最后确认</text><text x="70" y="110" fill="#a8b7c9" font-size="18" font-family="Arial,sans-serif">8 月 20 日接入 ChatGPT Work / Codex；默认逐次审批</text><g font-family="Arial,sans-serif"><rect x="70" y="190" width="210" height="160" rx="22" fill="#315d85"/><text x="175" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Messages</text><text x="175" y="270" text-anchor="middle" fill="#dceeff" font-size="16">iMessage</text><text x="175" y="300" text-anchor="middle" fill="#dceeff" font-size="16">SMS / RCS</text><path d="M292 270 H370" stroke="#8ba7c3" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="190" width="210" height="160" rx="22" fill="#69528b"/><text x="495" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">代理理解</text><text x="495" y="270" text-anchor="middle" fill="#f0e5ff" font-size="16">搜索上下文</text><text x="495" y="300" text-anchor="middle" fill="#f0e5ff" font-size="16">生成草稿</text><path d="M612 270 H690" stroke="#8ba7c3" stroke-width="4" marker-end="url(#arrow)"/><rect x="710" y="190" width="210" height="160" rx="22" fill="#a45036"/><text x="815" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">审批门</text><text x="815" y="270" text-anchor="middle" fill="#ffe5db" font-size="16">正文 + 收件人</text><text x="815" y="300" text-anchor="middle" fill="#ffe5db" font-size="16">默认需确认</text><path d="M932 270 H1010" stroke="#8ba7c3" stroke-width="4" marker-end="url(#arrow)"/><rect x="1030" y="190" width="105" height="160" rx="22" fill="#1d765c"/><text x="1082" y="230" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">发送</text><text x="1082" y="270" text-anchor="middle" fill="#d8f7e7" font-size="15">用户同意</text><text x="1082" y="300" text-anchor="middle" fill="#d8f7e7" font-size="15">或持久授权</text><rect x="125" y="446" width="950" height="86" rx="20" fill="#2a3140" stroke="#e4a06c" stroke-width="2"/><text x="600" y="484" text-anchor="middle" fill="#ffd7bd" font-size="22" font-weight="700">边界：会总结 ≠ 会替你决定要发什么</text><text x="600" y="514" text-anchor="middle" fill="#c9d3df" font-size="16">权限范围、收件人确认、撤销方式仍由用户和工作区控制</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8ba7c3"/></marker></defs></svg>