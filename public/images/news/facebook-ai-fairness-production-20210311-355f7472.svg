<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Facebook AI 的公平性三层检查</title>
  <desc id="desc">从上到下是产品目标、政策规则和实现误差，右侧用群体比较与利益相关者反馈连接到持续修正。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1c1b3b"/><stop offset="1" stop-color="#153e4a"/></linearGradient>
    <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#fcd34d"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="700">公平不是一个分数，而是一条检查链</text>
  <text x="74" y="106" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">2021-03-11 · Facebook AI 公开生产系统方法</text>
  <g filter="url(#shadow)">
    <rect x="74" y="156" width="500" height="344" rx="24" fill="#1b3554" stroke="#5f83aa" stroke-width="2"/>
    <rect x="626" y="156" width="500" height="344" rx="24" fill="#193d4b" stroke="#67e8f9" stroke-width="3"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="106" y="201" fill="#f8fafc" font-size="22" font-weight="700">三层问题</text>
    <text x="106" y="229" fill="#b8ccdf" font-size="15">先问目标和规则，再看模型结果</text>
    <rect x="106" y="258" width="432" height="58" rx="16" fill="#334d70" stroke="#fda4af" stroke-width="2"/>
    <text x="134" y="294" fill="#fff1f2" font-size="19" font-weight="700">产品：系统要为谁创造什么价值？</text>
    <rect x="106" y="333" width="432" height="58" rx="16" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <text x="134" y="369" fill="#e2fffb" font-size="19" font-weight="700">政策：哪些伤害和例外需要规则？</text>
    <rect x="106" y="408" width="432" height="58" rx="16" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="134" y="444" fill="#f4eaff" font-size="19" font-weight="700">实现：模型和标签在哪些群体上出错？</text>
    <text x="658" y="201" fill="#f8fafc" font-size="22" font-weight="700">把差异带回修正</text>
    <text x="658" y="229" fill="#a7f3d0" font-size="15">指标发现问题，不能替代价值判断</text>
    <circle cx="758" cy="335" r="68" fill="#245e66" stroke="#8df1e0" stroke-width="3"/>
    <path d="M725 335h66M758 302v66M735 312l46 46M781 312l-46 46" stroke="#d4fff7" stroke-width="4" stroke-linecap="round"/>
    <text x="758" y="431" fill="#d2fff7" font-size="17" text-anchor="middle">按群体比较误报 / 漏报</text>
    <path d="M866 289h192" stroke="url(#pink)" stroke-width="7" stroke-linecap="round"/>
    <path d="M887 289l-18-14M887 289l-18 14M1038 289l18-14M1038 289l18 14" stroke="#fda4af" stroke-width="5" stroke-linecap="round"/>
    <text x="962" y="260" fill="#ffdce0" font-size="17" text-anchor="middle">找数据、特征、目标和测量误差</text>
    <path d="M758 403c58 50 119 51 176 7" fill="none" stroke="url(#cyan)" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="962" y="449" fill="#c9fff4" font-size="17" text-anchor="middle">专家与有亲身经历的人反馈</text>
    <text x="962" y="477" fill="#9fb5cc" font-size="15" text-anchor="middle">再回到产品、政策和实现</text>
  </g>
  <path d="M574 329h42" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="74" y="530" width="1052" height="45" rx="18" fill="#102a40" stroke="#355c75" stroke-width="2"/>
  <text x="102" y="559" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">示意图为 VibePolaris 自制，重画产品目标 → 政策规则 → 实现误差 → 群体比较与反馈的检查链。</text>
</svg>
