<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">SenseNova V6.5 多模态推理与评测边界</title><desc id="desc">文字和图像共同进入推理流程，经过场景应用，再把厂商指标放回可复核的评测条件。</desc><rect width="1200" height="680" rx="36" fill="#101725"/><circle cx="980" cy="120" r="180" fill="#173c52" opacity=".8"/><circle cx="1080" cy="240" r="120" fill="#274c61" opacity=".7"/><text x="72" y="82" fill="#f7f9fc" font-family="sans-serif" font-size="32" font-weight="700">多模态不是“会识图”，而是一条工作流</text><text x="72" y="120" fill="#a8b6c9" font-family="sans-serif" font-size="20">SenseNova V6.5 · 2025-07-27</text><g font-family="sans-serif"><rect x="72" y="218" width="196" height="148" rx="22" fill="#273a60"/><text x="104" y="264" fill="#fff" font-size="23" font-weight="700">材料</text><text x="104" y="306" fill="#cbd8eb" font-size="19">文字 + 图像</text><text x="104" y="338" fill="#cbd8eb" font-size="19">网页 + 视频</text><path d="M286 292H352" stroke="#eabf68" stroke-width="6" stroke-linecap="round"/><path d="m342 280 18 12-18 12" fill="none" stroke="#eabf68" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="180" width="286" height="224" rx="22" fill="#3d2e56"/><text x="408" y="232" fill="#fff" font-size="23" font-weight="700">交错推理</text><text x="408" y="276" fill="#d9cbed" font-size="19">看见证据</text><text x="408" y="310" fill="#d9cbed" font-size="19">解释关系</text><text x="408" y="344" fill="#d9cbed" font-size="19">保持上下文</text><path d="M678 292H744" stroke="#eabf68" stroke-width="6" stroke-linecap="round"/><path d="m734 280 18 12-18 12" fill="none" stroke="#eabf68" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="766" y="186" width="362" height="206" rx="22" fill="#285461"/><text x="800" y="236" fill="#fff" font-size="23" font-weight="700">场景助手</text><text x="800" y="278" fill="#d1f0ea" font-size="19">Raccoon</text><text x="800" y="312" fill="#d1f0ea" font-size="19">分析 · 整理 · 协作</text><text x="800" y="346" fill="#d1f0ea" font-size="19">工具调用仍需授权</text><rect x="208" y="482" width="784" height="94" rx="24" fill="#202b40"/><text x="246" y="522" fill="#fff" font-size="21" font-weight="700">读性能数字时同时问：</text><text x="246" y="556" fill="#eabf68" font-size="20">硬件？数据？提示词？统计方式？能否复现？</text><path d="M912 420v46" stroke="#eabf68" stroke-width="6" stroke-linecap="round"/><path d="m900 454 12 18 12-18" fill="none" stroke="#eabf68" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="782" y="626" fill="#a8b6c9" font-size="18">厂商披露 ≠ 独立排名</text></g></svg>