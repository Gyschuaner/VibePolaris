<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Qwen-Image 原生文字渲染</title>
  <desc id="desc">模型把中文、英文和海报布局一起生成，旁边标注开放权重和团队评测边界。</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171b48"/>
      <stop offset="1" stop-color="#7b3f6e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#f0d8aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b0d2b" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="1080" cy="90" r="190" fill="#f3c76b" opacity=".17"/>
  <circle cx="160" cy="560" r="250" fill="#5f9fcb" opacity=".16"/>
  <g filter="url(#shadow)">
    <rect x="110" y="86" width="590" height="430" rx="24" fill="url(#paper)" transform="rotate(-3 405 301)"/>
    <rect x="760" y="144" width="300" height="300" rx="28" fill="#f3c76b"/>
  </g>
  <g fill="#241c48" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="180" y="178" font-size="36" font-weight="800" transform="rotate(-3 180 178)">通义千问视觉基础模型</text>
    <text x="185" y="224" font-size="20" transform="rotate(-3 185 224)">原生中文 · 复杂场景 · 自动布局</text>
    <rect x="175" y="272" width="190" height="118" rx="14" fill="#d99b68" opacity=".78" transform="rotate(-3 270 330)"/>
    <rect x="390" y="272" width="190" height="118" rx="14" fill="#86a8bd" opacity=".86" transform="rotate(-3 485 330)"/>
    <rect x="175" y="410" width="405" height="5" rx="2" fill="#7b3f6e" opacity=".55" transform="rotate(-3 377 412)"/>
    <text x="185" y="454" font-size="18" transform="rotate(-3 185 454)">一、复杂文字渲染</text>
    <text x="380" y="454" font-size="18" transform="rotate(-3 380 454)">二、图像生成</text>

    <text x="815" y="205" font-size="22" font-weight="800">Qwen-Image</text>
    <text x="815" y="254" font-size="48" font-weight="800">20B</text>
    <text x="815" y="286" font-size="18">开放权重</text>
    <path d="M815 333 h190" stroke="#241c48" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1002" cy="333" r="18" fill="#241c48"/>
    <text x="815" y="380" font-size="16">团队评测 ≠ 独立结论</text>
    <text x="815" y="410" font-size="16">先复现，再比较</text>
  </g>
  <g fill="#fff9e9" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="110" y="575" font-size="22" letter-spacing="1">Qwen Team · 2025.08.04</text>
    <text x="1090" y="575" font-size="16" text-anchor="end" opacity=".8">演示 → 权重 → 复核</text>
  </g>
</svg>
