<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Cosmos 物理 AI 开发栈</title>
  <desc id="desc">现实传感器经过 NuRec 重建，再由 Cosmos 生成数据、Reason 规划并交给 Isaac 仿真和实机验证</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#182438" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">NVIDIA · 物理 AI 开发栈</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">从现实场景到仿真，再回到机器人验证</text>
  <rect x="82" y="278" width="190" height="170" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="177" y="338" fill="#f8fafc" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">传感器</text>
  <text x="177" y="378" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">现实 · 噪声 · 遮挡</text>
  <path d="M 292 364 H 348" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 328 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="368" y="278" width="190" height="170" rx="20" fill="#253b55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="463" y="338" fill="#d1fae5" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">NuRec</text>
  <text x="463" y="378" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">三维重建</text>
  <path d="M 578 364 H 634" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 614 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="654" y="278" width="190" height="170" rx="20" fill="#3a2c4d" stroke="#c4b5fd" stroke-width="2"/>
  <text x="749" y="338" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">Cosmos</text>
  <text x="749" y="378" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">生成 · Reason</text>
  <path d="M 864 364 H 920" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 900 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="940" y="278" width="180" height="170" rx="20" fill="#2d2534" stroke="#fbbf24" stroke-width="2"/>
  <text x="1030" y="338" fill="#fef3c7" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">Isaac</text>
  <text x="1030" y="378" fill="#fde68a" font-size="16" text-anchor="middle" font-family="sans-serif">仿真 · 实机</text>
  <rect x="300" y="500" width="600" height="74" rx="18" fill="#243043"/>
  <text x="600" y="546" fill="#d5def0" font-size="18" text-anchor="middle" font-family="sans-serif">仿真通过 ≠ 现实安全：还要验证传感器、控制和人工接管</text>
</svg>
