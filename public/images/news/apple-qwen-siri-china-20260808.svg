<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">苹果中国大陆 Mac 与千问接入示意图</title>
  <desc id="desc">Mac 上的 Siri 和写作工具经过用户授权，把文稿或照片请求交给千问并返回结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a3a"/><stop offset="1" stop-color="#273d7a"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff5ff"/><stop offset="1" stop-color="#a6b8ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050914" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="180" fill="#6ce3d7" opacity=".12"/>
  <circle cx="150" cy="580" r="230" fill="#7f89ff" opacity=".12"/>
  <rect x="100" y="120" width="560" height="350" rx="24" fill="#d9e4f0" filter="url(#shadow)"/>
  <rect x="125" y="145" width="510" height="290" rx="13" fill="url(#screen)"/>
  <rect x="185" y="190" width="205" height="105" rx="16" fill="#fff" opacity=".8"/>
  <text x="210" y="232" font-family="Arial, sans-serif" font-size="28" fill="#17254f">Siri</text>
  <text x="210" y="270" font-family="Arial, sans-serif" font-size="19" fill="#41527b">更深入的回答</text>
  <rect x="420" y="190" width="160" height="105" rx="16" fill="#fff" opacity=".8"/>
  <text x="445" y="232" font-family="Arial, sans-serif" font-size="25" fill="#17254f">写作工具</text>
  <text x="445" y="270" font-family="Arial, sans-serif" font-size="18" fill="#41527b">文字 / 图像</text>
  <path d="M80 480h600l-52 34H132z" fill="#a9bacb"/>
  <path d="M350 480h60l-8 19h-44z" fill="#7e93aa"/>
  <path d="M690 300 C760 300 775 250 830 250" fill="none" stroke="#6ce3d7" stroke-width="6" stroke-linecap="round"/>
  <path d="M690 360 C760 360 775 410 830 410" fill="none" stroke="#ffcf70" stroke-width="6" stroke-linecap="round"/>
  <circle cx="850" cy="250" r="72" fill="#6ce3d7" opacity=".95"/>
  <text x="813" y="258" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#102347">授权</text>
  <circle cx="990" cy="330" r="128" fill="#f3a7ff" opacity=".94" filter="url(#shadow)"/>
  <text x="918" y="320" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#291e55">千问</text>
  <text x="927" y="360" font-family="Arial, sans-serif" font-size="22" fill="#49376e">生成 / 分析</text>
  <text x="100" y="570" font-family="Arial, sans-serif" font-size="28" fill="#dce7ff">8 Aug 2026 · 中国大陆 Mac 指南</text>
</svg>
