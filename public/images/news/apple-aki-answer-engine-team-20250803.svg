<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Apple AKI answer engine</title><desc id="desc">据报道的 Apple AKI 团队从网页检索信息到回答问题的早期探索链路</desc><rect width="1200" height="720" fill="#111827"/><rect x="50" y="50" width="1100" height="620" rx="28" fill="#172033" stroke="#334155"/><text x="90" y="120" fill="#f8fafc" font-size="30" font-family="sans-serif" font-weight="700">Apple AKI：据报道的 answer engine</text><text x="90" y="158" fill="#a8b3c7" font-size="17" font-family="sans-serif">团队动向不等于产品上线</text><rect x="90" y="274" width="220" height="182" rx="18" fill="#202b3c" stroke="#fbbf24" stroke-width="2"/><text x="200" y="337" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">问题</text><text x="200" y="377" fill="#fde68a" font-size="15" text-anchor="middle" font-family="sans-serif">理解用户要找什么</text><text x="200" y="414" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">报道未公开实现</text><path d="M 328 365 H 382" stroke="#94a3b8" stroke-width="3"/><path d="M 362 354 l 12 11 -12 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="402" y="274" width="220" height="182" rx="18" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/><text x="512" y="337" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">网页检索</text><text x="512" y="377" fill="#bfdbfe" font-size="15" text-anchor="middle" font-family="sans-serif">找页面和证据</text><text x="512" y="414" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">AKI 探索方向</text><path d="M 640 365 H 694" stroke="#94a3b8" stroke-width="3"/><path d="M 674 354 l 12 11 -12 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="714" y="274" width="220" height="182" rx="18" fill="#202b3c" stroke="#a7f3d0" stroke-width="2"/><text x="824" y="337" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">核对与生成</text><text x="824" y="377" fill="#bbf7d0" font-size="15" text-anchor="middle" font-family="sans-serif">判断可信度再回答</text><text x="824" y="414" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">能力未被公开验证</text><rect x="970" y="274" width="150" height="182" rx="18" fill="#202b3c" stroke="#f87171" stroke-width="2"/><text x="1045" y="337" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">落点</text><text x="1045" y="377" fill="#fecaca" font-size="15" text-anchor="middle" font-family="sans-serif">Siri / Safari</text><text x="1045" y="414" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">尚未决定</text><text x="600" y="565" fill="#d5def0" font-size="19" text-anchor="middle" font-family="sans-serif">VibePolaris 自制机制图 · 报道事实与未公开实现</text><text x="600" y="603" fill="#7f8ba0" font-size="14" text-anchor="middle" font-family="sans-serif">CC BY 4.0 · 不把早期探索写成已发布产品</text></svg>
