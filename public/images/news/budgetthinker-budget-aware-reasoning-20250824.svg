<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BudgetThinker</title>
  <desc id="desc">A reasoning model sees its remaining token budget and trades time for accuracy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17263b"/><stop offset="1" stop-color="#284c59"/></linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#81d9cc"/><stop offset="1" stop-color="#ffbf7a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#040710" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101a2b" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a4bbcF" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">BUDGETTHINKER · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Think within the budget</text>
  <text x="124" y="255" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">Accuracy and time share one control surface.</text>
  <rect x="124" y="349" width="720" height="104" rx="20" fill="#243d4b" stroke="#81d9cc" stroke-width="2"/>
  <text x="160" y="391" fill="#81d9cc" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">REMAINING REASONING TOKENS</text>
  <rect x="160" y="414" width="594" height="13" rx="6" fill="#263144"/><rect x="160" y="414" width="404" height="13" rx="6" fill="url(#meter)"/><circle cx="564" cy="420" r="12" fill="#ffbf7a"/>
  <text x="900" y="388" fill="#ffbf7a" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">ROUTE</text><text x="900" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">stop / think</text>
  <text x="124" y="520" fill="#a4bbcf" font-family="Arial, sans-serif" font-size="18">A shorter thought is useful only when the task still holds together.</text>
</svg>
