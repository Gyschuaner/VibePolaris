    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8bf4e2"/><stop offset="1" stop-color="#7db7ff"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb0d0"/><stop offset="1" stop-color="#b6a4ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#060913" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1045" cy="88" r="210" fill="#8bf4e2" opacity=".11"/>
  <circle cx="1030" cy="572" r="260" fill="#ffb0d0" opacity=".1"/>
