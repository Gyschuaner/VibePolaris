<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Semantic Energy hallucination detection</title>
  <desc id="desc">Semantic clusters and internal logits form an uncertainty signal for hallucination detection.</desc>
  <defs>
