    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#faf9ff">LOOK INSIDE THE MODEL</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#eae6ff">流畅回答，也要给出不确定信号</text>
  <g transform="translate(818 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="402" rx="30" fill="#111b34" stroke="#c0ccff" stroke-width="3"/>
    <circle cx="77" cy="103" r="29" fill="url(#cyan)"/><circle cx="151" cy="85" r="22" fill="url(#cyan)"/><circle cx="181" cy="132" r="26" fill="url(#pink)"/>
    <circle cx="101" cy="165" r="23" fill="url(#pink)"/><circle cx="168" cy="196" r="28" fill="url(#cyan)"/>
    <path d="M53 247h147" stroke="#6e82be" stroke-width="7" stroke-linecap="round"/>
    <path d="M53 291h104" stroke="#6e82be" stroke-width="7" stroke-linecap="round"/>
    <rect x="53" y="333" width="147" height="42" rx="17" fill="#294c65" stroke="#8bf4e2" stroke-width="2"/>
    <text x="126" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eafffb">CHECK / ROUTE</text>
  </g>
  <g transform="translate(78 360)">
