<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">临床 LLM 对抗性幻觉研究</title><desc id="desc">模拟病例中的虚构细节经过三种提示条件，得到模型复述率和人工核验边界</desc><rect width="1200" height="720" fill="#111827"/><rect x="50" y="50" width="1100" height="620" rx="28" fill="#172033" stroke="#334155"/><text x="90" y="120" fill="#f8fafc" font-size="30" font-family="sans-serif" font-weight="700">临床 LLM 对抗性幻觉研究</text><text x="90" y="158" fill="#a8b3c7" font-size="17" font-family="sans-serif">模拟病例里的一处伪事实，怎样改变模型回答</text><rect x="92" y="270" width="230" height="190" rx="18" fill="#202b3c" stroke="#f87171" stroke-width="2"/><text x="207" y="335" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">植入伪事实</text><text x="207" y="375" fill="#fecaca" font-size="15" text-anchor="middle" font-family="sans-serif">300 个模拟病例</text><text x="207" y="412" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">化验、体征或疾病</text><path d="M 340 365 H 390" stroke="#94a3b8" stroke-width="3"/><path d="M 370 354 l 12 11 -12 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="410" y="270" width="230" height="190" rx="18" fill="#202b3c" stroke="#fbbf24" stroke-width="2"/><text x="525" y="335" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">默认提示</text><text x="525" y="375" fill="#fde68a" font-size="15" text-anchor="middle" font-family="sans-serif">65.9%</text><text x="525" y="412" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">顺着错误继续说</text><path d="M 658 365 H 708" stroke="#94a3b8" stroke-width="3"/><path d="M 688 354 l 12 11 -12 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="728" y="270" width="230" height="190" rx="18" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/><text x="843" y="335" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">缓解提示</text><text x="843" y="375" fill="#bfdbfe" font-size="15" text-anchor="middle" font-family="sans-serif">44.2%</text><text x="843" y="412" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">降低但未消除</text><rect x="978" y="270" width="150" height="190" rx="18" fill="#202b3c" stroke="#a7f3d0" stroke-width="2"/><text x="1053" y="335" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">人工核验</text><text x="1053" y="375" fill="#bbf7d0" font-size="15" text-anchor="middle" font-family="sans-serif">仍必需</text><text x="1053" y="412" fill="#a8b3c7" font-size="14" text-anchor="middle" font-family="sans-serif">非真实临床率</text><text x="600" y="565" fill="#d5def0" font-size="19" text-anchor="middle" font-family="sans-serif">VibePolaris 自制机制图 · 研究结果与外推边界</text><text x="600" y="603" fill="#7f8ba0" font-size="14" text-anchor="middle" font-family="sans-serif">CC BY 4.0 · 模拟实验不等于真实诊疗错误率</text></svg>
