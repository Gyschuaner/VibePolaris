<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">美中 SI 对话与拟建事故通道</title>
  <desc id="desc">两条国家代表线连接到 SI 对话，再分出风险讨论和拟建事故通道。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101a36"/><stop offset="1" stop-color="#241532"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <path d="M240 210C410 110 790 110 960 210" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity=".75"/>
  <path d="M240 255C415 390 785 390 960 255" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-dasharray="14 18" opacity=".72"/>
  <circle cx="240" cy="230" r="82" fill="#171f45" stroke="#a78bfa" stroke-width="4"/>
  <circle cx="960" cy="230" r="82" fill="#321b3e" stroke="#fda4af" stroke-width="4"/>
  <text x="240" y="225" text-anchor="middle" fill="#f5f3ff" font-size="34" font-family="sans-serif" font-weight="700">美国</text>
  <text x="240" y="263" text-anchor="middle" fill="#c4b5fd" font-size="18" font-family="sans-serif">SI 代表</text>
  <text x="960" y="225" text-anchor="middle" fill="#fff1f2" font-size="34" font-family="sans-serif" font-weight="700">中国</text>
  <text x="960" y="263" text-anchor="middle" fill="#fda4af" font-size="18" font-family="sans-serif">SI 代表</text>
  <rect x="385" y="160" width="430" height="165" rx="28" fill="#172b46" stroke="#67e8f9" stroke-width="3" filter="url(#glow)"/>
  <text x="600" y="225" text-anchor="middle" fill="#ecfeff" font-size="42" font-family="sans-serif" font-weight="700">SI 对话</text>
  <text x="600" y="270" text-anchor="middle" fill="#a5f3fc" font-size="20" font-family="sans-serif">风险 · 收益 · 共同语言</text>
  <rect x="355" y="440" width="490" height="110" rx="24" fill="#15312d" stroke="#a7f3d0" stroke-width="3"/>
  <circle cx="430" cy="495" r="20" fill="#a7f3d0"/><path d="M424 495h12M430 489v12" stroke="#15312d" stroke-width="4"/>
  <text x="480" y="490" fill="#ecfdf5" font-size="27" font-family="sans-serif" font-weight="700">拟建事故通道</text>
  <text x="480" y="520" fill="#a7f3d0" font-size="17" font-family="sans-serif">触发条件和通知格式待定</text>
  <text x="600" y="625" text-anchor="middle" fill="#c4b5fd" font-size="22" font-family="sans-serif">下一次 SI 交流：2026 年 11 月</text>
</svg>
