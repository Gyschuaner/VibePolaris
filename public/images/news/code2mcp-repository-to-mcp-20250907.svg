<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Code2MCP：从代码仓库到 MCP 服务</title>
<desc id="desc">多 Agent 工作流依次进行代码分析、环境设置、工具设计和服务生成，再经过自纠错与权限验收。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0f7ff"/><stop offset="1" stop-color="#fff2e6"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5b778d"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#284a61" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#315c75" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">代码库里藏着工具，难的是把它安全地接出来</text>
<text x="70" y="114" fill="#718999" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">repository → multi-agent workflow → MCP service</text>
<g filter="url(#shadow)">
 <rect x="66" y="173" width="252" height="322" rx="22" fill="#fff" stroke="#b9d3e5" stroke-width="2"/>
 <text x="103" y="221" fill="#3d7897" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">GitHub 仓库</text>
 <rect x="104" y="257" width="176" height="48" rx="10" fill="#e3f1fa"/><text x="192" y="287" text-anchor="middle" fill="#3d7897" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">代码与依赖</text>
 <rect x="104" y="323" width="176" height="48" rx="10" fill="#fff0d9"/><text x="192" y="353" text-anchor="middle" fill="#a06b34" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">可复用函数</text>
 <text x="192" y="424" text-anchor="middle" fill="#718999" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">生物 / 数学 / 流体</text>
 <text x="192" y="463" text-anchor="middle" fill="#b16d4a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">先隔离再运行</text>
</g>
<path d="M334 335 H373" stroke="#5b778d" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="393" y="145" width="410" height="380" rx="22" fill="#fff" stroke="#c6b8e4" stroke-width="2"/>
 <text x="433" y="201" fill="#624f99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">多 Agent 适配链</text>
 <rect x="433" y="245" width="150" height="55" rx="11" fill="#e4f1fb"/><text x="508" y="279" text-anchor="middle" fill="#47718e" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">代码分析</text>
 <rect x="613" y="245" width="150" height="55" rx="11" fill="#eee7ff"/><text x="688" y="279" text-anchor="middle" fill="#765ca1" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">环境设置</text>
 <path d="M585 272 H606" stroke="#5b778d" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="433" y="340" width="150" height="55" rx="11" fill="#e5f2eb"/><text x="508" y="374" text-anchor="middle" fill="#4b8464" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">工具 schema</text>
 <rect x="613" y="340" width="150" height="55" rx="11" fill="#fff0d9"/><text x="688" y="374" text-anchor="middle" fill="#a06b34" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">服务生成</text>
 <path d="M688 302 V330" stroke="#5b778d" stroke-width="4" marker-end="url(#arrow)"/><path d="M613 367 H585" stroke="#5b778d" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M508 395 C508 449 688 449 688 395" fill="none" stroke="#8d75b5" stroke-width="4" marker-end="url(#arrow)"/>
 <text x="433" y="488" fill="#718999" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">自纠错 → 检查反馈 → 回修</text>
</g>
<path d="M824 335 H861" stroke="#5b778d" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="881" y="173" width="253" height="322" rx="22" fill="#fff" stroke="#b8d5c3" stroke-width="2"/>
 <text x="919" y="221" fill="#4c8665" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">MCP 服务</text>
 <rect x="916" y="257" width="184" height="48" rx="10" fill="#e5f2eb"/><text x="1008" y="287" text-anchor="middle" fill="#4c8665" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">可发现工具</text>
 <rect x="916" y="323" width="184" height="48" rx="10" fill="#e4f1fb"/><text x="1008" y="353" text-anchor="middle" fill="#47718e" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">权限 / 超时</text>
 <rect x="916" y="389" width="184" height="48" rx="10" fill="#fff0d9"/><text x="1008" y="419" text-anchor="middle" fill="#a06b34" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">人工验收</text>
 <text x="1008" y="463" text-anchor="middle" fill="#718999" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">最小权限后再发布</text>
</g>
<text x="68" y="575" fill="#a06b34" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">自动生成不等于自动获准执行</text>
<text x="68" y="613" fill="#718999" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">依赖审查、沙箱、schema review 和回滚仍不可省。</text>
</svg>
