<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Direct-Scoring：把 pairwise 比较转换成绝对分数</title>
<desc id="desc">方法先生成从低到高的合成摘要锚点，再和待评摘要比较，用概率加权得到可设阈值的分数。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#fff5e7"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4e79a5"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263b54" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#203c5d" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">从“哪篇更好”到“是否过线”</text>
<text x="70" y="114" fill="#6b7f96" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">合成质量锚点 · Better / Worse / Similar · 阈值分数</text>
<g filter="url(#shadow)">
 <rect x="66" y="174" width="250" height="324" rx="22" fill="#fff" stroke="#b8d1ea" stroke-width="2"/>
 <text x="105" y="225" fill="#356b9a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">质量锚点</text>
 <rect x="104" y="258" width="174" height="42" rx="10" fill="#fde0dc"/><text x="191" y="285" text-anchor="middle" fill="#a1534a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">1 · 最低</text>
 <rect x="104" y="315" width="174" height="42" rx="10" fill="#fcebd2"/><text x="191" y="342" text-anchor="middle" fill="#8a6a37" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">2  3  4</text>
 <rect x="104" y="372" width="174" height="42" rx="10" fill="#dcefe9"/><text x="191" y="399" text-anchor="middle" fill="#2e7567" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">5 · 最高</text>
 <text x="191" y="452" text-anchor="middle" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">合成摘要</text>
 </g>
 <path d="M331 336 H380" stroke="#4e79a5" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="400" y="152" width="390" height="370" rx="22" fill="#fff" stroke="#c8b6e4" stroke-width="2"/>
 <text x="440" y="205" fill="#604d99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">逐级比较</text>
 <rect x="440" y="254" width="310" height="56" rx="12" fill="#e5efff"/><text x="595" y="288" text-anchor="middle" fill="#356b9a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">待评摘要 vs. 锚点 1</text>
 <rect x="440" y="328" width="310" height="56" rx="12" fill="#eee8fb"/><text x="595" y="362" text-anchor="middle" fill="#604d99" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">Better · Worse · Similar</text>
 <path d="M470 432 H720" stroke="#7a68b5" stroke-width="8" stroke-linecap="round"/><circle cx="610" cy="432" r="12" fill="#e39a67"/>
 <text x="440" y="474" fill="#706b91" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">把比较概率加权到评分轴</text>
 </g>
 <path d="M805 336 H854" stroke="#4e79a5" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="874" y="174" width="260" height="324" rx="22" fill="#fff" stroke="#a8d8cc" stroke-width="2"/>
 <text x="909" y="225" fill="#2e7567" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">可执行结果</text>
 <text x="909" y="286" fill="#5d827b" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">样本分数</text>
 <text x="909" y="330" fill="#2e7567" font-size="38" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">3.8</text>
 <rect x="909" y="365" width="184" height="48" rx="10" fill="#e7f4f0"/><text x="1001" y="396" text-anchor="middle" fill="#2e7567" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">阈值：≥ 3.5</text>
 <text x="1001" y="457" text-anchor="middle" fill="#6b7f96" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">仍需人工校准</text>
 </g>
<text x="68" y="576" fill="#356b9a" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">SummEval +0.03 · TopicalChat −0.03 · HANNA +0.05</text>
<text x="68" y="614" fill="#6b7f96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">是基准上的样本级相关性变化，不是跨任务的人工真值。</text>
</svg>
