<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LM agent risk knowledge gap</title>
  <desc id="desc">An agent moves from risk knowledge to trajectory recognition to safe action, with an independent verifier before execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13253b"/><stop offset="1" stop-color="#472d49"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2f4e8"/><stop offset="1" stop-color="#69b8e5"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#efa16c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="704" height="136" rx="24" fill="#20354d" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 19 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f4fbff">KNOWLEDGE ≠ SAFE ACTION</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">知道危险，到了轨迹里还要再检查</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">SAFETY EXECUTION GAP</text>
    <g transform="translate(30 70)">
      <rect x="0" y="0" width="274" height="55" rx="14" fill="url(#cyan)"/>
      <text x="137" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">风险知识 · &gt;98%</text>
      <path d="M137 65 V94" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M118 82 L137 101 L156 82" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="112" width="274" height="55" rx="14" fill="#6e9bd3"/>
      <text x="137" y="147" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f4fbff">轨迹识别 · &gt;23%下降</text>
      <path d="M137 177 V206" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M118 194 L137 213 L156 194" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="224" width="274" height="55" rx="14" fill="url(#amber)"/>
      <text x="137" y="259" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">安全执行 · &lt;26%</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">独立验证器 · −55.3%</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">把“知道规则”与“真的停手”分开测</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">抽象轨迹，再让独立验证器检查候选动作</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">写入、删除、外发仍要隔离、确认、回滚</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">LM AGENTS · RISK KNOWLEDGE AND EXECUTION</text>
</svg>
