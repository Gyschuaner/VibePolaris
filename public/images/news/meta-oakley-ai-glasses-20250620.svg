<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Oakley Meta 运动型 AI 眼镜</title><desc id="desc">一副眼镜连接视野、语音和 Meta AI，旁边标出视频、回答和续航的边界。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b2b"/><stop offset="1" stop-color="#223f55"/></linearGradient><linearGradient id="beam"><stop stop-color="#f0a35e"/><stop offset="1" stop-color="#74e0c1"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><g opacity=".16" stroke="#c1e1de"><path d="M75 130H1125M75 235H1125M75 340H1125M75 445H1125M75 550H1125"/><path d="M170 80V620M350 80V620M530 80V620M710 80V620M890 80V620M1070 80V620"/></g><text x="76" y="82" fill="#f6faf7" font-family="Arial" font-size="28" font-weight="700">Oakley Meta · 运动场景的 AI 入口</text><text x="76" y="116" fill="#a9c4ca" font-family="Arial" font-size="16">镜头收集上下文，声音把回答送回耳边</text><g transform="translate(150 270)" fill="none" stroke="#f5f4ee" stroke-width="13"><path d="M0 80Q40 0 150 40L300 40Q410 0 450 80"/><path d="M150 40Q140 150 225 150Q310 150 300 40"/><path d="M0 80Q20 155 90 150M450 80Q430 155 360 150"/></g><circle cx="262" cy="314" r="22" fill="#f0a35e"/><path d="M262 314L525 210" stroke="url(#beam)" stroke-width="7" stroke-dasharray="12 14"/><path d="M525 210L720 210" stroke="#74e0c1" stroke-width="7" stroke-dasharray="12 14"/><g font-family="Arial"><rect x="520" y="160" width="190" height="96" rx="18" fill="#1b3441" stroke="#4e7780"/><text x="548" y="195" fill="#f5f4ee" font-size="18">Meta AI</text><text x="548" y="224" fill="#a9c4ca" font-size="14">“风力会影响这一杆吗？”</text><rect x="735" y="160" width="330" height="96" rx="18" fill="#1b3441" stroke="#4e7780"/><text x="764" y="198" fill="#74e0c1" font-size="18">耳边回答</text><text x="764" y="226" fill="#a9c4ca" font-size="14">不用掏手机，也没有镜片显示</text><rect x="785" y="390" width="270" height="112" rx="20" fill="#203a46" stroke="#4e7780"/><text x="813" y="426" fill="#f0a35e" font-size="1