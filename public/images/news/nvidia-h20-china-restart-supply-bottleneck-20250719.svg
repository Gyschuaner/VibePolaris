<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">H20 对华供应的两只时钟</title><desc id="desc">政策授权、库存、台积电产线和交付之间的时间关系。</desc><rect width="1200" height="680" rx="36" fill="#101827"/><text x="72" y="92" fill="#f8fafc" font-size="42" font-family="sans-serif" font-weight="700">H20 重启：许可恢复 ≠ 立刻到货</text><text x="72" y="136" fill="#a7b7cf" font-size="22" font-family="sans-serif">7 月 19 日报道把政策时钟和制造时钟分开</text><g font-family="sans-serif"><rect x="72" y="220" width="232" height="190" rx="24" fill="#263a63"/><text x="104" y="274" fill="#b9d7ff" font-size="22">政策</text><text x="104" y="326" fill="white" font-size="30" font-weight="700">申请 / 批准</text><text x="104" y="370" fill="#d5e3fb" font-size="18">官方说希望尽快交付</text><path d="M326 315h92" stroke="#6ea8fe" stroke-width="8" stroke-linecap="round"/><path d="m401 291 28 24-28 24" fill="none" stroke="#6ea8fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="438" y="220" width="232" height="190" rx="24" fill="#3b3a5d"/><text x="470" y="274" fill="#ddd6fe" font-size="22">库存</text><text x="470" y="326" fill="white" font-size="30" font-weight="700">数量有限</text><text x="470" y="370" fill="#e5e7eb" font-size="18">客户分配未公开</text><path d="M694 315h92" stroke="#f0b86a" stroke-width="8" stroke-linecap="round"/><path d="m769 291 28 24-28 24" fill="none" stroke="#f0b86a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="814" y="220" width="310" height="190" rx="24" fill="#573246"/><text x="846" y="274" fill="#fecdd3" font-size="22">制造</text><text x="846" y="326" fill="white" font-size="30" font-weight="700">产线已转移</text><text x="846" y="370" fill="#fbe2e4" font-size="18">从头生产可能需 9 个月</text><path d="M140 505h900" stroke="#64748b" stroke-width="2" stroke-dasharray="12 12"/><text x="72" y="565" fill="#fbbf24" font-size="26" font-family="sans-serif" font-weight="700">证据边界</text><text x="72" y="608" fill="#dbeafe" font-size="22" font-family="sans-serif">政策消息确认“能申请”，报道提示“供应受限”；许可证和真实出货仍需后续记录</text></g></svg>