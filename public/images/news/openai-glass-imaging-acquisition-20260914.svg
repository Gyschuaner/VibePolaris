  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <rect x="86" y="170" width="198" height="150" rx="22" fill="#5bc0be" opacity=".8"/>
  <path d="M112 209h146M112 250h105M112 291h122" stroke="#121826" stroke-width="15" stroke-linecap="round" opacity=".7"/>
  <path d="M294 245h116" stroke="#ffd166" stroke-width="12" stroke-linecap="round" stroke-dasharray="18 16"/>
