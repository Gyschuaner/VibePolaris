  <path d="M478 182l124 176M602 182L478 358" stroke="#fff3d6" stroke-width="5" opacity=".55"/>
  <path d="M680 245h92" stroke="#ffd166" stroke-width="12" stroke-linecap="round" stroke-dasharray="18 16"/>
  <rect x="778" y="170" width="98" height="150" rx="22" fill="#f7ede2"/>
