  <path d="M804 296h46" stroke="#34506b" stroke-width="9" stroke-linecap="round"/>
  <text x="86" y="92" fill="#fff3d6" font-family="Arial, sans-serif" font-size="30" font-weight="700">NEURAL ISP</text>
  <text x="86" y="466" fill="#c5d5e4" font-family="Arial, sans-serif" font-size="21">RAW frame → learned optics → on-device image</text>
