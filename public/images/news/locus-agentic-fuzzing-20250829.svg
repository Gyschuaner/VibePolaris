<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Locus 的 Agent 定向模糊测试路标</title><desc id="desc">Agent 合成中间谓词，经过符号执行检查后引导模糊测试抵达目标状态。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">Locus：给模糊测试铺出中间路标</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">目标状态 · Agent 谓词 · 符号执行 · 受控复现</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="110" y="282" width="190" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="205" y="326" text-anchor="middle" font-size="26" font-weight="700" fill="#21456f">目标状态</text><text x="205" y="362" text-anchor="middle" font-size="18" fill="#365b83">深层分支</text>
<rect x="380" y="282" width="190" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="475" y="326" text-anchor="middle" font-size="26" font-weight="700" fill="#275d39">中间路标</text><text x="475" y="362" text-anchor="middle" font-size="18" fill="#3e7650">语义谓词</text>
<rect x="650" y="282" width="190" height="112" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="745" y="326" text-anchor="middle" font-size="26" font-weight="700" fill="#805513">边界检查</text><text x="745" y="362" text-anchor="middle" font-size="18" fill="#966b24">符号执行</text>
<rect x="920" y="282" width="190" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1015" y="326" text-anchor="middle" font-size="26" font-weight="700" fill="#783553">受控验证</text><text x="1015" y="362" text-anchor="middle" font-size="18" fill="#94516f">发现与修复</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M300 338 H370"/><path d="M570 338 H640"/><path d="M840 338 H910"/></g><g fill="#607080"><path d="M370 338 l-14 -9 v18z"/><path d="M640 338 l-14 -9 v18z"/><path d="M910 338 l-14 -9 v18z"/></g>
<text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">加速搜索，也要证明没有把目标路径剪掉</text>
</svg>