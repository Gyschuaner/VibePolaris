<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Benchmark 改写鲁棒性：排名与绝对分数</title>
<desc id="desc">同一题目保持语义但改变表达，比较模型相对排名和绝对效果的变化。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0f6ff"/><stop offset="1" stop-color="#fff6ed"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3d6ba5"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#26344d" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#203a5c" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">题目换种说法，分数会不会跟着变？</text>
<text x="72" y="118" fill="#6a7d94" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">六个基准 · 34 个 LLM · 排名相对稳定，绝对效果下降</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="250" height="292" rx="22" fill="#fff" stroke="#c8d9f0" stroke-width="2"/>
 <text x="108" y="238" fill="#3d6ba5" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">同一语义</text>
 <rect x="108" y="272" width="174" height="54" rx="12" fill="#deebff"/><text x="195" y="307" text-anchor="middle" fill="#2c5488" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">原题</text>
 <rect x="108" y="342" width="174" height="54" rx="12" fill="#deebff"/><text x="195" y="377" text-anchor="middle" fill="#2c5488" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">等义改写</text>
 <text x="108" y="443" fill="#6a7d94" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">目标和答案空间冻结</text>
</g>
<path d="M338 334 H400" stroke="#3d6ba5" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="420" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#ecd09f" stroke-width="2"/>
 <text x="458" y="220" fill="#a36f18" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">34 个模型</text>
 <circle cx="493" cy="295" r="30" fill="#fff0c8"/><text x="493" y="302" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">A</text>
 <circle cx="594" cy="295" r="30" fill="#ffe4bd"/><text x="594" y="302" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">B</text>
 <circle cx="695" cy="295" r="30" fill="#ffd9ad"/><text x="695" y="302" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">C</text>
 <text x="458" y="371" fill="#806b42" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">原题与改写成对运行</text>
 <text x="458" y="409" fill="#806b42" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">记录版本、prompt、预算</text>
 <text x="458" y="448" fill="#806b42" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">看分布，不只看最高分</text>
</g>
<path d="M788 334 H850" stroke="#3d6ba5" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#b7d8cf" stroke-width="2"/>
 <text x="906" y="220" fill="#30766d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">两种结论</text>
 <rect x="906" y="255" width="188" height="56" rx="12" fill="#d9f1eb"/><text x="1000" y="290" text-anchor="middle" fill="#246158" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">排名相对稳</text>
 <rect x="906" y="333" width="188" height="56" rx="12" fill="#fde2dd"/><text x="1000" y="368" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">绝对分数下降</text>
 <text x="1000" y="438" text-anchor="middle" fill="#30766d" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">自然表达回归</text>
 <text x="1000" y="468" text-anchor="middle" fill="#6a7d94" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高分不等于部署稳</text>
</g>
<text x="70" y="578" fill="#3d6ba5" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Benchmark 需要测语言变化，而不只测固定题面</text>
<text x="70" y="615" fill="#6a7d94" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">等义输入下还能保持能力，才更接近用户真正会说的话。</text>
</svg>