<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Shieldstral 自然语言政策审核流程</title><desc id="desc">使用方用自然语言提出安全政策问题，Shieldstral 同时读取文本或图像并返回 yes/no 概率，部署方再设阈值或转人工。</desc><rect width="960" height="540" rx="28" fill="#111827"/><rect x="70" y="160" width="200" height="150" rx="20" fill="#312e81" stroke="#a5b4fc" stroke-width="3"/><text x="170" y="215" text-anchor="middle" fill="#e0e7ff" font-size="22" font-family="sans-serif">自然语言政策</text><text x="170" y="255" text-anchor="middle" fill="#c7d2fe" font-size="16" font-family="sans-serif">“是否适合未成年人？”</text><path d="M270 235H370" stroke="#a5b4fc" stroke-width="4" marker-end="url(#a)"/><rect x="370" y="125" width="220" height="220" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="480" y="190" text-anchor="middle" fill="#cffafe" font-size="24" font-family="sans-serif">Shieldstral</text><text x="480" y="230" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">文本 + 图像</text><text x="480" y="270" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">提示词 + 回答</text><text x="480" y="310" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">单次推理</text><path d="M590 235H690" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="690" y="160" width="200" height="150" rx="20" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="790" y="215" text-anchor="middle" fill="#fef3c7" font-size="22" font-family="sans-serif">安全分数</text><text x="790" y="255" text-anchor="middle" fill="#fde68a" font-size="16" font-family="sans-serif">阈值 / 人工复核</text><text x="480" y="455" text-anchor="middle" fill="#94a3b8" font-size="19" font-family="sans-serif">3B · Apache 2.0 · 2026-08-04</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker></defs></svg>
