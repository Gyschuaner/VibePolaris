<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">AnchorRAG 的开放世界多 Agent 检索</title><desc id="desc">预测 Agent 生成候选锚点，多个检索 Agent 并行探索，监督 Agent 合成知识路径。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f1"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf9" stroke="#d9d3c6" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#28312f">AnchorRAG：先找到可能的起点</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#69736f">候选锚点 · 并行多跳 · 监督收敛 · 路径可追溯</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="260" width="220" height="132" rx="22" fill="#e9eef8" stroke="#7d98bd" stroke-width="3"/><text x="222" y="312" text-anchor="middle" font-size="25" font-weight="700" fill="#2e5075">Predictor</text><text x="222" y="350" text-anchor="middle" font-size="18" fill="#4c6f91">候选锚点</text>
<rect x="490" y="205" width="220" height="112" rx="20" fill="#eaf3eb" stroke="#79a483" stroke-width="3"/><text x="600" y="252" text-anchor="middle" font-size="24" font-weight="700" fill="#2f6539">Retriever A</text><text x="600" y="283" text-anchor="middle" font-size="17" fill="#507b59">路径 1</text>
<rect x="490" y="340" width="220" height="112" rx="20" fill="#f9ecd8" stroke="#d0a264" stroke-width="3"/><text x="600" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#805821">Retriever B</text><text x="600" y="418" text-anchor="middle" font-size="17" fill="#9a7435">路径 2</text>
<rect x="868" y="260" width="220" height="132" rx="22" fill="#f2e6f0" stroke="#b582a1" stroke-width="3"/><text x="978" y="312" text-anchor="middle" font-size="25" font-weight="700" fill="#713d5c">Supervisor</text><text x="978" y="350" text-anchor="middle" font-size="18" fill="#925c79">合成知识路径</text>
</g>
<g fill="none" stroke="#66736d" stroke-width="5" stroke-linecap="round"><path d="M332 326 H470"/><path d="M710 261 C770 261 790 302 850 302"/><path d="M710 396 C770 396 790 350 850 350"/></g><g fill="#66736d"><path d="M470 326 l-15 -10 v20z"/><path d="M850 302 l-15 -10 v20z"/><path d="M850 350 l-15 -10 v20z"/></g>
<text x="600" y="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5b55">没有确定锚点，也可以把不确定性留在检索入口</text>
<text x="600" y="538" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#76817b">冲突路径要继续查证，不能只留下最顺的一条故事</text>
</svg>
