<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT agent 扩展到 Enterprise 与 Edu</title>
  <desc id="desc">ChatGPT agent 从个人方案扩展到 Enterprise 与 Edu，读取、行动和审计需要组织划定边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1c304d"/>
      <stop offset="1" stop-color="#627ca1"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f0e5"/>
      <stop offset="1" stop-color="#dbe6ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#112139" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="95" r="190" fill="#f0c978" opacity=".18"/>
  <circle cx="110" cy="540" r="230" fill="#9bbbc6" opacity=".17"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#f0c978" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f4f0e5"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#e5bf79"/>
  </g>
  <g fill="#1c304d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">Enterprise</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#bfd6df"/>
    <text x="218" y="261" font-size="24" text-anchor="middle" font-weight="800">+ Edu</text>
    <path d="M108 329 h214" stroke="#627ca1" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">方案扩展 · 试点</text>
    <text x="108" y="405" font-size="16">不是新 Agent 发布</text>

    <text x="489" y="178" font-size="25" font-weight="800">Agent 动作</text>
    <circle cx="600" cy="260" r="62" fill="#627ca1"/>
    <path d="M568 260 h64 M600 228 v64" stroke="#f4f0e5" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#627ca1" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">网站 · 文件 · 表格</text>

    <text x="860" y="178" font-size="25" font-weight="800">治理</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#627ca1"/>
    <text x="970" y="261" font-size="23" fill="#f4f0e5" text-anchor="middle" font-weight="800">权限 · 确认</text>
    <path d="M860 330 h215" stroke="#1c304d" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">日志 · 撤销 · 接管</text>
    <text x="860" y="405" font-size="16">能做什么要先划线</text>
  </g>
  <g fill="#f4f0e5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">CHATGPT AGENT · 2025.08.08</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">入口打开，边界要跟上</text>
  </g>
</svg>
