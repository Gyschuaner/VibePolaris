<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AgentScope 1.0 workflow</title>
  <desc id="desc">A developer workflow links models, MCP tools, asynchronous interaction, evaluation and a runtime sandbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171b31"/><stop offset="1" stop-color="#234d55"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffca7a"/><stop offset="1" stop-color="#7ce4d3"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#040913" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="70" width="1056" height="488" rx="36" fill="#10182a" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".15" filter="url(#shadow)"/>
  <text x="124" y="142" fill="#9bb5cf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">AGENTSCOPE 1.0 · 2025.08.22</text>
  <text x="124" y="213" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">From loop to workflow</text>
  <text x="124" y="258" fill="#c9d9e9" font-family="Arial, sans-serif" font-size="25">Models · MCP · async · eval · sandbox</text>
  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <rect x="124" y="350" width="150" height="82" rx="17" fill="#293652" stroke="#8bb6ff" stroke-width="2"/><text x="199" y="398" fill="#ffffff">MODEL</text>
    <rect x="322" y="350" width="150" height="82" rx="17" fill="#233d4a" stroke="#7ce4d3" stroke-width="2"/><text x="397" y="398" fill="#ffffff">MCP</text>
    <rect x="520" y="350" width="150" height="82" rx="17" fill="#3e3147" stroke="#ffca7a" stroke-width="2"/><text x="595" y="398" fill="#ffffff">ASYNC</text>
    <rect x="718" y="350" width="150" height="82" rx="17" fill="#293652" stroke="#8bb6ff" stroke-width="2"/><text x="793" y="398" fill="#ffffff">EVAL</text>
    <rect x="916" y="350" width="150" height="82" rx="17" fill="#233d4a" stroke="#7ce4d3" stroke-width="2"/><text x="991" y="398" fill="#ffffff">SANDBOX</text>
  </g>
  <g stroke="url(#line)" stroke-width="5" stroke-linecap="round" fill="none"><path d="M275 391h42"/><path d="M473 391h42"/><path d="M671 391h42"/><path d="M869 391h42"/></g>
  <text x="124" y="498" fill="#9bb5cf" font-family="Arial, sans-serif" font-size="18">A framework makes the path observable; it does not grant permission by itself.</text>
</svg>
