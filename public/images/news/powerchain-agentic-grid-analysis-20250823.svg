<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PowerChain grid analysis agent</title>
  <desc id="desc">Natural language tasks connect to verified trajectories and a power systems simulator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14263a"/><stop offset="1" stop-color="#214e4a"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8cb5ff"/><stop offset="1" stop-color="#7de1c8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#040711" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="68" width="1056" height="496" rx="38" fill="#101a2a" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a4bad0" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">POWERCHAIN · 2025.08.23</text>
  <text x="124" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Ask the grid. Run the model.</text>
  <text x="124" y="255" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">Tools and verified traces shape the context.</text>
  <rect x="124" y="344" width="238" height="108" rx="20" fill="#293653" stroke="#8cb5ff" stroke-width="2"/><text x="158" y="385" fill="#8cb5ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">QUESTION</text><text x="158" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">natural language</text>
  <path d="M386 398h70" stroke="url(#wire)" stroke-width="5" stroke-linecap="round"/><path d="M438 376l28 22-28 22" fill="none" stroke="#d6e4ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="484" y="317" width="238" height="162" rx="20" fill="#233f46" stroke="#7de1c8" stroke-width="2"/><text x="518" y="358" fill="#7de1c8" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">CONTEXT</text><text x="518" y="400" fill="#ffffff" font-family="Arial, sans-serif" font-size="26">GridLAB-D</text><text x="518" y="437" fill="#c7d9dc" font-family="Arial, sans-serif" font-size="18">+ verified traces</text>
  <path d="M746 398h70" stroke="url(#wire)" stroke-width="5" stroke-linecap="round"/><path d="M798 376l28 22-28 22" fill="none" stroke="#d6e4ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="844" y="344" width="222" height="108" rx="20" fill="#3d3245" stroke="#ffbf7e" stroke-width="2"/><text x="878" y="385" fill="#ffbf7e" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">RESULT</text><text x="878" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">reviewable</text>
  <text x="124" y="520" fill="#a4bad0" font-family="Arial, sans-serif" font-size="18">Analysis support is not automatic control.</text>
</svg>
