<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AI 速度争论中的两种公开表态</title>
  <desc id="desc">两张演讲卡片分别代表加速 AI 的公开立场和安全节奏的提醒。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27123f"/><stop offset="1" stop-color="#7a1f4d"/></linearGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffca3a"/><stop offset="1" stop-color="#ff595e"/></linearGradient>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <path d="M82 366h796" stroke="#ffca3a" stroke-width="6" opacity=".3"/>
  <path d="M105 349h190M154 317h178M224 285h170" stroke="url(#speed)" stroke-width="12" stroke-linecap="round"/>
  <rect x="248" y="150" width="220" height="180" rx="26" fill="#f7f0ff"/>
  <path d="M286 206h144M286 252h110" stroke="#4a214e" stroke-width="15" stroke-linecap="round"/>
  <path d="M288 298h74" stroke="#ff595e" stroke-width="13" stroke-linecap="round"/>
  <rect x="520" y="150" width="220" height="180" rx="26" fill="#2d1b43" stroke="#ffca3a" stroke-width="4"/>
  <path d="M558 206h144M558 252h108" stroke="#f7f0ff" stroke-width="15" stroke-linecap="round"/>
  <path d="M558 298h74" stroke="#65e572" stroke-width="13" stroke-linecap="round"/>
  <circle cx="440" cy="424" r="32" fill="#ffca3a"/>
  <path d="M424 424h32M440 408v32" stroke="#27123f" stroke-width="8" stroke-linecap="round"/>
  <text x="86" y="92" fill="#f7f0ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">SPEED OR SAFETY?</text>
  <text x="86" y="478" fill="#e9c8df" font-family="Arial, sans-serif" font-size="21">公开表态是新闻，行动证据要另行核对</text>
</svg>
