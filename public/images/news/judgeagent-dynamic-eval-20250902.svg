<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">JudgeAgent 的动态评测</title><desc id="desc">Agent 沿知识图生成问题，根据回答调整难度，并与固定回归集交叉复核。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d7d3c9" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#293333">JudgeAgent：让评测题跟着能力走</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#6f7978">知识图 · 动态出题 · 多轮追问 · 固定回归</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="100" y="258" width="214" height="136" rx="22" fill="#e8eef8" stroke="#7c98bc" stroke-width="3"/><text x="207" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">知识图</text><text x="207" y="348" text-anchor="middle" font-size="18" fill="#4d6e8d">节点 / 关系</text>
<rect x="368" y="258" width="214" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7d5519">动态题目</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#98702e">覆盖 / 难度</text>
<rect x="636" y="258" width="214" height="136" rx="22" fill="#f2e7f0" stroke="#b785a4" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#713d5a">多轮访谈</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#95647c">追问 / 诊断</text>
<rect x="904" y="258" width="196" height="136" rx="22" fill="#e8f2e9" stroke="#76a37c" stroke-width="3"/><text x="1002" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">回归集</text><text x="1002" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">可比较</text>
</g>
<g fill="none" stroke="#66736e" stroke-width="4" stroke-linecap="round"><path d="M314 326 H352"/><path d="M582 326 H620"/><path d="M850 326 H886"/></g><g fill="#66736e"><path d="M352 326 l-13 -9 v18z"/><path d="M620 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5958">动态探索发现缺口，固定题集保持可比</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#77817f">出题路径、题目版本和评判理由都要留下</text>
</svg>
