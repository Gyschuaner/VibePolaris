<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Genie 3 生成可行走的动态世界</title>
  <desc id="desc">文字提示生成世界，Agent 在其中导航，环境根据动作和事件继续变化。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123b55"/>
      <stop offset="1" stop-color="#3e836a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4ecd6"/>
      <stop offset="1" stop-color="#d7e8cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#071f2e" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1045" cy="95" r="190" fill="#f0ca77" opacity=".15"/>
  <circle cx="130" cy="535" r="235" fill="#94c8aa" opacity=".15"/>
  <path d="M25 450 C165 345 280 505 420 370 S675 260 825 400 S1030 480 1190 310" fill="none" stroke="#f0ca77" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="90" y="118" width="300" height="320" rx="30" fill="url(#card)"/>
    <rect x="450" y="118" width="300" height="320" rx="30" fill="#f4ecd6"/>
    <rect x="810" y="118" width="300" height="320" rx="30" fill="#e4c575"/>
  </g>
  <g fill="#123b55" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="135" y="178" font-size="25" font-weight="800">文字提示</text>
    <rect x="135" y="235" width="205" height="53" rx="18" fill="#d7e8cf"/>
    <text x="158" y="268" font-size="17">海边 · 暴风雨</text>
    <path d="M135 335 h175" stroke="#3e836a" stroke-width="12" stroke-linecap="round"/>
    <path d="M135 380 h115" stroke="#3e836a" stroke-width="12" stroke-linecap="round" opacity=".6"/>
    <text x="135" y="408" font-size="17">24fps · 720p</text>

    <text x="495" y="178" font-size="25" font-weight="800">可行走世界</text>
    <path d="M500 345 C540 275 580 350 620 275 S700 320 715 235" fill="none" stroke="#3e836a" stroke-width="7" stroke-linecap="round"/>
    <circle cx="515" cy="345" r="15" fill="#123b55"/>
    <circle cx="620" cy="275" r="15" fill="#123b55"/>
    <circle cx="715" cy="235" r="15" fill="#123b55"/>
    <path d="M550 230 h105" stroke="#3e836a" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <text x="495" y="408" font-size="17">动作 · 记忆 · 反馈</text>

    <text x="855" y="178" font-size="25" font-weight="800">Agent</text>
    <circle cx="930" cy="270" r="39" fill="#123b55"/>
    <path d="M910 270 h40 M930 250 v40" stroke="#f4ecd6" stroke-width="7" stroke-linecap="round"/>
    <path d="M995 235 h75 M995 285 h55 M995 335 h90" stroke="#123b55" stroke-width="11" stroke-linecap="round"/>
    <text x="855" y="408" font-size="17">导航 · 事件 · 训练</text>
  </g>
  <g fill="#f4ecd6" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="90" y="565" font-size="22" letter-spacing="1">Genie 3 · 2025.08.05</text>
    <text x="1110" y="565" font-size="16" text-anchor="end" opacity=".84">世界会随动作继续生成</text>
  </g>
</svg>
