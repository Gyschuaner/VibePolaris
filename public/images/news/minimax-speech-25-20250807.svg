<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax Speech 2.5 多语种与音色克隆</title>
  <desc id="desc">Speech 2.5 将多语种、音色克隆和情绪表达组合在同一语音生成模型中，并需要授权与听感复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3f2147"/>
      <stop offset="1" stop-color="#bd6c61"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff2df"/>
      <stop offset="1" stop-color="#f2d6ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#29172f" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="96" r="190" fill="#f0c978" opacity=".18"/>
  <circle cx="110" cy="540" r="228" fill="#c58e9d" opacity=".18"/>
  <path d="M22 458 C120 384 240 503 360 405 S575 323 690 425 S880 509 1010 382 S1110 349 1190 420" fill="none" stroke="#f0c978" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#fff2df"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#edbd82"/>
  </g>
  <g fill="#3f2147" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">多语种</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#d4b3c4"/>
    <text x="218" y="261" font-size="25" text-anchor="middle" font-weight="800">40+ languages</text>
    <path d="M108 329 h214" stroke="#bd6c61" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">语言 · 口音 · 长句</text>
    <text x="108" y="405" font-size="16">每种语言仍需实测</text>

    <text x="489" y="178" font-size="25" font-weight="800">音色克隆</text>
    <circle cx="600" cy="259" r="62" fill="#bd6c61"/>
    <path d="M562 259 C579 223 598 295 616 254 S641 228 664 260" fill="none" stroke="#fff2df" stroke-width="9" stroke-linecap="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#bd6c61" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">参考音频 → 新语音</text>

    <text x="860" y="178" font-size="25" font-weight="800">表达控制</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#bd6c61"/>
    <text x="970" y="261" font-size="23" fill="#fff2df" text-anchor="middle" font-weight="800">情绪 · 语速</text>
    <path d="M860 330 h215" stroke="#3f2147" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">授权 · 标记 · 复核</text>
    <text x="860" y="405" font-size="16">声音身份要有边界</text>
  </g>
  <g fill="#fff2df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">SPEECH 2.5 · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">像谁的声音，先问能不能用</text>
  </g>
</svg>
