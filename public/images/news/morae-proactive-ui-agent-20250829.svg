<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Morae 的主动暂停 UI Agent</title><desc id="desc">UI Agent 自动执行明确步骤，在关键决策点暂停并把选择交还用户。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">Morae：遇到关键选择，先把方向盘交回来</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">识别页面 · 找到决策点 · 暂停询问 · 继续执行</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="282" width="200" height="116" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="212" y="328" text-anchor="middle" font-size="27" font-weight="700" fill="#21456f">界面任务</text><text x="212" y="365" text-anchor="middle" font-size="18" fill="#365b83">页面与目标</text>
<rect x="402" y="282" width="200" height="116" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="502" y="328" text-anchor="middle" font-size="27" font-weight="700" fill="#275d39">决策点</text><text x="502" y="365" text-anchor="middle" font-size="18" fill="#3e7650">多个偏好选项</text>
<rect x="692" y="282" width="200" height="116" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="792" y="328" text-anchor="middle" font-size="27" font-weight="700" fill="#805513">暂停询问</text><text x="792" y="365" text-anchor="middle" font-size="18" fill="#966b24">用户来选择</text>
<rect x="982" y="282" width="136" height="116" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1050" y="328" text-anchor="middle" font-size="25" font-weight="700" fill="#783553">继续</text><text x="1050" y="365" text-anchor="middle" font-size="17" fill="#94516f">明确执行</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M312 340 H392"/><path d="M602 340 H682"/><path d="M892 340 H972"/></g><g fill="#607080"><path d="M392 340 l-14 -9 v18z"/><path d="M682 340 l-14 -9 v18z"/><path d="M972 340 l-14 -9 v18z"/></g>
<text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">自动化负责推进，偏好由用户表达</text>
</svg>