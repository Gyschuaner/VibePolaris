<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Meta 与 Safe Superintelligence 的收购和人才谈判</title><desc id="desc">一条分叉路径从收购尝试转向招聘谈判，终点用问号标记尚未正式确认的组织落地。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10202f"/><stop offset="1" stop-color="#253c55"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="76" y="84" fill="#f3f9ff" font-family="Arial" font-size="28" font-weight="700">Meta × SSI · 一条未完结的人才路径</text><text x="76" y="118" fill="#abc0cf" font-family="Arial" font-size="16">收购、招聘谈判和正式加入不能合并成一个事实</text><g transform="translate(100 260)"><rect width="220" height="120" rx="20" fill="#24384a" stroke="#54758a"/><text x="58" y="310" fill="#f3f9ff" font-family="Arial" font-size="18">Meta</text><text x="37" y="345" fill="#abc0cf" font-family="Arial" font-size="14">AI 团队重建</text></g><path d="M320 320H430" stroke="#7ddbbb" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(440 165)"><rect width="250" height="110" rx="20" fill="#2d354a" stroke="#f1a366"/><text x="52" y="213" fill="#f1a366" font-family="Arial" font-size="18">收购尝试</text><text x="37" y="247" fill="#abc0cf" font-family="Arial" font-size="14">据报未能达成</text><path d="M180 30L215 72M215 30L180 72" stroke="#f27b6a" stroke-width="7"/></g><path d="M565 275V395" stroke="#f1a366" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(440 405)"><rect width="250" height="110" rx="20" fill="#24384a" stroke="#7ddbbb"/><text x="57" y="453" fill="#7ddbbb" font-family="Arial" font-size="18">招聘谈判</text><text x="28" y="487" fill="#abc0cf" font-family="Arial" font-size="14">Gross · Friedman</text></g><path d="M690 460H835" stroke="#7ddbbb" stroke-width="8" stroke-dasharray="10 14"/><g transform="translate(850 335)"><rect width="270" height="180" rx="20" fill="#20383f" stroke="#7ddbbb"/><text x="70" y="392" fill="#f3f9ff" font-family="Arial" font-size="18">正式公告？</text><text x="45" y="430" fill="#abc0cf" font-family="Arial" font-size="14">职位 · 合同 · 汇报线</text><circle cx="135" cy="126" r="27" fill="#f1a366"/><text x="127" y="136" fill="#20383f" font-family="Arial" font-size="30">?</text></g><text x="100" y="590" fill="#abc0cf" font-family="Arial" font-size="16">reported → negotiated → signed → integrated</text></svg>
