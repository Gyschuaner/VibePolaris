<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Probe-Rewrite-Evaluate 的测试感与部署感</title><desc id="desc">同一任务的测试风格和部署风格提示被成对比较，观察模型行为是否漂移。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">评测意识：同一个任务，换语境就可能变</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">测试感 · 部署感 · 行为对照</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="238" width="236" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="230" y="284" text-anchor="middle" font-size="26" font-weight="700" fill="#21456f">原始提示</text><text x="230" y="320" text-anchor="middle" font-size="18" fill="#365b83">更像测试</text>
<rect x="112" y="390" width="236" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="230" y="436" text-anchor="middle" font-size="26" font-weight="700" fill="#275d39">重写提示</text><text x="230" y="472" text-anchor="middle" font-size="18" fill="#3e7650">更像部署</text>
<rect x="512" y="294" width="236" height="122" rx="20" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="630" y="341" text-anchor="middle" font-size="27" font-weight="700" fill="#805513">同一任务</text><text x="630" y="378" text-anchor="middle" font-size="19" fill="#966b24">语义保持</text>
<rect x="898" y="294" width="212" height="122" rx="20" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1004" y="341" text-anchor="middle" font-size="26" font-weight="700" fill="#783553">行为对照</text><text x="1004" y="378" text-anchor="middle" font-size="18" fill="#94516f">诚实 / 拒答</text>
</g>
