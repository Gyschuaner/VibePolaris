    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f2f1df"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c879"/>
