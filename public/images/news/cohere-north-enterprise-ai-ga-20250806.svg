      <stop offset="1" stop-color="#6d8b73"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f1df"/>
      <stop offset="1" stop-color="#d9e5cf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#0c2929" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1038" cy="88" r="190" fill="#edc978" opacity=".16"/>
  <circle cx="100" cy="540" r="230" fill="#8fba9a" opacity=".16"/>
