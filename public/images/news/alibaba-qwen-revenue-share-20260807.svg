<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Qwen 开放权重模型的商业收入分成计划</title>
  <desc id="desc">开放权重模型从模型提供方进入企业部署，路透报道大型商业用户可能按收入分成。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17233b"/><stop offset="1" stop-color="#4c326d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#070a19" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="180" fill="#f6cf82" opacity=".13"/>
  <rect x="95" y="190" width="255" height="190" rx="28" fill="#f0b2df" filter="url(#shadow)"/>
  <text x="158" y="270" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#3a244d">Qwen</text>
  <text x="140" y="320" font-family="Arial, sans-serif" font-size="22" fill="#5d3d65">开放权重</text>
  <path d="M390 285h145" stroke="#f6cf82" stroke-width="9" stroke-linecap="round"/>
  <polygon points="510,260 555,285 510,310" fill="#f6cf82"/>
  <rect x="580" y="130" width="260" height="300" rx="28" fill="#e3f0ff" filter="url(#shadow)"/>
  <text x="647" y="205" font-family="Arial, sans-serif" font-size="27" fill="#2c4770">企业部署</text>
  <rect x="630" y="250" width="160" height="28" rx="14" fill="#86c9c7"/>
  <rect x="630" y="310" width="115" height="28" rx="14" fill="#98a9e8"/>
  <rect x="630" y="370" width="180" height="28" rx="14" fill="#f3c67e"/>
  <path d="M880 280h80M880 340h80" stroke="#f6cf82" stroke-width="9" stroke-linecap="round"/>
  <polygon points="940,255 985,280 940,305" fill="#f6cf82"/>
  <polygon points="940,315 985,340 940,365" fill="#f6cf82"/>
  <rect x="1000" y="205" width="125" height="210" rx="24" fill="#86c9c7"/>
  <text x="1030" y="280" font-family="Arial, sans-serif" font-size="25" fill="#19494a">服务</text>
  <text x="1020" y="325" font-family="Arial, sans-serif" font-size="25" fill="#19494a">收入</text>
  <text x="1028" y="370" font-family="Arial, sans-serif" font-size="25" fill="#19494a">分成?</text>
  <text x="95" y="560" font-family="Arial, sans-serif" font-size="28" fill="#e9e5ff">7 Aug 2026 · 计划未定稿</text>
</svg>
