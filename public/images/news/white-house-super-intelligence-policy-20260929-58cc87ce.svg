<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">白宫 AI 到 SI 行政术语变更示意</title>
  <desc id="desc">总统令把行政部门文本中的 Artificial Intelligence 改称 Super Intelligence，同时保留现行法律边界并要求后续提出定义方案；这是政策流程示意，不代表技术能力已经改变。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#20233d"/><stop offset="1" stop-color="#184e4f"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f6c453"/><stop offset="1" stop-color="#79e6c4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061521" flood-opacity=".48"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">AI 变成 SI，先变的是行政文本</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2026-09-29 · 白宫总统令的政策流程解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#fda4af" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">原有 AI</text>
    <text x="237" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">法律与行业常用称呼</text>
    <text x="237" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">语境各有义务</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">行政文本用 SI</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">公文、网站、报告</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">受法律允许范围约束</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">后续核对</text>
    <text x="963" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">60 天定义提案</text>
    <text x="963" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">观察机构执行</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M963 322 C963 370 237 370 237 322" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="9 10" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">改名不等于能力改变：要回到法律、范围和证据</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">总统令改变行政称呼，不是发布了新模型</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">White House：现行法律、历史文件和后续定义任务仍然存在。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">来源：White House</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2026-09-29</text><text x="944" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">边界：仍需核对</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释 AI 行政术语变更、法律范围与后续定义流程。</text>
</svg>
