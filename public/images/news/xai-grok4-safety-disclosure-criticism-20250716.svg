<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Grok 4 安全披露证据层</title><desc id="d">系统卡、内部评测、公开结果和产品行为形成仍不完整的证据链</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3f1d3a"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="chain" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#93c5fd"/></linearGradient></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="85" y="185" width="240" height="180" rx="22" fill="#512b63" stroke="#f9a8d4" stroke-width="4"/><text x="205" y="240" fill="#fce7f3" font-size="28">系统卡</text><text x="205" y="282" fill="#fbcfe8" font-size="18">范围/限制</text><text x="205" y="320" fill="#fbcfe8" font-size="17">是否公开？</text><rect x="365" y="185" width="240" height="180" rx="22" fill="#243b53" stroke="#93c5fd" stroke-width="4"/><text x="485" y="240" fill="#dbeafe" font-size="28">内部评测</text><text x="485" y="282" fill="#bfdbfe" font-size="18">做过什么</text><text x="485" y="320" fill="#bfdbfe" font-size="17">结果可见吗？</text><rect x="645" y="185" width="240" height="180" rx="22" fill="#243b53" stroke="#93c5fd" stroke-width="4"/><text x="765" y="240" fill="#dbeafe" font-size="28">公开结果</text><text x="765" y="282" fill="#bfdbfe" font-size="18">可复核材料</text><text x="765" y="320" fill="#bfdbfe" font-size="17">仍缺一环</text><rect x="925" y="185" width="190" height="180" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="4"/><text x="1020" y="240" fill="#cffafe" font-size="28">产品行为</text><text x="1020" y="282" fill="#a5f3fc" font-size="18">线上表现</text><text x="1020" y="320" fill="#a5f3fc" font-size="17">需要复核</text><g fill="none" stroke="url(#chain)" stroke-width="7" stroke-linecap="round"><path d="M328 275h27"/><path d="M608 275h27"/><path d="M888 275h27"/></g><g fill="#f8fafc"><path d="M346 260l20 15-20 15z"/><path d="M626 260l20 15-20 15z"/><path d="M906 260l20 15-20 15z"/></g></g><text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" fill="#e2e8f0" font-size="26">公开质疑 ≠ 监管定性，缺失材料仍待补齐</text></svg>
