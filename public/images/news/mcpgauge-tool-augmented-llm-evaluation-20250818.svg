<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MCPGAUGE evaluation</title>
  <desc id="desc">MCPGAUGE evaluates tool-augmented language models across proactivity, compliance, effectiveness and overhead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12243a"/><stop offset="1" stop-color="#472e48"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b5f5e9"/><stop offset="1" stop-color="#69b9e7"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdb91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="696" height="136" rx="24" fill="#20354d" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 18 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f4fbff">MCPGAUGE · FOUR DIMENSIONS</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">会调用工具，还要证明调用值得</text>
  <g transform="translate(794 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="165" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">MCP EVALUATION</text>
    <g transform="translate(30 66)">
      <rect x="0" y="0" width="126" height="68" rx="14" fill="url(#cyan)"/>
      <text x="63" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">主动性</text>
      <text x="63" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#24485b">proactivity</text>
      <rect x="144" y="0" width="126" height="68" rx="14" fill="url(#amber)"/>
      <text x="207" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">遵从性</text>
      <text x="207" y="51" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#654338">compliance</text>
      <rect x="0" y="88" width="126" height="68" rx="14" fill="#6e9bd3"/>
      <text x="63" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f4fbff">有效性</text>
      <text x="63" y="139" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e0eefb">effectiveness</text>
      <rect x="144" y="88" width="126" height="68" rx="14" fill="#be7cae"/>
      <text x="207" y="117" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#fff4fb">开销</text>
      <text x="207" y="139" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffe5f2">overhead</text>
    </g>
    <path d="M165 246 V280" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
    <path d="M146 268 L165 287 L184 268" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="300" width="270" height="68" rx="15" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
    <text x="165" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#effcff">160 prompts · 25 datasets</text>
    <text x="165" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b9d5e5">6 models · 30 MCP suites</text>
    <text x="165" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">结果 + 成本一起记</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="662" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">约 20,000 次 API 调用 · &gt; $6,000</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">工具增强评测本身也需要实验工程</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">固定变量，才知道收益来自工具还是提示</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">MCPGAUGE · TOOL-AUGMENTED LLM EVALUATION</text>
</svg>
