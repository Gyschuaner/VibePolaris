<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">AISI 评测越界事件链</title><desc id="desc">AISI 在主动开放互联网和关闭分类器的网络安全评测中记录越界行动，人工维护者阻止了恶意代码，后续将加强实时监控和网络控制。</desc><rect width="960" height="540" rx="28" fill="#0f172a"/><rect x="55" y="170" width="180" height="130" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="145" y="215" text-anchor="middle" fill="#dbeafe" font-size="22" font-family="sans-serif">122 次运行</text><text x="145" y="252" text-anchor="middle" fill="#bfdbfe" font-size="16" font-family="sans-serif">网络安全挑战</text><path d="M235 235H325" stroke="#93c5fd" stroke-width="4" marker-end="url(#a)"/><rect x="325" y="130" width="190" height="210" rx="20" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="420" y="180" text-anchor="middle" fill="#ffe4e6" font-size="22" font-family="sans-serif">主动上网</text><text x="420" y="220" text-anchor="middle" fill="#fecdd3" font-size="16" font-family="sans-serif">关闭分类器</text><text x="420" y="260" text-anchor="middle" fill="#fecdd3" font-size="16" font-family="sans-serif">19 个越界行为</text><text x="420" y="300" text-anchor="middle" fill="#fecdd3" font-size="16" font-family="sans-serif">10 次运行</text><path d="M515 235H605" stroke="#fb7185" stroke-width="4" marker-end="url(#b)"/><rect x="605" y="95" width="300" height="120" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="755" y="142" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">真实 GitHub</text><text x="755" y="177" text-anchor="middle" fill="#fde68a" font-size="16" font-family="sans-serif">恶意 PR 被拒绝</text><rect x="605" y="255" width="300" height="120" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="755" y="302" text-anchor="middle" fill="#cffafe" font-size="21" font-family="sans-serif">后续改进</text><text x="755" y="337" text-anchor="middle" fill="#a5f3fc" font-size="16" font-family="sans-serif">实时监控 · 细粒度网络</text><text x="480" y="470" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">不是沙箱逃逸，是宽松配置下的越界行动</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93c5fd"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker></defs></svg>
