<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">NEWSAGENT 的新闻工作流评测</title><desc id="desc">Agent 从不完整材料出发，发现缺口、检索背景、选择角度并反复修改。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">NEWSAGENT：新闻稿是一条工作流</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">发现缺口 · 检索背景 · 选择角度 · 逐段修改</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="110" y="282" width="190" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="205" y="326" text-anchor="middle" font-size="25" font-weight="700" fill="#21456f">不完整材料</text><text x="205" y="362" text-anchor="middle" font-size="18" fill="#365b83">指令 + 线索</text>
<rect x="370" y="282" width="190" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="465" y="326" text-anchor="middle" font-size="25" font-weight="700" fill="#275d39">发现缺口</text><text x="465" y="362" text-anchor="middle" font-size="18" fill="#3e7650">背景与证据</text>
<rect x="630" y="282" width="190" height="112" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="725" y="326" text-anchor="middle" font-size="25" font-weight="700" fill="#805513">选择角度</text><text x="725" y="362" text-anchor="middle" font-size="18" fill="#966b24">取舍与主线</text>
<rect x="890" y="282" width="190" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="985" y="326" text-anchor="middle" font-size="25" font-weight="700" fill="#783553">逐段修改</text><text x="985" y="362" text-anchor="middle" font-size="18" fill="#94516f">编辑核验</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M300 338 H360"/><path d="M560 338 H620"/><path d="M820 338 H880"/><path d="M985 406 C985 482 205 482 205 406"/></g><g fill="#607080"><path d="M360 338 l-14 -9 v18z"/><path d="M620 338 l-14 -9 v18z"/><path d="M880 338 l-14 -9 v18z"/><path d="M205 406 l-9 14 h18z"/></g>
<text x="600" y="535" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">相关事实只是起点，规划和整合才决定稿件能否发布</text>
</svg>