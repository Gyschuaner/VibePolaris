<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">SimpleTIR 的空转轨迹过滤</title><desc id="desc">多轮工具训练记录回合，识别没有产物的空转，再隔离策略更新并保留失败原因。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d8d4c9" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#293332">SimpleTIR：先清掉训练里的空转</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#707a77">工具反馈 · void turn · 策略更新 · 失败留档</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="258" width="214" height="136" rx="22" fill="#e8eef8" stroke="#7c98bc" stroke-width="3"/><text x="211" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">多轮轨迹</text><text x="211" y="348" text-anchor="middle" font-size="18" fill="#4d6e8d">工具反馈</text>
<rect x="368" y="258" width="214" height="136" rx="22" fill="#f8e8e7" stroke="#c88d89" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7d403d">void turn</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#995b57">无产物</text>
<rect x="636" y="258" width="214" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7e551b">隔离更新</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#98702f">不放大梯度</text>
<rect x="904" y="258" width="196" height="136" rx="22" fill="#e8f2e9" stroke="#76a37d" stroke-width="3"/><text x="1002" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">复测</text><text x="1002" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">结果 / 安全</text>
</g>
<g fill="none" stroke="#66736f" stroke-width="4" stroke-linecap="round"><path d="M318 326 H350"/><path d="M582 326 H618"/><path d="M850 326 H886"/></g><g fill="#66736f"><path d="M350 326 l-13 -9 v18z"/><path d="M618 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5957">过滤更新，不等于删除失败经验</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#78827f">安全停顿、工具错误和模型犹豫都要留下原因</text>
</svg>
