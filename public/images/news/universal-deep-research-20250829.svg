<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Universal Deep Research 的可编排研究策略</title><desc id="desc">用户在不同强度的研究策略之间选择并交给模型执行。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">Universal Deep Research：先选策略，再开始研究</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">用户编辑 · 任意模型 · 工具规则 · 可复盘版本</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="214" width="204" height="92" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="214" y="252" text-anchor="middle" font-size="24" font-weight="700" fill="#21456f">简洁</text><text x="214" y="282" text-anchor="middle" font-size="18" fill="#365b83">快速回答</text>
<rect x="112" y="338" width="204" height="92" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="214" y="376" text-anchor="middle" font-size="24" font-weight="700" fill="#275d39">扩展</text><text x="214" y="406" text-anchor="middle" font-size="18" fill="#3e7650">更多核查</text>
<rect x="112" y="462" width="204" height="92" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="214" y="500" text-anchor="middle" font-size="24" font-weight="700" fill="#805513">密集</text><text x="214" y="530" text-anchor="middle" font-size="18" fill="#966b24">长研究</text>
<rect x="478" y="286" width="240" height="142" rx="20" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="598" y="338" text-anchor="middle" font-size="28" font-weight="700" fill="#783553">用户策略</text><text x="598" y="376" text-anchor="middle" font-size="19" fill="#94516f">工具 / 停止 / 输出</text>
<rect x="876" y="286" width="220" height="142" rx="20" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/><text x="986" y="338" text-anchor="middle" font-size="27" font-weight="700" fill="#234b78">任意模型</text><text x="986" y="376" text-anchor="middle" font-size="19" fill="#385f8d">执行与复盘</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M316 260 C374 260 396 314 468 330"/><path d="M316 384 H468"/><path d="M316 508 C374 508 396 402 468 384"/><path d="M718 357 H866"/></g><g fill="#607080"><path d="M468 330 l-14 -9 v18z"/><path d="M468 384 l-14 -9 v18z"/><path d="M468 384 l-14 -9 v18z"/><path d="M866 357 l-14 -9 v18z"/></g>
<text x="600" y="570" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#475467">研究流程可见、可改、可复用，结果才方便比较</text>
</svg>