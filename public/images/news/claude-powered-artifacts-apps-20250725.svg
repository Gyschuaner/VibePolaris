<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Claude Artifacts 变成可分享应用</title><desc id="desc">从自然语言到代码、Claude 调用、账号授权和 beta 限制的应用流程。</desc><rect width="1200" height="680" rx="36" fill="#171719"/><defs><linearGradient id="c" x1="0" x2="1"><stop stop-color="#f6b36a"/><stop offset="1" stop-color="#ef8d78"/></linearGradient></defs><text x="72" y="84" fill="#fff4e8" font-size="32" font-family="sans-serif" font-weight="700">Claude Artifacts · 从草稿到可分享应用</text><text x="72" y="122" fill="#d8c4b0" font-size="20" font-family="sans-serif">2025-07-25 · 代码、调用、授权和限制一起出现</text><g font-family="sans-serif"><rect x="78" y="218" width="214" height="164" rx="24" fill="#4f3a31"/><text x="116" y="270" fill="#fff" font-size="23" font-weight="700">自然语言</text><text x="116" y="316" fill="#f5d6bc" font-size="18">描述一个工具</text><text x="116" y="348" fill="#f5d6bc" font-size="18">反馈与修改</text><path d="M312 300h78" stroke="#f4b27f" stroke-width="6" stroke-linecap="round"/><path d="m374 288 18 12-18 12" fill="none" stroke="#f4b27f" stroke-width="6"/><rect x="424" y="198" width="238" height="204" rx="24" fill="#64443a"/><text x="464" y="252" fill="#fff" font-size="23" font-weight="700">真实代码</text><text x="464" y="298" fill="#ffe0c9" font-size="18">React UI</text><text x="464" y="332" fill="#ffe0c9" font-size="18">Claude API</text><text x="464" y="366" fill="#ffe0c9" font-size="18">文件处理</text><path d="M682 300h78" stroke="#f4b27f" stroke-width="6" stroke-linecap="round"/><path d="m744 288 18 12-18 12" fill="none" stroke="#f4b27f" stroke-width="6"/><rect x="794" y="172" width="328" height="254" rx="24" fill="url(#c)"/><text x="836" y="230" fill="#271a16" font-size="23" font-weight="700">分享与边界</text><text x="836" y="276" fill="#271a16" font-size="18">访客用自己的账号</text><text x="836" y="310" fill="#271a16" font-size="18">用量计入订阅</text><text x="836" y="344" fill="#271a16" font-size="18">无外部 API / 持久化</text><rect x="184" y="510" width="832" height="78" rx="22" fill="#2b2523"/><text x="232" y="558" fill="#fff4e8" font-size="21">能分享一个链接，不等于应用拥有无限权限</text></g></svg>
