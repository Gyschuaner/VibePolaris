<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">白宫完成自愿 AI 安全框架</title>
<desc id="desc">白宫按期完成自愿前沿模型网络安全评测框架，但全文和覆盖边界尚未公开。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="50" y="165" width="220" height="170" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
<text x="160.0" y="223" text-anchor="middle" fill="#dbeafe" font-size="21" font-family="sans-serif">行政命令</text>
<text x="160.0" y="265" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">设计自愿评测</text>
<path d="M270 250.0H251" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="263" y="165" width="220" height="170" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<text x="373.0" y="223" text-anchor="middle" fill="#cffafe" font-size="21" font-family="sans-serif">内部完成</text>
<text x="373.0" y="265" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">8 月 3 日</text>
<path d="M483 250.0H464" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="476" y="165" width="220" height="170" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
<text x="586.0" y="223" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">行业沟通</text>
<text x="586.0" y="265" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">公司待说明</text>
<path d="M696 250.0H677" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="689" y="165" width="220" height="170" rx="18" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
<text x="799.0" y="223" text-anchor="middle" fill="#f8fafc" font-size="21" font-family="sans-serif">公开规则</text>
<text x="799.0" y="265" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="sans-serif">仍未发布</text>
<text x="480" y="475" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">完成框架 ≠ 强制许可</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
