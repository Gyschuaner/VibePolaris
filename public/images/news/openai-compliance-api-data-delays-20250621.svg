<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Compliance API 数据延迟事件时间线</title>
  <desc id="desc">深色画布上，一条合规日志流从 6 月 21 日事件开始，经过 6 月 23 日公开调查、6 月 26 日确认根因与 6 月 28 日缓解，最后在 6 月 29 日恢复；日志流连接 eDiscovery、DLP 与 SIEM。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#172b3d"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef8354"/><stop offset=".55" stop-color="#f5b85b"/><stop offset="1" stop-color="#63d6a4"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <g opacity=".18" stroke="#b4d7df" stroke-width="1"><path d="M80 120H1120M80 220H1120M80 320H1120M80 420H1120M80 520H1120"/><path d="M180 70V620M360 70V620M540 70V620M720 70V620M900 70V620M1080 70V620"/></g>
  <text x="80" y="86" fill="#f4f8f7" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">Compliance API · 延迟与恢复</text>
  <text x="80" y="120" fill="#9bb9c0" font-family="Inter,Arial,sans-serif" font-size="16">事件发生日与首次公开日分开，沿着企业审计数据链读完这条时间线</text>
  <g font-family="Inter,Arial,sans-serif">
    <text x="80" y="177" fill="#ef8354" font-size="15" font-weight="700">事件起点</text>
    <text x="80" y="203" fill="#f4f8f7" font-size="22" font-weight="700">06.21</text>
    <text x="80" y="229" fill="#a9c2c7" font-size="14">数据开始延迟</text>
    <text x="80" y="272" fill="#f5b85b" font-size="15" font-weight="700">首次公开</text>
    <text x="80" y="298" fill="#f4f8f7" font-size="22" font-weight="700">06.23</text>
    <text x="80" y="324" fill="#a9c2c7" font-size="14">状态页调查中</text>
    <text x="80" y="367" fill="#f5b85b" font-size="15" font-weight="700">确认根因</text>
    <text x="80" y="393" fill="#f4f8f7" font-size="22" font-weight="700">06.26</text>
    <text x="80" y="419" fill="#a9c2c7" font-size="14">开始实施修复</text>
    <text x="80" y="462" fill="#f5b85b" font-size="15" font-weight="700">缓解观察</text>
    <text x="80" y="488" fill="#f4f8f7" font-size="22" font-weight="700">06.28</text>
    <text x="80" y="514" fill="#a9c2c7" font-size="14">观察恢复</text>
    <text x="80" y="557" fill="#63d6a4" font-size="15" font-weight="700">完全恢复</text>
    <text x="80" y="583" fill="#f4f8f7" font-size="22" font-weight="700">06.29</text>
    <text x="80" y="609" fill="#a9c2c7" font-size="14">状态页标记 Resolved</text>
  </g>
  <path d="M250 205 C360 205 360 300 470 300 S580 390 690 390 S800 485 910 485 S1020 580 1110 580" fill="none" stroke="#263d4b" stroke-width="34" stroke-linecap="round" opacity=".8"/>
  <path d="M250 205 C360 205 360 300 470 300 S580 390 690 390 S800 485 910 485 S1020 580 1110 580" fill="none" stroke="url(#flow)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#101827" stroke-width="5">
    <circle cx="250" cy="205" r="16" stroke="#ef8354" fill="#ef8354"/>
    <circle cx="470" cy="300" r="16" stroke="#f5b85b" fill="#f5b85b"/>
    <circle cx="690" cy="390" r="16" stroke="#f5b85b" fill="#f5b85b"/>
    <circle cx="910" cy="485" r="16" stroke="#f5b85b" fill="#f5b85b"/>
    <circle cx="1110" cy="580" r="18" stroke="#63d6a4" fill="#63d6a4"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="325" y="150" width="188" height="52" rx="15" fill="#1d3543" stroke="#395e6d"/>
    <text x="344" y="181" fill="#d8eeee" font-size="16">Compliance API</text>
    <rect x="535" y="446" width="170" height="50" rx="15" fill="#1d3543" stroke="#395e6d"/>
    <text x="565" y="476" fill="#d8eeee" font-size="15">audit logs</text>
    <rect x="790" y="226" width="164" height="48" rx="15" fill="#1d3543" stroke="#395e6d"/>
    <text x="818" y="256" fill="#d8eeee" font-size="15">缓解 → 观察</text>
  </g>
  <g transform="translate(760 90)" font-family="Inter,Arial,sans-serif">
    <rect width="350" height="100" rx="20" fill="#1a303d" stroke="#355463"/>
    <text x="24" y="32" fill="#a9c2c7" font-size="14">下游审计系统</text>
    <text x="24" y="65" fill="#f4f8f7" font-size="18">eDiscovery · DLP · SIEM</text>
    <path d="M50 77H290" stroke="#63d6a4" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
  </g>
  <text x="820" y="640" fill="#63d6a4" font-family="Inter,Arial,sans-serif" font-size="15">恢复 ≠ 自动完成客户侧对账</text>
</svg>
