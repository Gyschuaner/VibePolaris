<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">训练用途与书库来源分开判断</title><desc id="d">两条书籍证据路径分别通向法院的不同判断。</desc><rect width="1200" height="630" fill="#fff7ed"/><path d="M0 470 C240 380 360 530 590 430 S980 330 1200 420 V630 H0Z" fill="#fed7aa" opacity=".55"/><text x="72" y="88" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#431407">同一批书，两个问题</text><text x="72" y="128" font-family="Arial,sans-serif" font-size="20" fill="#7c2d12">Bartz v. Anthropic · 2025-06-23</text><g transform="translate(90 220)"><rect width="270" height="150" rx="22" fill="#fff" stroke="#ea580c" stroke-width="4"/><text x="135" y="58" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700" fill="#9a3412">合法取得的书</text><text x="135" y="95" text-anchor="middle" font-size="18" font-family="Arial" fill="#7c2d12">模型训练</text><text x="135" y="126" text-anchor="middle" font-size="16" font-family="Arial" fill="#9a3412">转换性使用</text></g><g transform="translate(840 220)"><rect width="270" height="150" rx="22" fill="#fff" stroke="#b91c1c" stroke-width="4"/><text x="135" y="58" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700" fill="#991b1b">盗版来源的书</text><text x="135" y="95" text-anchor="middle" font-size="18" font-family="Arial" fill="#7f1d1d">中心书库</text><text x="135" y="126" text-anchor="middle" font-size="16" font-family="Arial" fill="#991b1b">仍要审理</text></g><path d="M365 295 H815" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 18"/><circle cx="600" cy="295" r="70" fill="#431407"/><text x="600" y="288" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">法院</text><text x="600" y="318" text-anchor="middle" font-size="17" font-family="Arial" fill="#fed7aa">分开看</text><text x="72" y="548" font-family="Arial" font-size="18" fill="#7c2d12">训练结论不替数据来源背书；来源、授权与留存仍需记录。</text></svg>