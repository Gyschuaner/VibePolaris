<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">网信办约谈英伟达 H20 芯片安全风险</title><desc id="desc">监管询问、英伟达否认和待提交技术证据分成三条线，约谈不等于已认定后门。</desc><rect width="1200" height="680" rx="36" fill="#111827"/><g font-family="Arial, sans-serif"><text x="90" y="92" fill="#f9fafb" font-size="34" font-weight="700">Question → Response → Evidence</text><text x="90" y="128" fill="#93c5fd" font-size="20">H20 chip security review · 2025-07-31</text><g transform="translate(100 220)"><rect width="270" height="150" rx="24" fill="#dbeafe"/><text x="30" y="56" fill="#1e3a8a" font-size="25" font-weight="700">监管询问</text><text x="30" y="98" fill="#334155" font-size="19">约谈 · 索要材料</text></g><g transform="translate(465 220)"><rect width="270" height="150" rx="24" fill="#dcfce7"/><text x="30" y="56" fill="#166534" font-size="25" font-weight="700">厂商回应</text><text x="30" y="98" fill="#334155" font-size="19">否认后门</text></g><g transform="translate(830 220)"><rect width="270" height="150" rx="24" fill="#fef3c7"/><text x="30" y="56" fill="#92400e" font-size="25" font-weight="700">待核证据</text><text x="30" y="98" fill="#57534e" font-size="19">硬件 · 固件 · 权限</text></g><path d="M370 295H465M735 295H830" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrow)"/><path d="M965 380V475" stroke="#f59e0b" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/><g transform="translate(100 475)"><rect width="1000" height="100" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/><text x="32" y="45" fill="#fde68a" font-size="23" font-weight="700">约谈 ≠ 处罚 · 否认 ≠ 独立认证</text><text x="32" y="78" fill="#cbd5e1" font-size="18">只有可复核的代码、固件、密钥和访问记录，才能回答后门疑问。</text></g></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#60a5fa"/></marker></defs></svg>