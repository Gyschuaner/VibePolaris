<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Astra 十项数学进展的证据链</title>
<desc id="desc">OpenAI 内部模型探索十项数学问题，研究者整理稿件，Lean 证书提供机器检查，数学家继续复核含义。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="45" y="165" width="190" height="170" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
<text x="140" y="220" text-anchor="middle" fill="#dbeafe" font-size="23" font-family="sans-serif">Astra</text>
<text x="140" y="260" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">探索十项问题</text>
<text x="140" y="290" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">内部研究模型</text>
<path d="M235 250H260" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="260" y="165" width="190" height="170" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<text x="355" y="220" text-anchor="middle" fill="#cffafe" font-size="22" font-family="sans-serif">研究者</text>
<text x="355" y="260" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">整理论文</text>
<text x="355" y="290" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">说明结果</text>
<path d="M450 250H475" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="475" y="165" width="190" height="170" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
<text x="570" y="220" text-anchor="middle" fill="#fef3c7" font-size="22" font-family="sans-serif">Lean 4</text>
<text x="570" y="260" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">机器检查</text>
<text x="570" y="290" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">形式化命题</text>
<path d="M665 250H690" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="690" y="165" width="225" height="170" rx="18" fill="#3f1d5a" stroke="#d8b4fe" stroke-width="3"/>
<text x="802" y="220" text-anchor="middle" fill="#f3e8ff" font-size="22" font-family="sans-serif">领域专家</text>
<text x="802" y="260" text-anchor="middle" fill="#e9d5ff" font-size="15" font-family="sans-serif">复核对应关系</text>
<text x="802" y="290" text-anchor="middle" fill="#e9d5ff" font-size="15" font-family="sans-serif">判断新颖与意义</text>
<text x="480" y="465" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">2026-08-01 · 十项结果 · 证据链仍需独立复核</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
</svg>
