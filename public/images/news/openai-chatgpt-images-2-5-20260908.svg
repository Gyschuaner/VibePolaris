<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>ChatGPT Images 2.5 image workflow</title><desc>A sketch becomes an image, then precise edits move through a multi-turn creative loop.</desc><style>.flow{animation:flow 3s linear infinite}.edit{animation:edit 2.8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes edit{50%{transform:rotate(6deg) scale(1.08)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#f3f7ff"/><rect x="100" y="205" width="230" height="180" rx="20" fill="#e3ecff" stroke="#4d72b8" stroke-width="5"/><path d="M140 340l45-75 38 40 42-60 40 95" fill="none" stroke="#4d72b8" stroke-width="8"/><text x="215" y="430" fill="#35588d" font-size="22" text-anchor="middle">sketch</text><path d="M330 295H450" stroke="#5b87d1" stroke-width="7" stroke-dasharray="18 14" class="flow"/><rect x="450" y="165" width="300" height="260" rx="24" fill="#5f85d7"/><circle cx="570" cy="275" r="65" fill="#ffd26e"/><path d="M520 315l50-80 45 56 58-72 45 96" fill="none" stroke="#fff" stroke-width="8"/><text x="600" y="382" fill="#eaf1ff" font-size="23" text-anchor="middle">Images 2.5</text><path d="M750 295H880" stroke="#5b87d1" stroke-width="7" stroke-dasharray="18 14" class="flow"/><rect x="880" y="205" width="210" height="180" rx="20" fill="#ffe8b6" stroke="#d3923f" stroke-width="5"/><g class="edit"><path d="M925 335l70-70 32 32-70 70-42 10z" fill="#e48756"/><path d="M995 265l16-16 32 32-16 16z" fill="#a64b4b"/></g><text x="985" y="430" fill="#8c5e2a" font-size="22" text-anchor="middle">精确编辑</text><text x="100" y="88" fill="#35588d" font-size="24">OPENAI · IMAGES 2.5 · 2026-09-08</text><text x="100" y="565" fill="#54709d" font-size="21">草图、模板和多轮编辑把生成变成可回看的工作流</text></svg>