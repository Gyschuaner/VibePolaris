<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mistral Medium 3.1 应用流水线</title>
  <desc id="desc">文档和图片进入 128K 上下文，模型输出结构化结果，经权限校验后才调用外部工具</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#1b2638" stroke="#3b4a62" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Mistral Medium 3.1</text>
  <text x="92" y="160" fill="#fca5a5" font-size="18" font-family="sans-serif">多模态输入 · 128K · 结构化输出 · 工具授权</text>
  <rect x="92" y="272" width="210" height="174" rx="20" fill="#263b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="197" y="328" fill="#dbeafe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">文档 / 图片</text>
  <text x="197" y="370" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">来源 · 版本 · 128K</text>
  <path d="M 326 358 H 384" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 364 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="408" y="272" width="210" height="174" rx="20" fill="#3a2e4e" stroke="#c4b5fd" stroke-width="2"/>
  <text x="513" y="328" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">模型理解</text>
  <text x="513" y="370" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">问答 · 推理 · 摘要</text>
  <path d="M 642 358 H 700" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 680 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="724" y="272" width="210" height="174" rx="20" fill="#203d3e" stroke="#5eead4" stroke-width="2"/>
  <text x="829" y="328" fill="#ccfbf1" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">JSON / 工具</text>
  <text x="829" y="370" fill="#99f6e4" font-size="16" text-anchor="middle" font-family="sans-serif">校验 · 授权 · 执行</text>
  <rect x="260" y="508" width="680" height="78" rx="18" fill="#3b2d25" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="556" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">function calling 产生意图，业务系统决定能否真的执行</text>
</svg>
