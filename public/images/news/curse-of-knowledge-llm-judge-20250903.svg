<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">ComplexEval：上下文复杂度与评审偏差</title>
<desc id="desc">固定同一份答案，改变评审上下文，观察 LLM Judge 的评分是否稳定，并用人审校准。</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f5f7ff"/><stop offset="1" stop-color="#fffaf1"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4054b2"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#182044" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="72" y="80" fill="#182044" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">ComplexEval：先测上下文，再相信分数</text>
<text x="74" y="118" fill="#5c668f" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">同一份答案 · 不同评审信息 · 检查 LLM Judge 是否被辅助线索带偏</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="230" height="290" rx="22" fill="#ffffff" stroke="#cfd5f5" stroke-width="2"/>
 <text x="102" y="235" fill="#4054b2" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">固定输入</text>
 <rect x="102" y="270" width="166" height="62" rx="12" fill="#e9edff"/>
 <text x="185" y="307" text-anchor="middle" fill="#26336f" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">同一份答案</text>
 <text x="102" y="375" fill="#5c668f" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">任务编号与文本冻结</text>
 <text x="102" y="407" fill="#5c668f" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">便于成对回归</text>
 </g>
 <path d="M318 333 H390" stroke="#4054b2" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="410" y="170" width="330" height="326" rx="22" fill="#ffffff" stroke="#f0c66a" stroke-width="2"/>
 <text x="445" y="220" fill="#ad7510" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">评审上下文</text>
 <rect x="445" y="250" width="260" height="55" rx="12" fill="#fff2c9"/><text x="575" y="285" text-anchor="middle" fill="#80580a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">rubric / 参考答案</text>
 <rect x="445" y="323" width="260" height="55" rx="12" fill="#fff2c9"/><text x="575" y="358" text-anchor="middle" fill="#80580a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">示例 / 任务说明</text>
 <text x="445" y="430" fill="#7e6a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">一次只改变一类信息</text>
 <text x="445" y="460" fill="#7e6a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">记录上下文版本</text>
</g>
<path d="M758 333 H830" stroke="#4054b2" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="850" y="170" width="280" height="326" rx="22" fill="#ffffff" stroke="#d5c8ef" stroke-width="2"/>
 <text x="885" y="220" fill="#6b4ba1" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Judge 输出</text>
 <circle cx="925" cy="290" r="34" fill="#e8ddfb"/><text x="925" y="298" text-anchor="middle" fill="#563b85" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif">分</text>
 <circle cx="1027" cy="290" r="34" fill="#e8ddfb"/><text x="1027" y="298" text-anchor="middle" fill="#563b85" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif">理由</text>
 <path d="M920 392 C950 365 1000 365 1032 392" fill="none" stroke="#d56b55" stroke-width="5"/>
 <text x="990" y="435" text-anchor="middle" fill="#a14c3d" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">上下文变了，信号也可能变</text>
 <text x="990" y="466" text-anchor="middle" fill="#5c668f" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">先人审校准，再接自动门禁</text>
</g>
<text x="72" y="590" fill="#4054b2" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">12 个基础场景 + 3 个高级场景</text>
<text x="72" y="625" fill="#5c668f" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">复杂度上升时，偏差可能放大；推理模型也需要被测量。</text>
</svg>