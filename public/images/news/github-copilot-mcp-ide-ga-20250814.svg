<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Copilot MCP support in IDEs</title>
  <desc id="desc">Three integrated development environments connect Copilot agent mode to local or remote MCP tools behind an administrator policy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#101a2b"/><stop offset="1" stop-color="#234a57"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#68c7ff"/><stop offset="1" stop-color="#6f7df5"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#2ea043"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050b14" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="190" fill="#68c7ff" opacity=".13"/>
  <circle cx="1030" cy="530" r="240" fill="#56d364" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="72" y="74" width="600" height="132" rx="24" fill="#162c43" stroke="#68c7ff" stroke-width="2"/>
    <text x="106" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="4" fill="#9bdcff">GITHUB COPILOT</text>
    <text x="106" y="177" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#f0f6fc">MCP · GA</text>
  </g>
  <text x="78" y="267" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#d9efff">三种 IDE，接入本地或远程工具</text>
  <g transform="translate(690 96)" filter="url(#shadow)">
    <rect x="0" y="24" width="164" height="124" rx="18" fill="#224d74" stroke="#9bdcff" stroke-width="3"/>
    <rect x="190" y="24" width="164" height="124" rx="18" fill="#2c6b62" stroke="#9fe7c5" stroke-width="3"/>
    <rect x="95" y="190" width="164" height="124" rx="18" fill="#5d5438" stroke="#f6d478" stroke-width="3"/>
    <text x="82" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#eaf7ff">JETBRAINS</text>
    <text x="272" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#eafff5">ECLIPSE</text>
    <text x="177" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff4d3">XCODE</text>
    <path d="M164 86 H190 M146 148 L150 190 M208 148 L204 190" stroke="#f6d478" stroke-width="4" stroke-linecap="round"/>
    <circle cx="177" cy="374" r="40" fill="url(#green)" stroke="#ccf7d2" stroke-width="3"/>
    <path d="M158 374 L171 387 L198 355" fill="none" stroke="#10263c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="177" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#d8f4ee">ADMIN POLICY</text>
  </g>
  <g transform="translate(80 360)">
    <rect width="560" height="132" rx="20" fill="#152f45" stroke="#32637a" stroke-width="2"/>
    <text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f6d478">MCP SERVER</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e9f7ff">PAT / OAUTH · AGENT MODE · TOOLS</text>
    <text x="30" y="115" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b2d5df">policy off by default for orgs and enterprises</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a7cbd2">GENERALLY AVAILABLE · 14 AUG 2025</text>
</svg>