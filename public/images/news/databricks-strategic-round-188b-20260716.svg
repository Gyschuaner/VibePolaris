<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Databricks 1880 亿美元估值与 AI 产品</title><desc id="d">条款书先确定估值和条件，交割后资金投入 Unity AI Gateway、Genie 和 Lakebase。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#14233e}.muted{fill:#61718a;font-size:22px}.card{fill:#fff;stroke:#bfd0e6;stroke-width:3}.rise{fill:none;stroke:#f08a56;stroke-width:9;stroke-linecap:round;stroke-dasharray:20 16;animation:r 3s linear infinite}@keyframes r{to{stroke-dashoffset:-72}}</style><rect width="1200" height="680" rx="34" fill="#f4f7fb"/><text x="72" y="92" font-size="42" font-weight="700">Databricks / $188B</text><text x="72" y="132" class="muted">估值、条款书、交割和 AI 产品要分开读</text><g transform="translate(74 228)"><rect class="card" width="250" height="180" rx="24"/><text x="28" y="65" font-size="30">条款书</text><text x="28" y="112" class="muted">估值 $188B</text><text x="28" y="148" class="muted">预计夏末交割</text></g><path class="rise" d="M324 320H438"/><g transform="translate(438 208)"><rect class="card" width="286" height="224" rx="24"/><text x="28" y="62" font-size="30">资金用途</text><text x="28" y="108" class="muted">Unity AI Gateway</text><text x="28" y="146" class="muted">Genie · Lakebase</text><text x="28" y="184" class="muted">治理、数据、代理</text></g><path class="rise" d="M724 320H838"/><g transform="translate(838 184)"><rect class="card" width="300" height="272" rx="24"/><text x="28" y="60" font-size="30">真正的结果</text><text x="28" y="108" class="muted">交易完成</text><text x="28" y="146" class="muted">产品采用</text><text x="28" y="184" class="muted">可核验经营数据</text></g><text x="78" y="568" class="muted">官方未公布融资金额；Reuters 转述的 $3B 仍保留媒体归属。</text></svg>
