<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Enterprise Frontier Safeguards</title><desc id="desc">企业代理活动进入客户云端的存储、检测、告警和处置闭环</desc><rect width="1200" height="720" fill="#0d1616"/><rect x="48" y="48" width="1104" height="624" rx="30" fill="#182728" stroke="#3c5b5a" stroke-width="2"/><text x="90" y="118" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">Enterprise Frontier Safeguards</text><text x="90" y="156" fill="#b7d0cd" font-size="17" font-family="sans-serif">零数据保留，把运营责任交回客户云端</text><g transform="translate(90 250)"><rect width="190" height="170" rx="22" fill="#1e3a3a" stroke="#22d3ee" stroke-width="3"/><text x="95" y="90" fill="#a5f3fc" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700">代理活动</text><text x="95" y="125" fill="#d7f9fa" text-anchor="middle" font-size="14" font-family="sans-serif">请求 · 工具 · 信号</text></g><path d="M302 335 H370" stroke="#7fa8a5" stroke-width="4"/><path d="M354 317 l20 18 -20 18" fill="none" stroke="#7fa8a5" stroke-width="4"/><g transform="translate(400 250)"><rect width="190" height="170" rx="22" fill="#1e3a3a" stroke="#a7f3d0" stroke-width="3"/><text x="95" y="90" fill="#bbf7d0" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700">客户云</text><text x="95" y="125" fill="#d7f9fa" text-anchor="middle" font-size="14" font-family="sans-serif">密钥 · 权限 · 日志</text></g><path d="M612 335 H680" stroke="#7fa8a5" stroke-width="4"/><path d="M664 317 l20 18 -20 18" fill="none" stroke="#7fa8a5" stroke-width="4"/><g transform="translate(710 250)"><rect width="190" height="170" rx="22" fill="#1e3a3a" stroke="#fbbf24" stroke-width="3"/><text x="95" y="90" fill="#fde68a" text-anchor="middle" font-size="22" font-family="sans-serif" font-weight="700">检测告警</text><text x="95" y="125" fill="#d7f9fa" text-anchor="middle" font-size="14" font-family="sans-serif">信号 · 工单</text></g><path d="M922 335 H990" stroke="#7fa8a5" stroke-width="4"/><path d="M974 317 l20 18 -20 18" fill="none" stroke="#7fa8a5" stroke-width="4"/><g transform="translate(1020 250)"><rect width="90" height="170" rx="22" fill="#1e3a3a" stroke="#fb7185" stroke-width="3"/><text x="45" y="92" fill="#fecdd3" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="700">处置</text><text x="45" y="126" fill="#d7f9fa" text-anchor="middle" font-size="13" font-family="sans-serif">停用</text><text x="45" y="148" fill="#d7f9fa" text-anchor="middle" font-size="13" font-family="sans-serif">审计</text></g><text x="600" y="514" fill="#f8fafc" text-anchor="middle" font-size="23" font-family="sans-serif">零数据保留 ≠ 零运营责任</text><text x="600" y="574" fill="#8fb1ad" text-anchor="middle" font-size="15" font-family="sans-serif">VibePolaris 自制机制图 · CC BY 4.0 · 依据 Anthropic EFS</text></svg>
