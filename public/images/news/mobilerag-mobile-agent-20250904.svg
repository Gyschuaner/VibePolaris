<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">MobileRAG：手机 Agent 的检索、执行和记忆</title>
<desc id="desc">手机任务经过环境状态、三类检索、可检查动作和带条件记忆，并在高风险步骤前请求确认。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3977b7"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#19324d" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#173a5d" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">MobileRAG：让手机 Agent 记得路，也看得见路况</text>
<text x="72" y="118" fill="#627993" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">检索外部知识 · 读取当前环境 · 执行动作后确认结果</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="230" height="290" rx="22" fill="#fff" stroke="#c5dcef" stroke-width="2"/>
 <text x="106" y="238" fill="#3977b7" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">任务与环境</text>
 <rect x="105" y="272" width="160" height="58" rx="12" fill="#dceeff"/><text x="185" y="309" text-anchor="middle" fill="#285c8d" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">用户目标</text>
 <text x="105" y="378" fill="#627993" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">页面 · 权限 · 网络</text>
 <text x="105" y="411" fill="#627993" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">先确认能否执行</text>
</g>
<path d="M318 332 H390" stroke="#3977b7" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="410" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#9fcfca" stroke-width="2"/>
 <text x="448" y="220" fill="#28766e" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">检索增强</text>
 <rect x="448" y="254" width="120" height="52" rx="12" fill="#d8f1ec"/><text x="508" y="287" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">InterRAG</text>
 <rect x="585" y="254" width="120" height="52" rx="12" fill="#d8f1ec"/><text x="645" y="287" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">LocalRAG</text>
 <rect x="448" y="325" width="120" height="52" rx="12" fill="#d8f1ec"/><text x="508" y="358" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">MemRAG</text>
 <text x="585" y="358" fill="#537b76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">知识 · 内容 · 经验</text>
 <text x="448" y="430" fill="#537b76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">每条证据带来源与范围</text>
 <text x="448" y="460" fill="#537b76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不是直接点击指令</text>
</g>
<path d="M778 332 H848" stroke="#3977b7" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="868" y="170" width="262" height="326" rx="22" fill="#fff" stroke="#efc47d" stroke-width="2"/>
 <text x="905" y="220" fill="#a16e16" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">执行与确认</text>
 <rect x="905" y="255" width="188" height="58" rx="12" fill="#fff0c8"/><text x="999" y="291" text-anchor="middle" fill="#80580a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">短计划</text>
 <rect x="905" y="335" width="188" height="58" rx="12" fill="#fff0c8"/><text x="999" y="371" text-anchor="middle" fill="#80580a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">状态回读</text>
 <text x="999" y="437" text-anchor="middle" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高风险动作先授权</text>
 <text x="999" y="467" text-anchor="middle" fill="#806a3a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">异常时交还控制权</text>
</g>
<text x="70" y="578" fill="#3977b7" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">MobileRAG-Eval：复杂真实任务 · 论文报告提升 10.3%</text>
<text x="70" y="615" fill="#627993" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">少走步骤不等于少做确认；记忆必须带条件、来源和过期时间。</text>
</svg>