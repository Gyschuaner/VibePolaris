<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">地图智能体把出行目标变成行动</title>
  <desc id="desc">用户说出一段出行目标，地图智能体理解位置和时间，调用路线、生活和空间工具。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#182c4f"/>
      <stop offset="1" stop-color="#2c6d78"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f0dc"/>
      <stop offset="1" stop-color="#d9e8d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#09182c" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <path d="M-30 460 C130 350 190 510 330 400 S590 300 760 400 S980 500 1230 310" fill="none" stroke="#f3ca72" stroke-width="5" stroke-dasharray="13 14" opacity=".9"/>
  <circle cx="1060" cy="110" r="190" fill="#f3ca72" opacity=".16"/>
  <circle cx="110" cy="90" r="145" fill="#8ec4ba" opacity=".17"/>
  <g filter="url(#shadow)">
    <rect x="95" y="115" width="310" height="330" rx="30" fill="url(#card)"/>
    <rect x="445" y="115" width="310" height="330" rx="30" fill="#f8f0dc"/>
    <rect x="795" y="115" width="310" height="330" rx="30" fill="#e8c878"/>
  </g>
  <g fill="#182c4f" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="140" y="175" font-size="25" font-weight="800">一句话目标</text>
    <rect x="140" y="230" width="210" height="54" rx="18" fill="#d9e8d6"/>
    <text x="163" y="264" font-size="17">带家人玩三天</text>
    <rect x="140" y="302" width="170" height="45" rx="16" fill="#8ec4ba"/>
    <text x="163" y="331" font-size="16">杭州 · 亲子</text>
    <text x="140" y="405" font-size="17">时间 · 位置 · 偏好</text>

    <text x="490" y="175" font-size="25" font-weight="800">小高老师</text>
    <circle cx="520" cy="260" r="23" fill="#2c6d78"/>
    <path d="M520 238 v44 M498 260 h44" stroke="#f8f0dc" stroke-width="6" stroke-linecap="round"/>
    <path d="M570 238 h135 M570 285 h105 M570 332 h76" stroke="#2c6d78" stroke-width="11" stroke-linecap="round"/>
    <text x="490" y="405" font-size="17">理解 · 规划 · 调度</text>

    <text x="840" y="175" font-size="25" font-weight="800">工具落地</text>
    <path d="M865 245 C910 210 1010 210 1050 260 S1015 360 945 345 S860 310 865 245" fill="none" stroke="#182c4f" stroke-width="5"/>
    <circle cx="882" cy="246" r="17" fill="#182c4f"/>
    <circle cx="1039" cy="262" r="17" fill="#182c4f"/>
    <circle cx="951" cy="342" r="17" fill="#182c4f"/>
    <text x="840" y="405" font-size="17">路线 · 生活 · 空间</text>
  </g>
  <g fill="#f8f0dc" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="95" y="565" font-size="22" letter-spacing="1">Amap 2025 · 2025.08.04</text>
    <text x="1105" y="565" font-size="16" text-anchor="end" opacity=".84">地图把目标接到真实世界</text>
  </g>
</svg>
