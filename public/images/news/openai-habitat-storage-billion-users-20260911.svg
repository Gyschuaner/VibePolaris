<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">OpenAI Habitat 存储平台</title><desc id="desc">Habitat 连接产品请求、访问控制和在线存储；70M+ 请求每秒是 OpenAI 的自述。</desc><style>.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.42;transform:scale(1.06);transform-origin:center}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d37"/><stop offset="1" stop-color="#165a72"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#a8dadc"/><stop offset="1" stop-color="#f6bd60"/></linearGradient></defs><rect width="960" height="540" rx="34" fill="url(#bg)"/><text x="72" y="88" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="32" font-weight="700">HABITAT / ONLINE STORAGE</text><text x="72" y="124" fill="#c6e7ea" font-family="Arial,sans-serif" font-size="20">70M+ requests/s · 500 PB+ · 1B+ people/week（公司口径）</text><g class="pulse"><rect x="84" y="214" width="184" height="112" rx="24" fill="#f4f7fb" opacity=".96"/><text x="122" y="266" fill="#15324b" font-family="Arial,sans-serif" font-size="24" font-weight="700">产品请求</text><text x="119" y="298" fill="#50758a" font-family="Arial,sans-serif" font-size="18">ChatGPT · API · Codex</text></g><path d="M294 270h116M434 270h92M550 270h84" stroke="url(#line)" stroke-width="13" stroke-linecap="round"/><circle cx="414" cy="270" r="18" fill="#f6bd60"/><circle cx="526" cy="270" r="18" fill="#a8dadc"/><g><rect x="640" y="178" width="222" height="184" rx="28" fill="#0d293f" stroke="#a8dadc" stroke-width="4"/><text x="686" y="231" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="26" font-weight="700">Habitat</text><path d="M690 270h120M690 304h120M690 338h72" stroke="#a8dadc" stroke-width="10" stroke-linecap="round"/><circle cx="825" cy="270" r="10" fill="#f6bd60" class="pulse"/></g><text x="72" y="468" fill="#d9f1f2" font-family="Arial,sans-serif" font-size="21">统一路由、缓存、权限与数据驻留，尾延迟仍需单独核验</text>