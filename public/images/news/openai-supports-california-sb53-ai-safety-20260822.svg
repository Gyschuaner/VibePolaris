<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">SB 53 政策立场转向链路</title><desc id="desc">从现行规则到 OpenAI 8 月 22 日的政策建议，再到等待正式修法的可执行检查点。</desc><metadata><source>https://techcrunch.com/2026/08/22/openai-says-california-should-strengthen-its-ai-safety-bill/</source><source>https://www.gov.ca.gov/2025/09/29/governor-newsom-signs-sb-53-advancing-californias-world-leading-artificial-intelligence-industry/</source><source>https://openai.com/index/frontier-safety-blueprint/</source></metadata><rect width="1200" height="620" rx="36" fill="#101827"/><text x="70" y="72" fill="#f8fafc" font-size="32" font-family="Arial, sans-serif" font-weight="700">SB 53：从现行底座到待修法主张</text><text x="70" y="110" fill="#a6b5c8" font-size="18" font-family="Arial, sans-serif">新闻事件是立场转向；法律文本和执行证据仍在后面</text><line x1="170" y1="310" x2="1030" y2="310" stroke="#52647c" stroke-width="8"/><g font-family="Arial, sans-serif"><circle cx="210" cy="310" r="88" fill="#1d765c"/><text x="210" y="298" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">现行 SB 53</text><text x="210" y="332" text-anchor="middle" fill="#d7f6e8" font-size="16">透明度 · 报告 · 举报人</text><path d="M300 310 H400" stroke="#88a6c8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="540" cy="310" r="105" fill="#c7672c"/><text x="540" y="292" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">8/22 立场</text><text x="540" y="326" text-anchor="middle" fill="#fff1df" font-size="16">OpenAI 支持强化</text><text x="540" y="350" text-anchor="middle" fill="#fff1df" font-size="16">训练/评测期监控</text><path d="M650 310 H750" stroke="#88a6c8" stroke-width="4" marker-end="url(#arrow)"/><circle cx="890" cy="310" r="105" fill="#2563a6"/><text x="890" y="292" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">待验证</text><text x="890" y="326" text-anchor="middle" fill="#d9eaff" font-size="16">法案文本 · 定义</text><text x="890" y="350" text-anchor="middle" fill="#d9eaff" font-size="16">审计 · 执法</text><rect x="105" y="470" width="990" height="78" rx="18" fill="#262d3b" stroke="#e6a06e" stroke-width="2"/><text x="600" y="503" text-anchor="middle" fill="#ffd5b5" font-size="20" font-weight="700">边界：公司政策声明 ≠ 新法生效 ≠ 独立审计结果</text><text x="600" y="532" text-anchor="middle" fill="#c5cfdd" font-size="16">追踪修正案、事故定义、日志与停止流程是否真的落地</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#88a6c8"/></marker></defs></svg>