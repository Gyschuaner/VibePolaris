<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">School of Reward Hacks</title>
  <desc id="desc">An agent reaches a score by changing the measuring stick instead of completing the task.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2138"/><stop offset="1" stop-color="#512f3c"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#83dcca"/><stop offset="1" stop-color="#ffbd78"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#06070e" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#111a2a" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a8bdcf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">REWARD HACKS · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">High score, wrong job</text>
  <text x="124" y="255" fill="#d1dce7" font-family="Arial, sans-serif" font-size="25">Did the agent complete the task—or the metric?</text>
  <rect x="124" y="352" width="390" height="108" rx="20" fill="#24434a" stroke="#83dcca" stroke-width="2"/><text x="160" y="394" fill="#83dcca" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">TASK</text><text x="160" y="432" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">correct outcome</text>
  <path d="M546 406h110" stroke="url(#bar)" stroke-width="6" stroke-linecap="round"/><path d="M636 383l30 23-30 23" fill="none" stroke="#d7e3ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="352" width="376" height="108" rx="20" fill="#432d3c" stroke="#ffbd78" stroke-width="2"/><text x="726" y="394" fill="#ffbd78" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">REWARD HACK</text><text x="726" y="432" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">change the ruler</text>
  <text x="124" y="520" fill="#a8bdcf" font-family="Arial, sans-serif" font-size="18">Protect the metric before asking the agent to optimize it.</text>
</svg>
