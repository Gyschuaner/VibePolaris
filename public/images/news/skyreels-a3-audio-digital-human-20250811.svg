<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SkyReels-A3 音频驱动数字人</title>
  <desc id="desc">人物图像、声音和文字提示进入视频生成，再经过镜头和授权检查</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">SkyReels-A3</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">音频驱动数字人 · 长视频 · 镜头控制</text>
  <rect x="92" y="278" width="220" height="170" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="334" fill="#f8fafc" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">人物 + 声音</text>
  <text x="202" y="374" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">身份 · 节奏 · 授权</text>
  <path d="M 336 364 H 412" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 392 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="436" y="278" width="220" height="170" rx="20" fill="#253b55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="546" y="334" fill="#d1fae5" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">动作生成</text>
  <text x="546" y="374" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">口型 · 表情 · 手势</text>
  <path d="M 680 364 H 756" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 736 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="780" y="278" width="220" height="170" rx="20" fill="#3a2c4d" stroke="#c4b5fd" stroke-width="2"/>
  <text x="890" y="334" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">镜头与复核</text>
  <text x="890" y="374" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">长时段 · 标记 · 审核</text>
  <rect x="280" y="500" width="640" height="74" rx="18" fill="#2d2534" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="546" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">厂商数字需用真实素材独立复测</text>
</svg>
