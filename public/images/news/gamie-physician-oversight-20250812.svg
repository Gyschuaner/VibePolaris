<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">g-AMIE 医生监督流程</title>
  <desc id="desc">g-AMIE 在护栏内采集病史并生成 SOAP note，监督医生在工作台中复核并决定是否发送患者消息</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#1f2937" stroke="#475569" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">guardrailed-AMIE</text>
  <text x="92" y="160" fill="#c4b5fd" font-size="18" font-family="sans-serif">病史采集 → 护栏 → SOAP note → 医生复核</text>
  <rect x="92" y="272" width="220" height="174" rx="20" fill="#243047" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="328" fill="#dbeafe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">病史对话</text>
  <text x="202" y="370" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">询问 · 补问 · 回答</text>
  <path d="M 336 358 H 394" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 374 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="418" y="272" width="220" height="174" rx="20" fill="#3b2f4f" stroke="#c4b5fd" stroke-width="2"/>
  <text x="528" y="328" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">护栏代理</text>
  <text x="528" y="370" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">不输出个性化医嘱</text>
  <path d="M 662 358 H 720" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 700 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="744" y="272" width="220" height="174" rx="20" fill="#203b3b" stroke="#5eead4" stroke-width="2"/>
  <text x="854" y="328" fill="#ccfbf1" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">SOAP note</text>
  <text x="854" y="370" fill="#99f6e4" font-size="16" text-anchor="middle" font-family="sans-serif">摘要 · DDx · 计划</text>
  <rect x="260" y="508" width="680" height="78" rx="18" fill="#3b2d25" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="556" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">医生在 clinician cockpit 中修改、批准或升级</text>
</svg>
