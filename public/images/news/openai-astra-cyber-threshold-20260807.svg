  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="105" r="190" fill="#6bd8d0" opacity=".13"/>
  <circle cx="120" cy="560" r="190" fill="#ee9ec8" opacity=".12"/>
