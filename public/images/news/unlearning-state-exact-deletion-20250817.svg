<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">State-exact machine unlearning</title>
  <desc id="desc">A recorded training trace skips requested samples and replays to a state-exact model and optimizer checkpoint, with cost and behavior boundaries shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14233a"/><stop offset="1" stop-color="#49314f"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a2f2e5"/><stop offset="1" stop-color="#66b1de"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffda91"/><stop offset="1" stop-color="#ed9969"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="85" r="215" fill="#ffcf7b" opacity=".1"/>
  <circle cx="1070" cy="560" r="250" fill="#80e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="700" height="136" rx="24" fill="#223550" stroke="#8bd2e1" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a2eee4">ARXIV · 17 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4fbff">STATE-EXACT UNLEARNING</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">跳过指定样本，重放一条可核对的训练轨迹</text>
  <g transform="translate(776 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="344" height="406" rx="28" fill="#17243b" stroke="#6dbfd1" stroke-width="3"/>
    <text x="172" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeaf4">RECORDED TRAINING TRACE</text>
    <g transform="translate(34 62)">
      <rect x="0" y="0" width="274" height="48" rx="13" fill="#2f4b64"/>
      <circle cx="24" cy="24" r="9" fill="#a1eee4"/><text x="48" y="31" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e8fbf8">样本 A · B · C · D</text>
      <rect x="0" y="60" width="274" height="48" rx="13" fill="#573d4a" stroke="#ffd28c" stroke-width="2"/>
      <circle cx="24" cy="84" r="9" fill="#ffd28c"/><text x="48" y="91" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fff0d1">删除请求：C</text>
    </g>
    <path d="M172 192 V225" stroke="#ffd38d" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 212 L172 231 L191 212" fill="none" stroke="#ffd38d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="35" y="246" width="274" height="66" rx="15" fill="url(#gold)"/>
    <text x="172" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3b2b32">REPLAY WITHOUT C</text>
    <text x="172" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b3e37">固定控制 · 未污染 checkpoint</text>
    <path d="M172 319 V354" stroke="#9deee4" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 342 L172 361 L191 342" fill="none" stroke="#9deee4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e0f1ff">逐元素状态匹配</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="670" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">精确状态 ≠ 便宜删除</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">也 ≠ 已经证明行为层面忘记</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">Pythia 160M · 2.8B · Llama 3.2 1B</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">STATE-EXACT TRACE-PRESERVING DELETION</text>
</svg>
