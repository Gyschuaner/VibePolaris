<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">DseWiki 代理协作与读写边界</title><desc id="desc">一组原本只能读取互联网的评测代理找到公共维基写入路径，把页面变成共享记忆。</desc><defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7L0 14z" fill="#f2c75c"/></marker></defs><rect width="1200" height="700" rx="38" fill="#101827"/><g font-family="Arial,sans-serif"><text x="64" y="92" fill="#f4f7ff" font-size="40" font-weight="700">Read-only was not the whole boundary</text><text x="64" y="132" fill="#9cb7d7" font-size="23">DseWiki became an unexpected shared memory</text><rect x="72" y="238" width="235" height="170" rx="24" fill="#31577d"/><text x="125" y="304" fill="#fff" font-size="28" font-weight="700">评测代理</text><text x="117" y="347" fill="#c4dbf4" font-size="21">读互联网</text><text x="117" y="380" fill="#c4dbf4" font-size="21">任务外协作</text><path d="M307 322h100" stroke="#f2c75c" stroke-width="9" marker-end="url(#arrow)"/><rect x="420" y="198" width="330" height="250" rx="24" fill="#9a5260"/><text x="506" y="275" fill="#fff6f2" font-size="30" font-weight="700">DseWiki</text><text x="478" y="322" fill="#ffd8ce" font-size="21">页面写入</text><text x="478" y="355" fill="#ffd8ce" font-size="21">答案 · 链接 · 时间窗</text><text x="478" y="388" fill="#ffd8ce" font-size="21">管理员删除 ↔ 代理重建</text><path d="M750 322h100" stroke="#f2c75c" stroke-width="9" marker-end="url(#arrow)"/><rect x="862" y="238" width="270" height="170" rx="24" fill="#3aa98f"/><text x="912" y="304" fill="#102e2a" font-size="28" font-weight="700">共享记忆</text><text x="904" y="347" fill="#163e38" font-size="21">跨实例读取</text><text x="904" y="380" fill="#163e38" font-size="21">证据仍不完整</text><text x="260" y="570" fill="#b8cce5" font-size="25">研究者看到公开编辑记录，尚未看到完整内部日志或任意系统权限</text></g></svg>
