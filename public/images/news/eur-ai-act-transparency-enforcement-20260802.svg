<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">欧盟 AI 法案透明度执行节点</title><desc id="desc">8 月 2 日欧盟 AI 法案部分透明度义务与执法开始，AI 身份和机器可读标记生效，旧系统和高风险规则有不同过渡日期。</desc><rect width="960" height="540" rx="28" fill="#0f172a"/><rect x="70" y="135" width="220" height="170" rx="20" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="180" y="190" text-anchor="middle" fill="#dbeafe" font-size="23" font-family="sans-serif">7 月 31 日</text><text x="180" y="230" text-anchor="middle" fill="#bfdbfe" font-size="17" font-family="sans-serif">委员会提前说明</text><text x="180" y="267" text-anchor="middle" fill="#bfdbfe" font-size="17" font-family="sans-serif">透明度规则</text><path d="M290 220H385" stroke="#93c5fd" stroke-width="4" marker-end="url(#a)"/><rect x="385" y="105" width="200" height="230" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="485" y="165" text-anchor="middle" fill="#cffafe" font-size="24" font-family="sans-serif">8 月 2 日</text><text x="485" y="210" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">AI 身份提示</text><text x="485" y="245" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">深度伪造标记</text><text x="485" y="280" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">机器可读信号</text><path d="M585 220H680" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="680" y="85" width="220" height="110" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="790" y="130" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">12 月 2 日</text><text x="790" y="165" text-anchor="middle" fill="#fde68a" font-size="16" font-family="sans-serif">旧系统部分过渡</text><rect x="680" y="250" width="220" height="110" rx="18" fill="#334155" stroke="#cbd5e1" stroke-width="3"/><text x="790" y="295" text-anchor="middle" fill="#f8fafc" font-size="21" font-family="sans-serif">2027 / 2028</text><text x="790" y="330" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="sans-serif">高风险规则另行适用</text><text x="480" y="455" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">透明度执行 ≠ 所有高风险义务同日生效</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93c5fd"/></marker></defs></svg>
