<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gemini CLI GitHub Actions 协作 Agent</title>
  <desc id="desc">Issue 或 Pull Request 触发 Agent，经过身份、命令白名单和日志观测后回到人工合并。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1e3457"/>
      <stop offset="1" stop-color="#4b7b83"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f0e3"/>
      <stop offset="1" stop-color="#d6e5e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#10213e" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="190" fill="#edc877" opacity=".16"/>
  <circle cx="100" cy="540" r="230" fill="#80b7b4" opacity=".16"/>
  <path d="M24 458 C125 367 238 515 350 400 S560 322 675 430 S870 512 1006 382 S1100 347 1190 420" fill="none" stroke="#edc877" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f3f0e3"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c877"/>
  </g>
  <g fill="#1e3457" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">Issue / PR</text>
    <rect x="115" y="225" width="220" height="50" rx="16" fill="#bad7d8"/>
    <text x="139" y="257" font-size="17">@gemini-cli review</text>
    <rect x="115" y="291" width="182" height="50" rx="16" fill="#c4c9e4"/>
    <text x="139" y="323" font-size="17">write tests</text>
    <path d="M115 378 h205" stroke="#4b7b83" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="115" y="407" font-size="16">事件触发 · 异步执行</text>

    <text x="487" y="178" font-size="25" font-weight="800">安全控制</text>
    <rect x="500" y="226" width="200" height="44" rx="14" fill="#bad7d8"/>
    <text x="524" y="254" font-size="16">WIF identity</text>
    <rect x="500" y="287" width="154" height="44" rx="14" fill="#c4c9e4"/>
    <text x="524" y="315" font-size="16">allowlist</text>
    <rect x="500" y="348" width="184" height="44" rx="14" fill="#9fc4b6"/>
    <text x="524" y="376" font-size="16">OpenTelemetry</text>
    <text x="487" y="417" font-size="16">身份 · 命令 · 日志</text>

    <text x="859" y="178" font-size="25" font-weight="800">人工合并</text>
    <circle cx="906" cy="274" r="42" fill="#4b7b83"/>
    <path d="M884 275 l14 14 l29 -35" fill="none" stroke="#f3f0e3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M982 245 h108 M982 291 h80 M982 337 h127" stroke="#1e3457" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">diff · tests · approval</text>
  </g>
  <g fill="#f3f0e3" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">GEMINI CLI ACTIONS · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">自动化要有边界</text>
  </g>
</svg>
