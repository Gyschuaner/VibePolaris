<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">A2A 让不同 Agent 互相发现与协作</title><desc id="d">三个不同供应商的 Agent 通过中立协议交换任务，工具访问另由 MCP 负责。</desc><rect width="1200" height="630" fill="#eff6ff"/><text x="70" y="84" font-family="Arial" font-size="38" font-weight="700" fill="#1e3a8a">Agent 之间的共同语言</text><text x="70" y="124" font-family="Arial" font-size="20" fill="#1d4ed8">Agent2Agent 进入 Linux Foundation · 2025-06-23</text><g stroke="#2563eb" stroke-width="5" fill="none"><path d="M230 330 Q600 130 970 330"/><path d="M230 330 Q600 520 970 330"/><path d="M230 330 H970" stroke-dasharray="14 14"/></g><g font-family="Arial" text-anchor="middle"><circle cx="230" cy="330" r="96" fill="#1e3a8a"/><text x="230" y="322" font-size="27" font-weight="700" fill="#fff">Agent A</text><text x="230" y="354" font-size="16" fill="#bfdbfe">发现任务</text><circle cx="970" cy="330" r="96" fill="#1e3a8a"/><text x="970" y="322" font-size="27" font-weight="700" fill="#fff">Agent B</text><text x="970" y="354" font-size="16" fill="#bfdbfe">回传状态</text><circle cx="600" cy="330" r="116" fill="#dbeafe" stroke="#2563eb" stroke-width="7"/><text x="600" y="322" font-size="30" font-weight="700" fill="#1e3a8a">A2A</text><text x="600" y="356" font-size="17" fill="#1d4ed8">中立治理</text><rect x="485" y="470" width="230" height="62" rx="16" fill="#fff" stroke="#60a5fa" stroke-width="3"/><text x="600" y="510" font-size="20" fill="#1e3a8a">MCP：连接工具</text></g><text x="70" y="584" font-family="Arial" font-size="18" fill="#1d4ed8">A2A 负责 Agent 协作，认证、租户隔离和审计仍由部署方落实。</text></svg>