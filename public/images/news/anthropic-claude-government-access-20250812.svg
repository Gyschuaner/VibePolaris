<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">政府 AI 采购与治理入口</title>
  <desc id="desc">Claude for Government 通过采购和安全入口连接三个政府分支，数据、权限和人工审批由机构控制</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#1f2937" stroke="#475569" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Claude for Government</text>
  <text x="92" y="160" fill="#fca5a5" font-size="18" font-family="sans-serif">1 美元一年 · GSA schedule · 安全授权</text>
  <rect x="92" y="270" width="200" height="174" rx="20" fill="#263b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="192" y="326" fill="#dbeafe" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="700">行政</text>
  <text x="192" y="368" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">联邦民事机构</text>
  <rect x="342" y="270" width="200" height="174" rx="20" fill="#3b2f4f" stroke="#c4b5fd" stroke-width="2"/>
  <text x="442" y="326" fill="#ede9fe" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="700">立法</text>
  <text x="442" y="368" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">国会机构</text>
  <rect x="592" y="270" width="200" height="174" rx="20" fill="#203d3e" stroke="#5eead4" stroke-width="2"/>
  <text x="692" y="326" fill="#ccfbf1" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="700">司法</text>
  <text x="692" y="368" fill="#99f6e4" font-size="16" text-anchor="middle" font-family="sans-serif">联邦司法机构</text>
  <path d="M 830 356 H 902" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 882 340 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="922" y="270" width="170" height="174" rx="20" fill="#3b2d25" stroke="#fbbf24" stroke-width="2"/>
