  <text x="1007" y="390" fill="#fde68a" font-size="15" text-anchor="middle" font-family="sans-serif">审计 · 人工</text>
  <rect x="250" y="508" width="700" height="78" rx="18" fill="#252d3b" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="556" fill="#e2e8f0" font-size="18" text-anchor="middle" font-family="sans-serif">报价降低采购门槛，不替代机构的安全和授权评审</text>
