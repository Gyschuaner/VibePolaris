<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GPT-5 进入 Azure AI Foundry</title>
  <desc id="desc">Azure AI Foundry 将 GPT-5 家族接入企业应用，通过模型路由在能力、延迟和成本之间选择。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17344d"/>
      <stop offset="1" stop-color="#527b87"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f1e5"/>
      <stop offset="1" stop-color="#d4e6e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#0c2035" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="190" fill="#ecc06e" opacity=".18"/>
  <circle cx="112" cy="540" r="230" fill="#9ec4bd" opacity=".16"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#ecc06e" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f5f1e5"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#e7bd77"/>
  </g>
  <g fill="#17344d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">Foundry</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#bdd8db"/>
    <text x="137" y="261" font-size="24" font-weight="800">GPT-5 family</text>
    <path d="M108 329 h214" stroke="#527b87" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">5 · mini · nano · chat</text>
    <text x="108" y="405" font-size="16">企业 API 入口</text>

    <text x="489" y="178" font-size="25" font-weight="800">模型路由</text>
    <circle cx="600" cy="260" r="61" fill="#527b87"/>
    <path d="M567 260 h66 M600 227 v66" stroke="#f5f1e5" stroke-width="10" stroke-linecap="round"/>
    <path d="M515 355 C553 319 572 319 600 355 S650 390 690 350" fill="none" stroke="#527b87" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">能力 · 延迟 · 成本</text>

    <text x="860" y="178" font-size="25" font-weight="800">企业应用</text>
    <rect x="860" y="224" width="220" height="56" rx="17" fill="#527b87"/>
    <text x="970" y="260" font-size="23" fill="#f5f1e5" text-anchor="middle" font-weight="800">Copilot · Agent</text>
    <path d="M860 330 h215" stroke="#17344d" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">权限 · 日志 · 复核</text>
    <text x="860" y="405" font-size="16">上线仍需治理</text>
  </g>
  <g fill="#f5f1e5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">AZURE AI FOUNDRY · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">平台入口不替代选型</text>
  </g>
</svg>
