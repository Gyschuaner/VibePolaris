<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">MagicGUI 手机智能体工作流</title><desc id="desc">MagicGUI 读取屏幕、规划动作、在授权范围内调用应用，遇到错误时暂停交给人。</desc><rect width="1200" height="680" rx="36" fill="#151526"/><rect x="68" y="172" width="280" height="352" rx="38" fill="#282844" stroke="#6b72c9" stroke-width="4"/><rect x="96" y="210" width="224" height="230" rx="20" fill="#0d1524"/><circle cx="154" cy="250" r="14" fill="#69e1c4"/><rect x="126" y="294" width="130" height="18" rx="9" fill="#314362"/><rect x="126" y="332" width="170" height="18" rx="9" fill="#314362"/><rect x="126" y="370" width="92" height="18" rx="9" fill="#314362"/><text x="126" y="486" fill="#dce4f5" font-size="20" font-family="sans-serif">屏幕上下文</text><text x="72" y="86" fill="#fff" font-size="32" font-family="sans-serif" font-weight="700">会看屏幕，也要会停下来</text><text x="72" y="124" fill="#aebbd0" font-size="20" font-family="sans-serif">Honor MagicGUI · 2025-07-26</text><g font-family="sans-serif"><path d="M376 344h84" stroke="#ebc46c" stroke-width="6" stroke-linecap="round"/><path d="m448 332 18 12-18 12" fill="none" stroke="#ebc46c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="490" y="224" width="242" height="242" rx="26" fill="#453761"/><text x="526" y="276" fill="#fff" font-size="23" font-weight="700">规划</text><text x="526" y="324" fill="#ddd3ef" font-size="19">理解意图</text><text x="526" y="358" fill="#ddd3ef" font-size="19">拆成动作</text><text x="526" y="392" fill="#ddd3ef" font-size="19">检查页面反馈</text><path d="M760 344h84" stroke="#ebc46c" stroke-width="6" stroke-linecap="round"/><path d="m832 332 18 12-18 12" fill="none" stroke="#ebc46c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="884" y="204" width="244" height="280" rx="26" fill="#285b5d"/><text x="918" y="256" fill="#fff" font-size="23" font-weight="700">执行</text><text x="918" y="302" fill="#d7f1ed" font-size="19">应用调用</text><text x="918" y="336" fill="#d7f1ed" font-size="19">用户授权</text><path d="M918 398h150" stroke="#9fe8d5" stroke-width="5" stroke-linecap="round"/><text x="918" y="438" fill="#d7f1ed" font-size="18">失败 → 暂停 / 接管</text><rect x="268" y="566" width="664" height="56" rx="18" fill="#202b40"/><text x="310" y="603" fill="#fff" font-size="20">准确率是线索，权限和接管才是边界</text></g></svg>