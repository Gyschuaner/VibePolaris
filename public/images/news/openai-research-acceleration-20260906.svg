<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">研究员与多个研究代理协作</title><desc id="desc">人类研究员把问题交给三个编码代理，代理运行实验后回传带证据的结果，由人类决定下一步。</desc><rect width="1200" height="700" rx="36" fill="#0d1830"/><g font-family="Arial, sans-serif"><text x="60" y="92" fill="#eaf2ff" font-size="38" font-weight="700">Research loop</text><text x="60" y="132" fill="#9db4d5" font-size="22">3.1 agent-workdays is runtime, not a 3.1× science claim</text><rect x="70" y="235" width="240" height="160" rx="22" fill="#f6c453"/><text x="112" y="298" fill="#182238" font-size="28" font-weight="700">人类研究员</text><text x="112" y="338" fill="#182238" font-size="21">问题 · 取舍 · 扩展</text><path d="M310 315h95" stroke="#a7c7ff" stroke-width="8" marker-end="url(#a)"/><g fill="#1c3764" stroke="#79a8ed" stroke-width="3"><rect x="430" y="170" width="250" height="105" rx="20"/><rect x="430" y="300" width="250" height="105" rx="20"/><rect x="430" y="430" width="250" height="105" rx="20"/></g><g fill="#eaf2ff" font-size="24" font-weight="700"><text x="485" y="214">代理 A · 写代码</text><text x="485" y="344">代理 B · 跑评测</text><text x="485" y="474">代理 C · 排查环境</text></g><path d="M680 315h125" stroke="#a7c7ff" stroke-width="8" marker-end="url(#a)"/><rect x="815" y="235" width="300" height="160" rx="22" fill="#55d6be"/><text x="868" y="298" fill="#123135" font-size="27" font-weight="700">证据回到人手里</text><text x="868" y="338" fill="#123135" font-size="21">判断 · 复核 · 暂停</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#a7c7ff"/></marker></defs></g></svg>
