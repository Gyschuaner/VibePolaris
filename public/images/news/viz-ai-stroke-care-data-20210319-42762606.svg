<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">临床 AI 提醒与医生复核示意</title>
  <desc id="desc">脑部 CT 血管造影进入 AI 分析后，系统标记疑似大血管闭塞并提醒卒中团队，医生查看原始影像后决定护理流程；不是自动诊断。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#241a40"/><stop offset="1" stop-color="#124b55"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">AI 先发提醒，医生再完成判断</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-19 · Viz.ai 卒中护理数据新闻的通用流程解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#fda4af" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">CT 图像</text>
    <text x="237" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">急诊影像进入系统</text>
    <text x="237" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">不是完整临床决定</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">疑似 LVO 提醒</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">算法标记预先定义的发现</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">通知神经血管专科</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">医生复核</text>
    <text x="963" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">查看未压缩影像与病人情况</text>
    <text x="963" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">决定转运与治疗流程</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">提醒加快沟通，不等于模型替医生诊断</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">会议数据提供结果，临床边界仍要逐条核对</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">Viz.ai / Practical Neurology / ISC 2021：研究数据可追溯；样本、设备、医院和完整评估影响能否外推。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">来源：Viz.ai / Practical Neurology</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2021-03-19</text><text x="944" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">边界：不是诊断</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释临床 AI 新闻中的提醒、复核与证据边界。</text>
</svg>
