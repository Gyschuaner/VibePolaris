<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Qwen3-Coder 的代理式编程工作流</title><desc id="desc">Qwen3-Coder 从仓库上下文经过计划、工具调用和测试反馈，形成需要人工审批的代码补丁。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="72" y="78" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">Qwen3-Coder · Agentic Coding</text><text x="72" y="118" fill="#cbd5e1" font-size="21" font-family="sans-serif">2025-07-22 · 256K native context · Qwen Code</text><g font-family="sans-serif"><rect x="72" y="214" width="210" height="180" rx="24" fill="#164e63"/><text x="112" y="270" fill="#fff" font-size="25" font-weight="700">仓库</text><text x="112" y="314" fill="#cffafe" font-size="18">代码 · PR</text><text x="112" y="348" fill="#cffafe" font-size="18">测试入口</text><path d="M300 304h62" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/><path d="m346 292 18 12-18 12" fill="none" stroke="#7dd3fc" stroke-width="6"/><rect x="384" y="194" width="236" height="220" rx="24" fill="#3730a3"/><text x="430" y="254" fill="#fff" font-size="25" font-weight="700">计划</text><text x="430" y="300" fill="#e0e7ff" font-size="18">拆任务</text><text x="430" y="334" fill="#e0e7ff" font-size="18">选工具</text><text x="430" y="368" fill="#e0e7ff" font-size="18">设权限</text><path d="M638 304h62" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/><path d="m684 292 18 12-18 12" fill="none" stroke="#a5b4fc" stroke-width="6"/><rect x="722" y="194" width="236" height="220" rx="24" fill="#6b21a8"/><text x="766" y="254" fill="#fff" font-size="25" font-weight="700">循环</text><text x="766" y="300" fill="#f3e8ff" font-size="18">调用工具</text><text x="766" y="334" fill="#f3e8ff" font-size="18">运行测试</text><text x="766" y="368" fill="#f3e8ff" font-size="18">接收反馈</text><path d="M976 304h62" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round"/><path d="m1022 292 18 12-18 12" fill="none" stroke="#c4b5fd" stroke-width="6"/><rect x="1058" y="214" width="82" height="180" rx="22" fill="#0f766e"/><text x="1071" y="276" fill="#fff" font-size="21" font-weight="700">人审</text><text x="1071" y="320" fill="#ccfbf1" font-size="17">合并?</text><text x="1071" y="352" fill="#ccfbf1" font-size="17">回滚?</text><rect x="208" y="500" width="784" height="86" rx="26" fill="#0b1120" stroke="url(#line)" stroke-width="3"/><text x="310" y="552" fill="#fff" font-size="24" font-weight="700">长上下文 ≠ 自动拥有生产权限</text><text x="338" y="580" fill="#94a3b8" font-size="16">模型、工具、沙箱和审批必须分层</text></g></svg>
