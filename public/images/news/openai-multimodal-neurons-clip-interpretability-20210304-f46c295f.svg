<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CLIP 多模态神经元的可解释性与风险</title>
  <desc id="desc">照片、文字和漫画输入经过神经元可视化，右侧显示研究者发现的排版攻击和偏差风险。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#201d3a"/><stop offset="1" stop-color="#143b4e"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#b794f4"/><stop offset="1" stop-color="#e9d8fd"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#081626" flood-opacity=".4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700">CLIP：同一概念，几种输入，也几种风险</text>
  <text x="74" y="114" fill="#c9c4df" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">2021-03-04 · OpenAI 发布多模态神经元分析与研究工具</text>
  <g filter="url(#shadow)">
    <rect x="74" y="170" width="370" height="350" rx="24" fill="#172f4a" stroke="#52728f" stroke-width="2"/>
    <rect x="490" y="170" width="270" height="350" rx="24" fill="#193b4b" stroke="#5eead4" stroke-width="3"/>
    <rect x="806" y="170" width="320" height="350" rx="24" fill="#382b4a" stroke="#f5b7d2" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="259" y="210" fill="#f8fafc" font-size="22" font-weight="700">不同表现形式</text>
    <text x="259" y="241" fill="#b4c6d7" font-size="15">同一主题的输入变体</text>
    <rect x="112" y="278" width="130" height="92" rx="14" fill="#315271"/>
    <circle cx="177" cy="319" r="26" fill="#75b7df" opacity=".8"/>
    <path d="M145 345c20-25 36-17 57 3" fill="none" stroke="#d3edff" stroke-width="6" stroke-linecap="round"/>
    <text x="177" y="392" fill="#e2f1ff" font-size="15">照片</text>
    <rect x="261" y="278" width="130" height="92" rx="14" fill="#3b4673"/>
    <text x="326" y="334" fill="#f5e8ff" font-size="26" font-weight="700">spider</text>
    <text x="326" y="392" fill="#e2d8f7" font-size="15">文字</text>
    <rect x="112" y="425" width="279" height="54" rx="14" fill="#263e58" stroke="#557991"/>
    <text x="252" y="458" fill="#d5e8f5" font-size="16">照片 · 草图 · 符号</text>
    <text x="625" y="210" fill="#f8fafc" font-size="22" font-weight="700">神经元观察</text>
    <text x="625" y="241" fill="#a7f3d0" font-size="15">可视化 + 数据集示例</text>
    <circle cx="625" cy="332" r="78" fill="url(#teal)" opacity=".9"/>
    <circle cx="625" cy="332" r="47" fill="#174651"/>
    <circle cx="625" cy="332" r="14" fill="#effffb"/>
    <path d="M550 332h-34M700 332h34M625 257v-34M625 407v34" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
    <text x="625" y="337" fill="#fff" font-size="16" font-weight="700">Spider-Man</text>
    <text x="625" y="486" fill="#ccefe8" font-size="15">把激活变成人能看的假设</text>
    <text x="966" y="210" fill="#fff" font-size="22" font-weight="700">同一表示的边界</text>
    <rect x="844" y="256" width="244" height="72" rx="14" fill="#5b3657"/>
    <text x="966" y="286" fill="#ffd6e9" font-size="18" font-weight="700">排版攻击</text>
    <text x="966" y="311" fill="#f2cadd" font-size="14">文字改变分类</text>
    <rect x="844" y="355" width="244" height="72" rx="14" fill="#5b3657"/>
    <text x="966" y="385" fill="#ffd6e9" font-size="18" font-weight="700">偏差关联</text>
    <text x="966" y="410" fill="#f2cadd" font-size="14">需要真实任务复核</text>
    <rect x="844" y="454" width="244" height="32" rx="16" fill="#704d6d"/>
    <text x="966" y="476" fill="#fff" font-size="14">研究工具 ≠ 安全认证</text>
  </g>
  <g fill="none" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)"><path d="M448 332h37"/><path d="M763 332h36"/></g>
  <text x="74" y="570" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">示意图为 VibePolaris 自制，重画官方发布中的观察链路与风险边界。</text>
</svg>
