<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Meta AI 青少年风险提醒</title><desc id="d">对话信号经过 AI 标记与人工复核后，才向使用家长监督工具的家长发送提醒。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#13243c}.muted{fill:#5f718b;font-size:23px}.card{fill:#fff;stroke:#d7c9c7;stroke-width:3}.arrow{stroke:#d97964;stroke-width:8;fill:none;stroke-linecap:round}.dot{fill:#d97964;animation:b 2.4s ease-in-out infinite}@keyframes b{50%{r:20;opacity:.45}}</style><rect width="1200" height="680" rx="34" fill="#fff7f3"/><text x="72" y="92" font-size="42" font-weight="700">Meta AI / 需要关注的对话</text><text x="72" y="132" class="muted">先识别，再人工复核，最后通知监督家长</text><g transform="translate(72 240)"><rect class="card" width="242" height="164" rx="24"/><text x="28" y="64" font-size="29">对话语境</text><text x="28" y="108" class="muted">可能的自伤风险信号</text></g><path class="arrow" d="M314 322H444"/><circle class="dot" cx="378" cy="322" r="12"/><g transform="translate(444 240)"><rect class="card" width="280" height="164" rx="24"/><text x="28" y="64" font-size="29">AI 标记 + 人工复核</text><text x="28" y="108" class="muted">通知前检查语境</text></g><path class="arrow" d="M724 322H854"/><g transform="translate(854 208)"><rect class="card" width="290" height="228" rx="24"/><text x="28" y="62" font-size="29">监督家长</text><text x="28" y="110" class="muted">提醒 + 专家资源</text><text x="28" y="154" class="muted">不是诊断或急救替代</text></g><text x="78" y="568" class="muted">首批地区：美国、英国、澳大利亚、加拿大；全球 rollout 仍在后续计划中。</text></svg>
