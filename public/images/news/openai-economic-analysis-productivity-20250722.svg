<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">OpenAI 经济分析的三层证据</title><desc id="desc">OpenAI 的经济分析把平台采用规模、具体试点节省时间和仍待研究的生产率因果关系分开。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="evidence" x1="0" x2="1"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="72" y="78" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">AI 生产率数字 · 三层证据</text><text x="72" y="118" fill="#cbd5e1" font-size="21" font-family="sans-serif">2025-07-22 · adoption · pilot · causality</text><g font-family="sans-serif"><rect x="80" y="214" width="300" height="220" rx="26" fill="#164e63"/><text x="126" y="270" fill="#fff" font-size="25" font-weight="700">采用规模</text><text x="126" y="318" fill="#cffafe" font-size="19">5 亿+ 用户</text><text x="126" y="354" fill="#cffafe" font-size="19">25 亿条消息/天</text><text x="126" y="390" fill="#cffafe" font-size="19">内部日志与调查</text><path d="M410 324h86" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/><path d="m478 312 18 12-18 12" fill="none" stroke="#7dd3fc" stroke-width="6"/><rect x="524" y="214" width="300" height="220" rx="26" fill="#3f3f46"/><text x="570" y="270" fill="#fff" font-size="25" font-weight="700">具体试点</text><text x="570" y="318" fill="#e4e4e7" font-size="19">95 分钟</text><text x="570" y="354" fill="#e4e4e7" font-size="19">教师近 6 小时/周</text><text x="570" y="390" fill="#e4e4e7" font-size="19">特定样本与窗口</text><path d="M854 324h86" stroke="#a1a1aa" stroke-width="6" stroke-linecap="round"/><path d="m922 312 18 12-18 12" fill="none" stroke="#a1a1aa" stroke-width="6"/><rect x="968" y="214" width="180" height="220" rx="26" fill="url(#evidence)"/><text x="1000" y="270" fill="#052e16" font-size="24" font-weight="700">因果</text><text x="1000" y="318" fill="#052e16" font-size="18">对照组</text><text x="1000" y="352" fill="#052e16" font-size="18">质量</text><text x="1000" y="386" fill="#052e16" font-size="18">重复研究</text><rect x="226" y="518" width="748" height="68" rx="22" fill="#0b1120" stroke="url(#evidence)" stroke-width="3"/><text x="310" y="560" fill="#fff" font-size="23" font-weight="700">使用增长不等于生产率因果结论</text></g></svg>
