<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Debate or Vote</title>
  <desc id="desc">Independent agent answers flow to a vote, while debate is tested as a separate layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a233b"/><stop offset="1" stop-color="#4a334c"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#80d9ce"/><stop offset="1" stop-color="#ffbd7a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05060d" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#111a2b" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a5bad1" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">DEBATE OR VOTE · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">More voices, same answer?</text>
  <text x="124" y="255" fill="#d1dce8" font-family="Arial, sans-serif" font-size="25">Separate the vote from the debate.</text>
  <g fill="#243e4a" stroke="#80d9ce" stroke-width="3"><circle cx="250" cy="382" r="45"/><circle cx="250" cy="482" r="45"/><circle cx="400" cy="432" r="45"/></g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><text x="250" y="389">A</text><text x="250" y="489">B</text><text x="400" y="439">C</text></g>
  <path d="M296 382l106 43M296 482l106-43M446 432h132" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <rect x="602" y="350" width="218" height="164" rx="20" fill="#3a3049" stroke="#ffbd7a" stroke-width="2"/><text x="636" y="394" fill="#ffbd7a" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">VOTE</text><text x="636" y="438" fill="#ffffff" font-family="Arial, sans-serif" font-size="29">aggregate</text><text x="636" y="476" fill="#c9bfd4" font-family="Arial, sans-serif" font-size="18">baseline</text>
  <path d="M824 432h86" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/><path d="M890 410l28 22-28 22" fill="none" stroke="#d8e4ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="950" y="350" width="116" height="164" rx="20" fill="#293654" stroke="#9badff" stroke-width="2"/><text x="1008" y="420" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" text-anchor="middle">debate?</text><text x="1008" y="460" fill="#9badff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">add only if</text><text x="1008" y="487" fill="#9badff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">it corrects</text>
  <text x="124" y="540" fill="#a5bad1" font-family="Arial, sans-serif" font-size="18">Communication earns its cost only when it changes the correction path.</text>
</svg>
