<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gemma 3 270M small open model</title>
  <desc id="desc">A compact open text model moving from a local device into a benchmark and a guarded application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18243e"/><stop offset="1" stop-color="#3d275a"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9ee75"/><stop offset="1" stop-color="#5fcf9f"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f9cff"/><stop offset="1" stop-color="#d69cff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070b18" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1060" cy="86" r="205" fill="#b9ee75" opacity=".12"/>
  <circle cx="1050" cy="570" r="250" fill="#8f9cff" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="620" height="136" rx="24" fill="#222f4b" stroke="#b9ee75" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#d4f8a0">GOOGLE · GEMMA 3</text>
    <text x="108" y="180" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#f7f9ff">270M · TEXT → TEXT</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e8e4ff">开放权重模型，面向更小的设备</text>
  <g transform="translate(756 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="410" rx="34" fill="#111a31" stroke="#c5cbff" stroke-width="3"/>
    <rect x="22" y="28" width="216" height="245" rx="18" fill="#25365d"/>
    <circle cx="130" cy="108" r="46" fill="url(#lime)"/>
    <text x="130" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#17223b">270M</text>
    <text x="130" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#eef1ff">32K CONTEXT</text>
    <rect x="50" y="201" width="160" height="12" rx="6" fill="#7285bd"/>
    <rect x="50" y="227" width="118" height="12" rx="6" fill="#7285bd"/>
    <circle cx="130" cy="350" r="30" fill="url(#violet)"/>
    <path d="M113 350h34M130 333v34" stroke="#1c2341" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(80 356)">
    <rect width="604" height="136" rx="20" fill="#202f4d" stroke="#50608c" stroke-width="2"/>
    <text x="30" y="47" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#d4f8a0">HellaSwag 40.9 · BoolQ 61.4</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e6e9ff">移动设备 · 单板计算机 · 本地推理</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bac3e6">官方模型卡基准，非业务质量承诺</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c0c6e8">GOOGLE AI FOR DEVELOPERS · 14 AUG 2025</text>
</svg>
