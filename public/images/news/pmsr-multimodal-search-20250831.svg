<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">PMSR 的渐进多模态搜索</title><desc id="desc">Agent 保存搜索轨迹，结合最新记录和完整轨迹检索证据，再逐步修正。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">PMSR：搜索先积累证据，再修正方向</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">最新记录 · 完整轨迹 · 异构来源 · 紧凑证据</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="284" width="198" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="211" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#21456f">视觉线索</text><text x="211" y="363" text-anchor="middle" font-size="18" fill="#365b83">已知 / 未知</text>
<rect x="382" y="284" width="198" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="481" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#275d39">双范围查询</text><text x="481" y="363" text-anchor="middle" font-size="18" fill="#3e7650">当前 + 历史</text>
<rect x="652" y="284" width="198" height="112" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="751" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#805513">证据记录</text><text x="751" y="363" text-anchor="middle" font-size="18" fill="#966b24">来源与冲突</text>
<rect x="922" y="284" width="198" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1021" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#783553">交付</text><text x="1021" y="363" text-anchor="middle" font-size="18" fill="#94516f">回链答案</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M310 340 H372"/><path d="M580 340 H642"/><path d="M850 340 H912"/><path d="M1021 412 C1021 486 211 486 211 412"/></g><g fill="#607080"><path d="M372 340 l-14 -9 v18z"/><path d="M642 340 l-14 -9 v18z"/><path d="M912 340 l-14 -9 v18z"/><path d="M211 412 l-9 14 h18z"/></g>
<text x="600" y="535" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">搜索方向可回看，证据状态可修正</text>
</svg>