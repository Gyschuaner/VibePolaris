<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">France Osez l'IA plan</title><desc id="d">法国企业 AI 推广计划的认识、培训与陪伴路线</desc><rect width="1200" height="630" fill="#f8fafc"/><circle cx="1060" cy="72" r="170" fill="#2563eb" opacity=".1"/><text x="72" y="110" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#1d4ed8">POLICY / AI ADOPTION</text><text x="72" y="190" font-family="sans-serif" font-size="47" font-weight="800" fill="#0f172a">目标写进 2030</text><text x="72" y="244" font-family="sans-serif" font-size="25" fill="#334155">法国 Osez l’IA 计划把采用 AI 拆成可执行的支持</text><g font-family="sans-serif" text-anchor="middle"><circle cx="220" cy="410" r="70" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="220" y="402" font-size="23" fill="#1e40af">认识</text><text x="220" y="432" font-size="16" fill="#1d4ed8">看懂用例</text><path d="M310 410h180" stroke="#94a3b8" stroke-width="6"/><circle cx="580" cy="410" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="580" y="402" font-size="23" fill="#166534">培训</text><text x="580" y="432" font-size="16" fill="#15803d">会用会审</text><path d="M670 410h180" stroke="#94a3b8" stroke-width="6"/><circle cx="940" cy="410" r="70" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="940" y="402" font-size="23" fill="#92400e">陪伴</text><text x="940" y="432" font-size="16" fill="#b45309">融资与诊断</text></g><text x="72" y="558" font-family="sans-serif" font-size="18" fill="#64748b">VibePolaris · 2025-07-01 · 政策目标不等于强制部署结果</text></svg>
