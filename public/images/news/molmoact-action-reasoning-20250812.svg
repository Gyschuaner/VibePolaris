<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MolmoAct 空间动作推理</title>
  <desc id="desc">深度感知、图像空间路径点和低层动作组成机器人控制链</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">MolmoAct-7B</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">Action Reasoning Model · 三维空间推理 · 可编辑轨迹</text>
