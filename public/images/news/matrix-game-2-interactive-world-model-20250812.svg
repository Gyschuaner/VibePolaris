<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Matrix-Game 2.0 交互生成循环</title>
  <desc id="desc">鼠标键盘动作注入当前画面，世界模型逐帧生成下一画面并继续循环</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Matrix-Game 2.0</text>
  <text x="92" y="160" fill="#93c5fd" font-size="18" font-family="sans-serif">动作输入 · 视觉状态 · 逐帧世界模型</text>
  <rect x="102" y="270" width="230" height="174" rx="20" fill="#263b58" stroke="#60a5fa" stroke-width="2"/>
  <text x="217" y="328" fill="#dbeafe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">当前画面</text>
  <text x="217" y="370" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">场景 · 角色 · 物体</text>
  <path d="M 356 358 H 416" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 396 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="440" y="270" width="230" height="174" rx="20" fill="#3d3155" stroke="#c4b5fd" stroke-width="2"/>
  <text x="555" y="328" fill="#ede9fe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">动作注入</text>
  <text x="555" y="370" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">鼠标 · 键盘 · 逐帧</text>
  <path d="M 694 358 H 754" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 734 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="778" y="270" width="230" height="174" rx="20" fill="#1e4140" stroke="#5eead4" stroke-width="2"/>
  <text x="893" y="328" fill="#ccfbf1" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">下一帧</text>
  <text x="893" y="370" fill="#99f6e4" font-size="16" text-anchor="middle" font-family="sans-serif">自回归 · 可继续</text>
  <path d="M 894 468 C 894 548, 230 548, 217 468" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M 227 480 l -12 -14 -14 12" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="600" y="586" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">25 FPS 是作者生成口径，控制延迟和状态稳定性仍需复现</text>
</svg>
