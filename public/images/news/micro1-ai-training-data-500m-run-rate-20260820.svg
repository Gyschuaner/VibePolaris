<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Micro1：从专家数据到模型评测</title><desc id="desc">AI 训练数据业务把专家样本、合成数据、客户训练和独立验证连成一条供应链。</desc><metadata><source>https://techcrunch.com/2026/08/20/ai-data-startup-micro1-reaches-500m-gross-run-rate-amid-ai-training-boom/</source><source>https://www.micro1.ai/newsroom</source><source>https://www.micro1.ai/research</source></metadata><rect width="1200" height="620" rx="36" fill="#101827"/><text x="70" y="72" fill="#f8fafc" font-size="31" font-family="Arial,sans-serif" font-weight="700">Micro1：5 亿美元毛流水背后的数据链</text><text x="70" y="110" fill="#a8b7c9" font-size="18" font-family="Arial,sans-serif">报道数字来自知情人士；毛流水、净收入和模型效果分开</text><g font-family="Arial,sans-serif"><rect x="70" y="190" width="190" height="160" rx="22" fill="#315d85"/><text x="165" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">领域专家</text><text x="165" y="270" text-anchor="middle" fill="#dceeff" font-size="16">标注 · 比较</text><text x="165" y="300" text-anchor="middle" fill="#dceeff" font-size="16">示范数据</text><path d="M272 270 H330" stroke="#8ba7c3" stroke-width="4" marker-end="url(#arrow)"/><rect x="350" y="190" width="205" height="160" rx="22" fill="#69528b"/><text x="452" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">数据产品</text><text x="452" y="270" text-anchor="middle" fill="#f0e5ff" font-size="16">真实样本</text><text x="452" y="300" text-anchor="middle" fill="#f0e5ff" font-size="16">合成扩充</text><path d="M567 270 H625" stroke="#8ba7c3" stroke-width="4" marker-end="url(#arrow)"/><rect x="645" y="190" width="205" height="160" rx="22" fill="#1d765c"/><text x="747" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">训练 / 评测</text><text x="747" y="270" text-anchor="middle" fill="#d8f7e7" font-size="16">客户模型</text><text x="747" y="300" text-anchor="middle" fill="#d8f7e7" font-size="16">强化学习环境</text><path d="M862 270 H920" stroke="#8ba7c3" stroke-width="4" marker-end="url(#arrow)"/><rect x="940" y="190" width="195" height="160" rx="22" fill="#a45036"/><text x="1037" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">验证</text><text x="1037" y="270" text-anchor="middle" fill="#ffe5db" font-size="16">客户续约</text><text x="1037" y="300" text-anchor="middle" fill="#ffe5db" font-size="16">独立复测</text><rect x="125" y="446" width="950" height="86" rx="20" fill="#2a3140" stroke="#e4a06c" stroke-width="2"/><text x="600" y="484" text-anchor="middle" fill="#ffd7bd" font-size="22" font-weight="700">边界：毛流水年化 ≠ 审计收入 ≠ 模型质量</text><text x="600" y="514" text-anchor="middle" fill="#c9d3df" font-size="16">数据血缘、许可、客户和效果仍需要公开证据</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8ba7c3"/></marker></defs></svg>