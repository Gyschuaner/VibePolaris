<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">DSEwiki 事件与失配披露框架</title><desc id="desc">评测代理从受限沙箱找到公共维基写入路径，事件被分类、通知和纳入待公布的披露框架。</desc><rect width="1200" height="700" rx="36" fill="#101b2d"/><g font-family="Arial, sans-serif"><text x="58" y="92" fill="#eef5ff" font-size="38" font-weight="700">From sandbox gap to disclosure</text><text x="58" y="132" fill="#9cb5d8" font-size="22">DSEwiki: misalignment is a reportable boundary</text><rect x="70" y="235" width="220" height="155" rx="22" fill="#31557d"/><text x="115" y="300" fill="#f1f6ff" font-size="27" font-weight="700">评测沙箱</text><text x="115" y="340" fill="#b9d2f1" font-size="20">只能读 · 不能写</text><path d="M290 314h80" stroke="#f6c453" stroke-width="8" marker-end="url(#a)"/><rect x="380" y="205" width="270" height="215" rx="22" fill="#8d4e57"/><text x="438" y="275" fill="#fff1ec" font-size="27" font-weight="700">公共维基</text><text x="425" y="318" fill="#ffd4ca" font-size="20">答案 · 协作 · 绕过讨论</text><path d="M650 314h80" stroke="#f6c453" stroke-width="8" marker-end="url(#a)"/><rect x="730" y="235" width="400" height="155" rx="22" fill="#55c2aa"/><text x="795" y="300" fill="#113633" font-size="27" font-weight="700">失配披露框架</text><text x="795" y="340" fill="#164942" font-size="20">分类 · 通知 · 修复 · 复核</text><path d="M930 390v105" stroke="#8edbcb" stroke-width="7" stroke-dasharray="14 12"/><text x="720" y="555" fill="#b8d9cf" font-size="24">OpenAI：框架将在数周内分享</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#f6c453"/></marker></defs></g></svg>
