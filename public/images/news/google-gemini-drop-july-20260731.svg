<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Gemini Drop · 7 月更新</title>
<desc id="desc">Google 将 macOS 语音、后台 Spark、Flash 模型、头像、应用连接器和个性化图像生成放进同一轮 Gemini 更新，地区与权限边界仍需逐项核对。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="45" y="175" width="190" height="150" rx="18" fill="#174d4d" stroke="#93c5fd" stroke-width="3"/>
<text x="140" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">语音窗口</text>
<text x="140" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">macOS 操作</text>
<path d="M235 250H265" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="270" y="175" width="190" height="150" rx="18" fill="#6b3c12" stroke="#93c5fd" stroke-width="3"/>
<text x="365" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">Spark</text>
<text x="365" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">后台继续</text>
<path d="M460 250H490" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="495" y="175" width="190" height="150" rx="18" fill="#3b2b70" stroke="#93c5fd" stroke-width="3"/>
<text x="590" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">连接器</text>
<text x="590" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">跨应用授权</text>
<path d="M685 250H715" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="720" y="175" width="190" height="150" rx="18" fill="#123b5d" stroke="#93c5fd" stroke-width="3"/>
<text x="815" y="225" text-anchor="middle" fill="#f8fafc" font-size="22" font-family="sans-serif">复查结果</text>
<text x="815" y="270" text-anchor="middle" fill="#dbeafe" font-size="15" font-family="sans-serif">地区与权限</text>
<text x="480" y="445" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">2026-07-31 · Gemini Drop · 7 月更新</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
