<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TikTok 德国信任与安全团队重组</title>
  <desc id="desc">内容从人工审核流向 AI 筛选与承包商，最后仍需人工申诉、监督和平台责任</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="124" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">德国信任与安全团队</text>
  <text x="92" y="164" fill="#a8b3c7" font-size="18" font-family="sans-serif">计划重组：AI 与外包进入流程，责任链仍需有人守住</text>
  <rect x="98" y="278" width="220" height="170" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="208" y="342" fill="#f8fafc" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">用户内容</text>
  <text x="208" y="382" fill="#bfdbfe" font-size="17" text-anchor="middle" font-family="sans-serif">语境 · 语言 · 风险</text>
  <path d="M 344 364 H 424" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 404 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="454" y="226" width="220" height="126" rx="18" fill="#253b55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="564" y="284" fill="#d1fae5" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">AI 筛选</text>
  <text x="564" y="320" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">标记 · 排序</text>
  <rect x="454" y="390" width="220" height="126" rx="18" fill="#3a2c4d" stroke="#c4b5fd" stroke-width="2"/>
  <text x="564" y="448" fill="#ede9fe" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">承包商</text>
  <text x="564" y="484" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">审核 · 劳动保护</text>
  <path d="M 700 364 H 780" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 760 348 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="810" y="278" width="230" height="170" rx="20" fill="#2d2534" stroke="#fbbf24" stroke-width="2"/>
  <text x="925" y="342" fill="#fef3c7" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">申诉与监督</text>
  <text x="925" y="382" fill="#fde68a" font-size="17" text-anchor="middle" font-family="sans-serif">人工升级 · DSA</text>
  <text x="600" y="604" fill="#d5def0" font-size="18" text-anchor="middle" font-family="sans-serif">团队缩编不会自动移除平台的安全责任</text>
</svg>
