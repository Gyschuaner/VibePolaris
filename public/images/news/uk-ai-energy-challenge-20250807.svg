<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">英国 AI 降峰用电挑战</title>
  <desc id="desc">AI 预测电力高峰，设备在用户授权和电网安全规则下错峰运行，最后用试点数据复算结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#273b50"/>
      <stop offset="1" stop-color="#568b8d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f0df"/>
      <stop offset="1" stop-color="#d8e8e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#14283b" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="95" r="190" fill="#f0c978" opacity=".18"/>
  <circle cx="110" cy="540" r="230" fill="#a0c9bd" opacity=".18"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#f0c978" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f5f0df"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#e4c07a"/>
  </g>
  <g fill="#273b50" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">预测</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#bdd8d6"/>
    <text x="218" y="261" font-size="24" text-anchor="middle" font-weight="800">高峰 · 天气 · 负载</text>
    <path d="M108 329 h214" stroke="#568b8d" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">模型给出建议</text>
    <text x="108" y="405" font-size="16">不是自动执行命令</text>

    <text x="489" y="178" font-size="25" font-weight="800">错峰</text>
    <circle cx="600" cy="260" r="62" fill="#568b8d"/>
    <path d="M565 260 h70 M600 225 v70" stroke="#f5f0df" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#568b8d" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">充电 · 热泵 · 电池</text>

    <text x="860" y="178" font-size="25" font-weight="800">复算</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#568b8d"/>
    <text x="970" y="261" font-size="23" fill="#f5f0df" text-anchor="middle" font-weight="800">2GW target</text>
    <path d="M860 330 h215" stroke="#273b50" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">安全 · 授权 · 公平</text>
    <text x="860" y="405" font-size="16">试点后才有证据</text>
  </g>
  <g fill="#f5f0df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">AI ENERGY CHALLENGE · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">预测不等于控制</text>
  </g>
</svg>
