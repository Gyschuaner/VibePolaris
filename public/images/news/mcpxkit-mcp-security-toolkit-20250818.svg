<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MCPXKIT security testing</title>
  <desc id="desc">MCPXKIT routes tool descriptions, external files and shared context through a four-class security test for agent tool calls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111d31"/><stop offset="1" stop-color="#40283f"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b1f4ea"/><stop offset="1" stop-color="#6cb9e8"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#f0a36f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="696" height="136" rx="24" fill="#20334d" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 18 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f4fbff">MCPXKIT · 31 ATTACK METHODS</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">先把工具调用链当作不可信输入来测</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">FOUR SECURITY CLASSES</text>
    <g transform="translate(28 64)">
      <rect x="0" y="0" width="126" height="66" rx="14" fill="url(#cyan)"/>
      <text x="63" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#17314b">直接注入</text>
      <text x="63" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#24485b">tool</text>
      <rect x="152" y="0" width="126" height="66" rx="14" fill="url(#amber)"/>
      <text x="215" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#47313b">间接注入</text>
      <text x="215" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#654338">file / web</text>
      <rect x="0" y="86" width="126" height="66" rx="14" fill="#6e9bd3"/>
      <text x="63" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f4fbff">恶意用户</text>
      <text x="63" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e0eefb">input</text>
      <rect x="152" y="86" width="126" height="66" rx="14" fill="#be7cae"/>
      <text x="215" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff4fb">模型固有</text>
      <text x="215" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffe5f2">LLM</text>
    </g>
    <path d="M167 238 V274" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
    <path d="M148 262 L167 281 L186 262" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="296" width="274" height="68" rx="15" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
    <text x="167" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#effcff">共享上下文</text>
    <text x="167" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b9d5e5">数据 ≠ 命令</text>
    <text x="167" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">隔离 · 权限 · 审计</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">31 种方法 · 四类风险</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">把安全担忧变成可重复的回归测试</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">预印本结论仍需按真实工具权限和沙箱复核</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">MCPXKIT · AGENT TOOL SECURITY</text>
</svg>
