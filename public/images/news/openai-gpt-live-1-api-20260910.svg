<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>GPT-Live-1 full duplex voice API</title><desc>Two overlapping sound waves show simultaneous listening and speaking, with a reasoning backend in the middle.</desc><style>.wave{animation:wave 2.2s ease-in-out infinite}.ring{animation:ring 4s linear infinite}@keyframes wave{50%{transform:scaleY(.45)}}@keyframes ring{to{transform:rotate(360deg)}}text{font-family:Inter,Arial,sans-serif}</style><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#091b3a"/><stop offset="1" stop-color="#1d4b69"/></linearGradient></defs><rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="600" cy="315" r="148" fill="#0e2c4e" stroke="#86edff" stroke-width="4" class="ring"/><path d="M220 245 C310 130 360 430 450 315 S590 130 680 315 S820 500 900 315 S1020 170 1080 270" fill="none" stroke="#74f0d2" stroke-width="12" class="wave"/><path d="M220 380 C310 495 360 200 450 315 S590 500 680 315 S820 130 900 315 S1020 460 1080 360" fill="none" stroke="#ffa873" stroke-width="8" opacity=".85" class="wave"/><text x="600" y="306" fill="#fff" font-size="34" text-anchor="middle">GPT‑Live‑1</text><text x="600" y="346" fill="#a8dff0" font-size="22" text-anchor="middle">listening ↔ speaking</text><text x="100" y="90" fill="#86edff" font-size="24">OPENAI · API · 2026-09-10</text><text x="100" y="570" fill="#b9d4e6" font-size="22">全双工语音：边听边说，深度推理交给后端模型</text></svg>