<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vertex AI Gemini 监督微调</title>
  <desc id="desc">带标签样本经过训练、评估和权限控制，进入 Gemini 2.5 模型的定制流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#316b67"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f1df"/><stop offset="1" stop-color="#dbe9e1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#082c39" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="95" r="190" fill="#f4cc72" opacity=".2"/>
  <circle cx="100" cy="540" r="220" fill="#a3d2c5" opacity=".16"/>
  <path d="M20 455 C125 372 230 508 345 403 S565 321 680 430 S870 516 1004 384 S1104 350 1192 420" fill="none" stroke="#f4cc72" stroke-width="5" stroke-dasharray="12 15" opacity=".82"/>
  <g filter="url(#shadow)">
    <rect x="52" y="116" width="264" height="308" rx="30" fill="url(#panel)"/>
    <rect x="344" y="116" width="264" height="308" rx="30" fill="#f4f1df"/>
    <rect x="636" y="116" width="264" height="308" rx="30" fill="#d8e8df"/>
    <rect x="928" y="116" width="220" height="308" rx="30" fill="#e6bd72"/>
  </g>
  <g fill="#123b4a" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="88" y="176" font-size="24" font-weight="800">样本</text>
    <rect x="88" y="224" width="192" height="58" rx="17" fill="#a9d1c5"/>
    <text x="184" y="260" font-size="22" text-anchor="middle" font-weight="800">输入 → 标签</text>
    <path d="M88 329 h185" stroke="#316b67" stroke-width="10" stroke-linecap="round" opacity=".68"/>
    <text x="88" y="372" font-size="16">任务要定义清楚</text>
    <text x="88" y="404" font-size="15">数据要能复核</text>

    <text x="380" y="176" font-size="24" font-weight="800">微调</text>
    <circle cx="476" cy="260" r="61" fill="#316b67"/>
    <path d="M438 260 h76 M476 222 v76" stroke="#f4f1df" stroke-width="10" stroke-linecap="round"/>
    <path d="M408 355 C446 322 461 322 476 355 S521 386 555 350" fill="none" stroke="#316b67" stroke-width="9" stroke-linecap="round"/>
    <text x="380" y="404" font-size="16">调整输出行为</text>

    <text x="672" y="176" font-size="24" font-weight="800">评估</text>
    <path d="M696 317 L752 262 L795 296 L846 218" fill="none" stroke="#316b67" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="696" cy="317" r="9" fill="#316b67"/><circle cx="752" cy="262" r="9" fill="#316b67"/><circle cx="795" cy="296" r="9" fill="#316b67"/><circle cx="846" cy="218" r="9" fill="#316b67"/>
    <text x="672" y="372" font-size="16">留出验证集</text>
    <text x="672" y="404" font-size="15">和基础模型比较</text>

    <text x="964" y="176" font-size="24" font-weight="800">发布</text>
    <rect x="964" y="224" width="150" height="58" rx="17" fill="#316b67"/>
    <text x="1039" y="260" font-size="21" fill="#f4f1df" text-anchor="middle" font-weight="800">权限 + 回退</text>
    <path d="M964 330 h150" stroke="#123b4a" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="964" y="372" font-size="16">能撤回才可上线</text>
    <text x="964" y="404" font-size="15">效果要自己验证</text>
  </g>
  <g fill="#f4f1df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="52" y="565" font-size="22" letter-spacing="1">VERTEX AI · 2025.08.08</text>
    <text x="1148" y="565" font-size="16" text-anchor="end" opacity=".84">支持不等于效果</text>
  </g>
</svg>
