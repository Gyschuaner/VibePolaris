<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Muse 从下载到日常代理</title><desc id="desc">代理产品从进入手机入口、获得授权、完成任务到形成留存的流程。</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#17152f"/><stop offset="1" stop-color="#12394a"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><rect x="54" y="54" width="1092" height="612" rx="28" fill="#172536" stroke="#35516a"/><text x="92" y="113" fill="#f8fafc" font-family="sans-serif" font-size="31" font-weight="700">Muse 的早期数据说明什么？</text><text x="92" y="151" fill="#9fb8c8" font-family="sans-serif" font-size="18">下载只是入口，代理还要通过授权、执行和留存</text><g font-family="sans-serif"><g transform="translate(84 267)"><rect width="210" height="162" rx="20" fill="#2d2250" stroke="#c4b5fd" stroke-width="3"/><text x="105" y="68" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">进入入口</text><path d="M70 112h70M82 92h46" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/><text x="105" y="140" text-anchor="middle" fill="#b9b7d4" font-size="14">手机 / 消息</text></g><path d="M324 348h72" stroke="#67e8f9" stroke-width="6"/><path d="m382 330 24 18-24 18" fill="none" stroke="#67e8f9" stroke-width="6"/><g transform="translate(428 267)"><rect width="210" height="162" rx="20" fill="#17394a" stroke="#67e8f9" stroke-width="3"/><path d="M496 316l18 18 30-35" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="106" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">交出权限</text><text x="105" y="140" text-anchor="middle" fill="#b4c7d4" font-size="14">上下文 / 边界</text></g><path d="M668 348h72" stroke="#67e8f9" stroke-width="6"/><path d="m726 330 24 18-24 18" fill="none" stroke="#67e8f9" stroke-width="6"/><g transform="translate(772 267)"><rect width="210" height="162" rx="20" fill="#44351a" stroke="#fbbf24" stroke-width="3"/><path d="M838 350h78M852 320h50M852 380h50" strok