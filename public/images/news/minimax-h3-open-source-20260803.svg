<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">MiniMax H3 多模态生成</title>
<desc id="desc">MiniMax H3 把文本、图像、视频与原生立体声输出放入同一模型工作流。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="50" y="165" width="220" height="170" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
<text x="160.0" y="223" text-anchor="middle" fill="#dbeafe" font-size="21" font-family="sans-serif">文本 / 图像</text>
<text x="160.0" y="265" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">多模态输入</text>
<path d="M270 250.0H251" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="263" y="165" width="220" height="170" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="3"/>
<text x="373.0" y="223" text-anchor="middle" fill="#ffe4e6" font-size="21" font-family="sans-serif">视频生成</text>
<text x="373.0" y="265" text-anchor="middle" fill="#fecdd3" font-size="15" font-family="sans-serif">2K · 15 秒</text>
<path d="M483 250.0H464" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="476" y="165" width="220" height="170" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<text x="586.0" y="223" text-anchor="middle" fill="#cffafe" font-size="21" font-family="sans-serif">立体声音频</text>
<text x="586.0" y="265" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">32 kHz</text>
<path d="M696 250.0H677" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="689" y="165" width="220" height="170" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
<text x="799.0" y="223" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">审核与许可</text>
<text x="799.0" y="265" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">部署边界</text>
<text x="480" y="475" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">一个模型 ≠ 一个治理规则</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
