<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">L-MARS 的法律引用忠实度审计</title><desc id="desc">法律回答被拆成原子主张，逐条链接到来源并由不同模型核验。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">L-MARS：每条法律主张都要有依据</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">原子主张 · 来源定位 · 跨模型核验 · 专业复核</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="284" width="200" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="212" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#21456f">回答</text><text x="212" y="363" text-anchor="middle" font-size="18" fill="#365b83">多条主张</text>
<rect x="392" y="284" width="200" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="492" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#275d39">来源</text><text x="492" y="363" text-anchor="middle" font-size="18" fill="#3e7650">法条 / 判例</text>
<rect x="672" y="284" width="200" height="112" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="772" y="328" text-anchor="middle" font-size="26" font-weight="700" fill="#805513">核验</text><text x="772" y="363" text-anchor="middle" font-size="18" fill="#966b24">支持关系</text>
<rect x="952" y="284" width="168" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1036" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#783553">复核</text><text x="1036" y="363" text-anchor="middle" font-size="17" fill="#94516f">人类确认</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M312 340 H382"/><path d="M592 340 H662"/><path d="M872 340 H942"/></g><g fill="#607080"><path d="M382 340 l-14 -9 v18z"/><path d="M662 340 l-14 -9 v18z"/><path d="M942 340 l-14 -9 v18z"/></g>
<text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">链接可达只是第一关，引用忠实度才是核心</text>
</svg>