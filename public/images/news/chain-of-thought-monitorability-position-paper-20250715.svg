<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">多机构研究者把 chain-of-thought monitorability 作为 AI 代理安全线索</title>
  <desc id="desc">VibePolaris 自制新闻示意图：多机构研究者把 chain-of-thought monitorability 作为 AI 代理安全线索</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1f3a5f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050b14" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="680" rx="40" fill="url(#bg)"/>

  <text x="72" y="86" fill="#d2f0ff" font-family="sans-serif" font-size="28">COT MONITORABILITY · 2025.07.15</text>
  <rect x="86" y="210" width="270" height="250" rx="28" fill="#7fd4ee" filter="url(#shadow)"/><text x="145" y="285" fill="#12354a" font-family="sans-serif" font-size="28">推理模型</text><path d="M150 350h140M150 390h100" stroke="#12354a" stroke-width="12" stroke-linecap="round"/><text x="135" y="430" fill="#12354a" font-family="sans-serif" font-size="20">chain of thought</text>
  <path d="M400 335H505" stroke="#ffd17e" stroke-width="10"/><rect x="520" y="175" width="250" height="320" rx="28" fill="#254863" stroke="#ffd17e" stroke-width="4"/><circle cx="645" cy="275" r="62" fill="#ffd17e"/><path d="M620 275h50M645 250v50" stroke="#29435a" stroke-width="12" stroke-linecap="round"/><text x="585" y="375" fill="#fff" font-family="sans-serif" font-size="27">监测器</text><text x="568" y="416" fill="#cfe7f9" font-family="sans-serif" font-size="20">可疑线索</text><text x="563" y="450" fill="#cfe7f9" font-family="sans-serif" font-size="20">不等于真相</text>
  <path d="M815 335H910" stroke="#8be5c8" stroke-width="10"/><rect x="925" y="225" width="190" height="220" rx="24" fill="#8be5c8" filter="url(#shadow)"/><text x="975" y="305" fill="#143a4c" font-family="sans-serif" font-size="28">行动</text><text x="955" y="355" fill="#143a4c" font-family="sans-serif" font-size="20">复核 · 阻断</text><text x="960" y="392" fill="#143a4c" font-family="sans-serif" font-size="20">多层防守</text>
  <text x="72" y="600" fill="#e8f6ff" font-family="sans-serif" font-size="23">可监测性是安全线索，不是模型“真实想法”的证明</text>
</svg>