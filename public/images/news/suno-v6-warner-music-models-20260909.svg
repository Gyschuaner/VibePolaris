<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Suno v6 AI music model</title><desc>Audio controls, rights-holder partners and creator safeguards surround the Suno v6 music model.</desc><style>.wave{animation:wave 2.4s ease-in-out infinite}.knob{animation:knob 4s linear infinite;transform-origin:600px 320px}@keyframes wave{50%{transform:scaleY(.35)}}@keyframes knob{to{transform:rotate(360deg)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#1d1535"/><path d="M120 315 C220 150 250 480 350 315 S480 150 580 315 S710 480 810 315 S940 150 1080 315" fill="none" stroke="#ff8fc4" stroke-width="14" class="wave"/><path d="M120 380 C220 520 250 120 350 380 S480 520 580 380 S710 120 810 380 S940 520 1080 380" fill="none" stroke="#8bdcff" stroke-width="8" class="wave"/><circle cx="600" cy="315" r="92" fill="#3e2866" stroke="#f6d26e" stroke-width="5" class="knob"/><text x="600" y="306" fill="#fff0d3" font-size="31" text-anchor="middle">Suno v6</text><text x="600" y="344" fill="#f7d8a4" font-size="19" text-anchor="middle">creator controls</text><text x="100" y="88" fill="#ff9fc9" font-size="24">SUNO · WARNER · BMG · BELIEVE · 2026-09-09</text><text x="100" y="566" fill="#d6c9ea" font-size="21">更强的生成控制，也把授权、相似性和收益分配带到台前</text></svg>