<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">自主机器安全停止示意</title>
  <desc id="desc">共享工作区里有两台自主移动机器人，人员进入后，门禁或控制器发出安全命令让机器人停止；这是 FORT Robotics 融资新闻的通用机制解释，不是公开的具体部署。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#17243f"/><stop offset="1" stop-color="#154f4c"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">机器人会走路，也要有一条能被人触发的停止路径</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-18 · FORT Robotics 融资新闻的通用安全机制解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#67e8f9" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#fda4af" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">共享工作区</text>
    <text x="237" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">机器人按任务运行</text>
    <text x="237" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">人和机器共享空间</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">安全命令</text>
    <text x="600" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">门禁 / 按钮 / 控制台</text>
    <text x="600" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">无线急停与远程控制</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">停机并现场确认</text>
    <text x="963" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">收到命令后停机</text>
    <text x="963" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">现场人员确认后再复位</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">安全控制限制机器，不替人做最终判断</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">融资新闻交代了平台方向，未涵盖全部安全验收问题</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">FORT / VentureBeat：融资与产品场景可追溯；延迟、失效和复位条件仍需现场核验。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">来源：FORT / VentureBeat</text><text x="600" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">日期：2021-03-18</text><text x="944" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">边界：仍需核验</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释自主机器安全新闻中的命令路径与证据边界。</text>
</svg>
