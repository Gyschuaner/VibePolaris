<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Index 2021 指标地图</title>
  <desc id="desc">一张仪表盘把投资、人才、研究、伦理和数据缺口分成不同指标，并由上下文和来源连接。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#241d3b"/><stop offset="1" stop-color="#173f50"/></linearGradient>
    <linearGradient id="rose" x1="0" x2="1"><stop stop-color="#ff9a9e"/><stop offset="1" stop-color="#fad0c4"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#4fd1c5"/><stop offset="1" stop-color="#9ae6b4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#091928" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="76" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700">AI Index 2021：增长被拆成几种指标</text>
  <text x="74" y="114" fill="#c7c6df" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">2021-03-03 · 读年度报告，先看定义、年份和缺口</text>
  <g filter="url(#shadow)">
    <rect x="74" y="165" width="690" height="350" rx="24" fill="#172c46" stroke="#496580" stroke-width="2"/>
    <rect x="800" y="165" width="326" height="350" rx="24" fill="#1e3349" stroke="#e2b4e9" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="112" y="210" fill="#f8fafc" font-size="22" font-weight="700">指标面板</text>
    <text x="112" y="244" fill="#aabdd1" font-size="16">同一份报告并不只有一条“增长线”</text>
    <g>
      <rect x="112" y="275" width="180" height="100" rx="16" fill="#25466b"/>
      <text x="202" y="307" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">投资</text>
      <text x="202" y="348" text-anchor="middle" fill="url(#rose)" font-size="31" font-weight="700">+9.3%</text>
      <text x="202" y="367" text-anchor="middle" fill="#b5c8da" font-size="13">2020 私人 AI 投资</text>
    </g>
    <g>
      <rect x="316" y="275" width="180" height="100" rx="16" fill="#25466b"/>
      <text x="406" y="307" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">人才</text>
      <text x="406" y="348" text-anchor="middle" fill="url(#teal)" font-size="31" font-weight="700">65%</text>
      <text x="406" y="367" text-anchor="middle" fill="#b5c8da" font-size="13">北美 AI 博士去产业</text>
    </g>
    <g>
      <rect x="520" y="275" width="180" height="100" rx="16" fill="#25466b"/>
      <text x="610" y="307" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">研究</text>
      <path d="M551 352h118" stroke="#f7c97d" stroke-width="5" stroke-linecap="round"/><circle cx="575" cy="341" r="8" fill="#f7c97d"/><circle cx="614" cy="326" r="8" fill="#f7c97d"/><circle cx="654" cy="336" r="8" fill="#f7c97d"/>
      <text x="610" y="367" text-anchor="middle" fill="#b5c8da" font-size="13">期刊与会议口径不同</text>
    </g>
    <rect x="112" y="408" width="588" height="70" rx="16" fill="#213c51" stroke="#53788b"/>
    <text x="136" y="439" fill="#f8fafc" font-size="18" font-weight="700">伦理 / 多样性</text>
    <text x="136" y="463" fill="#b9d8d7" font-size="15">能力增长、研究关注和人才结构要分开解释</text>
    <text x="838" y="210" fill="#f8fafc" font-size="22" font-weight="700">读者要带走的限制</text>
    <path d="M850 274h226" stroke="#d9b5e8" stroke-width="3" stroke-dasharray="9 9"/>
    <text x="850" y="254" fill="#d9b5e8" font-size="17">不是统一条件的 benchmark</text>
    <g fill="#d6cbe2" font-size="17">
      <text x="850" y="315">• 定义和数据源</text>
      <text x="850" y="354">• 年份与地区</text>
      <text x="850" y="393">• 出版渠道和样本</text>
      <text x="850" y="432">• 政府、伦理、多样性数据缺口</text>
    </g>
    <rect x="850" y="458" width="222" height="28" rx="14" fill="#3a566b"/>
    <text x="961" y="478" text-anchor="middle" fill="#fff" font-size="14">来源 + 上下文 + 复核</text>
  </g>
  <text x="74" y="570" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">示意图为 VibePolaris 自制，重画报告的指标关系；数字以来源卡片和原始报告为准。</text>
</svg>
