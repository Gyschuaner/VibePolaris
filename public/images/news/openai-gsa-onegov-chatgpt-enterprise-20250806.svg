<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OneGov 联邦 AI 采购与治理流程</title>
  <desc id="desc">联邦机构通过 OneGov 获得一年一美元的 ChatGPT Enterprise 入口，再完成试点、权限和复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173451"/>
      <stop offset="1" stop-color="#5c7d91"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f0df"/>
      <stop offset="1" stop-color="#d4e4e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#0c2035" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="95" r="190" fill="#f0cb74" opacity=".16"/>
  <circle cx="105" cy="540" r="230" fill="#86b9bd" opacity=".17"/>
  <path d="M24 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#f0cb74" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f5f0df"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c877"/>
  </g>
  <g fill="#173451" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">OneGov</text>
    <rect x="115" y="226" width="220" height="60" rx="17" fill="#b8d4dc"/>
    <text x="141" y="264" font-size="25" font-weight="800">$1 / agency</text>
    <path d="M115 332 h205" stroke="#5c7d91" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="115" y="370" font-size="17">ChatGPT Enterprise · 1 年</text>
    <text x="115" y="407" font-size="16">GSA MAS 采购入口</text>

    <text x="487" y="178" font-size="25" font-weight="800">试点窗口</text>
    <circle cx="600" cy="267" r="62" fill="#5c7d91"/>
    <text x="600" y="255" font-size="28" fill="#f5f0df" text-anchor="middle" font-weight="800">60</text>
    <text x="600" y="285" font-size="17" fill="#f5f0df" text-anchor="middle">天</text>
    <path d="M500 370 h195" stroke="#5c7d91" stroke-width="10" stroke-linecap="round"/>
    <text x="487" y="407" font-size="17">模型 · Deep Research · Voice</text>

    <text x="859" y="178" font-size="25" font-weight="800">机构治理</text>
    <circle cx="905" cy="260" r="38" fill="#5c7d91"/>
    <path d="M885 260 l14 14 l28 -34" fill="none" stroke="#f5f0df" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M982 230 h115 M982 278 h91 M982 326 h125" stroke="#173451" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">数据 · 权限 · 复核</text>
  </g>
  <g fill="#f5f0df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">ONEGOV · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">便宜的入口仍需治理</text>
  </g>
</svg>
