<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">OpenAI 州政策团队网络</title><desc id="desc">OpenAI 全球事务团队把州级政策、网络防御和伙伴关系连到州立法，再由正式文本决定是否产生约束。</desc><rect width="1200" height="700" rx="36" fill="#17172a"/><g font-family="Arial, sans-serif"><text x="60" y="92" fill="#f5f1ff" font-size="38" font-weight="700">Policy signal is not a law</text><text x="60" y="132" fill="#b7b0d5" font-size="22">OpenAI expands state policy roles as AI rules diverge</text><circle cx="600" cy="345" r="92" fill="#f6c453"/><text x="542" y="337" fill="#252239" font-size="27" font-weight="700">Global</text><text x="543" y="372" fill="#252239" font-size="27" font-weight="700">Affairs</text><g fill="#3f4a82" stroke="#8ea1eb" stroke-width="3"><rect x="125" y="220" width="255" height="110" rx="20"/><rect x="125" y="420" width="255" height="110" rx="20"/><rect x="820" y="220" width="255" height="110" rx="20"/><rect x="820" y="420" width="255" height="110" rx="20"/></g><g fill="#f2f0ff" font-size="22" font-weight="700"><text x="182" y="266">东北：政策伙伴</text><text x="177" y="466">东南：州级合作</text><text x="860" y="266">网络防御</text><text x="868" y="466">正式州法规</text></g><g stroke="#b7c4ff" stroke-width="6"><path d="M380 275L520 330"/><path d="M380 475L520 375"/><path d="M680 330L820 275"/><path d="M680 375L820 475"/></g><text x="320" y="620" fill="#b9b3d7" font-size="24">招聘 → 游说策略 → 法案 / 规则 → 工程约束</text></g></svg>
