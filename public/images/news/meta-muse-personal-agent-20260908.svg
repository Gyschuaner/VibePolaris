<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Meta Muse personal AI agent</title><desc>A personal agent works inside an isolated cloud VM while a separate Sentinel controls outbound actions and approvals.</desc><style>.pulse{animation:pulse 3s ease-in-out infinite}.flow{animation:flow 2.6s linear infinite}@keyframes pulse{50%{transform:scale(1.05);opacity:.8}}@keyframes flow{to{stroke-dashoffset:-78}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#171b3c"/><rect x="90" y="160" width="490" height="300" rx="30" fill="#24326d" stroke="#98b8ff" stroke-width="5"/><text x="335" y="225" fill="#e9f1ff" font-size="30" text-anchor="middle">Muse Secure VM</text><rect x="160" y="270" width="180" height="120" rx="20" fill="#3c5ab4" class="pulse"/><text x="250" y="320" fill="#fff" font-size="26" text-anchor="middle">agent</text><text x="250" y="354" fill="#cbd8ff" font-size="18" text-anchor="middle">browser · tools · memory</text><path d="M580 310H700" stroke="#8fe7d0" stroke-width="8" stroke-dasharray="18 14" class="flow"/><rect x="700" y="205" width="250" height="210" rx="28" fill="#2f755f" stroke="#9be6c9" stroke-width="5"/><text x="825" y="285" fill="#edfff7" font-size="30" text-anchor="middle">Sentinel</text><text x="825" y="325" fill="#c6f3df" font-size="19" text-anchor="middle">允许 · 拒绝 · 询问</text><path d="M950 310H1080" stroke="#f4ce72" stroke-width="8" stroke-dasharray="18 14" class="flow"/><circle cx="1090" cy="310" r="35" fill="#f4ce72"/><text x="1090" y="319" fill="#473614" font-size="20" text-anchor="middle">人</text><text x="100" y="88" fill="#98b8ff" font-size="24">META MUSE · 2026-09-08</text><text x="100" y="560" fill="#bec8e6" font-size="21">代理可以提议动作，权限和外部网络由独立控制层决定</text></svg>