<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Tensor Holography 从 RGB-D 场景生成 3D 全息图</title>
  <desc id="desc">左侧是带颜色与深度的 RGB-D 场景，中间是深度学习网络，右侧是空间光调制器显示的 3D 全息图；底部标出不同设备上的速度差异。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171b3a"/><stop offset="1" stop-color="#173f55"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="72" y="70" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="35" font-weight="700">从 RGB-D 场景到 3D 全息图</text>
  <text x="74" y="106" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20">2021-03-10 · MIT News 报道 Tensor Holography</text>
  <g filter="url(#shadow)">
    <rect x="74" y="150" width="292" height="300" rx="24" fill="#1c3555" stroke="#5e84ab" stroke-width="2"/>
    <rect x="454" y="150" width="292" height="300" rx="24" fill="#193d4b" stroke="#67e8f9" stroke-width="3"/>
    <rect x="834" y="150" width="292" height="300" rx="24" fill="#3b2d50" stroke="#c4b5fd" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="220" y="192" fill="#f8fafc" font-size="22" font-weight="700">RGB-D 输入</text>
    <text x="220" y="220" fill="#b8ccdf" font-size="15">颜色 + 每像素深度</text>
    <rect x="132" y="256" width="176" height="112" rx="12" fill="#314e70" stroke="#75d6e4" stroke-width="2"/>
    <circle cx="178" cy="306" r="27" fill="#fbbf24"/><circle cx="253" cy="306" r="27" fill="#67e8f9"/>
    <path d="M151 352 Q220 280 289 352" fill="none" stroke="#a7f3d0" stroke-width="5"/>
    <text x="220" y="407" fill="#d9f4ff" font-size="15">场景里还要知道前后远近</text>
    <text x="600" y="192" fill="#f8fafc" font-size="22" font-weight="700">Tensor Holography</text>
    <text x="600" y="220" fill="#a7f3d0" font-size="15">卷积网络学习光学转换</text>
    <circle cx="600" cy="304" r="73" fill="#1d5961" stroke="#8df1e0" stroke-width="3"/>
    <path d="M560 304h80M600 264v80M573 277l54 54M627 277l-54 54" stroke="#d4fff7" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="407" fill="#d2fff7" font-size="15">4,000 对训练图像与全息图</text>
    <text x="980" y="192" fill="#f8fafc" font-size="22" font-weight="700">显示端（示意）</text>
    <text x="980" y="220" fill="#e5d9ff" font-size="15">全息图 + 空间光调制器</text>
    <path d="M883 350 Q980 248 1077 350" fill="none" stroke="url(#violet)" stroke-width="7"/>
    <path d="M909 350 Q980 287 1051 350" fill="none" stroke="#f0abfc" stroke-width="4" stroke-dasharray="8 10"/>
    <circle cx="980" cy="320" r="12" fill="#fff1ff"/>
    <text x="980" y="407" fill="#f4eaff" font-size="15">让眼睛接收到连续深度线索</text>
  </g>
  <g fill="none" stroke="#a7f3d0" stroke-width="5" marker-end="url(#arrow)"><path d="M372 300h70"/><path d="M752 300h70"/></g>
  <rect x="74" y="486" width="1052" height="78" rx="20" fill="#102a40" stroke="#355c75" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="102" y="518" fill="#fff" font-size="18" font-weight="700">速度要看设备：</text>
    <text x="254" y="518" fill="#a7f3d0" font-size="18">消费级 GPU 60 Hz</text>
    <text x="500" y="518" fill="#f6d98d" font-size="18">iPhone 11 Pro 1.1 Hz</text>
    <text x="800" y="518" fill="#f0abfc" font-size="18">Edge TPU 2 Hz</text>
    <text x="102" y="546" fill="#9fb5cc" font-size="15">示意图为 VibePolaris 自制，重画新闻中的 RGB-D → 神经网络 → 全息显示链路。</text>
  </g>
</svg>
