<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">RLFactory 的多轮工具调用闭环</title><desc id="desc">模型生成调用，工具返回环境观察，奖励层评估后更新下一步策略。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">RLFactory：工具反馈要回到下一步</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">生成 · 解析 · 调用 · 观察 · 更新</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="284" width="178" height="112" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="201" y="328" text-anchor="middle" font-size="25" font-weight="700" fill="#21456f">生成</text><text x="201" y="363" text-anchor="middle" font-size="18" fill="#365b83">工具调用</text>
<rect x="350" y="284" width="178" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="439" y="328" text-anchor="middle" font-size="25" font-weight="700" fill="#275d39">调用</text><text x="439" y="363" text-anchor="middle" font-size="18" fill="#3e7650">真实接口</text>
<rect x="588" y="284" width="178" height="112" rx="18" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="677" y="328" text-anchor="middle" font-size="25" font-weight="700" fill="#805513">观察</text><text x="677" y="363" text-anchor="middle" font-size="18" fill="#966b24">反馈标记</text>
<rect x="826" y="284" width="178" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="915" y="328" text-anchor="middle" font-size="25" font-weight="700" fill="#783553">奖励</text><text x="915" y="363" text-anchor="middle" font-size="18" fill="#94516f">策略更新</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M290 340 H340"/><path d="M528 340 H578"/><path d="M766 340 H816"/><path d="M915 410 C915 490 201 490 201 410"/></g><g fill="#607080"><path d="M340 340 l-14 -9 v18z"/><path d="M578 340 l-14 -9 v18z"/><path d="M816 340 l-14 -9 v18z"/><path d="M201 410 l-9 14 h18z"/></g>
<text x="600" y="535" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">模型不是写出调用就结束，而是要学会读懂结果</text>
</svg>