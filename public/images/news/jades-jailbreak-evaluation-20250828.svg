<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JADES 的分解式越狱评估</title>
  <desc id="desc">一个整体问题被拆成多个子问题，分别评分后按权重聚合，并与人工评审对照。</desc>
  <rect width="1200" height="630" rx="32" fill="#f7f5ef"/>
  <rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
  <text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">JADES：把“越狱成功”拆开来判</text>
  <text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">子问题评分 · 权重聚合 · 可选事实核查</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect x="112" y="252" width="205" height="116" rx="18" fill="#e9eef7" stroke="#8297b8" stroke-width="3"/>
    <text x="214" y="300" text-anchor="middle" font-size="27" font-weight="700" fill="#29486d">整体问题</text>
    <text x="214" y="336" text-anchor="middle" font-size="18" fill="#4c6685">一个粗标签</text>
    <rect x="394" y="208" width="188" height="92" rx="16" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/>
    <text x="488" y="246" text-anchor="middle" font-size="24" font-weight="700" fill="#275d39">子问题 A</text>
    <text x="488" y="276" text-anchor="middle" font-size="17" fill="#3e7650">是否顺从</text>
    <rect x="394" y="326" width="188" height="92" rx="16" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/>
    <text x="488" y="364" text-anchor="middle" font-size="24" font-weight="700" fill="#805513">子问题 B</text>
    <text x="488" y="394" text-anchor="middle" font-size="17" fill="#966b24">关键内容是否出现</text>
    <rect x="394" y="444" width="188" height="92" rx="16" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/>
    <text x="488" y="482" text-anchor="middle" font-size="24" font-weight="700" fill="#783553">子问题 C</text>
    <text x="488" y="512" text-anchor="middle" font-size="17" fill="#94516f">事实是否可靠</text>
    <rect x="698" y="274" width="192" height="122" rx="18" fill="#f1eee7" stroke="#a59c8d" stroke-width="3"/>
    <text x="794" y="319" text-anchor="middle" font-size="25" font-weight="700" fill="#514a40">按权重</text>
    <text x="794" y="354" text-anchor="middle" font-size="19" fill="#6d6559">分别评分</text>
    <text x="794" y="382" text-anchor="middle" font-size="17" fill="#6d6559">记录中间判断</text>
    <rect x="988" y="274" width="112" height="122" rx="18" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/>
    <text x="1044" y="323" text-anchor="middle" font-size="23" font-weight="700" fill="#234b78">结论</text>
    <text x="1044" y="359" text-anchor="middle" font-size="17" fill="#385f8d">可复核</text>
  </g>
  <g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M317 310 H382"/><path d="M582 254 C624 254 642 296 684 310"/><path d="M582 372 H684"/><path d="M582 490 C624 490 642 374 684 360"/><path d="M890 335 H978"/>
  </g>
  <g fill="#607080">
    <path d="M382 310 l-14 -9 v18z"/><path d="M684 310 l-14 -9 v18z"/><path d="M684 372 l-14 -9 v18z"/><path d="M684 360 l-14 -9 v18z"/><path d="M978 335 l-14 -9 v18z"/>
  </g>
  <text x="600" y="560" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#475467">不是只问“成功了吗”，而是问“哪一项被满足了”</text>
</svg>
