<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Tempus ECG-MR AI 筛查流程示意</title>
  <desc id="desc">标准 12 导联心电图进入 AI 筛查，输出与中重度二尖瓣反流相关的二元提示，再交给医生结合其他检查复核，必要时继续影像评估；这是 Tempus FDA 清除新闻的用途解释，不代表独立诊断。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#172440"/><stop offset="1" stop-color="#154f4b"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#fda4af"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061521" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">一张普通 ECG，多读出一个风险信号</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2026-09-28 · Tempus ECG-MR FDA 清除新闻的用途解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#fda4af" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#31584f" stroke="#a7f3d0" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">12 导联 ECG</text>
    <text x="237" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">医院采集的静息心电图</text>
    <text x="237" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">先有一份原始记录</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">ECG-MR AI</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">寻找与 MR 相关的信号</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">输出二元提示</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">医生复核</text>
    <text x="963" y="258" fill="#dfffea" font-size="15" text-anchor="middle">结合症状、病史和其他检查</text>
    <text x="963" y="283" fill="#dfffea" font-size="15" text-anchor="middle">必要时继续影像评估</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="350" fill="#a7f3d0" font-size="16" text-anchor="middle">单向辅助筛查：提示风险，不是独立诊断，也不是连续监测</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">FDA 清除确认了用途和边界，不等于每位患者都适用</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">FDA K254297：9 月 25 日作出决定；Tempus 9 月 28 日公布。结果仍需结合临床资料。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#4b3b63"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#31584f"/>
    <text x="256" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">来源：Tempus / FDA</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">公告：2026-09-28</text><text x="944" y="538" fill="#dfffea" font-size="14" text-anchor="middle">边界：辅助筛查</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释 ECG-MR 的筛查→复核→必要时影像流程，不是医疗建议或诊断结果。</text>
</svg>
