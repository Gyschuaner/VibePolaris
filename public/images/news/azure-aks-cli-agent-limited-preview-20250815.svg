<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Azure AKS CLI Agent human in the loop</title>
  <desc id="desc">A terminal agent uses telemetry and MCP tools to diagnose Kubernetes issues while a human keeps final permission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12243a"/><stop offset="1" stop-color="#1f4b58"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8dd9ff"/><stop offset="1" stop-color="#8f9bff"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bf0c8"/><stop offset="1" stop-color="#50b99b"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06121e" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1054" cy="92" r="205" fill="#8dd9ff" opacity=".12"/>
  <circle cx="1020" cy="558" r="250" fill="#9bf0c8" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="660" height="136" rx="24" fill="#1d3650" stroke="#8dd9ff" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c5efff">AZURE AKS · CLI AGENT</text>
    <text x="108" y="180" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#f2fbff">DIAGNOSE WITH PERMISSION</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d9f7f2">HolmesGPT + AKS-MCP · 人类在环</text>
  <g transform="translate(760 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="404" rx="26" fill="#111e33" stroke="#88b8d4" stroke-width="3"/>
    <rect x="28" y="28" width="284" height="112" rx="16" fill="#213b5b"/>
    <text x="48" y="62" font-family="monospace" font-size="17" fill="#9bf0c8">$ az aks agent</text>
    <text x="48" y="95" font-family="monospace" font-size="15" fill="#eaf6ff">why is my pod Pending?</text>
    <text x="48" y="121" font-family="monospace" font-size="14" fill="#b7d2e4">→ inspect telemetry + tools</text>
    <path d="M170 140 V183" stroke="#f3d179" stroke-width="5" stroke-linecap="round"/>
    <rect x="52" y="184" width="236" height="90" rx="16" fill="#2a5a67" stroke="#9bf0c8" stroke-width="2"/>
    <text x="170" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e5fff3">DIAGNOSE + RECOMMEND</text>
    <text x="170" y="249" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c9f5e5">AKS-MCP · RBAC · traces</text>
    <path d="M170 274 V313" stroke="#f3d179" stroke-width="5" stroke-linecap="round"/>
    <circle cx="170" cy="348" r="32" fill="url(#mint)"/>
    <path d="M155 348 L166 359 L187 334" fill="none" stroke="#143447" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e5fff3">USER PERMISSION</text>
  </g>
  <g transform="translate(80 356)">
    <rect width="622" height="136" rx="20" fill="#1b354b" stroke="#3f6d83" stroke-width="2"/>
    <text x="30" y="47" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c5efff">网络/DNS · Pod 调度 · 节点健康 · CRUD 故障</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e5f7ff">本地诊断 · 自带 LLM · limited preview</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b9d1df">Agent 提建议，集群变更仍需明确授权</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b9d5e1">MICROSOFT AKS ENGINEERING · 15 AUG 2025</text>
</svg>
