<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI CEO 采访：2026 年不上市</title>
  <desc id="desc">OpenAI CEO 在 Fortune 采访中称 2026 年不上市；安全、对齐和社会准备工作仍待推进，不是 SEC 或董事会公告。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132238"/><stop offset="1" stop-color="#1c6e8c"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a8dadc"/><stop offset="1" stop-color="#f1fa8c"/></linearGradient>
  </defs>
  <rect width="960" height="540" rx="34" fill="url(#bg)"/>
  <rect x="116" y="154" width="318" height="236" rx="26" fill="#f3f8f9" opacity=".96"/>
  <path d="M116 212h318" stroke="#132238" stroke-width="6"/><path d="M162 184h74M284 184h96" stroke="#1c6e8c" stroke-width="12" stroke-linecap="round"/>
  <path d="M164 266h84M164 310h118M164 354h62" stroke="#7fa8b7" stroke-width="13" stroke-linecap="round"/>
  <path d="M540 272h248" stroke="url(#bar)" stroke-width="15" stroke-linecap="round"/>
  <path d="M622 226v92M706 226v92" stroke="#f1fa8c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="622" cy="226" r="24" fill="#a8dadc"/><circle cx="706" cy="226" r="24" fill="#f1fa8c"/>
  <rect x="540" y="350" width="248" height="48" rx="18" fill="#132238" stroke="#a8dadc" stroke-width="4"/>
  <path d="M572 374h74M684 374h70" stroke="#f3f8f9" stroke-width="9" stroke-linecap="round"/>
  <text x="86" y="91" fill="#f3f8f9" font-family="Arial, sans-serif" font-size="30" font-weight="700">SAFETY BEFORE IPO</text>
  <text x="86" y="470" fill="#d1ecf1" font-family="Arial, sans-serif" font-size="21">采访表态：2026 不上市，安全工作先行</text>
