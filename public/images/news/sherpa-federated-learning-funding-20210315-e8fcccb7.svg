<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">联邦学习的分布式数据流程</title>
  <desc id="desc">三个数据地点各自训练模型，只把模型更新送入汇总节点；这是联邦学习通用示意，不是 Sherpa 2021 年已公开的具体架构，隐私效果仍需核验。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171b3a"/><stop offset="1" stop-color="#164b55"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">原始数据留在各自一侧，模型更新再汇总</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-15 · Sherpa 融资并把联邦学习列为企业服务新重点</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="120" y="196" width="220" height="114" rx="18" fill="#3d4d6a" stroke="#fda4af" stroke-width="2"/>
    <rect x="490" y="196" width="220" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="860" y="196" width="220" height="114" rx="18" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="230" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">医院 / 企业 A</text>
    <text x="230" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">原始数据留在本地</text>
    <text x="230" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">本地训练</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">银行 / 企业 B</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">原始数据留在本地</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">本地训练</text>
    <text x="970" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">机构 / 企业 C</text>
    <text x="970" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">原始数据留在本地</text>
    <text x="970" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">本地训练</text>
    <path d="M230 318V360H600V400" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M600 318V400" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M970 318V360H600V400" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">交换模型更新（具体安全方案未披露）</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">新闻确认的是方向，不是完整隐私证明</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">Sherpa 的融资与公共卫生案例可追溯；聚合、加密、误差和审计仍需后续材料。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">来源：TechCrunch</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2021-03-15</text><text x="944" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">边界：仍需核验</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释联邦学习新闻中的数据位置与模型更新边界。</text>
</svg>
