<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Self-guided action diffusion</title>
  <desc id="desc">A robot action diffusion sampler uses the prior decision to narrow the next proposal distribution under a tight inference budget.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142338"/><stop offset="1" stop-color="#49304f"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a4f1e4"/><stop offset="1" stop-color="#63addc"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdb93"/><stop offset="1" stop-color="#ee9d6a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="215" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1070" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="700" height="136" rx="24" fill="#22344f" stroke="#8dd4e2" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a3eee4">ARXIV · 17 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f4fbff">SELF-GUIDED ACTION DIFFUSION</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">让前一步决策帮下一步少走分支</text>
  <g transform="translate(776 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="344" height="406" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="172" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">INFERENCE-TIME SEARCH</text>
    <g transform="translate(36 62)">
      <circle cx="26" cy="50" r="15" fill="url(#teal)"/><circle cx="79" cy="30" r="15" fill="url(#teal)"/><circle cx="79" cy="70" r="15" fill="url(#teal)"/><circle cx="132" cy="50" r="15" fill="url(#teal)"/>
      <path d="M41 50 L64 34 M41 50 L64 66 M94 34 L117 50 M94 66 L117 50" stroke="#a7eee5" stroke-width="4" stroke-linecap="round"/>
      <text x="79" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e1faf5">动作候选</text>
    </g>
    <path d="M172 190 V224" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 213 L172 232 L191 213" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="246" width="276" height="66" rx="15" fill="url(#gold)"/>
    <text x="172" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3b2b32">PRIOR DECISION</text>
    <text x="172" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5c3e37">引导下一步提议分布</text>
    <path d="M172 319 V354" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 342 L172 361 L191 342" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">紧预算 · 更少分支</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="670" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">仿真动态任务 · 最高 +70%</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">作者比较结果，限定在严格采样预算</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">真实机器人仍要单独测延迟、碰撞与失败恢复</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">SELF-GUIDED ACTION DIFFUSION · ROBOT POLICY SEARCH</text>
</svg>
