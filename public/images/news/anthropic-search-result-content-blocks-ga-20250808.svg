<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Anthropic 搜索结果内容块移出 Beta</title>
  <desc id="desc">RAG 搜索片段带着来源信息进入 Claude，再生成可检查的引用。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#352b48"/><stop offset="1" stop-color="#775b72"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6f0e5"/><stop offset="1" stop-color="#e5dce9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#251b38" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="92" r="195" fill="#f2c66d" opacity=".18"/>
  <circle cx="96" cy="540" r="220" fill="#c6a9ca" opacity=".17"/>
  <path d="M18 453 C120 374 230 506 348 401 S565 321 680 432 S875 514 1008 384 S1102 350 1195 420" fill="none" stroke="#f2c66d" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="58" y="116" width="300" height="308" rx="30" fill="url(#panel)"/>
    <rect x="398" y="116" width="300" height="308" rx="30" fill="#f6f0e5"/>
    <rect x="738" y="116" width="404" height="308" rx="30" fill="#e8c07a"/>
  </g>
  <g fill="#352b48" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="96" y="176" font-size="25" font-weight="800">检索</text>
    <rect x="96" y="224" width="220" height="58" rx="17" fill="#c9b0cd"/>
    <text x="206" y="260" font-size="22" text-anchor="middle" font-weight="800">query → sources</text>
    <path d="M96 329 h218" stroke="#9a7898" stroke-width="10" stroke-linecap="round" opacity=".7"/>
    <text x="96" y="372" font-size="16">片段 · 链接 · 权限</text>
    <text x="96" y="404" font-size="15">来源先要可追溯</text>

    <text x="438" y="176" font-size="25" font-weight="800">内容块</text>
    <rect x="452" y="224" width="192" height="58" rx="17" fill="#9a7898"/>
    <path d="M474 252 h148 M474 266 h112" stroke="#f6f0e5" stroke-width="8" stroke-linecap="round"/>
    <path d="M448 355 C491 321 526 321 548 355 S608 389 650 350" fill="none" stroke="#9a7898" stroke-width="9" stroke-linecap="round"/>
    <text x="438" y="372" font-size="16">结构化传入 Claude</text>
    <text x="438" y="404" font-size="15">Beta header 可移除</text>

    <text x="778" y="176" font-size="25" font-weight="800">引用</text>
    <rect x="778" y="224" width="310" height="58" rx="17" fill="#9a7898"/>
    <text x="933" y="260" font-size="22" fill="#f6f0e5" text-anchor="middle" font-weight="800">answer + citation</text>
    <path d="M778 329 h310" stroke="#352b48" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="778" y="372" font-size="16">引用仍要核对来源</text>
    <text x="778" y="404" font-size="15">有链接不等于正确</text>
  </g>
  <g fill="#f6f0e5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="58" y="565" font-size="22" letter-spacing="1">CLAUDE API · VERTEX AI · 2025.08.08</text>
    <text x="1142" y="565" font-size="16" text-anchor="end" opacity=".84">引用要能回到证据</text>
  </g>
</svg>
