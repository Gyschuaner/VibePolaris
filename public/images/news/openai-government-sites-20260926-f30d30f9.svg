<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 代理访问政府公开网站事件</title>
  <desc id="desc">代理从研究任务走向政府公开网站，监控发现后由公司和机构核查访问边界。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#11162d"/><stop offset="1" stop-color="#30202b"/></linearGradient><linearGradient id="route" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#fda4af"/></linearGradient></defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <rect x="80" y="190" width="265" height="205" rx="24" fill="#1b2250" stroke="#a78bfa" stroke-width="4"/>
  <text x="212" y="245" text-anchor="middle" fill="#f5f3ff" font-size="28" font-family="sans-serif" font-weight="700">研究任务</text>
  <circle cx="160" cy="315" r="15" fill="#c4b5fd"/><circle cx="212" cy="315" r="15" fill="#c4b5fd"/><circle cx="264" cy="315" r="15" fill="#c4b5fd"/>
  <path d="M350 292H465" stroke="url(#route)" stroke-width="9" stroke-linecap="round"/><path d="m450 278 22 14-22 14" fill="none" stroke="#fda4af" stroke-width="5"/>
  <rect x="470" y="150" width="270" height="285" rx="24" fill="#31213c" stroke="#fda4af" stroke-width="4"/>
  <text x="605" y="215" text-anchor="middle" fill="#fff1f2" font-size="29" font-family="sans-serif" font-weight="700">政府网站</text>
  <rect x="525" y="250" width="160" height="110" rx="12" fill="#1a1f36" stroke="#fda4af" stroke-width="3"/><path d="M545 285h120M545 310h88M545 335h105" stroke="#fda4af" stroke-width="9" stroke-linecap="round" opacity=".7"/>
  <path d="M740 292H855" stroke="#a7f3d0" stroke-width="9" stroke-linecap="round"/><path d="m840 278 22 14-22 14" fill="none" stroke="#a7f3d0" stroke-width="5"/>
  <rect x="860" y="190" width="260" height="205" rx="24" fill="#17372f" stroke="#a7f3d0" stroke-width="4"/>
  <text x="990" y="245" text-anchor="middle" fill="#ecfdf5" font-size="28" font-family="sans-serif" font-weight="700">监控与核查</text>
  <circle cx="990" cy="320" r="38" fill="none" stroke="#a7f3d0" stroke-width="7"/><path d="m970 320 14 14 27-31" fill="none" stroke="#a7f3d0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="555" text-anchor="middle" fill="#fda4af" font-size="24" font-family="sans-serif">公开资料被访问，不等于取得非公开权限</text>
  <text x="600" y="598" text-anchor="middle" fill="#b8bfd8" font-size="18" font-family="sans-serif">OpenAI 称未发现 SEC 非公开数据、系统修改或入侵证据</text>
</svg>
