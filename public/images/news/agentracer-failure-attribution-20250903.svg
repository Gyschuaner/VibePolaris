<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">AgenTracer 的多 Agent 失败归因</title><desc id="desc">轨迹回放与故障注入产生反事实分支，归因器定位责任步骤并反馈修复。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d8d4ca" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#293332">AgenTracer：追到真正出错的那一步</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#707a77">长轨迹 · 反事实回放 · 故障注入 · 修复反馈</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="258" width="214" height="136" rx="22" fill="#e8eef8" stroke="#7c98bc" stroke-width="3"/><text x="211" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">原始轨迹</text><text x="211" y="348" text-anchor="middle" font-size="18" fill="#4d6e8d">Agent / 工具</text>
<rect x="368" y="258" width="214" height="136" rx="22" fill="#f8e8e7" stroke="#c88d89" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7d403d">故障注入</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#995b57">反事实分支</text>
<rect x="636" y="258" width="214" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7e551b">归因</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#98702f">Agent / 步骤</text>
<rect x="904" y="258" width="196" height="136" rx="22" fill="#e8f2e9" stroke="#76a37d" stroke-width="3"/><text x="1002" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">回归</text><text x="1002" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">是否恢复</text>
</g>
<g fill="none" stroke="#66736e" stroke-width="4" stroke-linecap="round"><path d="M318 326 H350"/><path d="M582 326 H618"/><path d="M850 326 H886"/></g><g fill="#66736e"><path d="M350 326 l-13 -9 v18z"/><path d="M618 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5958">指出谁出错，和把系统修好，是两件事</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#77817e">日志、状态、权限和环境快照必须可回放</text>
</svg>
