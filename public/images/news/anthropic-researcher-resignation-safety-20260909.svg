<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Anthropic researcher resignation and AI safety warning</title><desc>A researcher leaves a company while a safety gauge shows concern, public reporting and uncertainty.</desc><style>.needle{animation:needle 3s ease-in-out infinite;transform-origin:600px 350px}.blink{animation:blink 2s ease-in-out infinite}@keyframes needle{50%{transform:rotate(25deg)}}@keyframes blink{50%{opacity:.35}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#281f2f"/><path d="M350 420 A250 250 0 0 1 850 420" fill="none" stroke="#5a4968" stroke-width="34"/><path d="M365 420 A235 235 0 0 1 520 235" fill="none" stroke="#78d2b3" stroke-width="34"/><path d="M520 235 A235 235 0 0 1 690 205" fill="none" stroke="#f0d16a" stroke-width="34"/><path d="M690 205 A235 235 0 0 1 835 420" fill="none" stroke="#ed866e" stroke-width="34"/><path d="M600 350L760 255" stroke="#ffb28f" stroke-width="12" class="needle"/><circle cx="600" cy="350" r="28" fill="#fff0d4"/><circle cx="210" cy="250" r="30" fill="#ffb28f" class="blink"/><path d="M210 300V430" stroke="#ffb28f" stroke-width="10"/><text x="100" y="88" fill="#ffb28f" font-size="24">AP NEWS · ANTHROPIC · 2026-09-09</text><text x="600" y="500" fill="#f0d16a" font-size="30" text-anchor="middle">个人警告 ≠ 机构结论 ≠ 风险预测</text><text x="100" y="565" fill="#cbb9d5" font-size="20">辞职信和公司回应需要放回同一条证据链</text></svg>