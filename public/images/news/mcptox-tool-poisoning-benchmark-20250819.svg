<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MCPTox tool poisoning benchmark</title>
  <desc id="desc">MCPTox tests whether agents treat MCP tool metadata as trusted instructions across real servers and tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13253b"/><stop offset="1" stop-color="#452c48"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2f4e8"/><stop offset="1" stop-color="#69b7e4"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="706" height="136" rx="24" fill="#20354e" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 19 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4fbff">MCPTox · TOOL POISONING</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">合法工具的描述，也要先过安全检查</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">MCP BENCHMARK</text>
    <g transform="translate(32 68)">
      <rect x="0" y="0" width="122" height="60" rx="14" fill="url(#cyan)"/>
      <text x="61" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">45 Server</text>
      <rect x="148" y="0" width="122" height="60" rx="14" fill="url(#amber)"/>
      <text x="209" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">353 工具</text>
      <path d="M61 78 V108 M209 78 V108" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 96 L61 115 L80 96 M190 96 L209 115 L228 96" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="130" width="122" height="60" rx="14" fill="#6e9bd3"/>
      <text x="61" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f4fbff">1,348 案例</text>
      <rect x="148" y="130" width="122" height="60" rx="14" fill="#be7cae"/>
      <text x="209" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff4fb">20 Agent</text>
      <path d="M135 207 V239" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M116 226 L135 245 L154 226" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="260" width="270" height="60" rx="14" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
      <text x="135" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#effcff">元数据 ≠ 授权命令</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">隔离回归 · 人工确认</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">工具投毒不需要先执行代码</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">测试 Agent 会不会把描述当成可信指令</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">成功率属于基准设置，不是生产事故概率</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">MCPTox · MCP TOOL POISONING BENCHMARK</text>
</svg>
