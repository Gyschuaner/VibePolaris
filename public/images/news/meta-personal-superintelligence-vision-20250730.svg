<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Meta 个人超级智能愿景</title><desc id="desc">Meta 公开信从个人目标指向设备上下文，产品路线、权限和可验证能力仍在虚线之后。</desc><rect width="1200" height="680" rx="36" fill="#17152a"/><g font-family="Arial, sans-serif"><text x="90" y="92" fill="#fff" font-size="34" font-weight="700">Vision → Roadmap → Product</text><text x="90" y="128" fill="#c4b5fd" font-size="20">Meta Personal Superintelligence · 2025-07-30</text><g transform="translate(90 220)"><rect width="255" height="145" rx="22" fill="#ddd6fe"/><text x="28" y="54" fill="#4c1d95" font-size="24" font-weight="700">公开信</text><text x="28" y="96" fill="#4b5563" font-size="18">个人目标与愿景</text></g><g transform="translate(472 220)"><rect width="255" height="145" rx="22" fill="#dbeafe"/><text x="28" y="54" fill="#1e3a8a" font-size="24" font-weight="700">设备上下文</text><text x="28" y="96" fill="#334155" font-size="18">眼镜看见、听见</text></g><g transform="translate(855 220)"><rect width="255" height="145" rx="22" fill="#fef3c7"/><text x="28" y="54" fill="#92400e" font-size="24" font-weight="700">待交付</text><text x="28" y="96" fill="#57534e" font-size="18">权限 · 时间表 · 证据</text></g><path d="M345 292H472M727 292H855" stroke="#a78bfa" stroke-width="5" marker-end="url(#arrow)"/><path d="M983 378V468" stroke="#fb7185" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/><g transform="translate(90 468)"><rect width="1020" height="100" rx="22" fill="#29243f" stroke="#fb7185" stroke-width="2"/><text x="30" y="44" fill="#fda4af" font-size="23" font-weight="700">愿景 ≠ 已上线产品</text><text x="30" y="77" fill="#ddd6fe" font-size="18">真正的个人助手还要回答谁能看、记多久、怎样撤销。</text></g></g><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#a78bfa"/></marker></defs></svg>