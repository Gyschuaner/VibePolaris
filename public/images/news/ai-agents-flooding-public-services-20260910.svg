<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Agentic flooding of public services</title><desc>Many AI-assisted forms flow toward a public-service desk, showing both access and capacity pressure.</desc><style>.flow{animation:flow 2.5s linear infinite}.desk{animation:desk 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-90}}@keyframes desk{50%{transform:translateY(-6px)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#fff5e6"/><path d="M100 190H920M100 300H920M100 410H920" stroke="#f0c481" stroke-width="3"/><g fill="#e87942" class="flow"><circle cx="160" cy="160" r="14"/><circle cx="250" cy="260" r="14"/><circle cx="180" cy="370" r="14"/><circle cx="360" cy="460" r="14"/></g><path d="M180 160L760 300M270 260L760 300M200 370L760 300M380 460L760 300" stroke="#ef9c5d" stroke-width="8" stroke-dasharray="14 15" class="flow"/><g class="desk"><rect x="760" y="205" width="300" height="190" rx="22" fill="#c85b3d"/><text x="910" y="285" fill="#fff7e8" font-size="32" text-anchor="middle">公共服务</text><text x="910" y="330" fill="#ffe0b5" font-size="20" text-anchor="middle">容量 · 公平 · 审核</text></g><text x="100" y="88" fill="#c85b3d" font-size="24">TECHCRUNCH · 2026-09-10</text><text x="100" y="565" fill="#8b6047" font-size="22">AI 降低申请成本，也可能同时放大数量与单件复杂度</text></svg>