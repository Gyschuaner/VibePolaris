<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V3.1 hybrid inference and agent API</title>
  <desc id="desc">One DeepSeek model offers thinking and non-thinking paths with strict tool calling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18213d"/><stop offset="1" stop-color="#2e345b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#94c5ff"/><stop offset="1" stop-color="#8ef0e0"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd17e"/><stop offset="1" stop-color="#ff9ab9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070a16" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="88" r="210" fill="#94c5ff" opacity=".12"/>
  <circle cx="1030" cy="570" r="255" fill="#ff9ab9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="720" height="140" rx="24" fill="#232d51" stroke="#94c5ff" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#c6e3ff">DEEPSEEK · V3.1</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#fafbff">THINK ↔ NON-THINK</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e8e7ff">一个模型，两个推理节奏，一套 Agent API</text>
  <g transform="translate(816 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="400" rx="30" fill="#111a34" stroke="#c3ceff" stroke-width="3"/>
    <circle cx="126" cy="102" r="48" fill="url(#blue)"/>
    <path d="M96 102h60M126 72v60" stroke="#18234a" stroke-width="8" stroke-linecap="round"/>
    <path d="M126 158v36M126 194l-57 41M126 194l57 41" stroke="#788fc7" stroke-width="7" stroke-linecap="round"/>
    <rect x="31" y="252" width="85" height="66" rx="16" fill="url(#orange)"/>
    <rect x="136" y="252" width="85" height="66" rx="16" fill="url(#blue)"/>
    <text x="74" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#422646">THINK</text>
    <text x="178" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e2d54">FAST</text>
    <text x="126" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e9edff">128K · STRICT TOOLS</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="710" height="140" rx="20" fill="#232d51" stroke="#526d9c" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#c6e3ff">CHAT = NON-THINK · REASONER = THINK</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">Anthropic API 格式 · Beta Strict Function Calling</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c4cbe8">官方发布主张，仍需按任务回归</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c6cbe7">DEEPSEEK OFFICIAL NEWS · 21 AUG 2025</text>
</svg>
