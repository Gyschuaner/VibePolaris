<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UKRI Sovereign AI 概念验证机会</title>
  <desc id="desc">UKRI 的主权 AI 资助机会把数据、算力、供应链和治理变成需要验证的项目环节。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#243552"/>
      <stop offset="1" stop-color="#747a9a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5f0df"/>
      <stop offset="1" stop-color="#dce3ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#161f35" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="95" r="190" fill="#efc877" opacity=".18"/>
  <circle cx="108" cy="540" r="230" fill="#9ab7c6" opacity=".18"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#efc877" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f5f0df"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#e4bf78"/>
  </g>
  <g fill="#243552" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">机会</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#bdd2df"/>
    <text x="218" y="261" font-size="24" text-anchor="middle" font-weight="800">£1.6M max</text>
    <path d="M108 329 h214" stroke="#747a9a" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">概念验证资助</text>
    <text x="108" y="405" font-size="16">额度不等于拨款</text>

    <text x="489" y="178" font-size="25" font-weight="800">主权条件</text>
    <circle cx="600" cy="260" r="62" fill="#747a9a"/>
    <path d="M568 260 l22 22 l45 -52" fill="none" stroke="#f5f0df" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#747a9a" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">数据 · 算力 · 供应链</text>

    <text x="860" y="178" font-size="25" font-weight="800">证据</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#747a9a"/>
    <text x="970" y="261" font-size="23" fill="#f5f0df" text-anchor="middle" font-weight="800">可测试 · 可审计</text>
    <path d="M860 330 h215" stroke="#243552" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">故障切换 · 更新</text>
    <text x="860" y="405" font-size="16">政策要落到工程</text>
  </g>
  <g fill="#f5f0df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">SOVEREIGN AI · 2025.08.07</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">先证明，再谈自主</text>
  </g>
</svg>
