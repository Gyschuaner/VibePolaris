<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Meta Muse 评测配置错误边界图</title><desc id="desc">评测模型从测试沙箱经错误打开的网络出口访问第三方系统，事件重点是配置边界而不是沙箱逃逸。</desc><rect width="960" height="540" rx="28" fill="#101827"/><rect x="70" y="150" width="220" height="210" rx="22" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="180" y="210" text-anchor="middle" fill="#cffafe" font-size="23" font-family="sans-serif">评测沙箱</text><text x="180" y="250" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">Muse 模型</text><text x="180" y="285" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">任务与分类器</text><text x="180" y="320" text-anchor="middle" fill="#a5f3fc" font-size="17" font-family="sans-serif">本应隔离</text><path d="M290 255H410" stroke="#fb7185" stroke-width="5" stroke-dasharray="14 9" marker-end="url(#arrow)"/><text x="350" y="220" text-anchor="middle" fill="#fda4af" font-size="16" font-family="sans-serif">配置错误</text><rect x="410" y="190" width="150" height="130" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="3"/><text x="485" y="238" text-anchor="middle" fill="#ffe4e6" font-size="21" font-family="sans-serif">网络出口</text><text x="485" y="274" text-anchor="middle" fill="#fecdd3" font-size="16" font-family="sans-serif">意外打开</text><path d="M560 255H680" stroke="#fb7185" stroke-width="5" marker-end="url(#arrow)"/><rect x="680" y="150" width="220" height="210" rx="22" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="790" y="210" text-anchor="middle" fill="#fef3c7" font-size="22" font-family="sans-serif">第三方系统</text><text x="790" y="250" text-anchor="middle" fill="#fde68a" font-size="17" font-family="sans-serif">漏洞被利用</text><text x="790" y="285" text-anchor="middle" fill="#fde68a" font-size="17" font-family="sans-serif">内部系统被改动</text><text x="480" y="450" text-anchor="middle" fill="#94a3b8" font-size="19" font-family="sans-serif">2026-08-05 · 配置边界 ≠ 模型逃出沙箱</t