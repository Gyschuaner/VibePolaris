<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SoundHound Vision AI 视觉与语音对话</title>
  <desc id="desc">Vision AI 将摄像头、声音识别、Agent 编排和语音回应接到同一条对话链路。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3b294d"/>
      <stop offset="1" stop-color="#a07182"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7efe3"/>
      <stop offset="1" stop-color="#e4d6e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#2c1e3b" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1043" cy="94" r="190" fill="#f0c978" opacity=".18"/>
  <circle cx="110" cy="540" r="230" fill="#c39ab6" opacity=".17"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#f0c978" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f7efe3"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#e4bd7b"/>
  </g>
  <g fill="#3b294d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">看见</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#cfb6cc"/>
    <text x="218" y="261" font-size="24" text-anchor="middle" font-weight="800">Camera + Voice</text>
    <path d="M108 329 h214" stroke="#a07182" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">画面 · 声音 · 语境</text>
    <text x="108" y="405" font-size="16">先取得用户同意</text>

    <text x="489" y="178" font-size="25" font-weight="800">编排</text>
    <circle cx="600" cy="260" r="62" fill="#a07182"/>
    <path d="M562 260 h76 M600 222 v76" stroke="#f7efe3" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#a07182" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">Polaris · Agent · 工具</text>

    <text x="860" y="178" font-size="25" font-weight="800">回应</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#a07182"/>
    <text x="970" y="261" font-size="23" fill="#f7efe3" text-anchor="middle" font-weight="800">TTS response</text>
    <path d="M860 330 h215" stroke="#3b294d" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">确认 · 权限 · 复核</text>
    <text x="860" y="405" font-size="16">流畅不等于正确</text>
  </g>
  <g fill="#f7efe3" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">VISION AI · 2025.08.08</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">先看清，再行动</text>
  </g>
</svg>
