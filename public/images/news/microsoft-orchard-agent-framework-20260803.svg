<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Orchard 智能体评测框架</title>
<desc id="desc">Orchard 用隔离环境、工具记录和评测方法把一次智能体运行变成可复查轨迹。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="50" y="165" width="220" height="170" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/>
<text x="160.0" y="223" text-anchor="middle" fill="#dbeafe" font-size="21" font-family="sans-serif">任务输入</text>
<text x="160.0" y="265" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">数据与目标</text>
<path d="M270 250.0H251" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="263" y="165" width="220" height="170" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<text x="373.0" y="223" text-anchor="middle" fill="#cffafe" font-size="21" font-family="sans-serif">Orchard Env</text>
<text x="373.0" y="265" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">隔离容器</text>
<path d="M483 250.0H464" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="476" y="165" width="220" height="170" rx="18" fill="#3f1d5a" stroke="#d8b4fe" stroke-width="3"/>
<text x="586.0" y="223" text-anchor="middle" fill="#f3e8ff" font-size="21" font-family="sans-serif">Harness</text>
<text x="586.0" y="265" text-anchor="middle" fill="#e9d5ff" font-size="15" font-family="sans-serif">工具与状态</text>
<path d="M696 250.0H677" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="689" y="165" width="220" height="170" rx="18" fill="#134e4a" stroke="#5eead4" stroke-width="3"/>
<text x="799.0" y="223" text-anchor="middle" fill="#ccfbf1" font-size="21" font-family="sans-serif">评测结果</text>
<text x="799.0" y="265" text-anchor="middle" fill="#99f6e4" font-size="15" font-family="sans-serif">可复现比较</text>
<text x="480" y="475" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">框架开源 ≠ 默认生产安全</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs></svg>
