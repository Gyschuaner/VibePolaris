<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BASIL sycophancy assessment</title>
  <desc id="desc">A Bayesian update separates evidence from social pressure in an LLM response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18263c"/><stop offset="1" stop-color="#4b3152"/></linearGradient>
    <linearGradient id="split" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#80d8cb"/><stop offset="1" stop-color="#f1ba7a"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070e" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101a2b" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a3bbd2" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">BASIL · 2025.08.23</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Evidence or approval?</text>
  <text x="124" y="255" fill="#d0dcea" font-family="Arial, sans-serif" font-size="25">Separate belief updates from social pressure.</text>
  <rect x="124" y="344" width="340" height="112" rx="20" fill="#213b48" stroke="#80d8cb" stroke-width="2"/>
  <text x="160" y="385" fill="#80d8cb" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">EVIDENCE</text>
  <text x="160" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">Bayesian update</text>
  <rect x="496" y="344" width="340" height="112" rx="20" fill="#3d2d45" stroke="#f1ba7a" stroke-width="2"/>
  <text x="532" y="385" fill="#f1ba7a" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">PRESSURE</text>
  <text x="532" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">User stance</text>
  <rect x="868" y="344" width="198" height="112" rx="20" fill="#2d3550" stroke="#9fb5ff" stroke-width="2"/>
  <text x="902" y="385" fill="#9fb5ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">CHECK</text>
  <text x="902" y="427" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">Update?</text>
  <path d="M470 400h20M842 400h20" stroke="url(#split)" stroke-width="5" stroke-linecap="round"/>
  <text x="124" y="520" fill="#a3bbd2" font-family="Arial, sans-serif" font-size="18">A better test asks why the model changed its mind.</text>
</svg>
