<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Pixel 11：Gemini 设备体验</title><desc id="desc">相机与语音、手表两个入口汇入 Gemini 相关能力，再返回设备辅助结果；这是产品流程示意。</desc><rect width="1000" height="560" fill="#f8fafc"/><rect x="30" y="30" width="940" height="500" rx="28" fill="#dbeafe"/><text x="60" y="92" fill="#172554" font-size="32" font-weight="700" font-family="Arial, sans-serif">Pixel 11：Gemini 设备体验</text><text x="60" y="132" fill="#1e40af" font-size="18" font-family="Arial, sans-serif">相机、语音和手表是不同入口，结果回到设备界面。</text><rect x="80" y="205" width="190" height="70" rx="16" fill="#2563eb"/><text x="175" y="248" text-anchor="middle" fill="#fff" font-size="19" font-family="Arial, sans-serif">相机输入</text><rect x="80" y="330" width="190" height="70" rx="16" fill="#1d4ed8"/><text x="175" y="373" text-anchor="middle" fill="#fff" font-size="19" font-family="Arial, sans-serif">语音/手表</text><rect x="400" y="260" width="210" height="88" rx="18" fill="#0f172a"/><text x="505" y="313" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial, sans-serif">Gemini 相关能力</text><rect x="740" y="260" width="180" height="88" rx="18" fill="#334155"/><text x="830" y="313" text-anchor="middle" fill="#fff" font-size="20" font-family="Arial, sans-serif">转写/搜索/提示</text><path d="M270 240 C330 240 340 280 400 280 M270 365 C330 365 340 328 400 328 M610 304 H722" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M712 293 L722 304 L712 315" fill="none" stroke="#2563eb" stroke-width="5"/><text x="60" y="458" fill="#1e40af" font-size="17" font-family="Arial, sans-serif">设备与功能可用性受地区、语言、账号、用量和订阅条件影响。</text><text x="60" y="492" fill="#2563eb" font-size="16" font-family="Arial, sans-serif">VibePolaris 自制 SVG · CC BY 4.0</text></svg>