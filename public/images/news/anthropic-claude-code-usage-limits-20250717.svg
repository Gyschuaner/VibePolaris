<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Claude Code 用量上限</title><desc id="d">用量计量接近红线，用户提示与公司回应之间仍有待确认的规则</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#371b36"/><stop offset="1" stop-color="#18294a"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset=".72" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><rect width="1200" height="630" rx="36" fill="url(#bg)"/><g font-family="Arial, sans-serif"><text x="100" y="116" fill="#fce7f3" font-size="34">Claude Code · usage limit</text><text x="100" y="156" fill="#cbd5e1" font-size="20">用户看到重置时间，但长期规则仍待说明</text><rect x="100" y="230" width="1000" height="58" rx="29" fill="#334155"/><rect x="100" y="230" width="750" height="58" rx="29" fill="url(#bar)"/><line x1="850" y1="205" x2="850" y2="325" stroke="#fecdd3" stroke-width="5" stroke-dasharray="10 10"/><text x="850" y="360" fill="#fecdd3" font-size="20" text-anchor="middle">触顶提示</text><g><rect x="120" y="430" width="260" height="88" rx="18" fill="#243b53" stroke="#93c5fd" stroke-width="3"/><text x="250" y="468" fill="#dbeafe" font-size="23" text-anchor="middle">用户 issue</text><text x="250" y="497" fill="#bfdbfe" font-size="16" text-anchor="middle">可追踪但非政策</text></g><g><rect x="470" y="430" width="260" height="88" rx="18" fill="#243b53" stroke="#93c5fd" stroke-width="3"/><text x="600" y="468" fill="#dbeafe" font-size="23" text-anchor="middle">媒体报道</text><text x="600" y="497" fill="#bfdbfe" font-size="16" text-anchor="middle">采访与时间线</text></g><g><rect x="820" y="430" width="260" height="88" rx="18" fill="#243b53" stroke="#93c5fd" stroke-width="3"/><text x="950" y="468" fill="#dbeafe" font-size="23" text-anchor="middle">正式规则</text><text x="950" y="497" fill="#bfdbfe" font-size="16" text-anchor="middle">等待后续更新</text></g></g></svg>
