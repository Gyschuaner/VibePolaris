<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Deezer AI 音乐标签和反刷流</title><desc id="desc">音频波形经过检测后变成 AI 标签，再分别进入推荐和版税流程。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20192f"/><stop offset="1" stop-color="#3a234b"/></linearGradient><linearGradient id="wave"><stop stop-color="#ff8c69"/><stop offset="1" stop-color="#f3d36b"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="76" y="86" fill="#fff8f2" font-family="Arial" font-size="28" font-weight="700">Deezer · AI 音乐的标签路径</text><text x="76" y="120" fill="#c9b7ce" font-family="Arial" font-size="16">检测信号改变可见性、推荐和版税，但不等于版权判决</text><g stroke="#5b3e65" opacity=".5"><path d="M80 210H1120M80 320H1120M80 430H1120M80 540H1120"/></g><path d="M120 320 C150 200 180 440 210 320 S270 200 300 320 S360 440 390 320 S450 180 480 320" fill="none" stroke="url(#wave)" stroke-width="9"/><circle cx="545" cy="320" r="52" fill="#ff8c69"/><path d="M522 320L540 338L571 294" fill="none" stroke="#291c36" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M600 320H700" stroke="#f3d36b" stroke-width="8" stroke-dasharray="12 14"/><rect x="700" y="250" width="250" height="140" rx="22" fill="#2c2140" stroke="#7c5c81"/><text x="735" y="293" fill="#f3d36b" font-family="Arial" font-size="20">AI-generated</text><text x="735" y="326" fill="#fff8f2" font-family="Arial" font-size="16">标签显示在专辑页</text><text x="735" y="354" fill="#c9b7ce" font-family="Arial" font-size="13">检测 ≠ 侵权证明</text><path d="M820 390V475M820 475H625M820 475H1015" stroke="#f3d36b" stroke-width="6" stroke-dasharray="10 12"/><rect x="530" y="500" width="190" height="72" rx="16" fill="#2c2140" stroke="#7c5c81"/><text x="566" y="544" fill="#fff8f2" font-family="Arial" font-size="17">推荐过滤</text><rect x="920" y="500" width="190" height="72" rx="16" fill="#2c2140" stroke="#7c5c81"/><text x="955" y="544" fill="#fff8f2" font-family="Arial" font-size="17">版税核对</text><text x="120" y="600" fill="#c9b7ce" font-family="Arial" font-size="16">上传 → 检测 → 标签 → 分发/结算</text></svg>
