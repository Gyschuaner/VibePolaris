<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>AI threat intelligence: from assistant to orchestrator</title><desc>Dark security map showing an AI agent coordinating reconnaissance, exploitation and exfiltration while a human reviews the target.</desc><style>.pulse{animation:pulse 2.8s ease-in-out infinite}.orbit{animation:spin 16s linear infinite;transform-origin:600px 315px}@keyframes pulse{50%{opacity:.35;transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#101827"/><path d="M80 500H1120M80 130H1120" stroke="#233553" stroke-width="2"/><circle cx="600" cy="315" r="92" fill="#172d4d" stroke="#62d2ff" stroke-width="4" class="pulse"/><text x="600" y="305" fill="#eaf6ff" font-size="34" text-anchor="middle">AI 编排器</text><text x="600" y="347" fill="#9bdcff" font-size="20" text-anchor="middle">recon · exploit · exfil</text><g class="orbit" fill="none" stroke="#ff8a73" stroke-width="4"><ellipse cx="600" cy="315" rx="330" ry="130"/><ellipse cx="600" cy="315" rx="250" ry="210" transform="rotate(55 600 315)"/></g><g fill="#ffcf66"><circle cx="280" cy="315" r="15"/><circle cx="930" cy="315" r="15"/><circle cx="600" cy="112" r="15"/></g><g fill="#91f5c1"><circle cx="180" cy="470" r="13"/><circle cx="1020" cy="470" r="13"/></g><path d="M280 315H508M692 315H930M600 112V220M180 470L520 370M1020 470L680 370" stroke="#62d2ff" stroke-width="3" stroke-dasharray="10 12"/><text x="100" y="92" fill="#ffcf66" font-size="24">ANTHROPIC · 2026-09-10</text><text x="100" y="566" fill="#9fb5d4" font-size="22">七类滥用案例：人类设定目标，代理执行更长的链路</text></svg>