<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Qwen3 Instruct 2507 的长上下文与部署边界</title><desc id="desc">模型规格从 235B 总参数和 22B 激活参数，经过 256K 原生上下文，走向需要巨大显存的 1M 扩展和受控工具调用。</desc><defs><linearGradient id="qbg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="qline" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#qbg)"/><text x="68" y="78" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">Qwen3 Instruct-2507</text><text x="68" y="118" fill="#cbd5e1" font-size="21" font-family="sans-serif">2025-07-21 · 235B total / 22B active · non-thinking</text><g font-family="sans-serif"><rect x="72" y="210" width="250" height="190" rx="26" fill="#164e63"/><text x="112" y="266" fill="#fff" font-size="25" font-weight="700">模型</text><text x="112" y="310" fill="#cffafe" font-size="18">128 experts</text><text x="112" y="344" fill="#cffafe" font-size="18">8 active / token</text><path d="M340 304h76" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/><path d="m398 292 18 12-18 12" fill="none" stroke="#67e8f9" stroke-width="6"/><rect x="438" y="190" width="250" height="230" rx="26" fill="#4338ca"/><text x="482" y="252" fill="#fff" font-size="25" font-weight="700">上下文</text><text x="482" y="300" fill="#e0e7ff" font-size="20">256K 原生</text><text x="482" y="340" fill="#e0e7ff" font-size="18">1M 需额外配置</text><text x="482" y="378" fill="#e0e7ff" font-size="18">约 1000GB GPU</text><path d="M706 304h76" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/><path d="m764 292 18 12-18 12" fill="none" stroke="#a5b4fc" stroke-width="6"/><rect x="804" y="210" width="250" height="190" rx="26" fill="#7e22ce"/><text x="848" y="266" fill="#fff" font-size="25" font-weight="700">工具</text><text x="848" y="310" fill="#fae8ff" font-size="18">Qwen-Agent</text><text x="848" y="344" fill="#fae8ff" font-size="18">MCP / 白名单</text><text x="848" y="378" fill="#fae8ff" font-size="18">外层授权</text><rect x="188" y="500" width="824" height="88" rx="26" fill="#0b1120" stroke="url(#qline)" stroke-width="3"/><text x="322" y="548" fill="#fff" font-size="24" font-weight="700">模型上限 ≠ 默认资源 ≠ 生产权限</text><text x="370" y="578" fill="#94a3b8" font-size="16">规格、部署、评测和授权要分别核对</text></g></svg>
