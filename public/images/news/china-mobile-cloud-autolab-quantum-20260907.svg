<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>China Mobile Cloud AutoLab for Quantum</title><desc>A natural-language research goal flows through a quantum agent to circuit construction, noisy simulation and a reproducible experiment record.</desc><style>.flow{animation:flow 3s linear infinite}.spin{animation:spin 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-88}}@keyframes spin{to{transform:rotate(360deg)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#121b38"/><text x="75" y="78" fill="#8fe7ff" font-size="24">移动云 AUTOLAB FOR QUANTUM · 2026-09-07</text><rect x="70" y="200" width="245" height="190" rx="24" fill="#3e315c" stroke="#d1b5ff" stroke-width="4"/><text x="192" y="258" fill="#fff7ff" font-size="25" text-anchor="middle">自然语言</text><text x="192" y="302" fill="#dfcff6" font-size="18" text-anchor="middle">“复现这个实验”</text><text x="192" y="344" fill="#dfcff6" font-size="16" text-anchor="middle">目标 · 参数 · 约束</text><path d="M315 295H430" stroke="#d1b5ff" stroke-width="8" stroke-dasharray="18 16" class="flow"/><rect x="430" y="170" width="290" height="250" rx="24" fill="#21465c" stroke="#8fe7ff" stroke-width="4"/><circle cx="575" cy="255" r="55" fill="none" stroke="#8fe7ff" stroke-width="4" stroke-dasharray="12 12" class="spin"/><path d="M535 255h80M575 215v80" stroke="#8fe7ff" stroke-width="4"/><text x="575" y="350" fill="#eafaff" font-size="24" text-anchor="middle">科研代理</text><text x="575" y="382" fill="#bbdff0" font-size="16" text-anchor="middle">线路 · 工具 · 参数</text><path d="M720 295H835" stroke="#8fe7ff" stroke-width="8" stroke-dasharray="18 16" class="flow"/><rect x="835" y="155" width="290" height="130" rx="22" fill="#264e4b" stroke="#9cf0c7" stroke-width="4"/><text x="980" y="205" fill="#effff7" font-size="23" text-anchor="middle">含噪模拟</text><text x="980" y="242" fill="#c7f5df" font-size="16" text-anchor="middle">VQE · QAOA · Grover</text><rect x="835" y="325" width="290" height="130" rx="22" fill="#5b3d55" stroke="#ffb7a8" stroke-width="4"/><text x="980" y="375" fill="#fff3ef" font-size="23" text-anchor="middle">实验记录</text><text x="980" y="412" fill="#ffd8cf" font-size="16" text-anchor="middle">seed · circuit · result</text><text x="75" y="535" fill="#becbe8" font-size="21">媒体报道的功能发布，尚无公开成功率或独立稳定性评估</text><text x="75" y="575" fill="#d1b5ff" font-size="17">一句话是入口，可复现轨迹才是科研产品</text></svg>
