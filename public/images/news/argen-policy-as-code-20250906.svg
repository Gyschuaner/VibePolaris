<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">ArGen：把 AI 政策接进训练和治理</title>
<desc id="desc">伦理、安全和监管规则经过机器可读政策、自动评分与 GRPO 训练，再由治理层回归检查。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f1f5ff"/><stop offset="1" stop-color="#fff4e8"/></linearGradient>
 <linearGradient id="policy" x1="0" x2="1"><stop offset="0" stop-color="#dae8ff"/><stop offset="1" stop-color="#e7dcff"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#586b88"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263b5a" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#304b73" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">让 AI 的规则能被训练，也能被追踪</text>
<text x="70" y="114" fill="#71819a" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">machine-readable policy · reward scoring · GRPO · governance</text>
<g filter="url(#shadow)">
 <rect x="66" y="172" width="250" height="326" rx="22" fill="#fff" stroke="#b8cceb" stroke-width="2"/>
 <text x="104" y="220" fill="#4b66a2" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">政策输入</text>
 <rect x="103" y="253" width="176" height="48" rx="10" fill="#e3efff"/><text x="191" y="283" text-anchor="middle" fill="#3d619a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">伦理原则</text>
 <rect x="103" y="319" width="176" height="48" rx="10" fill="#eee6ff"/><text x="191" y="349" text-anchor="middle" fill="#674f9d" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">运营安全</text>
 <rect x="103" y="385" width="176" height="48" rx="10" fill="#fff0d9"/><text x="191" y="415" text-anchor="middle" fill="#9a6d35" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">监管要求</text>
 <text x="191" y="464" text-anchor="middle" fill="#71819a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">可配置 · 可版本化</text>
</g>
<path d="M332 335 H380" stroke="#586b88" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="400" y="145" width="390" height="380" rx="22" fill="#fff" stroke="#c9b7e8" stroke-width="2"/>
 <text x="440" y="201" fill="#624e9e" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">训练与治理</text>
 <rect x="440" y="238" width="150" height="60" rx="11" fill="url(#policy)"/><text x="515" y="275" text-anchor="middle" fill="#4d5f9c" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">自动奖励评分</text>
 <rect x="600" y="238" width="150" height="60" rx="11" fill="#e6f3ec"/><text x="675" y="275" text-anchor="middle" fill="#397563" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">GRPO 更新</text>
 <path d="M590 268 H598" stroke="#586b88" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M675 310 C675 378 515 378 515 310" fill="none" stroke="#8a74b5" stroke-width="4" marker-end="url(#arrow)"/>
 <rect x="466" y="407" width="258" height="57" rx="11" fill="#fff0d9"/><text x="595" y="442" text-anchor="middle" fill="#956b35" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">OPA 风格治理层</text>
 <text x="440" y="493" fill="#71819a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">规则、结果、例外 → 可追踪</text>
</g>
<path d="M811 335 H859" stroke="#586b88" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="880" y="172" width="254" height="326" rx="22" fill="#fff" stroke="#e4c49a" stroke-width="2"/>
 <text x="918" y="220" fill="#966a35" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">案例检查</text>
 <rect x="916" y="253" width="184" height="48" rx="10" fill="#e6f3ec"/><text x="1008" y="283" text-anchor="middle" fill="#397563" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">医疗助手</text>
 <rect x="916" y="319" width="184" height="48" rx="10" fill="#eee6ff"/><text x="1008" y="349" text-anchor="middle" fill="#674f9d" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">遵循度 +70.9%</text>
 <rect x="916" y="385" width="184" height="48" rx="10" fill="#fff0d9"/><text x="1008" y="415" text-anchor="middle" fill="#966a35" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">研究案例指标</text>
 <text x="1008" y="464" text-anchor="middle" fill="#71819a" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不是合规认证</text>
</g>
<text x="68" y="575" fill="#966a35" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">政策版本和反例回归仍需要人工负责</text>
<text x="68" y="613" fill="#71819a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">价值选择、规则冲突与领域风险不能交给单一评分器。</text>
</svg>
