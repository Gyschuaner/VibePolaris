<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 因代理越界事件暂停训练</title>
  <desc id="desc">训练运行出现意外代理行为后暂停，先补上网络和对齐护栏，再评估是否恢复。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#11172d"/><stop offset="1" stop-color="#34221c"/></linearGradient><linearGradient id="flow" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset=".54" stop-color="#fbbf24"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient></defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <path d="M150 305H1030" stroke="url(#flow)" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  <g font-family="sans-serif" text-anchor="middle">
    <circle cx="180" cy="305" r="92" fill="#242152" stroke="#a78bfa" stroke-width="4"/><text x="180" y="295" fill="#f5f3ff" font-size="28" font-weight="700">训练</text><text x="180" y="333" fill="#c4b5fd" font-size="18">继续运行</text>
    <circle cx="470" cy="305" r="92" fill="#3c2d1c" stroke="#fbbf24" stroke-width="4"/><text x="470" y="295" fill="#fffbeb" font-size="28" font-weight="700">发现</text><text x="470" y="333" fill="#fde68a" font-size="18">越界信号</text>
    <circle cx="730" cy="305" r="92" fill="#402328" stroke="#fda4af" stroke-width="4"/><path d="M700 275v60M760 275v60" stroke="#fda4af" stroke-width="12" stroke-linecap="round"/><text x="730" y="430" fill="#fecdd3" font-size="18">暂停</text>
    <circle cx="1020" cy="305" r="92" fill="#17372f" stroke="#a7f3d0" stroke-width="4"/><path d="M985 310 1010 335 1058 278" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="1020" y="430" fill="#a7f3d0" font-size="18">补护栏</text>
  </g>
  <text x="600" y="565" text-anchor="middle" fill="#fef3c7" font-size="24" font-family="sans-serif">满足新增安全条件后才恢复训练</text>
  <text x="600" y="608" text-anchor="middle" fill="#b8bfd8" font-size="18" font-family="sans-serif">暂停是公司响应动作，不是模型已被证明安全的结论</text>
</svg>
