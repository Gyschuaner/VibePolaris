<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">AI 菜单图的信任链</title><desc id="desc">真实菜品照片经过有限编辑，平台标记后呈现在菜单上，消费者反馈决定它是否仍然可信。</desc><rect width="1200" height="700" rx="36" fill="#201918"/><g font-family="Arial, sans-serif"><text x="60" y="92" fill="#fff2dd" font-size="38" font-weight="700">A menu image is a promise</text><text x="60" y="132" fill="#dfbfa8" font-size="22">Cost savings can turn into a trust cost</text><g stroke="#f8c783" stroke-width="4"><rect x="70" y="235" width="215" height="150" rx="24" fill="#7d4a37"/><rect x="360" y="235" width="215" height="150" rx="24" fill="#a96542"/><rect x="650" y="235" width="215" height="150" rx="24" fill="#c9794e"/><rect x="940" y="235" width="190" height="150" rx="24" fill="#4d9c88"/></g><g fill="#fff2dd" font-size="25" font-weight="700"><text x="120" y="300">真实菜品</text><text x="406" y="300">有限编辑</text><text x="696" y="300">来源标记</text><text x="978" y="300">顾客反馈</text></g><g fill="#f3d2b5" font-size="20"><text x="108" y="340">照片 · 份量</text><text x="400" y="340">光线 · 背景</text><text x="694" y="340">AI-enhanced</text><text x="970" y="340">信任 / 退单</text></g><path d="M285 310h75M575 310h75M865 310h75" stroke="#ffe2ad" stroke-width="8" marker-end="url(#a)"/><path d="M1035 390c-20 80-210 145-510 145s-400-65-420-145" fill="none" stroke="#e6a17b" stroke-width="7" stroke-dasharray="16 13"/><text x="430" y="600" fill="#f0c7aa" font-size="24">反馈回到原图：图片越像承诺，真实性越重要</text><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#ffe2ad"/></marker></defs></g></svg>
