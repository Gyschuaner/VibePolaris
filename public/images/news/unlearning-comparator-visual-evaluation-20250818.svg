<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Unlearning Comparator</title>
  <desc id="desc">A visual analytics workflow compares original and unlearned models from overall scores down to classes, instances and layers, then simulates membership inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14243a"/><stop offset="1" stop-color="#442c49"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b1f4e8"/><stop offset="1" stop-color="#67b7e5"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="700" height="136" rx="24" fill="#20354c" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 18 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="#f4fbff">UNLEARNING COMPARATOR</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">从总分下钻到样本，再看隐私残留</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">VISUAL ANALYTICS</text>
    <g transform="translate(32 64)">
      <rect x="0" y="0" width="122" height="60" rx="14" fill="url(#cyan)"/>
      <text x="61" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">原始模型</text>
      <rect x="148" y="0" width="122" height="60" rx="14" fill="url(#amber)"/>
      <text x="209" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">遗忘模型</text>
      <path d="M61 78 V108 M209 78 V108" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 96 L61 115 L80 96 M190 96 L209 115 L228 96" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="130" width="122" height="60" rx="14" fill="#6e9bd3"/>
      <text x="61" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f4fbff">类别 / 样本</text>
      <rect x="148" y="130" width="122" height="60" rx="14" fill="#be7cae"/>
      <text x="209" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff4fb">层级差异</text>
      <path d="M61 207 V238" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M42 226 L61 245 L80 226" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="260" width="270" height="60" rx="14" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
      <text x="135" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#effcff">成员推断 · 隐私检查</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">准确率 · 效率 · 隐私</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">把“忘掉了”拆成可观察的差异</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">从总体指标一路定位到类别、实例和层</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">可视化是分析入口，不是删除或合规证明</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">UNLEARNING COMPARATOR · VISUAL EVALUATION</text>
</svg>
