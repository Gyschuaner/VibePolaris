<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SSFO RAG faithfulness</title>
  <desc id="desc">Two answers, with and without context, become a preference signal for faithful generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17273a"/><stop offset="1" stop-color="#28524e"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#80d9ca"/><stop offset="1" stop-color="#8ea8ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#040710" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101a2b" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a4bccf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">SSFO · RAG FAITHFULNESS · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Listen to the context</text>
  <text x="124" y="255" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">Compare what the model says with and without evidence.</text>
  <rect x="124" y="343" width="300" height="112" rx="20" fill="#24434a" stroke="#80d9ca" stroke-width="2"/><text x="158" y="385" fill="#80d9ca" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">WITH CONTEXT</text><text x="158" y="426" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">aligned answer</text>
  <rect x="480" y="343" width="300" height="112" rx="20" fill="#39324b" stroke="#8ea8ff" stroke-width="2"/><text x="514" y="385" fill="#8ea8ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">WITHOUT</text><text x="514" y="426" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">parametric answer</text>
  <path d="M804 399h92" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/><path d="M874 376l28 23-28 23" fill="none" stroke="#d6e3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="934" y="343" width="132" height="112" rx="20" fill="#2f4147" stroke="#f3bd7e" stroke-width="2"/><text x="1000" y="385" fill="#f3bd7e" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" letter-spacing="2">DPO</text><text x="1000" y="426" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">prefer</text>
  <text x="124" y="520" fill="#a4bccf" font-family="Arial, sans-serif" font-size="18">Faithful to context is useful only when the context is worth trusting.</text>
