<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Jaipur Robotics industrial waste AI</title><desc>Waste moves past a vision camera into a hazard alert and a human-confirmed crane suggestion, illustrating the company’s industrial AI workflow.</desc><style>.belt{animation:belt 4s linear infinite}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes belt{to{stroke-dashoffset:-100}}@keyframes blink{50%{opacity:.55}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#1d202a"/><text x="75" y="78" fill="#f2cb72" font-size="24">JAIPUR ROBOTICS · WASTE-TO-ENERGY AI · 2026-09-07</text><rect x="70" y="250" width="350" height="110" rx="24" fill="#4f3c2d" stroke="#f2cb72" stroke-width="4"/><text x="245" y="300" fill="#fff5dd" font-size="28" text-anchor="middle">混杂废物</text><text x="245" y="334" fill="#f7dfaa" font-size="17" text-anchor="middle">camera feed · 50M+ labelled images</text><path d="M420 305H535" stroke="#f2cb72" stroke-width="10" stroke-dasharray="22 15" class="belt"/><rect x="535" y="180" width="240" height="250" rx="25" fill="#263f57" stroke="#8fe7ff" stroke-width="4"/><circle cx="655" cy="260" r="45" fill="#8fe7ff" fill-opacity=".25" class="blink"/><circle cx="655" cy="260" r="18" fill="#8fe7ff"/><text x="655" y="350" fill="#eafaff" font-size="24" text-anchor="middle">视觉检测</text><path d="M775 305H885" stroke="#9cf0c7" stroke-width="10" stroke-dasharray="22 15" class="belt"/><rect x="885" y="180" width="245" height="105" rx="22" fill="#5b3d55" stroke="#ffb7a8" stroke-width="4"/><text x="1007" y="226" fill="#fff3ef" font-size="24" text-anchor="middle">危险物告警</text><text x="1007" y="260" fill="#ffd8cf" font-size="16" text-anchor="middle">human checks</text><rect x="885" y="325" width="245" height="105" rx="22" fill="#264e4b" stroke="#9cf0c7" stroke-width="4"/><text x="1007" y="371" fill="#effff7" font-size="23" text-anchor="middle">起重机建议</text><text x="1007" y="404" fill="#c7f5df" font-size="16" text-anchor="middle">fallback remains</text><text x="75" y="520" fill="#c6cad7" font-size="21">€4.3M seed · 公司披露的指标需要独立复核</text><text x="75" y="560" fill="#f2cb72" font-size="17">检测 → 建议 → 人工确认 → 可回退流程</text></svg>
