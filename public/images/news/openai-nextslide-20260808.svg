<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NextSlide 团队加入 OpenAI 的演示文稿工作流</title>
  <desc id="desc">提示词、笔记、文档和研究资料汇入生成流程，再形成可编辑演示文稿并进入 ChatGPT 团队。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15133b"/><stop offset="1" stop-color="#4a2a75"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4d9"/><stop offset="1" stop-color="#ffc8a7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#07061a" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="170" fill="#f5b2d4" opacity=".14"/>
  <circle cx="160" cy="100" r="120" fill="#7ce4d2" opacity=".12"/>
  <g fill="#e5dcff" font-family="Arial, sans-serif" font-size="28">
    <rect x="86" y="160" width="200" height="78" rx="16" fill="#6b5bb5"/><text x="128" y="209">提示词</text>
    <rect x="86" y="270" width="200" height="78" rx="16" fill="#6b5bb5"/><text x="128" y="319">文档 / 研究</text>
    <rect x="86" y="380" width="200" height="78" rx="16" fill="#6b5bb5"/><text x="128" y="429">笔记</text>
  </g>
  <path d="M300 199h100M300 309h100M300 419h100" stroke="#7ce4d2" stroke-width="6" stroke-linecap="round"/>
  <polygon points="390,184 420,199 390,214" fill="#7ce4d2"/>
  <polygon points="390,294 420,309 390,324" fill="#7ce4d2"/>
  <polygon points="390,404 420,419 390,434" fill="#7ce4d2"/>
  <rect x="430" y="145" width="290" height="330" rx="28" fill="#211d52" stroke="#9d8cf7" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="575" cy="230" r="48" fill="#7ce4d2"/>
  <text x="545" y="240" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#162247">整合</text>
  <text x="475" y="330" font-family="Arial, sans-serif" font-size="24" fill="#e9e4ff">上下文 · 版式</text>
  <text x="482" y="372" font-family="Arial, sans-serif" font-size="24" fill="#e9e4ff">编辑 · 来源</text>
  <path d="M735 310h80" stroke="#ffcf70" stroke-width="6" stroke-linecap="round"/>
  <polygon points="800,295 830,310 800,325" fill="#ffcf70"/>
  <rect x="850" y="150" width="250" height="325" rx="18" fill="url(#card)" filter="url(#shadow)"/>
  <rect x="890" y="200" width="170" height="16" rx="8" fill="#8c5a81" opacity=".75"/>
  <rect x="890" y="245" width="140" height="12" rx="6" fill="#9b7896" opacity=".7"/>
  <rect x="890" y="285" width="155" height="12" rx="6" fill="#9b7896" opacity=".7"/>
  <rect x="890" y="350" width="78" height="48" rx="8" fill="#8fd4c4"/>
  <rect x="985" y="350" width="78" height="48" rx="8" fill="#b7a4ef"/>
  <text x="892" y="440" font-family="Arial, sans-serif" font-size="20" fill="#493654">可编辑演示文稿</text>
  <text x="90" y="560" font-family="Arial, sans-serif" font-size="28" fill="#e8dcff">8 Aug 2026 · NextSlide 团队加入 OpenAI</text>
</svg>
