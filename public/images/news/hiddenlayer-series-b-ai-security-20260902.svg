<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">HiddenLayer AI 代理运行时安全</title><desc id="d">代理从提示到工具调用再到代码提交的动作链被持续检查。</desc><rect width="1200" height="680" rx="36" fill="#171727"/><text x="70" y="88" font-family="Arial,sans-serif" fill="#f5f3ff" font-size="34" font-weight="700">AI security moves to runtime</text><text x="70" y="128" font-family="Arial,sans-serif" fill="#bbb7d5" font-size="20">1 亿美元 B 轮 · Delta-v Capital 领投</text><g font-family="Arial,sans-serif" fill="#171727" font-size="21" text-anchor="middle"><rect x="80" y="238" width="200" height="110" rx="18" fill="#f6c85f"/><text x="180" y="282">提示 / 数据</text><text x="180" y="315">prompt injection</text><rect x="340" y="238" width="200" height="110" rx="18" fill="#83d0c7"/><text x="440" y="282">模型 / 代理</text><text x="440" y="315">identity + policy</text><rect x="600" y="238" width="200" height="110" rx="18" fill="#9fb7ff"/><text x="700" y="282">工具调用</text><text x="700" y="315">tool misuse</text><rect x="860" y="238" width="260" height="110" rx="18" fill="#f28f8f"/><text x="990" y="282">代码 / 生产变更</text><text x="990" y="315">approve or block</text></g><g stroke="#f5f3ff" stroke-width="7" fill="none"><path d="M280 293h56M540 293h56M800 293h56"/></g><g font-family="Arial,sans-serif" fill="#dedcf0"><text x="105" y="475" font-size="24">运行时安全关心四件事</text><text x="105" y="520" font-size="20">谁在行动 · 想做什么 · 调用了什么 · 出错能否回滚</text><text x="105" y="575" font-size="18" fill="#aaa6c2">公司尚未公开独立拦截率或审计财务</text></g></svg>