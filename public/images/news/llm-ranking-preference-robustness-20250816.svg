<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LLM ranking robustness check</title>
  <desc id="desc">Pairwise preferences feed a ranking, a tiny highlighted subset is removed, and the top rank can flip while a robustness report remains visible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d35"/><stop offset="1" stop-color="#433257"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff5e8"/><stop offset="1" stop-color="#66b9e7"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd78d"/><stop offset="1" stop-color="#ee9966"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d1a" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="210" fill="#ffcf7a" opacity=".1"/>
  <circle cx="1030" cy="560" r="230" fill="#7ce6db" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="64" width="660" height="136" rx="24" fill="#21334f" stroke="#8acfe5" stroke-width="2"/>
    <text x="106" y="119" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a7eee7">ARXIV · 16 AUG 2025</text>
    <text x="106" y="172" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4fbff">LLM RANKING ROBUSTNESS</text>
  </g>
  <text x="78" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">删掉极少数偏好，榜首可能换人</text>
  <g transform="translate(770 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="342" height="390" rx="28" fill="#17243c" stroke="#6fbfd6" stroke-width="3"/>
    <text x="171" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeef6">PAIRWISE PREFERENCES</text>
    <g transform="translate(28 62)">
      <rect x="0" y="0" width="286" height="48" rx="13" fill="#304966"/>
      <circle cx="25" cy="24" r="9" fill="#9feee5"/><text x="52" y="31" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf8ff">A  beats  B</text>
      <rect x="0" y="60" width="286" height="48" rx="13" fill="#304966"/>
      <circle cx="25" cy="84" r="9" fill="#9feee5"/><text x="52" y="91" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ecf8ff">A  beats  C</text>
      <rect x="0" y="120" width="286" height="48" rx="13" fill="#533d4a" stroke="#ffd18a" stroke-width="2"/>
      <circle cx="25" cy="144" r="9" fill="#ffd18a"/><text x="52" y="151" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff1d3">关键偏好 · 0.003%</text>
    </g>
    <path d="M171 244 V276" stroke="#ffd18a" stroke-width="5" stroke-linecap="round"/>
    <path d="M152 263 L171 282 L190 263" fill="none" stroke="#ffd18a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="294" width="286" height="66" rx="15" fill="url(#orange)"/>
    <text x="171" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3b2932">RANK FLIP CHECK</text>
    <text x="171" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#563b38">A → B · 检查影响样本</text>
  </g>
  <g transform="translate(76 356)">
    <rect width="642" height="140" rx="20" fill="#202f4b" stroke="#536e8b" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">0.003% 不是“榜单作废”</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eef9">它提示榜首差距需要敏感度报告</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1e1">Chatbot Arena · MT-bench · 人类 / LLM judge</text>
  </g>
  <text x="78" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">DROPPING PREFERENCES CAN CHANGE TOP LLM RANKINGS</text>
</svg>
