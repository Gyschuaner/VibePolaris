<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Model trust equivalence</title>
  <desc id="desc">Two same-family models may match on performance while diverging in feature attribution and confidence calibration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14263d"/><stop offset="1" stop-color="#452d49"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2f4e9"/><stop offset="1" stop-color="#68b7e4"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="706" height="136" rx="24" fill="#20364e" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 19 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" fill="#f4fbff">TRUST-EQUIVALENCE</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">分数接近，决策依据和置信度未必接近</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">MODEL SWAP CHECK</text>
    <g transform="translate(28 66)">
      <rect x="0" y="0" width="126" height="60" rx="14" fill="url(#cyan)"/>
      <text x="63" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">大模型</text>
      <rect x="152" y="0" width="126" height="60" rx="14" fill="url(#amber)"/>
      <text x="215" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">小模型</text>
      <path d="M63 78 V108 M215 78 V108" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 96 L63 115 L82 96 M196 96 L215 115 L234 96" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="130" width="126" height="60" rx="14" fill="#6e9bd3"/>
      <text x="63" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#f4fbff">表现相近</text>
      <rect x="152" y="130" width="126" height="60" rx="14" fill="#be7cae"/>
      <text x="215" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff4fb">需再验证</text>
      <path d="M139 207 V239" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M120 226 L139 245 L158 226" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="260" width="278" height="60" rx="14" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
      <text x="139" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#effcff">归因对齐 · 校准相似性</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">性能 ≠ 信任等价</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">替换前，重新测阈值和边界样本</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">模型可能走不同特征路径，也可能同样自信地犯不同错误</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">论文给检查维度，不给通用信任分数</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">MODELS IN THE SAME FAMILY · TRUST-EQUIVALENCE</text>
</svg>
