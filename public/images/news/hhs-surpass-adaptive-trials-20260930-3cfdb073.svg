<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">SURPASS 自适应临床试验机制示意</title>
  <desc id="desc">ARPA-H 的 SURPASS 设想把预测模型、实时分析和自动化运营放进持续学习的临床试验流程；这是 HHS 新闻的通用机制解释，不代表项目已经证明效果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#17243f"/><stop offset="1" stop-color="#154f4c"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">临床试验也可以边做边学</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2026-09-30 · HHS / ARPA-H SURPASS 新闻的通用流程解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#fda4af" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">预测设计</text>
    <text x="237" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">模拟方案与可能结果</text>
    <text x="237" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">不是替代真实试验</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">实时分析</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">数据累积后持续检查</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">需要保持证据严谨</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">调整下一步</text>
    <text x="963" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">按预先规定的规则，可能调整分组</text>
    <text x="963" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">仍要监管与现场核验</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M963 322 C963 370 237 370 237 322" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="9 10" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">持续学习不等于自动通过：每次调整都要有证据和边界</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">SURPASS 是项目方向与团队方案征集，不是已验证的临床效果</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">HHS / Axios：方案、实时分析和自动化运营层可追溯；效果仍需项目验证与监管审查。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">来源：HHS / Axios</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2026-09-30</text><text x="944" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">边界：仍需验证</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释自适应临床试验新闻中的模型、数据与规则边界。</text>
</svg>
