<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">能力增长与安全门槛</title><desc id="desc">能力曲线向上，监控信心在中间形成门槛，只有跨过门槛才继续扩展。</desc><rect width="1200" height="700" rx="36" fill="#121526"/><g font-family="Arial, sans-serif"><text x="64" y="94" fill="#f1edff" font-size="38" font-weight="700">Capability needs a safety bar</text><text x="64" y="134" fill="#b5b9d8" font-size="22">OpenAI chief scientist: no lab has solved alignment and monitoring enough</text><path d="M120 555 C300 520 350 390 500 360 S730 215 1010 135" fill="none" stroke="#ff8f70" stroke-width="14"/><text x="890" y="138" fill="#ffb7a5" font-size="24">能力增长</text><path d="M120 530 C310 495 420 480 570 450 S760 440 1010 430" fill="none" stroke="#76d6c2" stroke-width="11"/><text x="845" y="472" fill="#9ce8d8" font-size="24">监控信心</text><line x1="120" y1="410" x2="1030" y2="410" stroke="#f6c453" stroke-width="7" stroke-dasharray="18 14"/><text x="690" y="390" fill="#f6c453" font-size="24" font-weight="700">共享安全门槛</text><circle cx="645" cy="410" r="18" fill="#f6c453"/><path d="M645 410v-95" stroke="#f6c453" stroke-width="5"/><text x="565" y="285" fill="#e8e6ff" font-size="22">未达到：放慢或暂停</text><text x="580" y="620" fill="#9ea6c9" font-size="22">对齐 · 监控 · 外部审计 · 人类控制</text></g></svg>
