<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MedThreatRAG</title>
  <desc id="desc">A medical image and report must agree before entering a retrieval system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17263a"/><stop offset="1" stop-color="#4a3046"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ddcca"/><stop offset="1" stop-color="#ffbd79"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#04070e" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101a2b" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a6bbcf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">MEDTHREATRAG · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Image ≠ report?</text>
  <text x="124" y="255" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">Cross-modal consistency is a safety check.</text>
  <rect x="124" y="348" width="282" height="108" rx="20" fill="#243f4a" stroke="#7ddcca" stroke-width="2"/><text x="158" y="389" fill="#7ddcca" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">IMAGE</text><text x="158" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">scan evidence</text>
  <rect x="462" y="348" width="282" height="108" rx="20" fill="#3e3046" stroke="#ffbd79" stroke-width="2"/><text x="496" y="389" fill="#ffbd79" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">REPORT</text><text x="496" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">text evidence</text>
  <path d="M784 402h72" stroke="url(#scan)" stroke-width="6" stroke-linecap="round"/><path d="M840 379l30 23-30 23" fill="none" stroke="#d7e3ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="910" y="348" width="156" height="108" rx="20" fill="#2c3650" stroke="#9db0ff" stroke-width="2"/><text x="988" y="391" fill="#9db0ff" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" letter-spacing="2">CHECK</text><text x="988" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" text-anchor="middle">agree?</text>
  <text x="124" y="520" fill="#a6bbcf" font-family="Arial, sans-serif" font-size="18">A plausible pair is not necessarily a consistent pair.</text>
</svg>
