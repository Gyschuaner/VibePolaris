<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GPT-OSS-20B deployment study</title>
  <desc id="desc">MoE active parameters connect to throughput, memory and energy measurements on one H100.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c2e"/><stop offset="1" stop-color="#293a57"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#74f0df"/><stop offset="1" stop-color="#7ca8ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#050812" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="78" y="74" width="1044" height="482" rx="36" fill="#0d1525" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="130" y="146" fill="#9fb7d9" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">DEPLOYMENT STUDY · H100 · BF16</text>
  <text x="130" y="222" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">GPT-OSS-20B</text>
  <text x="130" y="267" fill="#c8d7ea" font-family="Arial, sans-serif" font-size="26">MoE: 20.9B total · 3.61B active</text>
  <rect x="130" y="328" width="310" height="142" rx="20" fill="#172943" stroke="#74f0df" stroke-width="2"/>
  <text x="164" y="370" fill="#74f0df" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">DECODE</text>
  <text x="164" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">+31.8%</text>
  <text x="164" y="457" fill="#a9bdd5" font-family="Arial, sans-serif" font-size="17">throughput vs Qwen3-32B</text>
  <rect x="470" y="328" width="270" height="142" rx="20" fill="#1b2940" stroke="#7ca8ff" stroke-width="2"/>
  <text x="504" y="370" fill="#7ca8ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">ENERGY</text>
  <text x="504" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">−25.8%</text>
  <text x="504" y="457" fill="#a9bdd5" font-family="Arial, sans-serif" font-size="17">per 1k generated tokens</text>
  <rect x="770" y="328" width="300" height="142" rx="20" fill="#25253b" stroke="#f5c58c" stroke-width="2"/>
  <text x="804" y="370" fill="#f5c58c" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">BOUNDARY</text>
  <text x="804" y="425" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">No accuracy test</text>
  <text x="804" y="457" fill="#c5c3d7" font-family="Arial, sans-serif" font-size="17">deployment metrics only</text>
  <text x="130" y="520" fill="#8fa6c4" font-family="Arial, sans-serif" font-size="18">The benchmark answers “how it runs”, not “what it knows”.</text>
</svg>
