<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">OpenAI 与 Meta 的 AI 人才战</title><desc id="desc">从媒体报道、内部备忘录到薪酬方案待确认的事实链。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#10162e"/><stop offset="1" stop-color="#263b72"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#70e1f5"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="240" cy="220" r="120" fill="#70e1f5" opacity=".14"/><circle cx="1370" cy="680" r="180" fill="#ffd166" opacity=".12"/><path d="M280 470 C540 280 720 620 980 420 S1270 300 1370 470" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><g fill="#fff" font-family="Arial,Helvetica,sans-serif"><text x="150" y="170" font-size="54" font-weight="700">AI 人才战</text><text x="150" y="235" font-size="30" opacity=".78">从报道到内部备忘录，先拆事实再看结果</text><g font-size="34" font-weight="700"><text x="170" y="520">Meta 招募</text><text x="650" y="520">OpenAI 备忘录</text><text x="1130" y="520">方案待确认</text></g><g font-size="24" opacity=".78"><text x="170" y="570">人员流动</text><text x="650" y="570">重新校准薪酬</text><text x="1130" y="570">没有统一金额</text></g></g><g fill="#70e1f5"><circle cx="280" cy="470" r="18"/><circle cx="720" cy="470" r="18"/></g><g fill="#ffd166"><circle cx="1030" cy="420" r="18"/><circle cx="1370" cy="470" r="18"/></g></svg>