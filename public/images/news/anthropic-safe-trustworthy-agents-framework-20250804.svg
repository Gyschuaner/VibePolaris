<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">安全可信 Agent 框架</title>
  <desc id="desc">Agent 先展示计划，按权限调用工具，在高风险动作前请求人类批准。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#251c37"/>
      <stop offset="1" stop-color="#75526b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8edd5"/>
      <stop offset="1" stop-color="#e1d8c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#171126" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="170" fill="#e9bd76" opacity=".14"/>
  <circle cx="120" cy="520" r="220" fill="#a1c3ac" opacity=".15"/>
  <g filter="url(#shadow)">
    <rect x="95" y="120" width="280" height="350" rx="28" fill="url(#card)"/>
    <rect x="460" y="120" width="280" height="350" rx="28" fill="#f8edd5"/>
    <rect x="825" y="120" width="280" height="350" rx="28" fill="#e9bd76"/>
  </g>
  <g fill="#251c37" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="140" y="178" font-size="25" font-weight="800">计划可见</text>
    <rect x="140" y="230" width="190" height="16" rx="8" fill="#77526b"/>
    <rect x="140" y="270" width="150" height="16" rx="8" fill="#a1c3ac"/>
    <rect x="140" y="310" width="180" height="16" rx="8" fill="#77526b" opacity=".55"/>
    <text x="140" y="394" font-size="17">实时待办清单</text>

    <text x="505" y="178" font-size="25" font-weight="800">权限边界</text>
    <circle cx="600" cy="285" r="62" fill="#e1d8c4" stroke="#77526b" stroke-width="7"/>
    <path d="M600 242 v85 M557 285 h86" stroke="#77526b" stroke-width="9" stroke-linecap="round"/>
    <text x="505" y="394" font-size="17">只读 → 工具 → 审批</text>

    <text x="870" y="178" font-size="25" font-weight="800">人类接管</text>
    <path d="M895 295 h125" stroke="#251c37" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1018" cy="295" r="20" fill="#251c37"/>
    <text x="870" y="382" font-size="17">高风险动作前</text>
    <text x="870" y="414" font-size="17">请你确认</text>
  </g>
  <g fill="#f8edd5" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="95" y="565" font-size="22" letter-spacing="1">Anthropic · 2025.08.04</text>
    <text x="1105" y="565" font-size="16" text-anchor="end" opacity=".82">原则 → 控制 → 审计</text>
  </g>
</svg>
