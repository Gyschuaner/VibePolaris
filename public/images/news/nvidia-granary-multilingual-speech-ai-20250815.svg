<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Granary multilingual speech AI</title>
  <desc id="desc">An open multilingual speech dataset feeds accuracy and throughput oriented transcription models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101f27"/><stop offset="1" stop-color="#183f3d"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b7f65e"/><stop offset="1" stop-color="#48d6a0"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75e6ff"/><stop offset="1" stop-color="#6793ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#04100f" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="94" r="210" fill="#b7f65e" opacity=".12"/>
  <circle cx="1010" cy="560" r="245" fill="#75e6ff" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="650" height="136" rx="24" fill="#172f35" stroke="#b7f65e" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#d8ff9d">NVIDIA SPEECH AI</text>
    <text x="108" y="180" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#f2fff7">GRANARY · 1M HOURS</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d9f5ef">25 种欧洲语言 · 转写与翻译</text>
  <g transform="translate(750 84)" filter="url(#shadow)">
    <rect x="0" y="26" width="164" height="120" rx="18" fill="#286d68" stroke="#b7f65e" stroke-width="3"/>
    <rect x="196" y="26" width="164" height="120" rx="18" fill="#315685" stroke="#75e6ff" stroke-width="3"/>
    <text x="82" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4ffe9">CANARY</text>
    <text x="82" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d7ffd5">准确性</text>
    <text x="278" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#eef6ff">PARAKEET</text>
    <text x="278" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d8eaff">吞吐</text>
    <path d="M164 86 H196" stroke="#f4d575" stroke-width="5" stroke-linecap="round"/>
    <path d="M82 146 V216 M278 146 V216" stroke="#f4d575" stroke-width="5" stroke-linecap="round"/>
    <path d="M42 242 Q54 218 66 242 T90 242 T114 242 T138 242" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round"/>
    <path d="M238 242 Q250 218 262 242 T286 242 T310 242 T334 242" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
    <text x="82" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d8f7ef">TRANSCRIBE</text>
    <text x="278" y="294" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#dbeeff">TRANSLATE</text>
  </g>
  <g transform="translate(80 356)">
    <rect width="610" height="136" rx="20" fill="#173239" stroke="#3d7775" stroke-width="2"/>
    <text x="30" y="47" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#d8ff9d">Granary：约 650k ASR · 350k AST</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e6fbf4">公开数据处理管线 · Hugging Face 可用</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b9d9d4">速度与 leaderboard 数字来自 NVIDIA 测试</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bad9d5">NVIDIA · 15 AUG 2025</text>
</svg>
