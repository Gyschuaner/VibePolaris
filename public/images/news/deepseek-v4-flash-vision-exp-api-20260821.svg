<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">DeepSeek 视觉模型 API 链路</title><desc id="desc">从图片与文字输入到实验性视觉模型、代理工具和基准边界。</desc><metadata><source>https://api-docs.deepseek.com/updates/</source><source>https://api-docs.deepseek.com/news/news260821/</source><source>https://api-docs.deepseek.com/guides/vision/</source></metadata><rect width="1200" height="620" rx="36" fill="#101827"/><text x="70" y="72" fill="#f8fafc" font-size="32" font-family="Arial, sans-serif" font-weight="700">V4-Flash-Vision-Exp：看见之后，还要能行动</text><text x="70" y="110" fill="#a6b5c8" font-size="18" font-family="Arial, sans-serif">8 月 21 日 API 上线；厂商基准与独立复测保持分层</text><g font-family="Arial, sans-serif"><rect x="70" y="190" width="210" height="160" rx="22" fill="#2c5d82"/><text x="175" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">文字 + 图片</text><text x="175" y="270" text-anchor="middle" fill="#dcedff" font-size="16">Base64 / URL</text><text x="175" y="300" text-anchor="middle" fill="#dcedff" font-size="16">Files API</text><path d="M292 270 H370" stroke="#8aa6c4" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="190" width="210" height="160" rx="22" fill="#66538a"/><text x="495" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">实验模型</text><text x="495" y="270" text-anchor="middle" fill="#f1e7ff" font-size="16">视觉理解</text><text x="495" y="300" text-anchor="middle" fill="#f1e7ff" font-size="16">文字能力≈V4-Flash</text><path d="M612 270 H690" stroke="#8aa6c4" stroke-width="4" marker-end="url(#arrow)"/><rect x="710" y="190" width="210" height="160" rx="22" fill="#1d765c"/><text x="815" y="230" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">代理继续工作</text><text x="815" y="270" text-anchor="middle" fill="#d9f6e8" font-size="16">调用工具</text><text x="815" y="300" text-anchor="middle" fill="#d9f6e8" font-size="16">重试 · 权限 · 上下文</text><path d="M932 270 H1010" stroke="#8aa6c4" stroke-width="4" marker-end="url(#arrow)"/><rect x="1030" y="190" width="105" height="160" rx="22" fill="#a44f36"/><text x="1082" y="230" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">评测</text><text x="1082" y="270" text-anchor="middle" fill="#ffe6da" font-size="15">厂商基准</text><text x="1082" y="300" text-anchor="middle" fill="#ffe6da" font-size="15">≠复测</text><rect x="120" y="446" width="960" height="86" rx="20" fill="#2a3140" stroke="#e4a06c" stroke-width="2"/><text x="600" y="484" text-anchor="middle" fill="#ffd7bd" font-size="22" font-weight="700">边界：能看图 ≠ 代理已完成任务</text><text x="600" y="514" text-anchor="middle" fill="#c9d3df" font-size="16">图片 token、上下文、工具权限与失败重试仍由应用负责</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa6c4"/></marker></defs></svg>