<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Gemini Omni 与 Google Vids</title><desc id="d">文字和图片生成视频，继续对话修改，个人头像出镜并保留 SynthID 水印。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#17233d}.sub{fill:#50627e;font-size:24px}.card{fill:#fff;stroke:#c9d6ea;stroke-width:3}.dash{stroke:#6b7cff;stroke-width:7;stroke-dasharray:18 15;animation:dash 3s linear infinite}@keyframes dash{to{stroke-dashoffset:-66}}</style><rect width="1200" height="680" rx="34" fill="#f3f7ff"/><text x="72" y="90" font-size="42" font-weight="700">Google Vids × Gemini Omni</text><text x="72" y="130" class="sub">生成、连续修改、个人头像和可追溯水印在一条时间线上</text><g transform="translate(76 218)"><rect class="card" width="250" height="220" rx="26"/><text x="28" y="62" font-size="30">文字 + 参考图</text><text x="28" y="112" class="sub">“把背景换成…”</text><text x="28" y="154" class="sub">“加一段口播”</text></g><path class="dash" d="M326 328H440"/><g transform="translate(440 218)"><rect class="card" width="280" height="220" rx="26"/><text x="28" y="62" font-size="30">Gemini Omni</text><text x="28" y="112" class="sub">生成片段</text><text x="28" y="154" class="sub">按对话继续编辑</text></g><path class="dash" d="M720 328H834"/><g transform="translate(834 198)"><rect class="card" width="290" height="260" rx="26"/><text x="28" y="62" font-size="30">个人头像</text><text x="28" y="110" class="sub">自拍 + 短语音</text><text x="28" y="154" class="sub">账号绑定 likeness</text><text x="28" y="198" class="sub">SynthID 水印</text></g><text x="82" y="568" class="sub">可用性仍受地区、年龄、语言与 Workspace 管理员设置约束。</text></svg>
