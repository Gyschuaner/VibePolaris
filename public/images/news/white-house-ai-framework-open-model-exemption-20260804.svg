<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">白宫自愿 AI 评测框架边界</title><desc id="desc">6 月行政命令指向 8 月 4 日白宫与企业说明的自愿评测框架，覆盖范围偏向闭源前沿模型，开放权重暂不纳入。</desc><rect width="960" height="540" rx="28" fill="#111827"/><rect x="70" y="135" width="220" height="170" rx="20" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="180" y="195" text-anchor="middle" fill="#dbeafe" font-size="23" font-family="sans-serif">6 月行政命令</text><text x="180" y="237" text-anchor="middle" fill="#bfdbfe" font-size="18" font-family="sans-serif">自愿框架</text><text x="180" y="270" text-anchor="middle" fill="#bfdbfe" font-size="18" font-family="sans-serif">网络安全评测</text><path d="M290 220H380" stroke="#93c5fd" stroke-width="4" marker-end="url(#a)"/><rect x="380" y="135" width="200" height="170" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="480" y="195" text-anchor="middle" fill="#cffafe" font-size="23" font-family="sans-serif">8 月 4 日</text><text x="480" y="237" text-anchor="middle" fill="#a5f3fc" font-size="18" font-family="sans-serif">白宫说明</text><text x="480" y="270" text-anchor="middle" fill="#a5f3fc" font-size="18" font-family="sans-serif">框架未公开</text><path d="M580 220H670" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="670" y="95" width="220" height="105" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="780" y="140" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">闭源前沿模型</text><text x="780" y="172" text-anchor="middle" fill="#fde68a" font-size="16" font-family="sans-serif">重点评测对象</text><rect x="670" y="235" width="220" height="105" rx="18" fill="#334155" stroke="#cbd5e1" stroke-width="3"/><text x="780" y="280" text-anchor="middle" fill="#f8fafc" font-size="21" font-family="sans-serif">开放权重模型</text><text x="780" y="312" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="sans-serif">暂不纳入同样测试</text><text x="480" y="450" text-anchor="middle" fill="#94a3b8" font-size="19" font-family="sans-serif">自愿合作 ≠ 强制许可</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#93c5fd"/></marker></defs></svg>
