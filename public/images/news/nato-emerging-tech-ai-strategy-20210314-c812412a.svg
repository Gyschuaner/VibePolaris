<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">NATO 新兴与颠覆性技术政策时间线</title>
  <desc id="desc">时间线展示 2019 路线图、2021 年 2 月实施框架获认可、3 月新闻报道 AI 与数据优先、10 月正式 AI 战略；强调 3 月仍是协调路线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171b3a"/><stop offset="1" stop-color="#164b55"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">AI 先进入协调路线，再进入正式战略</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-14 · Defense News 报道 NATO 的新兴与颠覆性技术框架</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="188" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="366" width="1060" height="198" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <path d="M150 240H1040" stroke="url(#line)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="185" cy="240" r="34" fill="#4b3b63" stroke="#f0abfc" stroke-width="4"/>
    <circle cx="470" cy="240" r="34" fill="#315b64" stroke="#67e8f9" stroke-width="4"/>
    <circle cx="755" cy="240" r="34" fill="#4b3b63" stroke="#c4b5fd" stroke-width="4"/>
    <circle cx="1015" cy="240" r="34" fill="#66502a" stroke="#fcd34d" stroke-width="4"/>
    <text x="185" y="182" fill="#f4eaff" font-size="19" font-weight="700" text-anchor="middle">2019</text>
    <text x="470" y="182" fill="#e2fffb" font-size="19" font-weight="700" text-anchor="middle">2021-02</text>
    <text x="755" y="182" fill="#f4eaff" font-size="19" font-weight="700" text-anchor="middle">2021-03-14</text>
    <text x="1015" y="182" fill="#fff6cf" font-size="19" font-weight="700" text-anchor="middle">2021-10</text>
    <text x="185" y="296" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">EDT 路线图</text>
    <text x="470" y="296" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">实施框架获认可</text>
    <text x="755" y="296" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">AI / 数据优先</text>
    <text x="1015" y="296" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">正式 AI 战略</text>
    <text x="106" y="416" fill="#f8fafc" font-size="23" font-weight="700">3 月新闻的边界</text>
    <text x="106" y="447" fill="#a7f3d0" font-size="16">当时公开的是联盟协调路线；完整战略、预算和交付能力仍在后续。</text>
    <rect x="106" y="473" width="300" height="60" rx="16" fill="#3d4d6a" stroke="#fda4af" stroke-width="2"/>
    <rect x="450" y="473" width="300" height="60" rx="16" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="794" y="473" width="300" height="60" rx="16" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="256" y="500" fill="#fff1f2" font-size="16" font-weight="700" text-anchor="middle">互操作性</text>
    <text x="256" y="522" fill="#ffe1e5" font-size="14" text-anchor="middle">共同标准与系统协作</text>
    <text x="600" y="500" fill="#e2fffb" font-size="16" font-weight="700" text-anchor="middle">负责任使用</text>
    <text x="600" y="522" fill="#d6fff7" font-size="14" text-anchor="middle">原则与信任</text>
    <text x="944" y="500" fill="#f4eaff" font-size="16" font-weight="700" text-anchor="middle">保护投资</text>
    <text x="944" y="522" fill="#ede2ff" font-size="14" text-anchor="middle">技术转移与出口控制</text>
  </g>
  <rect x="70" y="592" width="1060" height="30" rx="14" fill="#102a40"/>
  <text x="600" y="613" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，重画路线图 → 实施框架 → 领域战略的政策阶段差异。</text>
</svg>
