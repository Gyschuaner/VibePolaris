<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Grok 4 限时免费开放</title>
  <desc id="desc">Grok 4 从订阅入口进入全球限时试用，Auto 与 Expert 共用入口，Heavy 留在订阅层</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#182438" stroke="#334155" stroke-width="2"/>
  <text x="92" y="124" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Grok 4 · 限时全球试用</text>
  <text x="92" y="164" fill="#a8b3c7" font-size="18" font-family="sans-serif">访问层变化，不是模型首发</text>
  <rect x="94" y="264" width="250" height="188" rx="20" fill="#202b3c" stroke="#60a5fa" stroke-width="2"/>
  <text x="219" y="330" fill="#f8fafc" font-size="27" text-anchor="middle" font-family="sans-serif" font-weight="700">全球用户</text>
  <text x="219" y="374" fill="#bfdbfe" font-size="18" text-anchor="middle" font-family="sans-serif">免费入口</text>
  <text x="219" y="414" fill="#94a3b8" font-size="15" text-anchor="middle" font-family="sans-serif">限时 · 额度未公开</text>
  <path d="M 370 358 H 470" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 450 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="500" y="226" width="216" height="126" rx="18" fill="#253b55" stroke="#a7f3d0" stroke-width="2"/>
  <text x="608" y="284" fill="#d1fae5" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">Auto</text>
  <text x="608" y="320" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">按复杂度路由</text>
  <rect x="500" y="390" width="216" height="126" rx="18" fill="#3a2c4d" stroke="#c4b5fd" stroke-width="2"/>
  <text x="608" y="448" fill="#ede9fe" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">Expert</text>
  <text x="608" y="484" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">主动指定 Grok 4</text>
  <path d="M 742 358 H 842" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 822 342 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="870" y="264" width="244" height="188" rx="20" fill="#2d2534" stroke="#fbbf24" stroke-width="2"/>
  <text x="992" y="330" fill="#fef3c7" font-size="27" text-anchor="middle" font-family="sans-serif" font-weight="700">Heavy</text>
  <text x="992" y="374" fill="#fde68a" font-size="18" text-anchor="middle" font-family="sans-serif">订阅层</text>
  <text x="992" y="414" fill="#fcd34d" font-size="15" text-anchor="middle" font-family="sans-serif">更少限制 · 仍付费</text>
  <text x="600" y="604" fill="#d5def0" font-size="18" text-anchor="middle" font-family="sans-serif">“免费”改变试用门槛，不代表无限额度</text>
</svg>
