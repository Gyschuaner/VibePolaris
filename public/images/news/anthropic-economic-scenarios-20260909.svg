<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Anthropic Economic Scenarios explorer</title><desc>Three branching economic scenarios move from modest to substantial to extreme, with a survey sample feeding the model.</desc><style>.branch{animation:branch 3s ease-in-out infinite}.dot{animation:dot 2s ease-in-out infinite}@keyframes branch{50%{stroke-width:8}}@keyframes dot{50%{transform:translateY(-8px)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#f3f6ff"/><circle cx="150" cy="315" r="78" fill="#203b72"/><text x="150" y="305" fill="#fff" font-size="24" text-anchor="middle">10,980</text><text x="150" y="338" fill="#c9dcff" font-size="18" text-anchor="middle">受访者</text><path d="M230 315H380" stroke="#6c8fd4" stroke-width="8" stroke-dasharray="16 14" class="branch"/><path d="M380 315L560 170M380 315L560 315M380 315L560 460" fill="none" stroke="#6c8fd4" stroke-width="7" class="branch"/><g class="dot"><rect x="560" y="110" width="250" height="120" rx="20" fill="#a3d8c5"/><text x="685" y="164" fill="#183f3a" font-size="24" text-anchor="middle">modest</text><text x="685" y="198" fill="#28675c" font-size="18" text-anchor="middle">GDP +1.6%</text><rect x="560" y="255" width="250" height="120" rx="20" fill="#f0d37b"/><text x="685" y="309" fill="#4d3b13" font-size="24" text-anchor="middle">substantial</text><text x="685" y="343" fill="#755a18" font-size="18" text-anchor="middle">GDP +8.3%</text><rect x="560" y="400" width="250" height="120" rx="20" fill="#ea9b88"/><text x="685" y="454" fill="#5d211b" font-size="24" text-anchor="middle">extreme</text><text x="685" y="488" fill="#81382d" font-size="18" text-anchor="middle">GDP +32.4%</text></g><path d="M810 170H1010M810 315H1010M810 460H1010" stroke="#9aa8c9" stroke-width="5" stroke-dasharray="12 12"/><text x="100" y="88" fill="#203b72" font-size="24">ANTHROPIC INSTITUTE · SEPTEMBER 2026</text><text x="100" y="575" fill="#53698d" font-size="20">情景探索器是条件模型，不是对未来的单一路线预测</text></svg>