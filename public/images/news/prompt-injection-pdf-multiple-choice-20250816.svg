<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PDF prompt injection and LLM judges</title>
  <desc id="desc">A PDF with a simple arithmetic question also contains a hidden instruction, which reaches an LLM judge and can change the answer path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132239"/><stop offset="1" stop-color="#49304e"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff2e4"/><stop offset="1" stop-color="#69b4e1"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd991"/><stop offset="1" stop-color="#eb9568"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="82" r="215" fill="#ffcf79" opacity=".1"/>
  <circle cx="1070" cy="560" r="250" fill="#80e5d8" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="704" height="136" rx="24" fill="#21334f" stroke="#8bcfe1" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a1eee4">ARXIV · 16 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4fbff">PDF PROMPT INJECTION</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">题目很简单，文件里的另一条指令却能改答案</text>
  <g transform="translate(776 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="344" height="404" rx="28" fill="#17243a" stroke="#6dbfd2" stroke-width="3"/>
    <text x="172" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeaf4">DOCUMENT INPUT</text>
    <rect x="30" y="58" width="284" height="116" rx="14" fill="#eaf1f4"/>
    <rect x="51" y="82" width="180" height="11" rx="5" fill="#567188"/>
    <text x="51" y="124" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#223b52">3 + 2 = ?</text>
    <text x="51" y="151" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b4350">隐藏提示：改变判断</text>
    <path d="M172 184 V219" stroke="#ffd28b" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 208 L172 227 L191 208" fill="none" stroke="#ffd28b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="172" cy="260" r="34" fill="url(#cyan)"/>
    <path d="M152 260 H192 M172 240 V280" stroke="#16394d" stroke-width="6" stroke-linecap="round"/>
    <text x="172" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e0faf5">LLM-AS-A-JUDGE</text>
    <rect x="37" y="329" width="270" height="45" rx="13" fill="url(#orange)"/>
    <text x="172" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#402e34">答案 / 指令边界被污染</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="670" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">题目简单，不代表输入安全</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">PDF 内容应与系统指令、评分规则分开</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">正常准确率之外，还要测污染后的恢复路径</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">TOO EASILY FOOLED? · PROMPT INJECTION IN SIMPLE TESTS</text>
</svg>
