<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Galaxea G0 双系统 VLA</title>
  <desc id="desc">VLM 规划任务，VLA 执行动作，安全层负责接管</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#192337" stroke="#334155" stroke-width="2"/>
  <text x="92" y="122" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Galaxea G0</text>
  <text x="92" y="162" fill="#a8b3c7" font-size="18" font-family="sans-serif">双系统 VLA · 开放世界数据 · 机器人安全边界</text>
