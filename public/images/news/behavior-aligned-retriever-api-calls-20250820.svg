<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Behavior aligned retrieval for tool calls</title>
  <desc id="desc">A retriever selects examples by compatible tool use behavior before an LLM decides whether to call an API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17213a"/><stop offset="1" stop-color="#3c284e"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#91f4df"/><stop offset="1" stop-color="#7fb2ff"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#ff9fc6"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#060913" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="92" r="210" fill="#91f4df" opacity=".11"/>
  <circle cx="1028" cy="570" r="255" fill="#ff9fc6" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="690" height="140" rx="24" fill="#242b48" stroke="#91f4df" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#baffed">BAR · TOOL DECISION</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#faf8ff">RETRIEVE BY BEHAVIOR</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e9e5ff">相似问题，不一定需要相同的工具</text>
  <g transform="translate(818 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="394" rx="30" fill="#111a32" stroke="#c0caff" stroke-width="3"/>
    <rect x="30" y="34" width="188" height="56" rx="18" fill="#2d3e61"/>
    <text x="124" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#baffed">USER QUERY</text>
    <path d="M124 103v42" stroke="#7995ce" stroke-width="7" stroke-linecap="round"/>
    <rect x="30" y="150" width="82" height="70" rx="16" fill="url(#cyan)"/>
    <rect x="140" y="150" width="82" height="70" rx="16" fill="url(#peach)"/>
    <text x="71" y="191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c2747">CALL</text>
    <text x="181" y="191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3b2444">SKIP</text>
    <path d="M71 235v42M181 235v42" stroke="#7995ce" stroke-width="7" stroke-linecap="round"/>
    <rect x="54" y="300" width="140" height="45" rx="18" fill="#354d73" stroke="#91f4df" stroke-width="2"/>
    <text x="124" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eef4ff">LLM DECIDES</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="690" height="140" rx="20" fill="#242b48" stroke="#53698f" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#baffed">14 LLMS · 3 BENCHMARKS</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">BERT · CONTRIEVER · QWEN 表征骨干</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c5cae6">检索器变聪明，决策仍留给模型</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c4c9e5">ARXIV · FIRST SUBMITTED 20 AUG 2025</text>
</svg>
