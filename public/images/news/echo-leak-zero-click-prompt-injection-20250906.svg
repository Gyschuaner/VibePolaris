<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">EchoLeak：外部内容穿过 Copilot 信任边界</title>
<desc id="desc">外部邮件进入企业 Copilot，内容与指令混淆后穿过模型和工具权限；防御用来源标记、最小权限和沙箱回归阻断。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset="1" stop-color="#fff0ed"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5e7898"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#293c54" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#203c5d" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">EchoLeak：内容和指令混在一起，边界就会移动</text>
<text x="70" y="114" fill="#6b7f96" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">外部邮件 · Copilot 上下文 · 工具权限 · 防御回归</text>
<g filter="url(#shadow)">
 <rect x="66" y="176" width="230" height="318" rx="22" fill="#fff" stroke="#b9d2eb" stroke-width="2"/>
 <text x="104" y="226" fill="#356b9a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">外部内容</text>
 <rect x="104" y="263" width="154" height="52" rx="11" fill="#e5f0ff"/><text x="181" y="296" text-anchor="middle" fill="#356b9a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">邮件 / 文档</text>
 <rect x="104" y="334" width="154" height="52" rx="11" fill="#fde4e0"/><text x="181" y="367" text-anchor="middle" fill="#a34f48" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不可信数据</text>
 <text x="181" y="433" text-anchor="middle" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">无用户点击</text>
 </g>
 <path d="M312 335 H363" stroke="#5e7898" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="384" y="150" width="392" height="372" rx="22" fill="#fff" stroke="#e2afa8" stroke-width="2"/>
 <text x="425" y="204" fill="#a6534a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">Copilot 信任边界</text>
 <rect x="425" y="248" width="310" height="52" rx="11" fill="#fbe8e5"/><text x="580" y="281" text-anchor="middle" fill="#a6534a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">内容 ↔ 指令混淆</text>
 <path d="M445 340 H715" stroke="#d98575" stroke-width="4" stroke-dasharray="10 8"/>
 <circle cx="500" cy="340" r="13" fill="#e49b73"/><circle cx="608" cy="340" r="13" fill="#db6e76"/><circle cx="684" cy="340" r="13" fill="#e49b73"/>
 <text x="425" y="395" fill="#7f6b88" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">模型上下文 · 连接器 · 网络策略</text>
 <text x="425" y="439" fill="#7f6b88" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">每一层都需要独立验证</text>
 </g>
 <path d="M797 335 H848" stroke="#5e7898" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="176" width="264" height="318" rx="22" fill="#fff" stroke="#a9d8cd" stroke-width="2"/>
 <text x="908" y="226" fill="#2e7567" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">防御层</text>
 <rect x="908" y="263" width="188" height="42" rx="10" fill="#e4f2ee"/><text x="1002" y="290" text-anchor="middle" fill="#2e7567" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">来源标记 / 分隔</text>
 <rect x="908" y="322" width="188" height="42" rx="10" fill="#e5f0ff"/><text x="1002" y="349" text-anchor="middle" fill="#356b9a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">最小权限</text>
 <rect x="908" y="381" width="188" height="42" rx="10" fill="#fff0da"/><text x="1002" y="408" text-anchor="middle" fill="#8a6b36" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">沙箱回归</text>
 <text x="1002" y="461" text-anchor="middle" fill="#6b7f96" font-size="15" font-family="Arial, 'Noto Sans CJK SC', sans-serif">逐次验证与审计</text>
 </g>
<text x="68" y="575" fill="#a6534a" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">案例警报：零点击不等于零风险</text>
<text x="68" y="613" fill="#6b7f96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">不可信内容只能被分析，不能自动获得用户权限。</text>
</svg>
