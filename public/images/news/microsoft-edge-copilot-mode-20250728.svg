<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Edge Copilot Mode 浏览协作</title><desc id="desc">Copilot Mode 在用户授权后读取多个标签页，协助比较和导航；它是限时实验并保留退出路径</desc><rect width="1200" height="720" fill="#101827"/><rect x="50" y="50" width="1100" height="620" rx="28" fill="#172338" stroke="#334155"/><text x="90" y="120" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">Edge Copilot Mode</text><text x="90" y="158" fill="#a9b7cf" font-size="17" font-family="sans-serif">多标签上下文进入浏览协作，权限仍由用户开启</text><rect x="90" y="255" width="245" height="170" rx="18" fill="#202e46" stroke="#60a5fa" stroke-width="3"/><text x="212" y="315" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">多个标签页</text><text x="212" y="350" fill="#93c5fd" font-size="15" text-anchor="middle" font-family="sans-serif">资料 / 商品 / 旅行</text><text x="212" y="382" fill="#a9b7cf" font-size="14" text-anchor="middle" font-family="sans-serif">需用户授权</text><path d="M 350 340 H 420" stroke="#94a3b8" stroke-width="3"/><path d="M 403 329 l 14 11 -14 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="445" y="235" width="300" height="210" rx="18" fill="#202e46" stroke="#a7f3d0" stroke-width="3"/><text x="595" y="295" fill="#f8fafc" font-size="21" text-anchor="middle" font-family="sans-serif">Copilot</text><text x="595" y="333" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">理解上下文</text><text x="595" y="365" fill="#bbf7d0" font-size="16" text-anchor="middle" font-family="sans-serif">比较 / 搜索 / 语音导航</text><text x="595" y="405" fill="#a9b7cf" font-size="14" text-anchor="middle" font-family="sans-serif">实验功能，范围可能变化</text><path d="M 760 340 H 830" stroke="#94a3b8" stroke-width="3"/><path d="M 813 329 l 14 11 -14 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="855" y="255" width="245" height="170" rx="18" fill="#202e46" stroke="#fbbf24" stroke-width="3"/><text x="977" y="315" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">用户控制</text><text x="977" y="350" fill="#fde68a" font-size="15" text-anchor="middle" font-family="sans-serif">开启 / 关闭</text><text x="977" y="382" fill="#a9b7cf" font-size="14" text-anchor="middle" font-family="sans-serif">高影响动作需再确认</text><text x="600" y="560" fill="#d5def0" font-size="19" text-anchor="middle" font-family="sans-serif">VibePolaris 自制机制图 · 浏览协作示意</text><text x="600" y="600" fill="#7f8ba0" font-size="14" text-anchor="middle" font-family="sans-serif">CC BY 4.0 · 不代表 Edge 已全面自动执行网页任务</text></svg>
