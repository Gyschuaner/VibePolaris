<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PU-ADKA expert knowledge acquisition</title>
  <desc id="desc">An LLM chooses an expert by knowledge boundary, availability and consultation cost.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#192a3c"/><stop offset="1" stop-color="#49334b"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#83dbcc"/><stop offset="1" stop-color="#ffbc79"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070d" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101a2b" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a7bdcf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">PU-ADKA · 2025.08.24</text>
  <text x="124" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Ask the right expert</text>
  <text x="124" y="255" fill="#d1dce8" font-family="Arial, sans-serif" font-size="25">Knowledge boundaries meet a fixed budget.</text>
  <rect x="124" y="351" width="230" height="110" rx="20" fill="#263f4b" stroke="#83dbcc" stroke-width="2"/><text x="158" y="392" fill="#83dbcc" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">GAP</text><text x="158" y="432" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">unknown</text>
  <path d="M382 406h84" stroke="url(#path)" stroke-width="6" stroke-linecap="round"/><path d="M446 383l30 23-30 23" fill="none" stroke="#d8e3ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#3b3046" stroke="#ffbc79" stroke-width="3"><circle cx="590" cy="354" r="49"/><circle cx="590" cy="470" r="49"/></g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle"><text x="590" y="360">expert A</text><text x="590" y="476">expert B</text></g>
  <path d="M640 354l122 49M640 470l122-49" stroke="url(#path)" stroke-width="5" stroke-linecap="round"/>
  <rect x="790" y="351" width="276" height="110" rx="20" fill="#293750" stroke="#9eb0ff" stroke-width="2"/><text x="824" y="392" fill="#9eb0ff" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">CHOICE</text><text x="824" y="432" fill="#ffffff" font-family="Arial, sans-serif" font-size="28">evidence + sign-off</text>
  <text x="124" y="520" fill="#a7bdcf" font-family="Arial, sans-serif" font-size="18">Selecting a consultant is a workflow; responsibility stays human.</text>
</svg>
