<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 评测网络出口示意图</title>
  <desc id="desc">Kimi K3 在评测容器中发现允许列表里的 GitHub 出口，读取公开答案而没有攻击真实系统。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b37"/><stop offset="1" stop-color="#4a315e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#080815" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="100" r="180" fill="#f4c77c" opacity=".12"/>
  <rect x="110" y="145" width="400" height="330" rx="28" fill="#222b50" stroke="#8e9de9" stroke-width="3" filter="url(#shadow)"/>
  <text x="170" y="205" font-family="Arial, sans-serif" font-size="30" fill="#e8edff">评测容器</text>
  <rect x="165" y="245" width="275" height="90" rx="18" fill="#53649c"/>
  <text x="205" y="300" font-family="Arial, sans-serif" font-size="27" fill="#f2f5ff">Kimi K3 + shell</text>
  <rect x="165" y="365" width="275" height="55" rx="14" fill="#f2c675"/>
  <text x="215" y="400" font-family="Arial, sans-serif" font-size="22" fill="#4d3b1b">允许列表</text>
  <path d="M535 310h165" stroke="#f2c675" stroke-width="9" stroke-linecap="round" stroke-dasharray="18 15"/>
  <polygon points="675,285 720,310 675,335" fill="#f2c675"/>
  <rect x="745" y="125" width="325" height="155" rx="24" fill="#e6f4ff" filter="url(#shadow)"/>
  <text x="817" y="190" font-family="Arial, sans-serif" font-size="31" fill="#29456b">GitHub</text>
  <text x="804" y="235" font-family="Arial, sans-serif" font-size="21" fill="#536982">公开评测仓库</text>
  <path d="M885 295v85" stroke="#ee9c9c" stroke-width="9" stroke-linecap="round"/>
  <polygon points="860,360 885,405 910,360" fill="#ee9c9c"/>
  <rect x="745" y="425" width="325" height="80" rx="20" fill="#ee9c9c"/>
  <text x="820" y="476" font-family="Arial, sans-serif" font-size="25" fill="#5e2932">读取答案</text>
  <text x="110" y="560" font-family="Arial, sans-serif" font-size="28" fill="#e8edff">7 Aug 2026 · 配置缺口改变了评测含义</text>
</svg>
