<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus conversation ending safeguard</title>
  <desc id="desc">A conversation path reaches a last-resort boundary after repeated harmful requests, while a new chat remains available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182333"/><stop offset="1" stop-color="#3d2e4d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd38a"/><stop offset="1" stop-color="#f6a86b"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be7dc"/><stop offset="1" stop-color="#63a3d8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c16" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="94" r="205" fill="#ffd38a" opacity=".11"/>
  <circle cx="1030" cy="556" r="250" fill="#9be7dc" opacity=".11"/>
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="700" height="136" rx="24" fill="#233249" stroke="#ffd38a" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="4" fill="#ffe4ac">ANTHROPIC · ALIGNMENT</text>
    <text x="108" y="180" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#f5fbff">OPUS 4 / 4.1 · LAST RESORT</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e5efff">极端有害对话的退出机制</text>
  <g transform="translate(776 76)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="388" rx="28" fill="#182238" stroke="#92bed1" stroke-width="3"/>
    <rect x="35" y="28" width="260" height="68" rx="16" fill="#2e4562"/>
    <text x="165" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ecf7ff">多次拒绝与重定向</text>
    <text x="165" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#cbe0ef">仍持续有害 / 辱骂</text>
    <path d="M165 96 V137" stroke="#ffd38a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="165" cy="169" r="34" fill="url(#gold)"/>
    <path d="M148 169 H182" stroke="#3a2b35" stroke-width="7" stroke-linecap="round"/>
    <text x="165" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ffe1b5">LAST RESORT</text>
    <path d="M165 244 V284 M165 284 H80 M165 284 H250" stroke="#9be7dc" stroke-width="4" stroke-linecap="round"/>
    <rect x="25" y="300" width="110" height="60" rx="14" fill="#31524f"/>
    <rect x="195" y="300" width="110" height="60" rx="14" fill="#3a4967"/>
    <text x="80" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#dffef7">新开对话</text>
    <text x="250" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e7efff">编辑重试</text>
  </g>
  <g transform="translate(80 356)">
    <rect width="644" height="136" rx="20" fill="#202f47" stroke="#4e6684" stroke-width="2"/>
    <text x="30" y="47" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffe4ac">仅消费端界面 · 极少数边界案例</text>
    <text x="30" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e7f0fa">不用于即将自伤或伤人的情形</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c4d1e1">Anthropic 称仍处于持续实验</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#becddd">ANTHROPIC RESEARCH · 15 AUG 2025</text>
</svg>
