<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Alpamayo 2 Super 云端到车端流程</title><desc id="desc">Alpamayo 2 Super 从全景相机输入生成轨迹、因果链和训练标注，云端教师输出再蒸馏到车端模型。</desc><rect width="960" height="540" rx="28" fill="#111827"/><rect x="55" y="170" width="170" height="140" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="140" y="220" text-anchor="middle" fill="#dbeafe" font-size="21" font-family="sans-serif">360° 相机</text><text x="140" y="260" text-anchor="middle" fill="#bfdbfe" font-size="16" font-family="sans-serif">道路场景</text><path d="M225 240H315" stroke="#93c5fd" stroke-width="4" marker-end="url(#a)"/><rect x="315" y="125" width="220" height="230" rx="20" fill="#164e63" stroke="#67e8f9" stroke-width="3"/><text x="425" y="185" text-anchor="middle" fill="#cffafe" font-size="23" font-family="sans-serif">Alpamayo 2</text><text x="425" y="225" text-anchor="middle" fill="#a5f3fc" font-size="16" font-family="sans-serif">轨迹 · 因果链</text><text x="425" y="255" text-anchor="middle" fill="#a5f3fc" font-size="16" font-family="sans-serif">动作 · 标注</text><text x="425" y="285" text-anchor="middle" fill="#a5f3fc" font-size="16" font-family="sans-serif">视觉问答</text><path d="M535 240H625" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="625" y="105" width="280" height="105" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/><text x="765" y="148" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">云端教师输出</text><text x="765" y="180" text-anchor="middle" fill="#fde68a" font-size="16" font-family="sans-serif">合成数据 / 蒸馏</text><rect x="625" y="275" width="280" height="105" rx="18" fill="#3f1d5a" stroke="#d8b4fe" stroke-width="3"/><text x="765" y="318" text-anchor="middle" fill="#f3e8ff" font-size="21" font-family="sans-serif">车端模型</text><text x="765" y="350" text-anchor="middle" fill="#e9d5ff" font-size="16" font-family="sans-serif">实时推理 / 安全验证</text><text x="480" y="465