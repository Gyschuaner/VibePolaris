<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CoCounsel Legal 的法律研究 Agent 工作流</title>
  <desc id="desc">法律问题经过研究计划、Westlaw 与 Practical Law 引用，最后由专业人士复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#202e4f"/>
      <stop offset="1" stop-color="#5e7388"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f0e2"/>
      <stop offset="1" stop-color="#d9e6e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#0f1b35" flood-opacity=".43"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="92" r="190" fill="#ecc774" opacity=".17"/>
  <circle cx="100" cy="530" r="230" fill="#87b3c2" opacity=".17"/>
  <path d="M20 460 C120 365 240 515 345 400 S555 315 672 430 S875 510 1000 375 S1100 348 1190 420" fill="none" stroke="#ecc774" stroke-width="5" stroke-dasharray="12 15" opacity=".82"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f4f0e2"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e9c978"/>
  </g>
  <g fill="#202e4f" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">法律问题</text>
    <rect x="115" y="225" width="220" height="44" rx="15" fill="#c6dce2"/>
    <text x="137" y="253" font-size="16">research question</text>
    <rect x="115" y="287" width="173" height="44" rx="15" fill="#b8d2d9"/>
    <text x="137" y="315" font-size="16">facts · jurisdiction</text>
    <path d="M115 375 h205" stroke="#5e7388" stroke-width="10" stroke-linecap="round" opacity=".65"/>
    <text x="115" y="407" font-size="16">委托给研究流程</text>

    <text x="487" y="178" font-size="25" font-weight="800">研究计划</text>
    <path d="M500 238 h196 M500 286 h150 M500 334 h178" stroke="#5e7388" stroke-width="11" stroke-linecap="round"/>
    <circle cx="515" cy="238" r="13" fill="#202e4f"/>
    <circle cx="515" cy="286" r="13" fill="#202e4f"/>
    <circle cx="515" cy="334" r="13" fill="#202e4f"/>
    <path d="M710 231 l22 22 l-22 22" fill="none" stroke="#5e7388" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="487" y="407" font-size="17">Westlaw · Practical Law</text>

    <text x="859" y="178" font-size="25" font-weight="800">引用与复核</text>
    <rect x="865" y="225" width="83" height="105" rx="16" fill="#5e7388"/>
    <path d="M884 260 h45 M884 282 h37 M884 304 h44" stroke="#f4f0e2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1023" cy="278" r="42" fill="#202e4f"/>
    <path d="M1001 280 l13 13 l29 -35" fill="none" stroke="#f4f0e2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M865 377 h205" stroke="#202e4f" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="407" font-size="17">报告 · 人工监督</text>
  </g>
  <g fill="#f4f0e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">COCOUNSEL LEGAL · 2025.08.05</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">Agent 先研究，人来复核</text>
  </g>
