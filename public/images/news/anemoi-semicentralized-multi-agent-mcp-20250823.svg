<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Anemoi semi-centralized multi-agent collaboration</title>
  <desc id="desc">A planner and worker agents exchange structured progress through an A2A MCP channel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171e36"/><stop offset="1" stop-color="#225154"/></linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fa8ff"/><stop offset="1" stop-color="#7de4d2"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#040711" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="68" width="1056" height="496" rx="38" fill="#10182a" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a4b9d2" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">ANEMOI · A2A MCP · 2025.08.23</text>
  <text x="124" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="49" font-weight="700">Let agents see the work</text>
  <text x="124" y="255" fill="#d0dce9" font-family="Arial, sans-serif" font-size="25">A planner guides. Peers refine.</text>
  <circle cx="598" cy="365" r="76" fill="#30375b" stroke="#9aaeff" stroke-width="3"/><text x="598" y="358" fill="#9aaeff" font-family="Arial, sans-serif" font-size="19" text-anchor="middle" letter-spacing="2">PLANNER</text><text x="598" y="392" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">direction</text>
  <g fill="#24464c" stroke="#7de4d2" stroke-width="3" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><circle cx="294" cy="350" r="54"/><circle cx="900" cy="350" r="54"/><circle cx="430" cy="485" r="54"/><circle cx="766" cy="485" r="54"/></g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="17" text-anchor="middle"><text x="294" y="356">worker</text><text x="900" y="356">worker</text><text x="430" y="491">review</text><text x="766" y="491">tools</text></g>
  <g stroke="url(#link)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M350 350l172-4"/><path d="M674 350l172-4"/><path d="M350 382l46 65"/><path d="M846 382l-46 65"/><path d="M484 485h228"/></g>
  <text x="124" y="520" fill="#a4b9d2" font-family="Arial, sans-serif" font-size="18">Structured collaboration reduces one bottleneck and creates a state-governance job.</text>
</svg>
