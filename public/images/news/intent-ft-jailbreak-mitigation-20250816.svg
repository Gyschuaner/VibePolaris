<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Intent-FT jailbreak mitigation</title>
  <desc id="desc">An adversarial instruction passes through an intent inference gate before the model chooses a safe response, with unknown attack evaluation shown beside it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131f35"/><stop offset="1" stop-color="#4b304d"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a4f4e7"/><stop offset="1" stop-color="#68b8df"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffda8f"/><stop offset="1" stop-color="#ed9568"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="210" fill="#ffcf7c" opacity=".1"/>
  <circle cx="1070" cy="560" r="240" fill="#81e8dc" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="686" height="136" rx="24" fill="#22344f" stroke="#8dd6e3" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a1eee4">ARXIV · 16 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#f5fbff">INTENT-FT · SAFETY GATE</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">先判断真实意图，再决定如何回应</text>
  <g transform="translate(776 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="342" height="398" rx="28" fill="#17243b" stroke="#6fbfd0" stroke-width="3"/>
    <text x="171" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeaf4">ADVERSARIAL INSTRUCTION</text>
    <rect x="33" y="60" width="276" height="58" rx="15" fill="#573d4a" stroke="#ffd18b" stroke-width="2"/>
    <text x="171" y="86" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff0d0">表面任务 / 隐藏目的</text>
    <text x="171" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e7c7b1">角色 · 改写 · 多步上下文</text>
    <path d="M171 120 V152" stroke="#ffd48e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="171" cy="184" r="33" fill="url(#teal)"/>
    <path d="M153 184 H189 M171 166 V202" stroke="#173548" stroke-width="6" stroke-linecap="round"/>
    <text x="171" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#dff9f4">INTENT INFERENCE</text>
    <path d="M171 251 V281 M171 281 H88 M171 281 H254" stroke="#9deee4" stroke-width="4" stroke-linecap="round"/>
    <rect x="28" y="300" width="122" height="58" rx="14" fill="#31534f"/>
    <rect x="192" y="300" width="122" height="58" rx="14" fill="#3a4b68"/>
    <text x="89" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2fff8">安全回应</text>
    <text x="253" y="335" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e9f1ff">拒绝 / 澄清</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="664" height="140" rx="20" fill="#202f49" stroke="#536f8b" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">评测不只看攻击成功率</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">还要看实用性、过度拒答与未知改写</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">论文报告：所测类别中单一攻击未超过 50%</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">MITIGATING JAILBREAKS WITH INTENT-AWARE LLMS</text>
</svg>
