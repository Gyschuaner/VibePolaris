<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Faraday 科研代理评测链路</title><desc id="desc">从论文复现任务到编码工具、长时程实验和公司基准比较。</desc><metadata><source>https://techcrunch.com/2026/08/22/inherent-founded-by-deepmind-alumni-says-its-ai-teammate-just-outperformed-anthropic-and-openai-at-replicating-research/</source><source>https://inherentlabs.ai/research/training-to-replicate</source><source>https://arxiv.org/abs/2608.13331</source></metadata><rect width="1200" height="620" rx="36" fill="#111827"/><text x="68" y="72" fill="#f8fafc" font-size="32" font-family="Arial, sans-serif" font-weight="700">Faraday：论文复现不是一句“模型更强”</text><text x="68" y="110" fill="#a8b7cb" font-size="18" font-family="Arial, sans-serif">27B 核心模型 + 工具 + 长循环 + 评分器，才构成这条基准链路</text><g font-family="Arial, sans-serif"><rect x="68" y="190" width="220" height="164" rx="22" fill="#254f73"/><text x="178" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Replica 任务</text><text x="178" y="267" text-anchor="middle" fill="#d8ecff" font-size="16">310 个任务</text><text x="178" y="293" text-anchor="middle" fill="#d8ecff" font-size="16">100 篇论文</text><text x="178" y="319" text-anchor="middle" fill="#d8ecff" font-size="16">有限算力</text><path d="M300 272 H370" stroke="#86a4c7" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="190" width="220" height="164" rx="22" fill="#65518a"/><text x="500" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Faraday 27B</text><text x="500" y="267" text-anchor="middle" fill="#f0e4ff" font-size="16">读论文 · 提假设</text><text x="500" y="293" text-anchor="middle" fill="#f0e4ff" font-size="16">长时程 RL</text><text x="500" y="319" text-anchor="middle" fill="#f0e4ff" font-size="16">研究品味</text><path d="M620 272 H690" stroke="#86a4c7" stroke-width="4" marker-end="url(#arrow)"/><rect x="710" y="190" width="220" height="164" rx="22" fill="#1d765c"/><text x="820" y="230" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">工具循环</text><text x="820" y="267" text-anchor="middle" fill="#d8f7e7" font-size="16">写代码</text><text x="820" y="293" text-anchor="middle" fill="#d8f7e7" font-size="16">跑实验</text><text x="820" y="319" text-anchor="middle" fill="#d8f7e7" font-size="16">看结果再改</text><path d="M940 272 H1010" stroke="#86a4c7" stroke-width="4" marker-end="url(#arrow)"/><rect x="1018" y="190" width="120" height="164" rx="22" fill="#a64f35"/><text x="1078" y="230" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">比较</text><text x="1078" y="272" text-anchor="middle" fill="#ffe6d9" font-size="15">Claude</text><text x="1078" y="298" text-anchor="middle" fill="#ffe6d9" font-size="15">GPT-5.5</text><text x="1078" y="324" text-anchor="middle" fill="#ffe6d9" font-size="15">公司基准</text><rect x="125" y="448" width="950" height="86" rx="20" fill="#2b3242" stroke="#e3a16c" stroke-width="2"/><text x="600" y="486" text-anchor="middle" fill="#ffd9bc" font-size="22" font-weight="700">公司基准 ≠ 独立复测</text><text x="600" y="516" text-anchor="middle" fill="#c8d2df" font-size="16">还要公开任务、代码、评分器、预算和失败案例</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#86a4c7"/></marker></defs></svg>