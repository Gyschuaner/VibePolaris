<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Measuring AI serving environmental impact</title>
  <desc id="desc">Production telemetry follows an AI prompt through accelerator, host, data center and water footprint measurements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15223a"/><stop offset="1" stop-color="#214c4b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8f4b5"/><stop offset="1" stop-color="#7bdce2"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#92b9ff"/><stop offset="1" stop-color="#b4a2ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#060b15" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1045" cy="88" r="212" fill="#a8f4b5" opacity=".11"/>
  <circle cx="1030" cy="570" r="258" fill="#92b9ff" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="720" height="140" rx="24" fill="#20334a" stroke="#a8f4b5" stroke-width="2"/>
    <text x="108" y="126" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#caffcb">GOOGLE AI SERVING · PRODUCTION</text>
    <text x="108" y="182" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#fafbff">0.24 Wh · 0.26 mL</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7edff">把一个 prompt 的代价量出来</text>
  <g transform="translate(816 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="406" rx="30" fill="#111b32" stroke="#c0ccff" stroke-width="3"/>
    <rect x="34" y="35" width="184" height="45" rx="16" fill="#2e4c59"/>
    <text x="126" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#caffcb">PROMPT</text>
    <path d="M126 95v36M126 131v33M126 164v34" stroke="#7e98ca" stroke-width="7" stroke-linecap="round"/>
    <circle cx="126" cy="111" r="11" fill="url(#green)"/><circle cx="126" cy="146" r="11" fill="url(#blue)"/><circle cx="126" cy="181" r="11" fill="url(#green)"/>
    <rect x="41" y="235" width="170" height="78" rx="17" fill="#2f5260" stroke="#a8f4b5" stroke-width="2"/>
    <text x="126" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eafff1">ENERGY + CARBON</text>
    <text x="126" y="291" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#c8d9df">WATER · FULL STACK</text>
    <text x="126" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#eaf0ff">MEDIAN TEXT PROMPT</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="710" height="140" rx="20" fill="#20334a" stroke="#557a83" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#caffcb">33× ENERGY · 44× CARBON REDUCTION</text>
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf1ff">一年间软件效率 + 清洁能源采购</text>
    <text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c6cce7">Google 生产测量口径，不是通用模型账单</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c5cbe4">ARXIV · FIRST SUBMITTED 21 AUG 2025</text>
</svg>
