<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">DuckDuckGo 隐藏 AI 图片过滤器</title><desc id="desc">用户开关、公开黑名单和仍可能漏网的 AI 图片。</desc><rect width="1200" height="680" rx="36" fill="#15212a"/><text x="72" y="88" fill="#f8fafc" font-size="40" font-family="sans-serif" font-weight="700">隐藏 AI 图片：筛选器，不是鉴定器</text><text x="72" y="130" fill="#bad1d7" font-size="22" font-family="sans-serif">用户选择 → 公开列表 → 结果减少，仍有漏网</text><g font-family="sans-serif"><rect x="90" y="230" width="230" height="165" rx="24" fill="#315e63"/><text x="126" y="280" fill="#c9fbf2" font-size="22">用户</text><text x="126" y="330" fill="white" font-size="30" font-weight="700">Hide</text><text x="126" y="368" fill="#dcf9f4" font-size="17">Images 设置</text><path d="M350 312h110" stroke="#77d3c3" stroke-width="8" stroke-linecap="round"/><path d="m435 288 28 24-28 24" fill="none" stroke="#77d3c3" stroke-width="8"/><rect x="490" y="230" width="260" height="165" rx="24" fill="#46537a"/><text x="526" y="280" fill="#d9e2ff" font-size="22">过滤器</text><text x="526" y="330" fill="white" font-size="30" font-weight="700">公开黑名单</text><text x="526" y="368" fill="#e5eaff" font-size="17">人工维护 / 不完整</text><path d="M780 312h110" stroke="#e8b56d" stroke-width="8" stroke-linecap="round"/><path d="m865 288 28 24-28 24" fill="none" stroke="#e8b56d" stroke-width="8"/><rect x="920" y="230" width="220" height="165" rx="24" fill="#613d50"/><text x="954" y="280" fill="#ffd8e6" font-size="22">结果</text><text x="954" y="330" fill="white" font-size="30" font-weight="700">减少 ≠ 清零</text><text x="954" y="368" fill="#ffe8ee" font-size="17">仍需看原始来源</text><rect x="90" y="505" width="1050" height="70" rx="18" fill="#293842"/><text x="126" y="550" fill="#e2f1f1" font-size="22">过滤器改变你看到的结果，不替你判断图片真假</text></g></svg>