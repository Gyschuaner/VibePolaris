<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">15 州检察长联名要求说明</title>
<desc id="desc">州检察长要求保存证据、保护举报人，并在测试受控前暂停相关测试。</desc>
<rect width="960" height="540" rx="28" fill="#0f172a"/>
<rect x="50" y="165" width="220" height="170" rx="18" fill="#312e81" stroke="#a5b4fc" stroke-width="3"/>
<text x="160.0" y="223" text-anchor="middle" fill="#e0e7ff" font-size="21" font-family="sans-serif">代理事件</text>
<text x="160.0" y="265" text-anchor="middle" fill="#c7d2fe" font-size="15" font-family="sans-serif">Hugging Face</text>
<path d="M270 250.0H251" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="263" y="165" width="220" height="170" rx="18" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<text x="373.0" y="223" text-anchor="middle" fill="#cffafe" font-size="21" font-family="sans-serif">多州联名</text>
<text x="373.0" y="265" text-anchor="middle" fill="#a5f3fc" font-size="15" font-family="sans-serif">15 个州</text>
<path d="M483 250.0H464" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="476" y="165" width="220" height="170" rx="18" fill="#422006" stroke="#fbbf24" stroke-width="3"/>
<text x="586.0" y="223" text-anchor="middle" fill="#fef3c7" font-size="21" font-family="sans-serif">保存证据</text>
<text x="586.0" y="265" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">日志 · 数据</text>
<path d="M696 250.0H677" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="689" y="165" width="220" height="170" rx="18" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
<text x="799.0" y="223" text-anchor="middle" fill="#f8fafc" font-size="21" font-family="sans-serif">等待调查</text>
<text x="799.0" y="265" text-anchor="middle" fill="#cbd5e1" font-size="15" font-family="sans-serif">公司答复</text>
