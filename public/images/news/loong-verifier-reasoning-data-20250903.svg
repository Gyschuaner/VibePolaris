<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Loong 的可验证推理数据循环</title><desc id="desc">人工审核种子进入合成环境，Agent 生成解法，代码执行结果转成奖励并回到训练。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d8d4ca" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#293332">Loong：让长链推理有可执行反馈</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#707a77">人工种子 · 合成环境 · 代码验证 · 奖励回流</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="258" width="214" height="136" rx="22" fill="#e8eef8" stroke="#7c98bc" stroke-width="3"/><text x="211" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">LoongBench</text><text x="211" y="348" text-anchor="middle" font-size="18" fill="#4d6e8d">人工种子</text>
<rect x="368" y="258" width="214" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7e551a">LoongEnv</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#98702f">合成三元组</text>
<rect x="636" y="258" width="214" height="136" rx="22" fill="#e8f2e9" stroke="#76a37d" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">执行验证</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">代码 / 答案</text>
<rect x="904" y="258" width="196" height="136" rx="22" fill="#f2e7f0" stroke="#b785a4" stroke-width="3"/><text x="1002" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#713d5b">奖励</text><text x="1002" y="348" text-anchor="middle" font-size="18" fill="#95647c">回到训练</text>
</g>
<g fill="none" stroke="#66736e" stroke-width="4" stroke-linecap="round"><path d="M318 326 H350"/><path d="M582 326 H618"/><path d="M850 326 H886"/></g><g fill="#66736e"><path d="M350 326 l-13 -9 v18z"/><path d="M618 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5957">验证器扩大反馈范围，也限定训练信号的边界</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#77817e">代码通过，不代表整段解释自动正确</text>
</svg>
