<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jules 异步编码 Agent 工作流</title>
  <desc id="desc">Jules 从 Issue 读取任务、制定计划、异步修改代码，等待开发者复核。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22284d"/>
      <stop offset="1" stop-color="#536e8b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f0e2"/>
      <stop offset="1" stop-color="#d8e5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#111931" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1038" cy="90" r="190" fill="#ecc674" opacity=".16"/>
  <circle cx="100" cy="540" r="230" fill="#83b8c2" opacity=".17"/>
  <path d="M24 458 C125 367 238 515 350 400 S560 320 675 430 S870 512 1006 382 S1100 347 1190 420" fill="none" stroke="#ecc674" stroke-width="5" stroke-dasharray="12 15" opacity=".83"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#f3f0e2"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#e8c675"/>
  </g>
  <g fill="#22284d" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">Issue</text>
    <rect x="115" y="226" width="220" height="54" rx="16" fill="#bed7dd"/>
    <text x="140" y="260" font-size="17">修复登录错误</text>
    <path d="M115 327 h205" stroke="#536e8b" stroke-width="10" stroke-linecap="round" opacity=".6"/>
    <text x="115" y="365" font-size="17">仓库 · 分支 · 权限</text>
    <text x="115" y="405" font-size="16">交给异步任务</text>

    <text x="487" y="178" font-size="25" font-weight="800">Gemini 2.5 计划</text>
    <path d="M500 238 h190 M500 287 h145 M500 336 h172" stroke="#536e8b" stroke-width="11" stroke-linecap="round"/>
    <circle cx="515" cy="238" r="13" fill="#22284d"/>
    <circle cx="515" cy="287" r="13" fill="#22284d"/>
    <circle cx="515" cy="336" r="13" fill="#22284d"/>
    <text x="487" y="405" font-size="17">读取 · 修改 · 验证</text>

    <text x="859" y="178" font-size="25" font-weight="800">开发者复核</text>
    <rect x="865" y="226" width="90" height="110" rx="16" fill="#536e8b"/>
    <path d="M884 258 h52 M884 282 h40 M884 306 h50" stroke="#f3f0e2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1025" cy="280" r="42" fill="#22284d"/>
    <path d="M1003 281 l13 13 l29 -35" fill="none" stroke="#f3f0e2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M865 379 h205" stroke="#22284d" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="405" font-size="17">diff · tests · merge</text>
  </g>
  <g fill="#f3f0e2" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">GOOGLE JULES · 2025.08.06</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">异步完成，人来验收</text>
  </g>
