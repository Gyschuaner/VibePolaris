<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Apple 内部讨论 Perplexity 的证据层级</title><desc id="desc">从内部讨论到正式交易的四层阶梯，只有第一层在 6 月 20 日得到报道确认。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151c2a"/><stop offset="1" stop-color="#2a4055"/></linearGradient></defs><rect width="1200" height="700" rx="36" fill="url(#bg)"/><text x="76" y="84" fill="#f5f8fa" font-family="Arial" font-size="28" font-weight="700">Apple × Perplexity · “考虑”到“交易”</text><text x="76" y="118" fill="#abc1ca" font-family="Arial" font-size="16">6 月 20 日能确认的只有第一层</text><g transform="translate(120 520)" font-family="Arial"><path d="M0 0H900V-80H0Z" fill="#284158" stroke="#52718a"/><path d="M0 -80H700V-170H0Z" fill="#2e5265" stroke="#52718a"/><path d="M0 -170H500V-260H0Z" fill="#3a6a75" stroke="#52718a"/><path d="M0 -260H280V-350H0Z" fill="#f0a767" stroke="#f0c27a"/><text x="34" y="-295" fill="#182332" font-size="19">内部讨论 · confirmed</text><text x="34" y="-205" fill="#e8f3f4" font-size="18">正式接触 · unknown</text><text x="34" y="-115" fill="#e8f3f4" font-size="18">报价/签约 · unknown</text><text x="34" y="-25" fill="#e8f3f4" font-size="18">交割/整合 · unknown</text></g><circle cx="1010" cy="205" r="72" fill="#243b4b" stroke="#7dd7c1" stroke-width="6"/><path d="M985 207L1005 228L1040 183" fill="none" stroke="#7dd7c1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="935" y="320" fill="#abc1ca" font-family="Arial" font-size="16">要等更硬的外部证据</text></svg>
