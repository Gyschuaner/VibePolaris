<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">OpenAI 与 io 的 AI 硬件探索</title><desc id="d">法庭文件把耳机测试、未定型原型和商标约束放在同一条证据线上。</desc><rect width="1200" height="630" fill="#f8fafc"/><text x="70" y="82" font-family="Arial" font-size="38" font-weight="700" fill="#0f172a">还没有确定的外形</text><text x="70" y="122" font-family="Arial" font-size="20" fill="#475569">OpenAI / io · 法庭文件披露 · 2025-06-23</text><g transform="translate(115 220)"><path d="M0 70 C0 5 120 5 120 70 V160 C120 215 0 215 0 160Z" fill="#0f172a"/><circle cx="35" cy="90" r="15" fill="#94a3b8"/><circle cx="85" cy="90" r="15" fill="#94a3b8"/><text x="60" y="260" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">30+ 耳机测试</text></g><path d="M345 325 H470" stroke="#64748b" stroke-width="6" stroke-dasharray="12 12"/><g transform="translate(500 205)"><rect width="235" height="240" rx="32" fill="#e2e8f0" stroke="#475569" stroke-width="5"/><circle cx="118" cy="103" r="48" fill="#fff" stroke="#0f172a" stroke-width="5"/><rect x="77" y="145" width="82" height="25" rx="12" fill="#0f172a"/><text x="118" y="214" text-anchor="middle" font-family="Arial" font-size="20" fill="#334155">原型未定</text></g><path d="M780 325 H900" stroke="#64748b" stroke-width="6" stroke-dasharray="12 12"/><g transform="translate(930 220)"><rect width="190" height="170" rx="20" fill="#fee2e2" stroke="#b91c1c" stroke-width="5"/><text x="95" y="67" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#991b1b">法院</text><path d="M38 100 H152" stroke="#b91c1c" stroke-width="5"/><text x="95" y="135" text-anchor="middle" font-family="Arial" font-size="17" fill="#991b1b">商标限制</text></g><text x="70" y="570" font-family="Arial" font-size="18" fill="#475569">法庭文件能说明研发线索，不能替代产品规格、价格和上市承诺。</text></svg>