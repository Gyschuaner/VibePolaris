<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">METR AI 编程工具实地试验</title><desc id="desc">16 名熟悉大型开源项目的开发者完成 246 个真实任务，允许使用 AI 的条件平均多花 19% 时间；主观感觉与实际耗时分开表示。</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1f2a"/><stop offset="1" stop-color="#163b37"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="68" y="76" fill="#f8fafc" font-size="34" font-family="sans-serif" font-weight="700">AI Coding Tools · METR field study</text><text x="68" y="116" fill="#bae6fd" font-size="21" font-family="sans-serif">2025-07-20 news · 16 developers · 246 real issues</text><g font-family="sans-serif"><rect x="72" y="210" width="235" height="190" rx="26" fill="#155e75"/><text x="114" y="266" fill="#fff" font-size="25" font-weight="700">真实任务</text><text x="114" y="310" fill="#cffafe" font-size="18">成熟开源仓库</text><text x="114" y="346" fill="#cffafe" font-size="18">&gt; 1M 行代码</text><text x="114" y="382" fill="#cffafe" font-size="18">修复 / 功能 / 重构</text><path d="M327 305h72" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/><path d="m384 293 18 12-18 12" fill="none" stroke="#7dd3fc" stroke-width="6"/><rect x="418" y="190" width="250" height="230" rx="26" fill="#0f766e"/><text x="462" y="252" fill="#fff" font-size="25" font-weight="700">随机分组</text><text x="462" y="300" fill="#ccfbf1" font-size="18">允许 AI</text><text x="462" y="336" fill="#ccfbf1" font-size="18">或禁止 AI</text><text x="462" y="380" fill="#ccfbf1" font-size="17">Cursor + Claude</text><path d="M688 305h72" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/><path d="m745 293 18 12-18 12" fill="none" stroke="#fbbf24" stroke-width="6"/><rect x="780" y="210" width="350" height="190" rx="26" fill="#92400e"><text x="820" y="266" fill="#fff" font-size="25" font-weight="700">实际交付</text><text x="820" y="314" fill="#fef3c7" font-size="24">AI 条件 +19% 时间</text><text x="820" y="354" fill="#fef3c7" font-size="18">体感仍约快 20%</text><text x="820" y="386" fill="#fef3c7" font-size="17">提示 · 审查 · 整合</text><rect x="172" y="500" width="856" height="88" rx="26" fill="#07141b" stroke="url(#accent)" stroke-width="3"/><text x="350" y="548" fill="#fff" font-size="24" font-weight="700">“更快的生成” ≠ “更短的交付”</text><text x="365" y="578" fill="#bae6fd" font-size="16">样本、工具版本和仓库类型决定数字的边界</text></g></svg>
