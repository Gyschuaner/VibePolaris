<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">多 Agent 辩论的失败模式</title>
<desc id="desc">多个 Agent 先独立作答，再在受限轮次中质询；错误理由可能造成正确到错误的转向。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f2ff"/><stop offset="1" stop-color="#fff2ee"/></linearGradient>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#63529b"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2a2345" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="70" y="80" fill="#2e2854" font-size="36" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">多 Agent 辩论：声音更多，答案未必更稳</text>
<text x="72" y="118" fill="#756f91" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif">独立首答 → 关键分歧 → 反方质询 → 记录转向</text>
<g filter="url(#shadow)">
 <rect x="70" y="188" width="250" height="292" rx="22" fill="#fff" stroke="#d6cef0" stroke-width="2"/>
 <text x="108" y="238" fill="#63529b" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">独立首答</text>
 <circle cx="140" cy="305" r="28" fill="#e9e2fb"/><text x="140" y="312" text-anchor="middle" fill="#58478e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">A</text>
 <circle cx="220" cy="305" r="28" fill="#e9e2fb"/><text x="220" y="312" text-anchor="middle" fill="#58478e" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">B</text>
 <text x="108" y="384" fill="#756f91" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">结论 · 证据 · 信心</text>
 <text x="108" y="417" fill="#756f91" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">先冻结基线</text>
 </g>
 <path d="M338 334 H390" stroke="#63529b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="410" y="170" width="350" height="326" rx="22" fill="#fff" stroke="#a8d7cf" stroke-width="2"/>
 <text x="448" y="220" fill="#28786d" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">受限辩论</text>
 <rect x="448" y="255" width="120" height="54" rx="12" fill="#d9f1ec"/><text x="508" y="289" text-anchor="middle" fill="#236259" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">分歧</text>
 <rect x="588" y="255" width="120" height="54" rx="12" fill="#fff0c8"/><text x="648" y="289" text-anchor="middle" fill="#80580a" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">质询</text>
 <path d="M568 282 H585" stroke="#63529b" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="448" y="365" fill="#537d76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">可证伪依据</text>
 <text x="588" y="365" fill="#806a3a" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">轮次与预算</text>
 <text x="448" y="431" fill="#537d76" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">避免“说得像真的”</text>
 <text x="448" y="462" fill="#537d76" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">替代“证据是真的”</text>
</g>
<path d="M778 334 H850" stroke="#63529b" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="870" y="170" width="260" height="326" rx="22" fill="#fff" stroke="#e4b1a7" stroke-width="2"/>
 <text x="906" y="220" fill="#a64d40" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">转向记录</text>
 <rect x="906" y="255" width="188" height="56" rx="12" fill="#fde2de"/><text x="1000" y="290" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">对 → 错</text>
 <rect x="906" y="333" width="188" height="56" rx="12" fill="#fde2de"/><text x="1000" y="368" text-anchor="middle" fill="#8b4037" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">证据 / 反例</text>
 <text x="1000" y="438" text-anchor="middle" fill="#a64d40" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">高风险时人工复核</text>
 <text x="1000" y="468" text-anchor="middle" fill="#756f91" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">多数不是验证器</text>
</g>
<text x="70" y="578" fill="#63529b" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">准确率可能随辩论轮次下降</text>
<text x="70" y="615" fill="#756f91" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">真正的协作要奖励独立核验，而不是奖励更快形成共识。</text>
</svg>