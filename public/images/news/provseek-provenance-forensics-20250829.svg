<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">PROVSEEK 的来源驱动威胁取证</title><desc id="desc">Agent 从 provenance 事件生成查询，融合威胁情报并输出可回链的调查摘要。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">PROVSEEK：让证据链自己长出来</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">来源事件 · 动态查询 · 交叉验证 · 可回链摘要</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="108" y="276" width="214" height="122" rx="20" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="215" y="325" text-anchor="middle" font-size="27" font-weight="700" fill="#21456f">来源事件</text><text x="215" y="363" text-anchor="middle" font-size="18" fill="#365b83">进程 / 文件 / 网络</text>
<rect x="400" y="276" width="214" height="122" rx="20" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="507" y="325" text-anchor="middle" font-size="27" font-weight="700" fill="#275d39">Agent 查询</text><text x="507" y="363" text-anchor="middle" font-size="18" fill="#3e7650">提出假设再追问</text>
<rect x="692" y="276" width="214" height="122" rx="20" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="799" y="325" text-anchor="middle" font-size="27" font-weight="700" fill="#805513">证据核验</text><text x="799" y="363" text-anchor="middle" font-size="18" fill="#966b24">情报与行为对照</text>
<rect x="984" y="276" width="132" height="122" rx="20" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="1050" y="325" text-anchor="middle" font-size="25" font-weight="700" fill="#783553">摘要</text><text x="1050" y="363" text-anchor="middle" font-size="17" fill="#94516f">回链来源</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M322 337 H390"/><path d="M614 337 H682"/><path d="M906 337 H974"/><path d="M1050 410 C1050 500 215 500 215 410"/></g>
<g fill="#607080"><path d="M390 337 l-14 -9 v18z"/><path d="M682 337 l-14 -9 v18z"/><path d="M974 337 l-14 -9 v18z"/><path d="M215 410 l-9 14 h18z"/></g>
<text x="600" y="540" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">每次判断都留下查询、证据和下一步</text>
</svg>