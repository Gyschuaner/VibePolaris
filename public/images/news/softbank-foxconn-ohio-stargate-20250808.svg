<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SoftBank 俄亥俄工厂与 Stargate 报道</title>
  <desc id="desc">媒体报道称 SoftBank 收购富士康俄亥俄工厂，AI 基础设施用途仍等待交易和建设证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#29394c"/>
      <stop offset="1" stop-color="#8b7460"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4efe0"/>
      <stop offset="1" stop-color="#dbe0dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#172435" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="95" r="190" fill="#efc878" opacity=".18"/>
  <circle cx="110" cy="540" r="230" fill="#a6b9ad" opacity=".17"/>
  <path d="M22 458 C125 370 235 510 350 402 S565 320 680 430 S872 514 1008 382 S1100 345 1190 420" fill="none" stroke="#efc878" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="64" y="118" width="320" height="306" rx="30" fill="url(#panel)"/>
    <rect x="440" y="118" width="320" height="306" rx="30" fill="#f4efe0"/>
    <rect x="816" y="118" width="320" height="306" rx="30" fill="#dfbb78"/>
  </g>
  <g fill="#29394c" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="108" y="178" font-size="25" font-weight="800">报道</text>
    <rect x="108" y="225" width="220" height="56" rx="17" fill="#bfd0d4"/>
    <text x="218" y="261" font-size="24" text-anchor="middle" font-weight="800">SoftBank?</text>
    <path d="M108 329 h214" stroke="#8b7460" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="108" y="371" font-size="17">交易未立即确认</text>
    <text x="108" y="405" font-size="16">先分清来源层级</text>

    <text x="489" y="178" font-size="25" font-weight="800">厂房</text>
    <circle cx="600" cy="260" r="62" fill="#8b7460"/>
    <path d="M566 276 h68 M575 254 h50 M585 232 h30" stroke="#f4efe0" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 C552 321 574 321 600 355 S650 389 692 350" fill="none" stroke="#8b7460" stroke-width="9" stroke-linecap="round"/>
    <text x="489" y="405" font-size="17">电力 · 冷却 · 网络</text>

    <text x="860" y="178" font-size="25" font-weight="800">证据</text>
    <rect x="860" y="225" width="220" height="56" rx="17" fill="#8b7460"/>
    <text x="970" y="261" font-size="23" fill="#f4efe0" text-anchor="middle" font-weight="800">许可 · 服务器</text>
    <path d="M860 330 h215" stroke="#29394c" stroke-width="10" stroke-linecap="round" opacity=".62"/>
    <text x="860" y="371" font-size="17">建设 · 时间表</text>
    <text x="860" y="405" font-size="16">未见证据，不下结论</text>
  </g>
  <g fill="#f4efe0" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="64" y="565" font-size="22" letter-spacing="1">STARGATE INFRA · 2025.08.08</text>
    <text x="1136" y="565" font-size="16" text-anchor="end" opacity=".84">报道先行，建设待证</text>
  </g>
</svg>
