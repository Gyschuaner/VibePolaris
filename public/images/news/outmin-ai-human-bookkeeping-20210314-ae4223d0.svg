<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Outmin 的 AI 与人工记账服务流程</title>
  <desc id="desc">客户上传文件后，自动化处理与人工协作共同生成财务视图；图中标出这是 2021 年 3 月 14 日新闻中的公司主张。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1c1838"/><stop offset="1" stop-color="#174a4d"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">“AI＋人工”是一条服务流程</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-14 · Irish Times 报道 Outmin 走出隐身状态</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="236" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="408" width="1060" height="150" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <path d="M170 258H1020" stroke="url(#flow)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="190" cy="258" r="39" fill="#4b3b63" stroke="#f0abfc" stroke-width="4"/>
    <circle cx="440" cy="258" r="39" fill="#315b64" stroke="#67e8f9" stroke-width="4"/>
    <circle cx="690" cy="258" r="39" fill="#4b3b63" stroke="#c4b5fd" stroke-width="4"/>
    <circle cx="940" cy="258" r="39" fill="#66502a" stroke="#fcd34d" stroke-width="4"/>
    <text x="190" y="189" fill="#f4eaff" font-size="20" font-weight="700" text-anchor="middle">客户文件</text>
    <text x="440" y="189" fill="#e2fffb" font-size="20" font-weight="700" text-anchor="middle">自动处理</text>
    <text x="690" y="189" fill="#f4eaff" font-size="20" font-weight="700" text-anchor="middle">人工协助</text>
    <text x="940" y="189" fill="#fff6cf" font-size="20" font-weight="700" text-anchor="middle">财务视图</text>
    <text x="190" y="325" fill="#b8ccdf" font-size="15" text-anchor="middle">发票、工资、申报材料</text>
    <text x="440" y="325" fill="#b8ccdf" font-size="15" text-anchor="middle">重复的行政步骤</text>
    <text x="690" y="325" fill="#b8ccdf" font-size="15" text-anchor="middle">异常、规则、责任</text>
    <text x="940" y="325" fill="#b8ccdf" font-size="15" text-anchor="middle">公司声称更实时</text>
    <text x="106" y="455" fill="#f8fafc" font-size="23" font-weight="700">可确认的是流程描述，不是模型效果</text>
    <text x="106" y="487" fill="#a7f3d0" font-size="16">€99 起、早期客户和“实时数据”均来自报道转述的公司主张。</text>
    <rect x="106" y="510" width="300" height="28" rx="14" fill="#3d4d6a"/>
    <rect x="450" y="510" width="300" height="28" rx="14" fill="#315b64"/>
    <rect x="794" y="510" width="300" height="28" rx="14" fill="#4b3b63"/>
    <text x="256" y="530" fill="#ffe1e5" font-size="14" text-anchor="middle">来源：Irish Times</text>
    <text x="600" y="530" fill="#d6fff7" font-size="14" text-anchor="middle">时间：2021-03-14</text>
    <text x="944" y="530" fill="#ede2ff" font-size="14" text-anchor="middle">状态：仍需独立核验</text>
  </g>
  <rect x="70" y="580" width="1060" height="30" rx="14" fill="#102a40"/>
  <text x="600" y="601" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，重画新闻中“自动化＋人工协助”的服务边界。</text>
</svg>
