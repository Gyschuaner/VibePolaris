<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">UniPic-2 统一多模态任务链</title>
  <desc id="desc">文字或图片进入统一多模态模型，再分出理解、生成和编辑路径，训练变体需要独立评测</desc>
  <rect width="1200" height="720" fill="#101827"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#1b2638" stroke="#3b4a62" stroke-width="2"/>
  <text x="92" y="120" fill="#f8fafc" font-size="32" font-family="sans-serif" font-weight="700">Skywork UniPic-2</text>
  <text x="92" y="160" fill="#f9a8d4" font-size="18" font-family="sans-serif">理解 · 生成 · 编辑 · PDTR</text>
  <rect x="92" y="276" width="222" height="170" rx="20" fill="#263b55" stroke="#60a5fa" stroke-width="2"/>
  <text x="203" y="332" fill="#dbeafe" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="700">文字 / 图片</text>
  <text x="203" y="374" fill="#bfdbfe" font-size="16" text-anchor="middle" font-family="sans-serif">对象 · 指令 · 条件</text>
  <path d="M 338 360 H 396" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 376 344 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="420" y="252" width="246" height="218" rx="22" fill="#3a2e4e" stroke="#c4b5fd" stroke-width="2"/>
  <text x="543" y="316" fill="#ede9fe" font-size="25" text-anchor="middle" font-family="sans-serif" font-weight="700">统一模型</text>
  <text x="543" y="360" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">SD3.5M-Kontext</text>
  <text x="543" y="392" fill="#ddd6fe" font-size="16" text-anchor="middle" font-family="sans-serif">MetaQuery</text>
  <text x="543" y="434" fill="#f9a8d4" font-size="15" text-anchor="middle" font-family="sans-serif">PDTR / RL checkpoint</text>
  <path d="M 690 318 H 748 M 690 360 H 748 M 690 402 H 748" stroke="#94a3b8" stroke-width="4"/>
  <path d="M 728 302 l 20 16 -20 16 M 728 344 l 20 16 -20 16 M 728 386 l 20 16 -20 16" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <rect x="772" y="244" width="296" height="254" rx="22" fill="#203d3e" stroke="#5eead4" stroke-width="2"/>
  <text x="920" y="306" fill="#ccfbf1" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="700">三条任务路径</text>
  <text x="920" y="354" fill="#99f6e4" font-size="18" text-anchor="middle" font-family="sans-serif">图像理解</text>
  <text x="920" y="394" fill="#99f6e4" font-size="18" text-anchor="middle" font-family="sans-serif">文字生图</text>
  <text x="920" y="434" fill="#99f6e4" font-size="18" text-anchor="middle" font-family="sans-serif">图像编辑</text>
  <rect x="252" y="540" width="696" height="60" rx="18" fill="#3b2d25" stroke="#fbbf24" stroke-width="2"/>
  <text x="600" y="577" fill="#fef3c7" font-size="18" text-anchor="middle" font-family="sans-serif">统一入口不等于统一错误边界，三类任务仍要分别评测</text>
</svg>
