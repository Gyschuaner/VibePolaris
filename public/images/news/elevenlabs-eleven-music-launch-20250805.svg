<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Eleven Music 从自然语言提示生成歌曲</title>
  <desc id="desc">提示词进入音乐生成、段落编辑和授权检查流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#32204b"/>
      <stop offset="1" stop-color="#9b4d67"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3df"/>
      <stop offset="1" stop-color="#f4d2c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#170e2b" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1015" cy="80" r="190" fill="#f7c56e" opacity=".18"/>
  <circle cx="120" cy="555" r="230" fill="#dd8eaf" opacity=".15"/>
  <path d="M20 465 C125 395 160 520 245 432 S365 330 455 425 S595 520 685 405 S825 315 925 410 S1075 520 1190 390" fill="none" stroke="#f7c56e" stroke-width="5" stroke-dasharray="12 15" opacity=".84"/>
  <g filter="url(#shadow)">
    <rect x="70" y="118" width="315" height="310" rx="30" fill="url(#panel)"/>
    <rect x="442" y="118" width="315" height="310" rx="30" fill="#fff3df"/>
    <rect x="814" y="118" width="315" height="310" rx="30" fill="#f5c978"/>
  </g>
  <g fill="#32204b" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="115" y="178" font-size="25" font-weight="800">自然语言提示</text>
    <rect x="115" y="220" width="220" height="42" rx="15" fill="#e8b6c6"/>
    <text x="137" y="247" font-size="16">dreamy indie rock</text>
    <rect x="115" y="278" width="183" height="42" rx="15" fill="#f7c56e"/>
    <text x="137" y="305" font-size="16">warm vocal · chorus</text>
    <rect x="115" y="336" width="150" height="42" rx="15" fill="#d7c7ef"/>
    <text x="137" y="363" font-size="16">Japanese lyrics</text>

    <text x="487" y="178" font-size="25" font-weight="800">生成与编辑</text>
    <path d="M500 252 C540 197 560 310 598 252 S658 197 696 252 S753 310 730 345" fill="none" stroke="#9b4d67" stroke-width="7" stroke-linecap="round"/>
    <path d="M500 352 h210" stroke="#9b4d67" stroke-width="10" stroke-linecap="round" opacity=".35"/>
    <path d="M500 352 h126" stroke="#9b4d67" stroke-width="10" stroke-linecap="round"/>
    <circle cx="630" cy="352" r="14" fill="#32204b"/>
    <text x="487" y="398" font-size="17">副歌 · 桥段 · 整曲</text>

    <text x="859" y="178" font-size="25" font-weight="800">授权检查</text>
    <circle cx="906" cy="272" r="42" fill="#9b4d67"/>
    <path d="M886 273 l14 14 l28 -34" fill="none" stroke="#fff3df" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M980 244 h105 M980 290 h80 M980 336 h122" stroke="#32204b" stroke-width="11" stroke-linecap="round"/>
    <text x="859" y="398" font-size="17">提示词 · 条款 · 交付</text>
  </g>
  <g fill="#fff3df" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="70" y="565" font-size="22" letter-spacing="1">ELEVEN MUSIC · 2025.08.05</text>
    <text x="1130" y="565" font-size="16" text-anchor="end" opacity=".84">能生成，也要核对授权</text>
  </g>
</svg>
