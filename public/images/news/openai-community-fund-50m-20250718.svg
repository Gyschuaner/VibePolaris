<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">OpenAI 社区基金证据链</title><desc id="desc">委员会听取、基金承诺、申请规则和实际拨款的四层证据链。</desc><rect width="1200" height="680" rx="36" fill="#151d2c"/><text x="72" y="88" fill="#f8fafc" font-size="40" font-family="sans-serif" font-weight="700">5000 万美元：承诺到影响还有几步</text><text x="72" y="130" fill="#b8c7dc" font-size="22" font-family="sans-serif">7 月 18 日公告确认了资源方向，没有公布拨款细则</text><g font-family="sans-serif"><circle cx="180" cy="320" r="74" fill="#2f5579"/><text x="128" y="311" fill="#d8efff" font-size="22">委员会</text><text x="116" y="344" fill="white" font-size="18">500+ 人 / 100 组织</text><path d="M258 320h150" stroke="#77b8e8" stroke-width="8" stroke-linecap="round"/><path d="m382 296 28 24-28 24" fill="none" stroke="#77b8e8" stroke-width="8"/><circle cx="500" cy="320" r="74" fill="#4f4a7e"/><text x="451" y="311" fill="#ede9fe" font-size="22">基金</text><text x="437" y="344" fill="white" font-size="18">初始 5000 万美元</text><path d="M578 320h150" stroke="#e9b764" stroke-width="8" stroke-linecap="round"/><path d="m702 296 28 24-28 24" fill="none" stroke="#e9b764" stroke-width="8"/><circle cx="820" cy="320" r="74" fill="#6a4057"/><text x="773" y="311" fill="#ffd8e3" font-size="22">规则</text><text x="756" y="344" fill="white" font-size="18">申请 / 评审？</text><path d="M898 320h150" stroke="#a7d67d" stroke-width="8" stroke-linecap="round"/><path d="m1022 296 28 24-28 24" fill="none" stroke="#a7d67d" stroke-width="8"/><circle cx="1120" cy="320" r="74" fill="#375b4d"/><text x="1080" y="311" fill="#d8f5dc" font-size="22">影响</text><text x="1070" y="344" fill="white" font-size="18">待后续证据</text><rect x="120" y="500" width="960" height="72" rx="18" fill="#283449"/><text x="154" y="546" fill="#e2e8f0" font-size="22">公司承诺 ≠ 已拨款 ≠ 已证明公共影响</text></g></svg>