<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">REFRAG 的高效 RAG 解码</title><desc id="desc">检索段落先压缩，再感知并按需展开，减少长上下文重复计算。</desc>
<rect width="1200" height="630" rx="32" fill="#f6f7f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d6d9cd" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#20302a">REFRAG：RAG 解码少算一点上下文</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#68756e">compress · sense · expand · 按需恢复证据</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="104" y="254" width="220" height="144" rx="22" fill="#e6eef8" stroke="#7897ba" stroke-width="3"/><text x="214" y="306" text-anchor="middle" font-size="25" font-weight="700" fill="#274b71">检索段落</text><text x="214" y="344" text-anchor="middle" font-size="18" fill="#416485">很多 · 弱相关</text><text x="214" y="373" text-anchor="middle" font-size="17" fill="#557894">完整 token</text>
<rect x="488" y="254" width="220" height="144" rx="22" fill="#fff0d5" stroke="#d4a25d" stroke-width="3"/><text x="598" y="306" text-anchor="middle" font-size="25" font-weight="700" fill="#7c5418">压缩感知</text><text x="598" y="344" text-anchor="middle" font-size="18" fill="#966d2d">compact context</text><text x="598" y="373" text-anchor="middle" font-size="17" fill="#a27c3a">少算交互</text>
<rect x="872" y="254" width="220" height="144" rx="22" fill="#e7f2e9" stroke="#76a57d" stroke-width="3"/><text x="982" y="306" text-anchor="middle" font-size="25" font-weight="700" fill="#2c6338">按需展开</text><text x="982" y="344" text-anchor="middle" font-size="18" fill="#4b7b55">相关证据</text><text x="982" y="373" text-anchor="middle" font-size="17" fill="#63866b">回答时恢复</text>
</g>
<g fill="none" stroke="#65736b" stroke-width="5" stroke-linecap="round"><path d="M324 326 H470"/><path d="M708 326 H854"/></g><g fill="#65736b"><path d="M470 326 l-15 -10 v20z"/><path d="M854 326 l-15 -10 v20z"/></g>
<text x="600" y="492" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="24" fill="#46534c">首 token 最高加速 30.85 倍 · 上下文扩展 16 倍</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#758078">证据仍需保留原文映射，速度不能替代可核查性</text>
</svg>
