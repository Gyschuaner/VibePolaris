<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Dynamic Speculative Planning 的 Agent 加速</title><desc id="desc">Agent 根据运行状态调节推测力度，在延迟与成本之间选择，同时隔离外部副作用。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f6f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffefa" stroke="#d8d4ca" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#293231">DSP：Agent 加速也要有一个旋钮</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#707a76">异步在线学习 · 推测计划 · 延迟 / 费用 · 授权执行</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="100" y="258" width="214" height="136" rx="22" fill="#e8eef8" stroke="#7c98bc" stroke-width="3"/><text x="207" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e5073">运行状态</text><text x="207" y="348" text-anchor="middle" font-size="18" fill="#4d6e8d">任务 / 工具</text>
<rect x="368" y="258" width="214" height="136" rx="22" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="475" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#7d5519">推测规划</text><text x="475" y="348" text-anchor="middle" font-size="18" fill="#98702e">可取消</text>
<rect x="636" y="258" width="214" height="136" rx="22" fill="#f2e7f0" stroke="#b785a4" stroke-width="3"/><text x="743" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#713d5b">旋钮</text><text x="743" y="348" text-anchor="middle" font-size="18" fill="#95647c">快 ↔ 省</text>
<rect x="904" y="258" width="196" height="136" rx="22" fill="#e8f2e9" stroke="#76a37d" stroke-width="3"/><text x="1002" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">执行</text><text x="1002" y="348" text-anchor="middle" font-size="18" fill="#4e7b57">授权 / 回退</text>
</g>
<g fill="none" stroke="#66736e" stroke-width="4" stroke-linecap="round"><path d="M314 326 H350"/><path d="M582 326 H618"/><path d="M850 326 H886"/></g><g fill="#66736e"><path d="M350 326 l-13 -9 v18z"/><path d="M618 326 l-13 -9 v18z"/><path d="M886 326 l-13 -9 v18z"/></g>
<text x="600" y="493" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d5957">速度、费用和正确性要一起核算</text>
<text x="600" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#77817d">推测可以取消，外部副作用必须等授权</text>
</svg>
