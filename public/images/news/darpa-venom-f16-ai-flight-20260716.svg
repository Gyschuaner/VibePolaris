<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">VENOM F-16 AI 飞行测试</title><desc id="d">标准 F-16 通过 VENOM 接口在人工控制与 AI 控制之间切换，飞行员留在座舱内。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#eaf2ff} .muted{fill:#9bb1cc;font-size:24px}.line{stroke:#73b9ff;stroke-width:8;fill:none;stroke-linecap:round}.node{fill:#132a45;stroke:#73b9ff;stroke-width:3}.pulse{animation:p 2.8s ease-in-out infinite}@keyframes p{50%{opacity:.35;transform:translateX(18px)}}</style><rect width="1200" height="680" rx="34" fill="#071525"/><text x="74" y="92" font-size="42" font-weight="700">VENOM / AI 飞行测试</text><text x="74" y="132" class="muted">把高风险演示拆成可接管、可评测的基础设施</text><g transform="translate(74 230)"><rect class="node" width="250" height="160" rx="24"/><text x="34" y="68" font-size="30">标准 F-16</text><text x="34" y="111" class="muted">机体与核心软件</text></g><path class="line pulse" d="M324 310H470"/><circle cx="400" cy="310" r="14" fill="#ffca65" class="pulse"/><g transform="translate(470 230)"><rect class="node" width="260" height="160" rx="24"/><text x="34" y="68" font-size="30">VENOM 接口</text><text x="34" y="111" class="muted">飞控 · 传感器 · 切换</text></g><path class="line pulse" d="M730 310H876"/><g transform="translate(876 206)"><rect class="node" width="250" height="208" rx="24"/><text x="34" y="62" font-size="30">人在回路</text><text x="34" y="106" class="muted">AI 控制 ↔ 人工接管</text><text x="34" y="148" class="muted">AIR 多代理测试</text></g><text x="80" y="570" class="muted">公告确认测试与基础设施建设；没有宣布作战部署或放开武器权限。</text></svg>
