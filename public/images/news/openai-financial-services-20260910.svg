<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>ChatGPT for Financial Services</title><desc>Financial statements and source citations flow into an analysis workspace guarded by access controls.</desc><style>.bar{animation:bar 2.8s ease-in-out infinite}.lock{animation:lock 3s ease-in-out infinite}@keyframes bar{50%{transform:scaleY(1.3);transform-origin:bottom}}@keyframes lock{50%{transform:translateY(-8px)}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#071e2c"/><rect x="90" y="130" width="420" height="360" rx="24" fill="#0e3445" stroke="#46d7a7" stroke-width="4"/><text x="300" y="185" fill="#b8fbe0" font-size="28" text-anchor="middle">数据与原文</text><g fill="#46d7a7"><rect x="160" y="270" width="38" height="130" class="bar"/><rect x="230" y="190" width="38" height="210" class="bar"/><rect x="300" y="235" width="38" height="165" class="bar"/><rect x="370" y="150" width="38" height="250" class="bar"/></g><path d="M510 310H660" stroke="#f5c76b" stroke-width="6" stroke-dasharray="16 14"/><rect x="660" y="175" width="390" height="270" rx="24" fill="#f5c76b"/><text x="855" y="255" fill="#173240" font-size="34" text-anchor="middle">Astra 分析</text><text x="855" y="300" fill="#173240" font-size="21" text-anchor="middle">表格 · 模型 · 客户材料</text><g class="lock"><rect x="790" y="350" width="130" height="70" rx="14" fill="#173240"/><path d="M815 350v-25a40 40 0 0 1 80 0v25" fill="none" stroke="#173240" stroke-width="16"/></g><text x="100" y="86" fill="#b8fbe0" font-size="24">OPENAI · FINANCIAL SERVICES</text><text x="100" y="565" fill="#9ac5d4" font-size="22">内置数据、可追溯引用和企业权限一起进入工作流</text></svg>