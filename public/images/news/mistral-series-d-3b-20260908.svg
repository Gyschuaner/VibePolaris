<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><title>Mistral 3 billion euro Series D</title><desc>Four layers of sovereign AI—data, open-weight models, private compute and production systems—surround a funding milestone.</desc><style>.layer{animation:layer 4s ease-in-out infinite}.spark{animation:spark 2s ease-in-out infinite}@keyframes layer{50%{transform:translateY(-8px)}}@keyframes spark{50%{opacity:.35}}text{font-family:Inter,Arial,sans-serif}</style><rect width="1200" height="630" rx="34" fill="#16263e"/><g class="layer"><rect x="370" y="135" width="460" height="70" rx="20" fill="#6ac2d8"/><text x="600" y="180" fill="#102c42" font-size="24" text-anchor="middle">数据边界</text><rect x="370" y="225" width="460" height="70" rx="20" fill="#83d7b6"/><text x="600" y="270" fill="#123d32" font-size="24" text-anchor="middle">开放权重模型</text><rect x="370" y="315" width="460" height="70" rx="20" fill="#f1cd6d"/><text x="600" y="360" fill="#503e13" font-size="24" text-anchor="middle">私有算力</text><rect x="370" y="405" width="460" height="70" rx="20" fill="#e9947b"/><text x="600" y="450" fill="#5b251b" font-size="24" text-anchor="middle">可审计生产系统</text></g><g class="spark" fill="#f1cd6d"><circle cx="180" cy="215" r="20"/><circle cx="1020" cy="300" r="25"/><circle cx="190" cy="440" r="14"/></g><text x="100" y="88" fill="#83d7b6" font-size="24">MISTRAL · SERIES D · 2026-09-08</text><text x="600" y="555" fill="#f1cd6d" font-size="38" text-anchor="middle">€3B · €21B+ post-money</text></svg>