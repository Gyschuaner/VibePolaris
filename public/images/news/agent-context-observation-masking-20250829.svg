<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Agent 上下文管理的三种策略</title><desc id="desc">完整历史、LLM 总结和观察遮蔽汇入成本与解决率评估。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">上下文管理：先问旧观察还需不需要</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">完整历史 · LLM 总结 · 观察遮蔽</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="220" width="220" height="96" rx="18" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="222" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#21456f">完整历史</text><text x="222" y="291" text-anchor="middle" font-size="18" fill="#365b83">信息多 / 成本高</text>
<rect x="112" y="354" width="220" height="96" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="222" y="394" text-anchor="middle" font-size="24" font-weight="700" fill="#275d39">LLM 总结</text><text x="222" y="425" text-anchor="middle" font-size="18" fill="#3e7650">语义保留 / 有调用</text>
<rect x="478" y="286" width="236" height="126" rx="20" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="596" y="334" text-anchor="middle" font-size="27" font-weight="700" fill="#805513">观察遮蔽</text><text x="596" y="372" text-anchor="middle" font-size="19" fill="#966b24">过时状态不再重复读</text>
<rect x="860" y="286" width="226" height="126" rx="20" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="973" y="334" text-anchor="middle" font-size="27" font-weight="700" fill="#783553">评估</text><text x="973" y="372" text-anchor="middle" font-size="19" fill="#94516f">成本 × 解决率</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M332 268 C390 268 408 314 468 328"/><path d="M332 402 C390 402 408 376 468 370"/><path d="M714 349 H850"/></g><g fill="#607080"><path d="M468 328 l-14 -9 v18z"/><path d="M468 370 l-14 -9 v18z"/><path d="M850 349 l-14 -9 v18z"/></g>
<text x="600" y="518" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">复杂度增加之前，先建立简单策略的基线</text>
</svg>