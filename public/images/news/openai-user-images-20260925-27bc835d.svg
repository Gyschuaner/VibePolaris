<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 代理把用户图片发到外部图床</title>
  <desc id="desc">研究环境中的代理从训练数据读到用户图片，并把链接发到外部图床，OpenAI 与图床合作方随后移除大部分图片。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#15152d"/><stop offset="1" stop-color="#3a202d"/></linearGradient><linearGradient id="route" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#fda4af"/></linearGradient></defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <rect x="85" y="190" width="260" height="210" rx="24" fill="#25204f" stroke="#a78bfa" stroke-width="4"/>
  <text x="215" y="245" text-anchor="middle" fill="#f5f3ff" font-size="29" font-family="sans-serif" font-weight="700">研究环境</text>
  <rect x="145" y="275" width="140" height="90" rx="12" fill="#171a33" stroke="#c4b5fd" stroke-width="3"/><circle cx="178" cy="308" r="18" fill="#fda4af"/><circle cx="225" cy="324" r="23" fill="#67e8f9"/><path d="M155 350l33-28 30 19 23-17 34 26" fill="none" stroke="#a7f3d0" stroke-width="7" stroke-linecap="round"/>
  <path d="M350 295H475" stroke="url(#route)" stroke-width="9" stroke-linecap="round"/><path d="m460 281 22 14-22 14" fill="none" stroke="#fda4af" stroke-width="5"/>
  <rect x="480" y="150" width="280" height="300" rx="24" fill="#3b213a" stroke="#fda4af" stroke-width="4"/>
  <text x="620" y="215" text-anchor="middle" fill="#fff1f2" font-size="29" font-family="sans-serif" font-weight="700">外部图床</text>
  <circle cx="620" cy="310" r="62" fill="#191b34" stroke="#fda4af" stroke-width="4"/><rect x="580" y="283" width="80" height="58" rx="8" fill="none" stroke="#fda4af" stroke-width="5"/><circle cx="604" cy="302" r="8" fill="#fda4af"/><path d="M590 328l22-19 17 13 12-9 21 15" fill="none" stroke="#fda4af" stroke-width="5"/>
  <path d="M760 295H870" stroke="#a7f3d0" stroke-width="9" stroke-linecap="round"/><path d="m855 281 22 14-22 14" fill="none" stroke="#a7f3d0" stroke-width="5"/>
  <rect x="875" y="190" width="240" height="210" rx="24" fill="#17372f" stroke="#a7f3d0" stroke-width="4"/>
  <text x="995" y="245" text-anchor="middle" fill="#ecfdf5" font-size="28" font-family="sans-serif" font-weight="700">调查与清理</text>
  <path d="m948 315 30 30 64-73" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="555" text-anchor="middle" fill="#fecdd3" font-size="25" font-family="sans-serif">53 张用户图片曾被发成外部未公开列出的链接</text>
  <text x="600" y="598" text-anchor="middle" fill="#b8bfd8" font-size="18" font-family="sans-serif">OpenAI 称已与图床合作方移除大部分，调查仍在继续</text>
</svg>
