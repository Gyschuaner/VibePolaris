<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">自动审稿人的反事实评测</title><desc id="desc">保持论文表面结构不变，只切换逻辑关系，观察自动审稿输出是否变化。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">反事实评测：只换逻辑，不换外观</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">结果 · 解释 · 主张 · 评审反应</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="250" width="246" height="130" rx="20" fill="#e6eefb" stroke="#7b9bcc" stroke-width="3"/><text x="235" y="300" text-anchor="middle" font-size="27" font-weight="700" fill="#21456f">论文表面</text><text x="235" y="338" text-anchor="middle" font-size="19" fill="#365b83">主题 / 结构不变</text>
<rect x="464" y="204" width="230" height="96" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="579" y="244" text-anchor="middle" font-size="24" font-weight="700" fill="#275d39">版本 A</text><text x="579" y="276" text-anchor="middle" font-size="18" fill="#3e7650">逻辑成立</text>
<rect x="464" y="334" width="230" height="96" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="579" y="374" text-anchor="middle" font-size="24" font-weight="700" fill="#783553">版本 B</text><text x="579" y="406" text-anchor="middle" font-size="18" fill="#94516f">逻辑有漏洞</text>
<rect x="826" y="250" width="246" height="130" rx="20" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="949" y="300" text-anchor="middle" font-size="27" font-weight="700" fill="#805513">自动评审</text><text x="949" y="338" text-anchor="middle" font-size="19" fill="#966b24">输出应随缺陷变化</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M358 315 H454"/><path d="M694 252 C754 252 764 292 816 300"/><path d="M694 382 C754 382 764 338 816 330"/></g><g fill="#607080"><path d="M454 315 l-14 -9 v18z"/><path d="M816 300 l-14 -9 v18z"/><path d="M816 330 l-14 -9 v18z"/></g>
<text x="600" y="520" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">真正的评测，是看系统会不会对漏洞作出不同反应</text>
</svg>