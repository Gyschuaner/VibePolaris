<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">英国国家 AI 战略从路线图到正式战略</title>
  <desc id="desc">一条三站时间线：一月 AI Council 路线图、三月政府宣布年内制定战略、九月正式发布国家 AI 战略；旁边列出三项关注方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171b3a"/><stop offset="1" stop-color="#164b55"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#fcd34d"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">一条战略新闻，先看它处在哪个阶段</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-12 · 英国政府宣布年内制定国家 AI 战略</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="188" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="366" width="1060" height="220" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <path d="M168 240H1028" stroke="url(#line)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="220" cy="240" r="35" fill="#4b3b63" stroke="#f0abfc" stroke-width="4"/>
    <circle cx="600" cy="240" r="35" fill="#315b64" stroke="#67e8f9" stroke-width="4"/>
    <circle cx="980" cy="240" r="35" fill="#66502a" stroke="#fcd34d" stroke-width="4"/>
    <text x="220" y="182" fill="#f4eaff" font-size="20" font-weight="700" text-anchor="middle">2021-01-06</text>
    <text x="600" y="182" fill="#e2fffb" font-size="20" font-weight="700" text-anchor="middle">2021-03-12</text>
    <text x="980" y="182" fill="#fff6cf" font-size="20" font-weight="700" text-anchor="middle">2021-09-22</text>
    <text x="220" y="300" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">AI Council 路线图</text>
    <text x="220" y="322" fill="#b8ccdf" font-size="15" text-anchor="middle">16 条建议</text>
    <text x="600" y="300" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">政府宣布制定计划</text>
    <text x="600" y="322" fill="#b8ccdf" font-size="15" text-anchor="middle">方向与参与方式</text>
    <text x="980" y="300" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">正式战略文本</text>
    <text x="980" y="322" fill="#b8ccdf" font-size="15" text-anchor="middle">三大支柱与执行安排</text>
    <text x="106" y="416" fill="#f8fafc" font-size="23" font-weight="700">3 月公告先承诺什么？</text>
    <text x="106" y="448" fill="#a7f3d0" font-size="16">它把政策方向分成三束，但没有在当天发布完整预算、法规或验收指标。</text>
    <rect x="106" y="478" width="296" height="66" rx="16" fill="#3d4d6a" stroke="#fda4af" stroke-width="2"/>
    <rect x="452" y="478" width="296" height="66" rx="16" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="798" y="478" width="296" height="66" rx="16" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="254" y="506" fill="#fff1f2" font-size="17" font-weight="700" text-anchor="middle">经济增长</text>
    <text x="254" y="529" fill="#ffe1e5" font-size="14" text-anchor="middle">更广泛采用 AI</text>
    <text x="600" y="506" fill="#e2fffb" font-size="17" font-weight="700" text-anchor="middle">安全与可信</text>
    <text x="600" y="529" fill="#d6fff7" font-size="14" text-anchor="middle">负责任的发展</text>
    <text x="946" y="506" fill="#f4eaff" font-size="17" font-weight="700" text-anchor="middle">韧性与人才</text>
    <text x="946" y="529" fill="#ede2ff" font-size="14" text-anchor="middle">技能、人才和研发</text>
  </g>
  <rect x="70" y="606" width="1060" height="30" rx="14" fill="#102a40"/>
  <text x="600" y="627" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，重画路线图 → 政府承诺 → 正式战略的政策阶段差异。</text>
</svg>
