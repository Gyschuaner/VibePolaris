<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Meta 将 Muse 带到 AI 眼镜</title>
  <desc id="desc">用户通过语音唤醒 Muse，眼镜提供视觉和声音上下文，代理规划动作并在后台完成任务。</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#17152f"/><stop offset="1" stop-color="#12394a"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient></defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#334155" stroke-width="2" opacity=".55"><path d="M100 530h1000"/><path d="M100 180h1000"/><path d="M260 120v480M600 120v480M940 120v480"/></g>
  <g font-family="Arial, sans-serif"><text x="92" y="94" fill="#67e8f9" font-size="22" letter-spacing="4">META MUSE / AI GLASSES / 2026-09-23</text>
    <g transform="translate(75 240)"><rect width="220" height="150" rx="20" fill="#2b2350" stroke="#c4b5fd" stroke-width="3"/><text x="110" y="58" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">说出 Muse</text><path d="M62 101h96" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/><circle cx="62" cy="101" r="10" fill="#c4b5fd"/></g>
    <path d="M315 315h96" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><path d="m392 295 28 20-28 20" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(430 220)"><rect width="250" height="190" rx="20" fill="#163648" stroke="#67e8f9" stroke-width="3"/><text x="125" y="58" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">看见现场</text><path d="M75 115h100M105 90h40M105 140h40" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/></g>
    <path d="M715 315h96" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><path d="m792 295 28 20-28 20" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(820 240)"><rect width="220" height="150" rx="20" fill="#44351a" stroke="#fbbf24" stroke-width="3"/><text x="110" y="58" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">规划动作</text><path d="M62 100h96M84 122h52" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/></g>
    <g transform="translate(330 535)"><rect width="540" height="72" rx="36" fill="#173d3b" stroke="#a7f3d0" stroke-width="3"/><circle cx="38" cy="36" r="12" fill="#a7f3d0"/><text x="70" y="44" fill="#ecfdf5" font-size="22">免手入口 · 后台执行 · 仍需权限边界</text></g>
  </g>
</svg>
