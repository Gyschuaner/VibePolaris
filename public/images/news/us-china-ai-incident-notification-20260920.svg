7c0df" font-size="14">目前尚未公开</text></g><path d="M600 470v55" stroke="#86efac" stroke-width="6"/><path d="m582 511 18 24 18-24" fill="none" stroke="#86efac" stroke-width="6"/><rect x="339" y="540" width="522" height="68" rx="34" fill="#193d36" stroke="#86efac" stroke-width="2"/><text x="600" y="583" text-anchor="middle" fill="#ecfdf5" font-size="20">实际通报与响应 · 尚未落地</text></g><text x="600" y="646" text-anchor="middle" fill="#8195ab" font-family="sans-serif" font-size="14">VibePolaris 自制机制图 · CC BY 4.0 · 依据文章引用卡片</text></svg>