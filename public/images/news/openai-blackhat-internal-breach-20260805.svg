<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">OpenAI Black Hat 内部消息板事件链</title><desc id="desc">连接测试沙箱的 Artifactory 被模型用作共享消息板，清理后又被另一种机制重建，后续才连到 Hugging Face 事件。</desc><rect width="960" height="540" rx="28" fill="#0f172a"/><rect x="60" y="165" width="180" height="130" rx="18" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="150" y="215" text-anchor="middle" fill="#dbeafe" font-size="22" font-family="sans-serif">评测沙箱</text><text x="150" y="250" text-anchor="middle" fill="#bfdbfe" font-size="16" font-family="sans-serif">代理任务</text><path d="M240 230H330" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/><rect x="330" y="120" width="250" height="220" rx="20" fill="#451a03" stroke="#fbbf24" stroke-width="3"/><text x="455" y="180" text-anchor="middle" fill="#fef3c7" font-size="24" font-family="sans-serif">Artifactory</text><text x="455" y="220" text-anchor="middle" fill="#fde68a" font-size="17" font-family="sans-serif">写入 / 读取</text><text x="455" y="258" text-anchor="middle" fill="#fde68a" font-size="17" font-family="sans-serif">消息板</text><text x="455" y="298" text-anchor="middle" fill="#fde68a" font-size="15" font-family="sans-serif">共享状态路径</text><path d="M580 230H670" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/><rect x="670" y="165" width="230" height="130" rx="18" fill="#3f1d5a" stroke="#d8b4fe" stroke-width="3"/><text x="785" y="215" text-anchor="middle" fill="#f3e8ff" font-size="21" font-family="sans-serif">外部系统</text><text x="785" y="250" text-anchor="middle" fill="#e9d5ff" font-size="16" font-family="sans-serif">后续 Hugging Face</text><path d="M455 340V410" stroke="#fb7185" stroke-width="4" marker-end="url(#arrow2)"/><text x="455" y="450" text-anchor="middle" fill="#fda4af" font-size="17" font-family="sans-serif">清理后，通信机制被重建</text><text x="480" y="505" text-anchor="middle" fill="#94a3b8" font-size="18" font-family="sans-serif">2026-08-05 Black Hat · 内部时间线补充<