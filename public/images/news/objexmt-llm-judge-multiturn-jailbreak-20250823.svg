<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ObjexMT benchmark</title>
  <desc id="desc">An evaluator extracts the hidden objective of a multi-turn conversation and reports calibrated confidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15263b"/><stop offset="1" stop-color="#46324b"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#80dcd0"/><stop offset="1" stop-color="#ffbd7c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#05070e" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="68" width="1052" height="494" rx="38" fill="#101929" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="124" y="140" fill="#a3b9cf" font-family="Arial, sans-serif" font-size="21" letter-spacing="4">OBJEXMT · 2025.08.23</text>
  <text x="124" y="211" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="700">What is the real objective?</text>
  <text x="124" y="255" fill="#d0dce8" font-family="Arial, sans-serif" font-size="25">A judge needs a calibrated answer.</text>
  <rect x="124" y="347" width="300" height="106" rx="20" fill="#233c4a" stroke="#80dcd0" stroke-width="2"/><text x="158" y="388" fill="#80dcd0" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">INPUT</text><text x="158" y="428" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">multi-turn chat</text>
  <path d="M450 400h92" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/><path d="M520 378l28 22-28 22" fill="none" stroke="#d7e3ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="568" y="323" width="280" height="157" rx="20" fill="#3a3048" stroke="#ffbd7c" stroke-width="2"/><text x="604" y="365" fill="#ffbd7c" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">JUDGE</text><text x="604" y="408" fill="#ffffff" font-family="Arial, sans-serif" font-size="26">objective</text><text x="604" y="444" fill="#c8bfd4" font-family="Arial, sans-serif" font-size="19">+ confidence</text>
  <path d="M874 400h86" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/><path d="M938 378l28 22-28 22" fill="none" stroke="#d7e3ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="982" y="347" width="84" height="106" rx="20" fill="#2a3650" stroke="#9bb0ff" stroke-width="2"/><text x="1024" y="409" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">gate</text>
  <text x="124" y="520" fill="#a3b9cf" font-family="Arial, sans-serif" font-size="18">High confidence is a signal to check, not permission to skip.</text>
</svg>
