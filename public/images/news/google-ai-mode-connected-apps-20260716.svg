<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Google AI Mode 连接应用</title><desc id="d">AI Mode 读取用户目标，经由用户开启的连接调用 Instacart、Canva 或 YouTube Music。</desc><style>text{font-family:Arial,'Noto Sans SC',sans-serif;fill:#f3f7ff}.muted{fill:#a9bad4;font-size:23px}.box{fill:#142b48;stroke:#5fc3ff;stroke-width:3}.flow{stroke:#62e5bb;stroke-width:8;fill:none;stroke-dasharray:12 16;animation:f 2s linear infinite}@keyframes f{to{stroke-dashoffset:-56}}</style><rect width="1200" height="680" rx="34" fill="#091827"/><text x="72" y="92" font-size="42" font-weight="700">AI Mode → 连接的应用</text><text x="72" y="132" class="muted">少量授权工具，让搜索从“回答”走到“下一步”</text><g transform="translate(72 242)"><rect class="box" width="250" height="152" rx="24"/><text x="30" y="64" font-size="30">用户目标</text><text x="30" y="108" class="muted">买食材 / 找模板 / 做歌单</text></g><path class="flow" d="M322 318H442"/><g transform="translate(442 212)"><rect class="box" width="300" height="212" rx="24"/><text x="30" y="66" font-size="30">AI Mode</text><text x="30" y="112" class="muted">理解上下文</text><text x="30" y="152" class="muted">调用已授权工具</text></g><path class="flow" d="M744 318H854"/><g transform="translate(854 180)"><rect class="box" width="290" height="276" rx="24"/><text x="30" y="62" font-size="30">合作应用</text><text x="30" y="112" class="muted">Instacart 购物车</text><text x="30" y="152" class="muted">Canva 模板</text><text x="30" y="192" class="muted">YouTube Music 歌单</text></g><text x="78" y="568" class="muted">首批从美国逐步 rollout；连接哪一个账号，决定工具能做什么。</text></svg>
