<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TuneAgent kernel tuning</title>
  <desc id="desc">TuneAgent proposes valid Linux kernel configurations, checks constraints, benchmarks performance and keeps a rollback path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13243a"/><stop offset="1" stop-color="#422d49"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2f4e8"/><stop offset="1" stop-color="#69b7e4"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="698" height="136" rx="24" fill="#20364e" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 18 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f4fbff">TUNEAGENT · KERNEL SEARCH</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">先保证能启动，再寻找那一点性能</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">CONSTRAINED RL LOOP</text>
    <g transform="translate(36 68)">
      <rect x="0" y="0" width="262" height="58" rx="14" fill="url(#cyan)"/>
      <text x="131" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">候选内核配置</text>
      <path d="M131 66 V96" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M112 84 L131 103 L150 84" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="114" width="262" height="58" rx="14" fill="#6e9bd3"/>
      <text x="131" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f4fbff">约束与有效性</text>
      <path d="M131 182 V212" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M112 200 L131 219 L150 200" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="230" width="262" height="58" rx="14" fill="url(#amber)"/>
      <text x="131" y="266" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">基准测试 · 回滚</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">候选 ≠ 自动上线</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">作者实验：最高 +5.6% 相对整体性能</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">结构化奖励同时看推理、正确性和性能</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">真实机器仍需快照、审批、稳定性与回滚</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">TUNEAGENT · LINUX KERNEL TUNING</text>
</svg>
