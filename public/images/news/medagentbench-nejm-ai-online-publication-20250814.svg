<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MedAgentBench virtual EHR benchmark</title>
  <desc id="desc">A medical language model agent moves through a FHIR virtual EHR task and receives a programmatic evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111f35"/><stop offset="1" stop-color="#1d4d5b"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop offset="0" stop-color="#7ee2c4"/><stop offset="1" stop-color="#54a9e8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050b15" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="190" fill="#7ee2c4" opacity=".13"/>
  <circle cx="1000" cy="540" r="240" fill="#54a9e8" opacity=".12"/>
  <g filter="url(#shadow)">
    <rect x="72" y="74" width="570" height="132" rx="24" fill="#142e46" stroke="#7ee2c4" stroke-width="2"/>
    <text x="106" y="126" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="4" fill="#a8f2da">NEJM AI</text>
    <text x="106" y="178" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#f4fbff">MedAgentBench</text>
  </g>
  <text x="80" y="267" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#d8f4ee">让医疗智能体在虚拟 EHR 里真正完成任务</text>
  <g transform="translate(692 94)" filter="url(#shadow)">
    <rect x="20" y="32" width="362" height="254" rx="20" fill="#142c43" stroke="#54a9e8" stroke-width="3"/>
    <rect x="52" y="70" width="128" height="66" rx="12" fill="#22597b"/>
    <rect x="202" y="70" width="148" height="66" rx="12" fill="#2d6e63"/>
    <rect x="52" y="160" width="298" height="78" rx="12" fill="#1b4058"/>
    <text x="116" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e8f8ff">FHIR EHR</text>
    <text x="276" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4fff6">AGENT</text>
    <path d="M180 102 H202" stroke="#f7d77a" stroke-width="4" stroke-linecap="round"/>
    <path d="M270 136 V160" stroke="#f7d77a" stroke-width="4" stroke-linecap="round"/>
    <text x="201" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d5edf6">TOOL CALL → CHECK</text>
    <circle cx="201" cy="322" r="40" fill="url(#mint)" stroke="#d9fff3" stroke-width="3"/>
    <path d="M183 322 L195 334 L221 305" fill="none" stroke="#10283c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="201" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#d8f4ee">PROGRAMMATIC SCORE</text>
  </g>
  <g transform="translate(80 355)">
    <rect width="560" height="136" rx="20" fill="#142e46" stroke="#32637a" stroke-width="2"/>
    <text x="30" y="45" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f7d77a">300 TASKS · 10 CATEGORIES</text>
    <text x="30" y="86" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e5f7f3">100 PATIENT PROFILES · 700K+ DATA ELEMENTS</text>
    <text x="30" y="117" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a9ced8">69.67% best-model benchmark success</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a6cbd1">ONLINE PUBLISHED 14 AUG 2025 · FHIR · VIRTUAL EHR</text>
</svg>