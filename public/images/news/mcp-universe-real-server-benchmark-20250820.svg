<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MCP-Universe real server benchmark</title>
  <desc id="desc">An agent navigates a large map of real MCP servers with long context and unknown tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1839"/><stop offset="1" stop-color="#173e4b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ef0ee"/><stop offset="1" stop-color="#70a5ff"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#ff9dc7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#070815" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1060" cy="84" r="210" fill="#8ef0ee" opacity=".12"/>
  <circle cx="1030" cy="572" r="250" fill="#ff9dc7" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="690" height="140" rx="24" fill="#29254e" stroke="#8ef0ee" stroke-width="2"/>
    <text x="108" y="127" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="4" fill="#b8fff7">MCP-UNIVERSE · BENCHMARK</text>
    <text x="108" y="183" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#f8f8ff">11 SERVERS · 6 DOMAINS</text>
  </g>
  <text x="78" y="270" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e9e4ff">真实工具比函数调用示例更难</text>
  <g transform="translate(814 72)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="392" rx="30" fill="#111a34" stroke="#b8c9ff" stroke-width="3"/>
    <circle cx="126" cy="106" r="44" fill="url(#cyan)"/>
    <circle cx="111" cy="103" r="7" fill="#1b2747"/><circle cx="141" cy="103" r="7" fill="#1b2747"/>
    <path d="M103 126c13 12 33 12 46 0" fill="none" stroke="#1b2747" stroke-width="6" stroke-linecap="round"/>
    <path d="M126 151v43M126 194l-54 40M126 194l54 40" stroke="#7891cc" stroke-width="7" stroke-linecap="round"/>
    <circle cx="70" cy="246" r="22" fill="url(#yellow)"/><circle cx="182" cy="246" r="22" fill="url(#yellow)"/>
    <text x="126" y="319" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#e4eaff">REAL MCP SERVERS</text>
  </g>
  <g transform="translate(78 360)">
    <rect width="680" height="140" rx="20" fill="#25234a" stroke="#536e99" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#b8fff7">GPT-5 43.72% · GROK-4 33.33%</text>
    <text x="30" y="87" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#edf0ff">长上下文 · 陌生工具 · 执行式评测</text>
    <text x="30" y="119" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c1c8e7">论文分数，非所有生产 Agent 的通用排名</text>
  </g>
  <text x="80" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c6cae6">ARXIV · FIRST SUBMITTED 20 AUG 2025</text>
</svg>
