<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">伪装越狱基准：从表面词汇到上下文防御</title>
<desc id="desc">基准用良性和伪装输入测试模型，观察安全意识、保护措施和服从度，再进入会话级防御回归。</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f2f7ff"/><stop offset="1" stop-color="#fff0ed"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#597a9f"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#273c57" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="680" rx="32" fill="url(#bg)"/>
<text x="68" y="76" fill="#203c5d" font-size="35" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">伪装越狱：表面正常，意图藏在上下文里</text>
<text x="70" y="114" fill="#6b7f96" font-size="19" font-family="Arial, 'Noto Sans CJK SC', sans-serif">500 条受控样例 · 七维评测 · 会话级防御</text>
<g filter="url(#shadow)">
 <rect x="66" y="175" width="235" height="322" rx="22" fill="#fff" stroke="#bad1eb" stroke-width="2"/>
 <text x="104" y="225" fill="#356b9a" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">输入对照</text>
 <rect x="104" y="259" width="158" height="52" rx="11" fill="#ddf1e9"/><text x="183" y="292" text-anchor="middle" fill="#2e7567" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">100 条良性</text>
 <rect x="104" y="329" width="158" height="52" rx="11" fill="#fde2df"/><text x="183" y="362" text-anchor="middle" fill="#a34f48" font-size="17" font-family="Arial, 'Noto Sans CJK SC', sans-serif">400 条伪装</text>
 <text x="183" y="431" text-anchor="middle" fill="#6b7f96" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">受控、脱敏、不可公开</text>
 </g>
 <path d="M322 336 H372" stroke="#597a9f" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="392" y="150" width="390" height="372" rx="22" fill="#fff" stroke="#c7b9e5" stroke-width="2"/>
 <text x="432" y="205" fill="#604d99" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">七维安全评测</text>
 <g font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="15">
  <rect x="432" y="244" width="150" height="40" rx="9" fill="#eee8fb"/><text x="507" y="269" text-anchor="middle" fill="#604d99">安全意识</text>
  <rect x="598" y="244" width="150" height="40" rx="9" fill="#e8f3ff"/><text x="673" y="269" text-anchor="middle" fill="#356b9a">技术可行性</text>
  <rect x="432" y="300" width="150" height="40" rx="9" fill="#e8f5f2"/><text x="507" y="325" text-anchor="middle" fill="#2e7567">保护措施</text>
  <rect x="598" y="300" width="150" height="40" rx="9" fill="#fff0da"/><text x="673" y="325" text-anchor="middle" fill="#8a6b36">危害潜力</text>
  <rect x="432" y="356" width="150" height="40" rx="9" fill="#fbe8e4"/><text x="507" y="381" text-anchor="middle" fill="#a34f48">教育价值</text>
  <rect x="598" y="356" width="150" height="40" rx="9" fill="#edf0f5"/><text x="673" y="381" text-anchor="middle" fill="#596d81">内容质量</text>
  <rect x="515" y="412" width="150" height="40" rx="9" fill="#e5efff"/><text x="590" y="437" text-anchor="middle" fill="#356b9a">服从度</text>
 </g>
 <text x="432" y="484" fill="#6f6d92" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">看风险，不公开危险样例</text>
 </g>
 <path d="M802 336 H852" stroke="#597a9f" stroke-width="4" marker-end="url(#arrow)"/>
<g filter="url(#shadow)">
 <rect x="872" y="175" width="262" height="322" rx="22" fill="#fff" stroke="#a9d7cb" stroke-width="2"/>
 <text x="907" y="225" fill="#2e7567" font-size="22" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">防御回归</text>
 <rect x="907" y="260" width="192" height="48" rx="10" fill="#e6f4f0"/><text x="1003" y="290" text-anchor="middle" fill="#2e7567" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">上下文判断</text>
 <rect x="907" y="327" width="192" height="48" rx="10" fill="#e5efff"/><text x="1003" y="357" text-anchor="middle" fill="#356b9a" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">最小权限</text>
 <rect x="907" y="394" width="192" height="48" rx="10" fill="#fff0da"/><text x="1003" y="424" text-anchor="middle" fill="#8a6b36" font-size="16" font-family="Arial, 'Noto Sans CJK SC', sans-serif">人工确认</text>
 </g>
<text x="68" y="575" fill="#a34f48" font-size="20" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-weight="700">论文观察：伪装输入时安全表现明显下降</text>
<text x="68" y="613" fill="#6b7f96" font-size="18" font-family="Arial, 'Noto Sans CJK SC', sans-serif">基准用于发现防守盲点，不用于传播有害提示。</text>
</svg>
