<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">合成数据的训练与现实验证示意</title>
  <desc id="desc">左侧是现实世界数据收集，中间是可控的三维场景和带标签样本，右侧是机器人或工厂现场复测；这是 Datagen 2021 年融资新闻的通用技术解释，不是公司已公开的具体系统。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#241b3f"/><stop offset="1" stop-color="#164b55"/></linearGradient>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071725" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/></marker>
  </defs>
  <rect width="1200" height="660" rx="30" fill="url(#bg)"/>
  <text x="70" y="68" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34" font-weight="700">合成样本让变量可控，真实现场决定能否上线</text>
  <text x="72" y="104" fill="#c4d6e4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">2021-03-16 · DataGen 融资新闻的通用技术解释</text>
  <g filter="url(#shadow)">
    <rect x="70" y="144" width="1060" height="250" rx="24" fill="#192e4a" stroke="#5e83a8" stroke-width="2"/>
    <rect x="70" y="422" width="1060" height="136" rx="24" fill="#173b4b" stroke="#4e8995" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="112" y="196" width="250" height="114" rx="18" fill="#3d4d6a" stroke="#fda4af" stroke-width="2"/>
    <rect x="475" y="196" width="250" height="114" rx="18" fill="#315b64" stroke="#67e8f9" stroke-width="2"/>
    <rect x="838" y="196" width="250" height="114" rx="18" fill="#4b3b63" stroke="#c4b5fd" stroke-width="2"/>
    <text x="237" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">真实数据缺口</text>
    <text x="237" y="258" fill="#ffe1e5" font-size="15" text-anchor="middle">稀有情况 / 标注成本</text>
    <text x="237" y="283" fill="#ffe1e5" font-size="15" text-anchor="middle">隐私与采集限制</text>
    <text x="600" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">合成场景</text>
    <text x="600" y="258" fill="#d6fff7" font-size="15" text-anchor="middle">三维模型 · 光照 · 物理</text>
    <text x="600" y="283" fill="#d6fff7" font-size="15" text-anchor="middle">图像 / 视频 + 标签</text>
    <text x="963" y="230" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">真实现场</text>
    <text x="963" y="258" fill="#ede2ff" font-size="15" text-anchor="middle">机器人 / 工厂 / 安防</text>
    <text x="963" y="283" fill="#ede2ff" font-size="15" text-anchor="middle">混合评测与失败复测</text>
    <path d="M362 252H460" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <path d="M725 252H823" stroke="url(#flow)" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
    <text x="600" y="382" fill="#a7f3d0" font-size="16" text-anchor="middle">合成数据补足样本，不替代真实部署证据</text>
    <text x="106" y="463" fill="#f8fafc" font-size="23" font-weight="700">看起来像真的，还要回到现场验证</text>
    <text x="106" y="497" fill="#a7f3d0" font-size="16">Fortune / VentureBeat：融资与公司主张可追溯；模拟器边界与效果仍需核验。</text>
    <rect x="106" y="520" width="300" height="25" rx="12" fill="#3d4d6a"/><rect x="450" y="520" width="300" height="25" rx="12" fill="#315b64"/><rect x="794" y="520" width="300" height="25" rx="12" fill="#4b3b63"/>
    <text x="256" y="538" fill="#ffe1e5" font-size="14" text-anchor="middle">来源：Fortune / VentureBeat</text><text x="600" y="538" fill="#d6fff7" font-size="14" text-anchor="middle">日期：2021-03-16</text><text x="944" y="538" fill="#ede2ff" font-size="14" text-anchor="middle">边界：仍需核验</text>
  </g>
  <rect x="70" y="586" width="1060" height="30" rx="14" fill="#102a40"/><text x="600" y="607" fill="#9fb5cc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" text-anchor="middle">示意图为 VibePolaris 自制，解释合成数据新闻中的样本控制与现实验证边界。</text>
</svg>
