<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Google Search AI Mode 学习路径</title><desc id="desc">AI Mode 把文件、Canvas 计划、Search Live 视频输入和来源链接串成试验性搜索流程，地区与资格受限</desc><rect width="1200" height="720" fill="#101827"/><rect x="50" y="50" width="1100" height="620" rx="28" fill="#172338" stroke="#334155"/><text x="90" y="120" fill="#f8fafc" font-size="31" font-family="sans-serif" font-weight="700">Search AI Mode</text><text x="90" y="158" fill="#a9b7cf" font-size="17" font-family="sans-serif">文件、计划和实时画面进入同一条检索路径</text><rect x="90" y="250" width="210" height="185" rx="18" fill="#202e46" stroke="#60a5fa" stroke-width="3"/><text x="195" y="315" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">文件</text><text x="195" y="350" fill="#93c5fd" font-size="15" text-anchor="middle" font-family="sans-serif">图片 / PDF</text><text x="195" y="382" fill="#a9b7cf" font-size="14" text-anchor="middle" font-family="sans-serif">按地区和端分批</text><path d="M 315 342 H 375" stroke="#94a3b8" stroke-width="3"/><path d="M 358 331 l 14 11 -14 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="400" y="250" width="210" height="185" rx="18" fill="#202e46" stroke="#a7f3d0" stroke-width="3"/><text x="505" y="315" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">Canvas</text><text x="505" y="350" fill="#bbf7d0" font-size="15" text-anchor="middle" font-family="sans-serif">计划 / 追问</text><text x="505" y="382" fill="#a9b7cf" font-size="14" text-anchor="middle" font-family="sans-serif">Labs 实验</text><path d="M 625 342 H 685" stroke="#94a3b8" stroke-width="3"/><path d="M 668 331 l 14 11 -14 11" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="710" y="250" width="210" height="185" rx="18" fill="#202e46" stroke="#fbbf24" stroke-width="3"/><text x="815" y="315" fill="#f8fafc" font-size="20" text-anchor="middle" font-family="sans-serif">Search Live</text><text x="815" y="350" fill=