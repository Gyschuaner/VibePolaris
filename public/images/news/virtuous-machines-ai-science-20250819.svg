<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtuous Machines AI Scientist</title>
  <desc id="desc">An AI Scientist workflow moves from hypothesis to study, data, analysis and a human-reviewed manuscript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14263c"/><stop offset="1" stop-color="#452e49"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b2f4e9"/><stop offset="1" stop-color="#6ab8e4"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffdc91"/><stop offset="1" stop-color="#efa16d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#070c15" flood-opacity=".52"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="220" fill="#ffcf7d" opacity=".1"/>
  <circle cx="1080" cy="560" r="250" fill="#83e6d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="706" height="136" rx="24" fill="#20364e" stroke="#8fd9e5" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a5eee4">ARXIV · 19 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#f4fbff">VIRTUOUS MACHINES</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">假设、实验、数据和论文，串成一条证据链</text>
  <g transform="translate(790 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="334" height="414" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="167" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#d0eaf3">AI SCIENTIST WORKFLOW</text>
    <g transform="translate(26 68)">
      <rect x="0" y="0" width="126" height="58" rx="14" fill="url(#cyan)"/>
      <text x="63" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#17314b">假设</text>
      <rect x="156" y="0" width="126" height="58" rx="14" fill="url(#amber)"/>
      <text x="219" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#47313b">研究</text>
      <path d="M63 76 V108 M219 76 V108" stroke="#9ceee3" stroke-width="5" stroke-linecap="round"/>
      <path d="M44 96 L63 115 L82 96 M200 96 L219 115 L238 96" fill="none" stroke="#9ceee3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="130" width="126" height="58" rx="14" fill="#6e9bd3"/>
      <text x="63" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f4fbff">数据</text>
      <rect x="156" y="130" width="126" height="58" rx="14" fill="#be7cae"/>
      <text x="219" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#fff4fb">分析</text>
      <path d="M141 207 V238" stroke="#ffd38f" stroke-width="5" stroke-linecap="round"/>
      <path d="M122 226 L141 245 L160 226" fill="none" stroke="#ffd38f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="0" y="260" width="282" height="60" rx="14" fill="#263a57" stroke="#91dfe1" stroke-width="2"/>
      <text x="141" y="296" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#effcff">论文 · 人类复核</text>
    </g>
    <text x="167" y="391" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#e1f1ff">288 participants · 8h+ coding</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="660" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">端到端不等于无人审阅</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">每一步都要保留数据、代码和版本证据</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">概念细腻度与理论解释仍由研究者负责</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">VIRTUOUS MACHINES · AI SCIENTIST WORKFLOW</text>
</svg>
