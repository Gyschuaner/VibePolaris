<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">XDOF 机器人训练数据管线</title><desc id="desc">人类远程操控和身体传感器把真实动作变成可标注、可评测的机器人训练样本。</desc><rect width="1200" height="700" rx="38" fill="#151f2c"/><g font-family="Arial,sans-serif"><text x="64" y="92" fill="#f3f7ff" font-size="40" font-weight="700">The missing dataset is physical</text><text x="64" y="132" fill="#a5bdd5" font-size="23">XDOF turns human motion into robot-training data</text><g fill="#3e617a"><circle cx="170" cy="322" r="78"/><rect x="330" y="252" width="205" height="140" rx="22"/><rect x="620" y="252" width="205" height="140" rx="22"/><rect x="910" y="252" width="205" height="140" rx="22"/></g><g fill="#edf6ff" font-size="24" font-weight="700"><text x="125" y="315">人类</text><text x="105" y="351">操控 / 传感</text><text x="372" y="315">动作数据</text><text x="367" y="351">视频 + 力道</text><text x="668" y="315">标注与质检</text><text x="671" y="351">任务 / 失败</text><text x="963" y="315">机器人训练</text><text x="965" y="351">评测泛化</text></g><g stroke="#f2c85b" stroke-width="8"><path d="M248 322h82"/><path d="M535 322h82"/><path d="M825 322h82"/></g><rect x="235" y="500" width="730" height="75" rx="20" fill="#329e8b"/><text x="300" y="547" fill="#102f2a" font-size="25" font-weight="700">B 轮洽谈 ≠ 数据质量已被验证</text><text x="302" y="635" fill="#b8cbe0" font-size="23">资金、同意、隐私和客户复购仍要单独核对</text></g></svg>
