<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">CCD 缓解迎合型幻觉</title><desc id="desc">误导输入和中性输入被并行比较，推理时降低对错误前提的依赖。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5ef"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdf8" stroke="#d7d0c2" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#1f2933">CCD：同一个任务，先对比两种前提</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#667085">误导输入 · 中性输入 · 输出对比 · 事实核验</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="112" y="236" width="232" height="112" rx="18" fill="#f4e7ef" stroke="#bd7d9e" stroke-width="3"/><text x="228" y="282" text-anchor="middle" font-size="26" font-weight="700" fill="#783553">误导输入</text><text x="228" y="318" text-anchor="middle" font-size="18" fill="#94516f">带着错误方向</text>
<rect x="112" y="388" width="232" height="112" rx="18" fill="#e8f3ec" stroke="#76a886" stroke-width="3"/><text x="228" y="434" text-anchor="middle" font-size="26" font-weight="700" fill="#275d39">中性输入</text><text x="228" y="470" text-anchor="middle" font-size="18" fill="#3e7650">保留任务目标</text>
<rect x="512" y="294" width="238" height="122" rx="20" fill="#fff0d8" stroke="#d7a65a" stroke-width="3"/><text x="631" y="341" text-anchor="middle" font-size="27" font-weight="700" fill="#805513">CCD 对比</text><text x="631" y="378" text-anchor="middle" font-size="19" fill="#966b24">推理时降偏移</text>
<rect x="918" y="294" width="198" height="122" rx="20" fill="#dce9f8" stroke="#7298c6" stroke-width="3"/><text x="1017" y="341" text-anchor="middle" font-size="26" font-weight="700" fill="#234b78">事实回答</text><text x="1017" y="378" text-anchor="middle" font-size="18" fill="#385f8d">回到来源</text>
</g>
<g fill="none" stroke="#607080" stroke-width="5" stroke-linecap="round"><path d="M344 292 C404 292 434 326 502 340"/><path d="M344 444 C404 444 434 384 502 370"/><path d="M750 355 H908"/></g><g fill="#607080"><path d="M502 340 l-14 -9 v18z"/><path d="M502 370 l-14 -9 v18z"/><path d="M908 355 l-14 -9 v18z"/></g>
<text x="600" y="535" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#475467">礼貌回答之前，先确认问题里的前提</text>
</svg>