<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GitHub MCP secret scanning</title>
  <desc id="desc">A tool call carrying a secret is stopped at a shield before it reaches a public repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#101826"/><stop offset="1" stop-color="#163a4a"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#2ea043"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050a12" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1040" cy="116" r="190" fill="#2ea043" opacity=".16"/>
  <circle cx="958" cy="540" r="240" fill="#58a6ff" opacity=".10"/>
  <g opacity=".25" stroke="#79c0ff" stroke-width="2" fill="none">
    <path d="M70 420 H355 C430 420 438 300 512 300 H690"/>
    <path d="M70 463 H320 C420 463 420 350 530 350 H690"/>
    <path d="M70 506 H290 C425 506 425 400 560 400 H690"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="76" y="78" width="590" height="128" rx="24" fill="#172b3b" stroke="#58a6ff" stroke-width="2"/>
    <text x="112" y="130" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="4" fill="#79c0ff">GITHUB MCP SERVER</text>
    <text x="112" y="177" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#f0f6fc">SECRET SCANNING</text>
  </g>
  <text x="82" y="267" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d9eaf7">工具调用先过扫描，再决定是否发送</text>
  <g transform="translate(722 92)" filter="url(#shadow)">
    <path d="M168 16 L308 66 V178 C308 274 248 345 168 380 C88 345 28 274 28 178 V66 Z" fill="url(#green)" stroke="#b7f5bd" stroke-width="4"/>
    <path d="M168 68 L253 100 V176 C253 237 217 284 168 310 C119 284 83 237 83 176 V100 Z" fill="#102b36" opacity=".92"/>
    <path d="M117 178 L150 211 L222 137" fill="none" stroke="#56d364" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="168" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d9f2df">DEFAULT BLOCK</text>
  </g>
  <g transform="translate(82 355)">
    <rect width="560" height="137" rx="20" fill="#13283a" stroke="#2f6d7c" stroke-width="2"/>
    <text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#79c0ff">PUBLIC REPOSITORY TOOL CALL</text>
    <text x="30" y="86" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#e6edf3">secret → scan → block / explicit bypass</text>
  </g>
  <text x="82" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9fb8c8">13 AUG 2025 · PUBLIC REPOSITORIES · ALL PLANS</text>
