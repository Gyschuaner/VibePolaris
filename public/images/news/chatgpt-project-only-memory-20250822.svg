<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Project-only memory</title>
  <desc id="desc">A project boundary keeps project conversations together while outside memory stays outside.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17152f"/><stop offset="1" stop-color="#284b61"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffcf85"/><stop offset="1" stop-color="#8ed6ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#050714" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="94" r="150" fill="#ffffff" opacity=".06"/>
  <circle cx="1040" cy="94" r="98" fill="none" stroke="#b8e6ff" stroke-opacity=".25" stroke-width="2"/>
  <rect x="92" y="88" width="1016" height="454" rx="34" fill="#10172a" fill-opacity=".76" stroke="#ffffff" stroke-opacity=".14" filter="url(#shadow)"/>
  <text x="140" y="164" fill="#9fb7d9" font-family="Arial, sans-serif" font-size="22" letter-spacing="4">CHATGPT · 2025.08.22</text>
  <text x="140" y="244" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="700">Project-only memory</text>
  <text x="140" y="292" fill="#d8e4f4" font-family="Arial, sans-serif" font-size="27">Keep context inside the project.</text>
  <rect x="142" y="356" width="420" height="116" rx="18" fill="#17253b" stroke="#8ed6ff" stroke-width="2"/>
  <text x="178" y="398" fill="#8ed6ff" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">INSIDE</text>
  <text x="178" y="438" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">Project conversations</text>
  <rect x="644" y="356" width="420" height="116" rx="18" fill="#2a2032" stroke="#ffcf85" stroke-width="2"/>
  <text x="680" y="398" fill="#ffcf85" font-family="Arial, sans-serif" font-size="20" letter-spacing="2">OUTSIDE</text>
  <text x="680" y="438" fill="#ffffff" font-family="Arial, sans-serif" font-size="27">Saved memory stays out</text>
  <path d="M574 414h74" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M620 392l28 22-28 22" fill="none" stroke="#d8e4f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="508" fill="#9fb7d9" font-family="Arial, sans-serif" font-size="18">A context boundary, not a permission system.</text>
</svg>
