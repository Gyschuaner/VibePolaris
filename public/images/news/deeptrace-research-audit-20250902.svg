<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">DeepTRACE 的引用可靠性审计</title><desc id="desc">研究回答拆成陈述，分别进入引用矩阵和事实支持矩阵，再交给人工复核。</desc>
<rect width="1200" height="630" rx="32" fill="#f7f5f2"/><rect x="62" y="54" width="1076" height="522" rx="26" fill="#fffdfa" stroke="#d9d3cb" stroke-width="3"/>
<text x="100" y="122" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="38" font-weight="700" fill="#29333a">DeepTRACE：引用多，不等于证据够</text>
<text x="102" y="166" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="21" fill="#6e777d">陈述拆分 · 引用矩阵 · 事实支持 · 人工复核</text>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<rect x="108" y="258" width="210" height="132" rx="22" fill="#e9eef8" stroke="#7d99bb" stroke-width="3"/><text x="213" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2d4f73">研究回答</text><text x="213" y="347" text-anchor="middle" font-size="18" fill="#4d6e8e">拆成陈述</text>
<rect x="404" y="212" width="244" height="110" rx="20" fill="#fff0d6" stroke="#d2a15c" stroke-width="3"/><text x="526" y="258" text-anchor="middle" font-size="23" font-weight="700" fill="#7e551a">引用矩阵</text><text x="526" y="288" text-anchor="middle" font-size="17" fill="#98702e">有没有对上来源</text>
<rect x="404" y="352" width="244" height="110" rx="20" fill="#f2e7f0" stroke="#b784a3" stroke-width="3"/><text x="526" y="398" text-anchor="middle" font-size="23" font-weight="700" fill="#713d5b">事实支持</text><text x="526" y="428" text-anchor="middle" font-size="17" fill="#95627b">来源是否真的证明</text>
<rect x="800" y="258" width="250" height="132" rx="22" fill="#e8f2e9" stroke="#76a37c" stroke-width="3"/><text x="925" y="309" text-anchor="middle" font-size="24" font-weight="700" fill="#2e6338">复核结论</text><text x="925" y="347" text-anchor="middle" font-size="18" fill="#4e7b57">准确 · 单边 · 不确定</text>
</g>
<g fill="none" stroke="#66736d" stroke-width="5" stroke-linecap="round"><path d="M318 324 H382"/><path d="M648 267 C704 267 738 292 782 304"/><path d="M648 407 C704 407 738 356 782 344"/></g><g fill="#66736d"><path d="M382 324 l-14 -9 v18z"/><path d="M782 304 l-14 -9 v18z"/><path d="M782 344 l-14 -9 v18z"/></g>
<text x="600" y="496" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="23" fill="#4d595e">引用完整度 ≠ 事实支持 ≠ 可靠结论</text>
<text x="600" y="534" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="18" fill="#788287">来源快照、引用位置和争议标记都要留下</text>
</svg>
