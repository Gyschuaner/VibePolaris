<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VLAPS model-based search for VLA policies</title>
  <desc id="desc">A vision-language-action prior enters a model-based tree search, where candidate robot actions are simulated and compared before execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142339"/><stop offset="1" stop-color="#4a304f"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0f0e4"/><stop offset="1" stop-color="#68b2df"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffda90"/><stop offset="1" stop-color="#ee9b69"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080d17" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1052" cy="82" r="215" fill="#ffce7b" opacity=".1"/>
  <circle cx="1070" cy="560" r="250" fill="#80e4d9" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="670" height="136" rx="24" fill="#22344f" stroke="#8bd2e2" stroke-width="2"/>
    <text x="104" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#a2eee4">ARXIV · 17 AUG 2025</text>
    <text x="104" y="172" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#f4fbff">VLAPS · SEARCH BEFORE ACTION</text>
  </g>
  <text x="76" y="260" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e7f1ff">VLA 给方向，环境模型帮它多看几步</text>
  <g transform="translate(776 66)" filter="url(#shadow)">
    <rect x="0" y="0" width="344" height="406" rx="28" fill="#17243b" stroke="#6ebfd1" stroke-width="3"/>
    <text x="172" y="37" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cfeaf4">VLA ACTION PRIOR</text>
    <rect x="31" y="60" width="282" height="52" rx="14" fill="#2e4c63"/>
    <text x="172" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e7fbf7">视觉 + 语言 → 动作方向</text>
    <path d="M172 120 V152" stroke="#ffd38c" stroke-width="5" stroke-linecap="round"/>
    <path d="M153 141 L172 160 L191 141" fill="none" stroke="#ffd38c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="172" cy="202" r="34" fill="url(#teal)"/>
    <path d="M172 179 V225 M149 202 H195" stroke="#16384c" stroke-width="6" stroke-linecap="round"/>
    <text x="172" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e0faf5">MCTS + ENVIRONMENT MODEL</text>
    <path d="M172 264 V296 M172 296 H91 M172 296 H253" stroke="#9deee4" stroke-width="4" stroke-linecap="round"/>
    <rect x="28" y="318" width="125" height="55" rx="14" fill="#31534f"/>
    <rect x="191" y="318" width="125" height="55" rx="14" fill="#3b4b68"/>
    <text x="90" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2fff8">候选 A</text>
    <text x="254" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e8f1ff">候选 B</text>
  </g>
  <g transform="translate(74 356)">
    <rect width="664" height="140" rx="20" fill="#202f49" stroke="#536f8a" stroke-width="2"/>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffdda0">语言指定任务 · 最高 +67 个百分点</text>
    <text x="30" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e4eff9">作者比较：VLAPS 对比 VLA-only 基线</text>
    <text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c4d1df">环境模型覆盖不到的后果仍需真实部署验证</text>
  </g>
  <text x="76" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bfcede">VISION-LANGUAGE-ACTION PLANNING &amp; SEARCH</text>
</svg>
