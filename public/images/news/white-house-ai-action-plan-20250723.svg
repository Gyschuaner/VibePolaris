<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">美国 AI 行动计划的三条政策路线</title>
  <desc id="desc">白宫 2025 年 7 月 23 日发布的 AI 行动计划围绕创新、基础设施和国际外交安全展开，最后仍需要执行文件落地。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="road" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="36" fill="url(#bg)"/>
  <text x="72" y="78" fill="#fff" font-size="34" font-family="sans-serif" font-weight="700">America’s AI Action Plan</text>
  <text x="72" y="118" fill="#cbd5e1" font-size="21" font-family="sans-serif">2025-07-23 · 90+ 项联邦政策动作 · 路线图</text>
  <g font-family="sans-serif">
    <rect x="76" y="190" width="300" height="220" rx="26" fill="#164e63"/>
    <circle cx="126" cy="245" r="24" fill="#67e8f9"/>
    <text x="118" y="254" fill="#082f49" font-size="22" font-weight="700">1</text>
    <text x="168" y="250" fill="#fff" font-size="26" font-weight="700">创新</text>
    <text x="112" y="306" fill="#c9f5ff" font-size="19">开放模型 · 评测</text>
    <text x="112" y="340" fill="#c9f5ff" font-size="19">政府采用 · 科学数据</text>
    <text x="112" y="374" fill="#c9f5ff" font-size="19">可解释性 · 鲁棒性</text>
    <rect x="450" y="190" width="300" height="220" rx="26" fill="#3b2f6b"/>
    <circle cx="500" cy="245" r="24" fill="#c4b5fd"/>
    <text x="492" y="254" fill="#312e81" font-size="22" font-weight="700">2</text>
    <text x="542" y="250" fill="#fff" font-size="26" font-weight="700">基础设施</text>
    <text x="486" y="306" fill="#e9ddff" font-size="19">数据中心 · 电网</text>
    <text x="486" y="340" fill="#e9ddff" font-size="19">芯片 · 高安全环境</text>
    <text x="486" y="374" fill="#e9ddff" font-size="19">网络安全 · 事件响应</text>
    <rect x="824" y="190" width="300" height="220" rx="26" fill="#14532d"/>
    <circle cx="874" cy="245" r="24" fill="#86efac"/>
    <text x="866" y="254" fill="#14532d" font-size="22" font-weight="700">3</text>
    <text x="916" y="250" fill="#fff" font-size="25" font-weight="700">国际外交与安全</text>
    <text x="860" y="306" fill="#dcfce7" font-size="19">全栈 AI 出口包</text>
    <text x="860" y="340" fill="#dcfce7" font-size="19">标准 · 盟友 · 管制</text>
    <text x="860" y="374" fill="#dcfce7" font-size="19">供应链与治理影响</text>
    <path d="M376 300h54M750 300h54" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
    <path d="m418 288 18 12-18 12M792 288l18 12-18 12" fill="none" stroke="#93c5fd" stroke-width="6"/>
    <rect x="218" y="500" width="764" height="86" rx="26" fill="#0b1120" stroke="url(#road)" stroke-width="3"/>
    <text x="320" y="554" fill="#fff" font-size="24" font-weight="700">路线图 ≠ 已生效的法律</text>
    <text x="320" y="580" fill="#94a3b8" font-size="16">后续看规则、预算、许可、采购和项目证据</text>
  </g>
</svg>
